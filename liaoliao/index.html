// 学习打卡汇总：掌握情况 + 汇总数据 + 分时段回看
function renderEnglishSummary(w) {
  // 自然拼读总进度（掌握度总览）
  const ph = phonicsEnsure();
  const totalUnits = PHONICS_UNITS.length;
  const doneUnits = ph.done.length;
  const masterPct = totalUnits ? Math.round(doneUnits / totalUnits * 100) : 0;
  w.appendChild(el('div', { className: 'card', style: { marginBottom: '14px' } },
    el('div', { className: 'card-title' }, '📈 自然拼读总进度（掌握度）'),
    el('div', { className: 'mastery-bar' }, el('div', { className: 'mastery-fill', style: { width: masterPct + '%' } })),
    el('div', { style: { fontSize: '13px', color: 'var(--text-light)' } }, '已学 ' + doneUnits + ' / ' + totalUnits + ' 个单元（' + masterPct + '%）· 累计收集 ' + ph.stars + ' ⭐')
  ));

  // 时间段选择
  const ctrl = el('div', { className: 'card', style: { marginBottom: '14px' } });
  ctrl.appendChild(el('div', { className: 'card-title' }, '📅 学习打卡汇总（可切换时间段回看）'));
  const sel = el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '10px' } });
  const periods = [{ id: 'today', n: '今天' }, { id: 'week', n: '本周' }, { id: 'month', n: '本月' }, { id: 'custom', n: '自定义' }];
  const reSel = () => sel.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.t === enSumPeriod));
  periods.forEach(p => sel.appendChild(el('div', { className: 'tab', 'data-t': p.id, onClick: () => { enSumPeriod = p.id; reSel(); renderModule(); } }, p.n)));
  ctrl.appendChild(sel);
  reSel();
  if (enSumPeriod === 'custom') {
    const fromInp = el('input', { type: 'date', value: enSumFrom || '', style: { marginRight: '8px' } });
    const toInp = el('input', { type: 'date', value: enSumTo || '' });
    ctrl.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' } },
      el('span', { style: { color: 'var(--text-light)', fontSize: '13px' } }, '从'), fromInp,
      el('span', { style: { color: 'var(--text-light)', fontSize: '13px' } }, '至'), toInp,
      el('button', { className: 'btn btn-sm', onClick: () => { enSumFrom = fromInp.value; enSumTo = toInp.value; renderModule(); } }, '查看')
    ));
  }
  w.appendChild(ctrl);

  // 取该时段内的学习日志
  const [start, end] = _hwPeriodRange(enSumPeriod, enSumFrom, enSumTo);
  const logs = (data.english.log || []).filter(l => l.ts >= start.getTime() && l.ts <= end.getTime());
  const units = logs.filter(l => l.type === 'unit');
  const readalongs = logs.filter(l => l.type === 'readalong');
  const flashcards = logs.filter(l => l.type === 'flashcard');
  const games = logs.filter(l => l.type === 'game');
  const vocabs = logs.filter(l => l.type === 'vocab');
  const studies = logs.filter(l => l.type === 'study');
  const total = logs.length;
  const stars = units.length + readalongs.length + flashcards.length + games.length;
  const studyMin = studies.reduce((s, l) => s + (l.dur || 0), 0);
  const raAvg = readalongs.length ? Math.round(readalongs.reduce((s, l) => s + (l.score || 0), 0) / readalongs.length * 10) / 10 : 0;

  // 汇总统计卡片
  const stats = [
    { n: total, l: '学习打卡次数', c: '#FF9B7A' },
    { n: units.length, l: '拼读单元', c: '#FF9B7A' },
    { n: readalongs.length, l: '跟读练习', c: '#87CEEB' },
    { n: flashcards.length, l: '单词卡', c: '#D4A5E0' },
    { n: games.length, l: '互动游戏', c: '#B5E2C0' },
    { n: vocabs.length, l: '新学词汇', c: '#FFD700' },
    { n: stars, l: '收集星星⭐', c: '#FFB6A0' },
    { n: studyMin, l: '学习时长(分)', c: '#FFD4B8' }
  ];
  const grid = el('div', { className: 'sum-overview' });
  stats.forEach(s => grid.appendChild(el('div', { className: 'sum-stat' },
    el('div', { className: 'n', style: { color: s.c } }, String(s.n)),
    el('div', { className: 'l' }, s.l)
  )));
  w.appendChild(grid);

  // 掌握情况：本时段学习的内容
  const mastery = el('div', { className: 'card' });
  mastery.appendChild(el('div', { className: 'card-title' }, '📚 ' + _hwPeriodLabel(enSumPeriod) + '学习内容与掌握情况'));
  if (total === 0) {
    mastery.appendChild(el('div', { style: { textAlign: 'center', color: 'var(--text-light)', padding: '16px' } }, '这个时间段还没有学习记录，去学一学吧~'));
  } else {
    if (readalongs.length) {
      mastery.appendChild(el('div', { style: { margin: '8px 0', fontWeight: 'bold', color: 'var(--primary-dark)' } },
        '🎤 跟读练习掌握度：平均 ' + '⭐'.repeat(Math.max(1, Math.round(raAvg))) + ' ' + raAvg + ' 分（' + readalongs.length + ' 次）'));
    }
    if (units.length) {
      const ul = el('div', { className: 'checkin-list' });
      [...new Set(units.map(u => u.name))].forEach(nm => ul.appendChild(el('div', { className: 'checkin-row' },
        el('span', { className: 'checkin-dot', style: { background: '#FF9B7A' } }),
        el('div', { className: 'checkin-main' }, el('div', { className: 't' }, '✓ ' + nm), el('div', { className: 's' }, '已看动画课堂并掌握')),
        el('span', { className: 'checkin-date' }, '已掌握')
      )));
      mastery.appendChild(el('div', { style: { margin: '12px 0 4px', fontWeight: 'bold' } }, '📘 已学拼读单元'));
      mastery.appendChild(ul);
    }
    if (vocabs.length) {
      const ul = el('div', { className: 'checkin-list' });
      vocabs.slice().reverse().forEach(v => ul.appendChild(el('div', { className: 'checkin-row' },
        el('span', { className: 'checkin-dot', style: { background: '#FFD700' } }),
        el('div', { className: 'checkin-main' }, el('div', { className: 't' }, v.name), el('div', { className: 's' }, '新增词汇')),
        el('span', { className: 'checkin-date' }, formatTime(v.ts))
      )));
      mastery.appendChild(el('div', { style: { margin: '12px 0 4px', fontWeight: 'bold' } }, '📷 新学词汇'));
      mastery.appendChild(ul);
    }
  }
  w.appendChild(mastery);

  // 最近打卡动态
  const recent = logs.slice().sort((a, b) => b.ts - a.ts).slice(0, 15);
  const timeline = el('div', { className: 'card' });
  timeline.appendChild(el('div', { className: 'card-title' }, '📅 最近打卡动态'));
  if (recent.length === 0) {
    timeline.appendChild(el('div', { style: { textAlign: 'center', color: 'var(--text-light)', padding: '16px' } }, '暂无记录'));
  } else {
    const tl = el('div', { className: 'checkin-list' });
    recent.forEach(l => {
      const meta = SUM_META[l.type] || { icon: '📝', color: '#ccc', label: '学习' };
      let sub = meta.label;
      if (l.type === 'readalong') sub = '跟读练习 · 平均 ' + (l.score || 0) + ' 分';
      else if (l.type === 'unit') sub = '看动画课堂：' + (l.name || '');
      else if (l.type === 'game') sub = (l.name || '游戏') + (l.score != null ? ' · 得 ' + l.score + ' 分' : '');
      else if (l.type === 'flashcard') sub = '单词卡 · 通过 ' + (l.passed || 0) + ' 个';
      else if (l.type === 'vocab') sub = '新增词汇';
      else if (l.type === 'study') sub = '学习完成 +' + (l.dur || 0) + ' 分';
      tl.appendChild(el('div', { className: 'checkin-row' },
        el('span', { className: 'checkin-dot', style: { background: meta.color } }),
        el('div', { className: 'checkin-main' }, el('div', { className: 't' }, meta.icon + ' ' + (l.name || meta.label)), el('div', { className: 's' }, sub)),
        el('span', { className: 'checkin-date' }, formatTime(l.ts))
      ));
    });
    timeline.appendChild(tl);
  }
  w.appendChild(timeline);
}

function renderEnglishSection(w, section) {
  if (section === '自然拼读') {
    renderPhonicsHome(w);
  } else if (section === '学习打卡') {
    renderEnglishSummary(w);
  } else if (section === '英语词汇') {
    const card = el('div', { className: 'card' },
      el('div', { className: 'card-title' }, '📚 我的词汇本 (' + data.english.vocabulary.length + ')'),
      el('div', { style: { display: 'flex', gap: '8px', marginBottom: '16px', flexWrap: 'wrap' } },
        el('button', { className: 'btn', onClick: () => addVocab() }, '➕ 手动添加'),
        el('button', { className: 'btn btn-blue', onClick: () => addVocabBatch() }, '📋 批量粘贴添加'),
        el('label', { className: 'btn btn-green', style: { cursor: 'pointer' } },
          '📷 拍照识别',
          el('input', { type: 'file', accept: 'image/*', style: { display: 'none' }, onchange: (e) => {
            const f = e.target.files && e.target.files[0];
            if (f) { const r = new FileReader(); r.onload = () => addVocabFromImages([r.result]); r.readAsDataURL(f); }
          }})
        ),
        el('label', { className: 'btn btn-green', style: { cursor: 'pointer' } },
          '🖼️ 选多张图',
          el('input', { type: 'file', accept: 'image/*', multiple: true, style: { display: 'none' }, onchange: (e) => {
            const fs = Array.from(e.target.files || []);
            if (fs.length) { const rs = fs.map(f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); })); Promise.all(rs).then(urls => addVocabFromImages(urls)); }
          }})
        )
      ),
      el('p', { style: { fontSize: '12px', color: 'var(--text-light)', marginTop: '-6px', marginBottom: '12px' } }, '💡 批量粘贴：一行一个词（英文,中文），可一次加几十个；「选多张图」可一次选多张照片，每张都能裁剪，识别后在下方逐张填词，或从智能库多选后「填入空行」一次性批量填入。')
    );
    if (data.english.vocabulary.length > 0) {
      const grid = el('div', { className: 'grid grid-3' });
      data.english.vocabulary.forEach(v => {
        grid.appendChild(el('div', { className: 'card', style: { textAlign: 'center' } },
          v.image ? el('img', { src: v.image, style: { width: '100%', height: '120px', objectFit: 'cover', borderRadius: '8px', marginBottom: '8px' } }) : el('div', { style: { fontSize: '60px' } }, '📖'),
          el('div', { style: { fontSize: '20px', fontWeight: 'bold' } }, v.en),
          el('div', { style: { fontSize: '14px', color: 'var(--text-light)' } }, v.zh),
          v.phonetic ? el('div', { style: { fontSize: '12px', color: 'var(--text-light)' } }, v.phonetic) : null,
          el('div', { style: { fontSize: '12px', color: 'var(--text-light)' } }, v.book || '通用'),
          el('div', { style: { marginTop: '8px', display: 'flex', gap: '4px', justifyContent: 'center' } },
            el('button', { className: 'btn btn-sm', onClick: () => speak(v.en) }, '🔊'),
            el('button', { className: 'btn btn-sm btn-ghost', onClick: () => {
              confirm('删除这个单词？', () => { data.english.vocabulary = data.english.vocabulary.filter(x => x.id !== v.id); saveData(); renderModule(); });
            } }, '🗑️')
          )
        ));
      });
      card.appendChild(grid);
    } else {
      card.appendChild(el('p', { style: { textAlign: 'center', color: 'var(--text-light)', padding: '20px' } }, '还没有单词，添加第一个吧~'));
    }
    w.appendChild(card);
    addStudyButton(w, 'english');
  } else if (section === '单词书写') {
    // 每日轮换：从 WORD_BANK_G2 选 12 个 + 用户的 vocab（去重），每天内容不同；优先没学过的
    const voc = (data.english.vocabulary || []).map(v => ({ word: v.en, zh: v.zh, img: v.image, from: 'vocab', _id: 'vocab#' + (v.id || v.en) }));
    const daily = pickDailyWritingWords().map(w => ({ word: w.word, zh: w.zh, img: w.img || null, from: 'daily', _id: w._id }));
    const seen = new Set();
    const words = [];
    [...voc, ...daily].forEach(w => {
      const k = (w.word || '').toLowerCase();
      if (!k || seen.has(k)) return; seen.add(k); words.push(w);
    });
    const writeIds = words.map(w => w._id || ('word#' + w.word));
    const card = el('div', { className: 'card' },
      el('div', { className: 'card-title' }, '✍️ 单词书写 · 描一描，写一写'),
      el('p', { style: { color: 'var(--text-light)', fontSize: '13px', marginBottom: '12px' } },
        words.length + ' 个单词 · 每天自动换一组 · 点击进入：听发音 → 描写 → 自动评分')
    );
    const grid = el('div', { className: 'grid grid-3' });
    words.forEach((wd, idx) => {
      grid.appendChild(el('div', {
        className: 'card',
        style: { textAlign: 'center', cursor: 'pointer', padding: '14px' },
        onclick: () => openWordTracingFlow(words, idx)
      },
        el('div', { style: { fontSize: '28px', fontWeight: 'bold', color: 'var(--primary-dark)', letterSpacing: '2px', textTransform: 'lowercase' } }, wd.word),
        el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginTop: '6px', minHeight: '18px' } }, wd.zh || (wd.from === 'vocab' ? '' : '常用词')),
        el('div', { style: { marginTop: '8px', fontSize: '12px', color: 'var(--primary)' } }, '✏️ 点击描红')
      ));
    });
    card.appendChild(grid);
    w.appendChild(card);
    w.appendChild(el('div', { style: { marginTop: '16px', padding: '12px', background: '#FFF8E1', borderRadius: '12px', fontSize: '13px', color: '#A67C00' } },
      '💡 明天会自动换一组新词哦！每天都有新单词练~ 想加自己学的词？去「📚 英语词汇」添加，会自动出现在前面的卡片里~'));
    addStudyButton(w, 'english', writeIds);
  } else if (section === '听音拼写') {
    // 每日轮换：从 WORD_BANK_G2 取本日的拼写词（优先没学过的）
    const dailyObjs = pickDailySpellWords();
    const dailyWords = dailyObjs.map(w => w.word);
    // 加几个备用，防止 day 内单词少于 5
    const pool = dailyWords.length >= 5 ? dailyWords.slice(0, 5) : dailyWords.concat(['book','apple','cat','dog','fish','bird','sun','moon','star','happy','tiger','rabbit']).slice(0, 5);
    let score = 0, current = 0;
    const next = () => {
      if (current >= 5) {
        const pts = Math.round((score / 5) * data.english.points);
        if (pts > 0) addPoints(pts, '英语听音拼写');
        dailyObjs.forEach(o => markLearned('english', o._id));
        logStudy('spell', { name: '听音拼写', dur: 5, ts: Date.now() });
        showModal(el('div', { style: { textAlign: 'center' } },
          el('h3', null, '🎉 完成了！'),
          el('p', null, '得分：' + score + '/5'),
          el('p', { style: { color: 'var(--primary-dark)' } }, '+ ' + pts + ' 积分'),
          el('p', { style: { fontSize: '13px', color: 'var(--text-light)' } }, '明天会换 5 个新单词哦~')
        ));
        return;
      }
      const word = pool[current];
      const answer = el('input', { type: 'text', placeholder: '拼写你听到的单词', style: { fontSize: '24px', padding: '12px', textAlign: 'center', width: '240px' } });
      showModal(el('div', { style: { textAlign: 'center' } },
        el('h3', null, '🎧 听音拼写 (' + (current+1) + '/5) · 今天的词'),
        el('button', { className: 'btn', style: { margin: '16px 0' }, onClick: () => speak(word, 0.7) }, '🔊 听单词'),
        el('br'),
        answer,
        el('div', { className: 'modal-actions', style: { justifyContent: 'center' } },
          el('button', { className: 'btn', onClick: () => {
            if (answer.value.toLowerCase().trim() === word) { toast('正确！'); score++; }
            else { toast('答案是 ' + word); }
            current++; next();
          } }, '提交')
        )
      ));
    };
    w.appendChild(el('div', { className: 'card', style: { textAlign: 'center' } },
      el('h3', null, '🎧 听音拼写挑战'),
      el('p', { style: { fontSize: '13px', color: 'var(--text-light)' } }, '今天选了 5 个二年级词 · 听发音拼出来 · 明天换新词'),
      el('div', { style: { fontSize: '12px', color: 'var(--text-light)', margin: '8px 0' } }, '今天要练的：' + pool.join(' · ')),
      el('button', { className: 'btn btn-gold', onClick: next }, '🚀 开始挑战')
    ));
  } else if (section === '主题词汇') {
    // 每日轮换：从 EN_THEMES 选主题，优先没学过的主题；每个主题展示当日选中的词
    const themeRes = learnedFilter(EN_THEMES, 'english', (t) => 'theme#' + t.name, 5);
    const themesToday = themeRes.items.map((t, k) => Object.assign({}, t, { _id: themeRes.ids[k] }));
    themesToday.forEach(theme => {
      const pickN = Math.min(4, theme.words.length);
      const todays = pickDailyItems(theme.words, pickN, 'theme-' + theme.name);
      const card = el('div', { className: 'card' },
        el('div', { className: 'card-title' }, theme.icon + ' ' + theme.name + ' · 今天 ' + todays.length + ' 个词'),
        el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '8px' } }, '明天自动换下一批～')
      );
      const list = el('div', { className: 'grid grid-3' });
      todays.forEach(w => {
        list.appendChild(el('div', { className: 'card', style: { textAlign: 'center', padding: '16px' } },
          el('div', { style: { fontSize: '22px', fontWeight: 'bold', color: 'var(--primary-dark)' } }, w.e),
          el('div', { style: { fontSize: '15px', color: 'var(--text)' } }, '🇨🇳 ' + w.z),
          el('div', { style: { fontSize: '13px', color: 'var(--text-light)' } }, '译音：' + w.p),
          el('button', { className: 'btn btn-sm', style: { marginTop: '8px' }, onClick: () => speak(w.e) }, '🔊 听')
        ));
      });
      card.appendChild(list);
      w.appendChild(card);
    });
    addStudyButton(w, 'english', themesToday.map(t => t._id));
  } else if (section === '动画视频') {
    const videos = [
      { name: 'Peppa Pig 小猪佩奇', bvid: 'BV1d5411H7jY', page: 'https://www.bilibili.com/bangumi/play/ep375713' },
      { name: 'Yakka Dee 单词王国', bvid: 'BV1WN4y1D7Uq', page: 'https://www.bilibili.com/video/BV1WN4y1D7Uq/' },
      { name: 'Super Simple Songs 英文儿歌', bvid: 'BV1Q5iwB7Evd', page: 'https://www.bilibili.com/video/BV1Q5iwB7Evd/' }
    ];
    const card = el('div', { className: 'card' },
      el('div', { className: 'card-title' }, '📺 动画视频'),
      el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '10px' } }, '点一下就能直接在里面看，不会跳到别的视频啦～')
    );
    videos.forEach(v => {
      card.appendChild(el('div', { className: 'list-item', style: { cursor: 'pointer' }, onClick: () => openVideoPlayer(v.name, v.bvid, v.page) },
        el('div', { style: { fontSize: '28px' } }, '🎬'),
        el('div', { style: { flex: '1' } }, v.name),
        el('span', null, '▶')
      ));
    });
    w.appendChild(card);
  }
}

function openVideoPlayer(name, bvid, pageUrl) {
  const iframe = el('iframe', {
    src: 'https://player.bilibili.com/player.html?bvid=' + bvid + '&page=1&high_quality=1&danmaku=0&autoplay=0',
    allowfullscreen: true,
    frameborder: '0',
    style: { width: '100%', aspectRatio: '16 / 9', minHeight: '300px', border: 'none', borderRadius: '12px', background: '#000', display: 'block' }
  });
  const box = el('div', { style: { width: '100%' } },
    el('h3', { style: { marginTop: 0, marginBottom: '10px' } }, '📺 ' + name),
    iframe,
    el('div', { style: { marginTop: '10px', display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' } },
      pageUrl ? el('a', { href: pageUrl, target: '_blank', className: 'btn btn-ghost btn-sm', style: { textDecoration: 'none' } }, '🔗 在 B站打开（播放器不可用时点这）') : null,
      el('span', { style: { fontSize: '12px', color: 'var(--text-light)' } }, '点播放器右下角可全屏观看')
    )
  );
  showModal(box, true);
  _modalCleanup = () => { try { iframe.src = 'about:blank'; } catch (e) {} };
}

function matchOffline(preds) {
  let best = null, bestScore = -1;
  (preds || []).forEach(p => {
    const cn = (p.className || '').toLowerCase();
    let chosen = null, chosenLen = 0;
    for (const k in OFFLINE_VISION_MAP) {
      if (cn.indexOf(k) >= 0 && k.length > chosenLen) { chosen = k; chosenLen = k.length; }
    }
    if (chosen && p.probability > 0) {
      const score = p.probability * 1000 + chosenLen;
      if (score > bestScore) { best = OFFLINE_VISION_MAP[chosen]; bestScore = score; }
    }
  });
  return best;
}
let _mnModel = null, _mnLoading = null;
const _TF_SRCS = [
  'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
  'https://unpkg.com/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/tensorflow.js/4.22.0/tf.min.js'
];
const _MN_SRCS = [
  'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js',
  'https://unpkg.com/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/tensorflow-models/mobilenet/2.1.1/mobilenet.min.js'
];
function _injectScript(src, timeout) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    let done = false;
    const timer = setTimeout(() => { if (!done) { done = true; try { s.remove(); } catch (e) {} reject(new Error('timeout ' + src)); } }, timeout || 15000);
    s.onload = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
    s.onerror = () => { if (!done) { done = true; clearTimeout(timer); try { s.remove(); } catch (e) {} reject(new Error('load ' + src)); } };
    s.src = src; document.head.appendChild(s);
  });
}
function loadMobilenet() {
  if (_mnModel) return Promise.resolve(_mnModel);
  if (_mnLoading) return _mnLoading;
  if (typeof mobilenet !== 'undefined' && typeof tf !== 'undefined') { _mnLoading = mobilenet.load().then(m => { _mnModel = m; return m; }); return _mnLoading; }
  _mnLoading = (async () => {
    let ok = false;
    for (const src of _TF_SRCS) { try { await _injectScript(src, 15000); ok = true; break; } catch (e) { /* 试下一个 CDN 源 */ } }
    if (!ok || typeof tf === 'undefined') throw new Error('tfjs 加载失败（网络受限）');
    ok = false;
    for (const src of _MN_SRCS) { try { await _injectScript(src, 15000); ok = true; break; } catch (e) { /* 试下一个 CDN 源 */ } }
    if (!ok || typeof mobilenet === 'undefined') throw new Error('mobilenet 加载失败（网络受限）');
    const model = await Promise.race([
      mobilenet.load(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('model load timeout')), 20000))
    ]);
    _mnModel = model; return model;
  })();
  _mnLoading.catch(() => { _mnLoading = null; }); // 失败清空，允许用户重试加载
  return _mnLoading;
}
function recognizeOffline(imgDataUrl, cb) {
  let finished = false;
  const done = (r) => { if (finished) return; finished = true; try { clearTimeout(guard); } catch (e) {} cb(r); };
  const guard = setTimeout(() => { done(null); }, 22000); // 全局兜底：绝不让识别永久挂起（否则面板卡死）
  if (typeof mobilenet === 'undefined' && !_mnLoading) toast('🔍 首次使用：正在联网加载识别模型（几秒）…');
  loadMobilenet().then((model) => {
    const img = new Image();
    img.onload = () => {
      Promise.race([
        model.classify(img, 5),
        new Promise((_, rej) => setTimeout(() => rej(new Error('classify timeout')), 15000))
      ]).then((preds) => { done(matchOffline(preds)); }).catch(() => { done(null); });
    };
    img.onerror = () => { done(null); };
    img.src = imgDataUrl;
  }).catch(() => { done(null); });
}
function recognizeImage(imgDataUrl, cb) {
  const cfg = data.english.visionApi || {};
  if (!cfg.enabled || !cfg.endpoint || !cfg.key) { recognizeOffline(imgDataUrl, cb); return; }
  try {
    const prompt = '这是一张儿童学习的实物照片。请只返回一个 JSON 对象，包含这个物品对应的英文单词(en)、中文名称(zh)、中文近似译音(p，用汉字标注怎么读)。例如苹果返回 {"en":"apple","zh":"苹果","p":"艾坡"}。不要返回其他文字。';
    fetch(cfg.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify({ model: cfg.model || 'gpt-4o-mini', messages: [ { role: 'user', content: [ { type: 'text', text: prompt }, { type: 'image_url', image_url: { url: imgDataUrl } } ] } ] })
    }).then(r => r.json()).then(j => {
      let txt = '';
      try { txt = j.choices[0].message.content; } catch (e) { txt = ''; }
      const m = txt && txt.match(/\{[\s\S]*\}/);
      if (m) { try { const o = JSON.parse(m[0]); if (o.en && o.zh) { cb({ en: o.en, zh: o.zh, phonetic: o.p || '' }); return; } } catch (e) {} }
      recognizeOffline(imgDataUrl, cb);
    }).catch(() => recognizeOffline(imgDataUrl, cb));
  } catch (e) { recognizeOffline(imgDataUrl, cb); }
}

function addVocabFromImage(imgDataUrl) {
  recognizeImage(imgDataUrl, (res) => {
    if (res) {
      data.english.vocabulary.push({ id: uid(), en: res.en, zh: res.zh, phonetic: res.phonetic, book: '', image: imgDataUrl, ts: Date.now() });
      logStudy('vocab', { name: res.en, ts: Date.now() });
      saveData(); renderModule(); toast('📷 自动识别：' + res.en + '（' + res.zh + '）');
    } else {
      openVocabLibraryPicker(imgDataUrl);
    }
  });
}
function openVocabLibraryPicker(imgDataUrl) {
  const grid = el('div', { className: 'grid grid-3', style: { maxHeight: '48vh', overflow: 'auto' } });

  const fill = () => {
    const q = (search.value || '').trim().toLowerCase();
    grid.innerHTML = '';
    VISION_LIBRARY.filter(x => !q || x.e.toLowerCase().indexOf(q) >= 0 || x.z.indexOf(q) >= 0).forEach(x => {
      grid.appendChild(el('div', { className: 'card', style: { textAlign: 'center', padding: '10px', cursor: 'pointer' }, onClick: () => {
        data.english.vocabulary.push({ id: uid(), en: x.e, zh: x.z, phonetic: x.p, book: '', image: imgDataUrl, ts: Date.now() });
        logStudy('vocab', { name: x.e, ts: Date.now() });
        saveData(); closeModal(); renderModule(); toast('📷 已添加：' + x.e + '（' + x.z + '）');
      } },
        el('div', { style: { fontSize: '34px' } }, x.ic),
        el('div', { style: { fontSize: '15px', fontWeight: 'bold' } }, x.e),
        el('div', { style: { fontSize: '12px', color: 'var(--text-light)' } }, x.z)
      ));
    });
    if (!grid.children.length) grid.appendChild(el('div', { style: { textAlign: 'center', color: 'var(--text-light)', padding: '20px' } }, '没有找到，换个词试试～'));
  };
  search.oninput = fill;
  fill();
  showModal(el('div', null,
    el('h3', null, '📷 这张照片是什么？'),
    el('div', { style: { textAlign: 'center', marginBottom: '10px' } }, el('img', { src: imgDataUrl, style: { maxHeight: '120px', borderRadius: '8px' } })),
    el('p', { style: { fontSize: '13px', color: 'var(--text-light)' } }, '点一下下面的物品，就能自动填好英文、中文和译音，不用打字～'),
    search, grid
  ), true);
}

// 批量粘贴：一行一个词，支持「英文,中文」或「英文 中文」或「英文,中文,译音」
function addVocabBatch() {
  const ta = el('textarea', { placeholder: '一行一个词，格式：英文,中文（可加第三列译音）\n例如：\napple,苹果,艾坡\nbanana,香蕉\ndog,狗\n一次可粘贴几十个', style: { width: '100%', height: '200px', fontSize: '14px', padding: '10px', borderRadius: '8px', border: '1px solid var(--border)', boxSizing: 'border-box' } });
  ta.setAttribute('tabindex', '0');
  const preview = el('div', { style: { marginTop: '10px', fontSize: '13px', color: 'var(--text-light)', minHeight: '20px' } });
  // 兜底粘贴：某些嵌入/移动环境会拦截 textarea 原生粘贴，这里直接从剪贴板读入
  ta.onpaste = (e) => {
    try {
      const cd = e.clipboardData || window.clipboardData;
      if (cd && cd.getData) {
        const txt = cd.getData('text');
        if (txt) {
          e.preventDefault();
          const s = ta.selectionStart || 0, en = ta.selectionEnd || 0;
          ta.value = ta.value.slice(0, s) + txt + ta.value.slice(en);
          ta.selectionStart = ta.selectionEnd = s + txt.length;
          if (ta.oninput) ta.oninput();
        }
      }
    } catch (_) {}
  };
  // 解析一行：支持「英文,中文,译音」「英文 中文」（单空格）「英文\t中文」
  const parseLine = (line) => {
    let parts = line.split(/[,，\t]+|\s{2,}/).map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) {
      const m = line.match(/^([a-zA-Z][a-zA-Z'’.\-]*)\s+([^\s].*)$/);
      if (m) parts = [m[1].trim(), m[2].trim()];
    }
    if (parts.length >= 2 && /[a-zA-Z]/.test(parts[0])) return { en: parts[0], zh: parts[1], phonetic: parts[2] || '' };
    return null;
  };
  const btn = el('button', { className: 'btn', onClick: () => {
    const lines = (ta.value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const parsed = []; const bad = [];
    lines.forEach(line => { const p = parseLine(line); if (p) parsed.push(p); else bad.push(line); });
    if (parsed.length === 0) { toast('没识别到有效单词，请按「英文,中文」格式（中英文也可用空格隔开）'); return; }
    parsed.forEach(p => pushVocab(p.en, p.zh, p.phonetic, '', null));
    saveData(); closeModal(); renderModule();
    toast('🎉 已批量添加 ' + parsed.length + ' 个单词' + (bad.length ? '（' + bad.length + ' 行格式不对已跳过）' : ''));
  } }, '✅ 全部添加');
  ta.oninput = () => {
    const lines = (ta.value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    let ok = 0, bad = 0;
    lines.forEach(line => { if (parseLine(line)) ok++; else if (line) bad++; });
    preview.textContent = '将添加 ' + ok + ' 个 · 跳过 ' + bad + ' 行（格式：英文,中文 或 英文 中文）';
  };
  showModal(el('div', null,
    el('h3', null, '📋 批量粘贴添加单词'),
    el('p', { style: { fontSize: '13px', color: 'var(--text-light)' } }, '把一堆单词粘进来，一行一个，自动识别几十个～'),
    ta, preview,
    el('div', { className: 'modal-actions' }, el('button', { className: 'btn btn-ghost', onClick: closeModal }, '取消'), btn)
  ), true);
  setTimeout(() => { try { ta.focus(); } catch (_) {} }, 60);
}

  function onMove(e) { if (!drag) return; e.preventDefault(); const p = ptOf(e); const dx = p.clientX - drag.x, dy = p.clientY - drag.y; const b = drag.b;

function openWordTracingFlow(words, startIdx) {
  let idx = startIdx;
  const total = words.length;
  let totalStars = 0;
  let ratedCount = 0;
  const W = 320, H = 320;

  const wordFont = () => {
    const len = words[idx].word.length;
    const px = Math.min(180, Math.max(80, 240 - (len - 1) * 30));
    return px + 'px cursive';
  };

  const buildCanvas = () => {
    const canvas = el('canvas', { width: W, height: H, className: 'drawing-canvas word-trace-canvas' });

    };

      if (!drawing) return; e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;

    // 检测 canvas 上用户画的红色笔迹像素数
    // 算法：算全部画布里"红像素"占的比例 → 分档 ★
    // 不依赖字体渲染（headless / 不同字体下都稳定）
    const all = ctx.getImageData(0, 0, W, H).data;
    let redPx = 0;
    for (let i = 0; i < all.length; i += 4) {
      const r = all[i], g = all[i+1], b = all[i+2];
      // 红色笔迹（容差）：红 > 180，绿蓝很低
      if (r > 180 && g < 100 && b < 120) redPx++;
    }
    const total = W * H;
    const ratio = redPx / total;
    // 分档：5%→5★ / 3%→4 / 1.5%→3 / 0.8%→2 / 0.2%→1 / 否则 0
    const stars = ratio >= 0.05 ? 5 : ratio >= 0.03 ? 4 : ratio >= 0.015 ? 3 : ratio >= 0.008 ? 2 : ratio >= 0.002 ? 1 : 0;
    return { stars, ratio, redPx };
  };

  const root = el('div', { style: { textAlign: 'center', padding: '8px 4px' } });
  const head = el('div', { className: 'word-flow-head' });
  const wordBig = el('div', { className: 'word-flow-word' });
  const idxSpan = el('div', { className: 'word-flow-idx' });
  const canvasWrap = el('div', { className: 'word-flow-canvas-wrap' });
  const btnBar = el('div', { className: 'word-flow-btnbar' });
  const actBar = el('div', { className: 'word-flow-nav' });
  const scoreBox = el('div', { className: 'word-flow-score' });

  root.appendChild(head);
  root.appendChild(wordBig);
  root.appendChild(canvasWrap);
  root.appendChild(btnBar);
  root.appendChild(scoreBox);
  root.appendChild(actBar);

  let cur = null;
  const switchTo = (next) => {
    idx = (next + total) % total;
    wordBig.textContent = words[idx].word;
    idxSpan.textContent = (idx + 1) + ' / ' + total;
    canvasWrap.innerHTML = '';
    cur = buildCanvas();
    canvasWrap.appendChild(cur.canvas);
    scoreBox.innerHTML = '';
  };

  switchTo(idx);

  const prevBtn = el('button', { className: 'btn btn-ghost', onclick: () => switchTo(idx - 1) }, '← 上一词');
  const nextBtn = el('button', { className: 'btn', onclick: () => switchTo(idx + 1) }, '下一词 →');
  head.appendChild(prevBtn);
  head.appendChild(idxSpan);
  head.appendChild(nextBtn);

  const closeBtn = el('button', {
    className: 'btn btn-ghost btn-sm word-flow-finish',
    onclick: () => { showWordTracingSummary(totalStars, ratedCount, words.length); }
  }, '✕ 完成');
  // 将"完成"按钮放到 modal 右上角的 × 旁边位置
  head.appendChild(closeBtn);

  const speakBtn = el('button', { className: 'btn', onclick: () => speak(words[idx].word, 0.85) }, '🔊 听发音');
  const hideBtn = el('button', { className: 'btn btn-ghost', onclick: () => {
    cur.ctx.clearRect(0, H/2 - 90, W, 180);
  } }, '👁 隐身水印');
  const showBtn = el('button', { className: 'btn btn-ghost', onclick: () => {
    cur.ctx.font = wordFont();
    cur.ctx.fillStyle = 'rgba(255, 130, 90, 0.35)';
    cur.ctx.textAlign = 'center'; cur.ctx.textBaseline = 'middle';
    cur.ctx.fillText(words[idx].word, W/2, H/2);
  } }, '🪄 显示水印');
  const clearBtn = el('button', { className: 'btn btn-ghost', onclick: () => cur.clear() }, '🧹 清除重描');
  btnBar.appendChild(speakBtn);
  btnBar.appendChild(hideBtn);
  btnBar.appendChild(showBtn);
  btnBar.appendChild(clearBtn);

  const rateBtn = el('button', { className: 'btn btn-gold', onclick: () => {
    const r = scoreTracing(cur.ctx);
    if (r.redPx < 200) {
      toast('再描几笔吧，笔迹越多分数越高哦 ✏️');
      return;
    }
    totalStars += r.stars;
    ratedCount++;
    scoreBox.classList.add('visible');
    const starsStr = '⭐'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
    const pct = (r.ratio * 100).toFixed(1);
    scoreBox.innerHTML = '';
    scoreBox.appendChild(el('div', { className: 'wf-score-stars' }, starsStr));
    scoreBox.appendChild(el('div', { className: 'wf-score-pct' }, '书写覆盖 ' + pct + '%'));
    scoreBox.appendChild(el('div', { className: 'wf-score-msg' },
      r.stars >= 4 ? '🎉 太棒了！写得很充实！' :
      r.stars >= 3 ? '👍 不错的，再多描一笔会更好' :
      r.stars >= 1 ? '💪 加油，试着多写一些笔画' :
      '✏️ 再描写一次吧'));
    const againBtn = el('button', { className: 'btn btn-ghost btn-sm', onclick: () => { cur.clear(); scoreBox.innerHTML = ''; scoreBox.classList.remove('visible'); } }, '🔁 再描一次');
    scoreBox.appendChild(againBtn);
  } }, '⭐ 评分');
  const autoNextBtn = el('button', { className: 'btn btn-success', onclick: () => switchTo(idx + 1) }, '⏭ 写下一个');
  actBar.appendChild(rateBtn);
  actBar.appendChild(autoNextBtn);

  showModal(root, true);
}

function showWordTracingSummary(totalStars, ratedCount, total) {
  if (ratedCount === 0) return;
  const avg = +(totalStars / ratedCount).toFixed(1);
  const avgRound = Math.round(avg);
  const stars = '⭐'.repeat(avgRound) + '☆'.repeat(5 - avgRound);
  const points = totalStars * 2;
  let pwCopy = '';
  if (avg >= 4) pwCopy = '🏆 书写小达人！继续保持！';
  else if (avg >= 3) pwCopy = '📈 写得越来越好了～';
  else if (avg >= 2) pwCopy = '💪 多写几次就会更稳的！';
  else pwCopy = '✏️ 多练练，下次一定会更棒！';
  if (points > 0) addPoints(points, '单词书写');
  logStudy('tracing', { name: '单词书写', count: ratedCount, stars: avg });
  saveData();
  showModal(el('div', { style: { textAlign: 'center', padding: '24px' } },
    el('div', { style: { fontSize: '64px', marginBottom: '8px' } }, '🎉'),
    el('h2', { style: { color: 'var(--primary-dark)', marginBottom: '8px' } }, '写完了！'),
    el('div', { style: { fontSize: '32px', letterSpacing: '4px', color: '#FFB300', margin: '12px 0' } }, stars),
    el('div', { style: { fontSize: '16px', color: 'var(--text-light)', marginBottom: '16px' } },
      '共评分 ' + ratedCount + ' / ' + total + ' 个单词 · 平均 ' + avg + ' ★'),
    el('div', { style: { fontSize: '20px', color: 'var(--primary-dark)', fontWeight: 'bold', marginBottom: '8px' } },
      '+ ' + points + ' 积分'),
    el('div', { style: { fontSize: '15px', color: 'var(--text-light)', marginBottom: '20px' } }, pwCopy),
    el('button', { className: 'btn', onclick: closeModal }, '收下奖励 ✨')
  ), true);
}

function openTracingCanvas(letter) {
  const canvas = el('canvas', { width: 300, height: 300, className: 'drawing-canvas' });
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFAF0'; ctx.fillRect(0, 0, 300, 300);
  ctx.font = '200px cursive';
  ctx.fillStyle = 'rgba(255, 182, 160, 0.3)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, 150, 150);
  let drawing = false, lastX = 0, lastY = 0;
  const start = (e) => {
    drawing = true; const r = canvas.getBoundingClientRect();
    lastX = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    lastY = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  };
  const move = (e) => {
    if (!drawing) return; e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    ctx.strokeStyle = '#FF4757'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
    lastX = x; lastY = y;
  };
  const end = () => drawing = false;
  canvas.onmousedown = canvas.ontouchstart = start;
  canvas.onmousemove = canvas.ontouchmove = move;
  canvas.onmouseup = canvas.onmouseleave = canvas.ontouchend = end;
  return canvas;
}

function speakStop() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} _readingText = null; }
function speak(text, rate) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate || 0.9;
    speechSynthesis.speak(u);
  } catch (e) { toast('当前浏览器不支持语音'); }
}

function speakZh(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; speechSynthesis.speak(u); } catch (e) {}
}
// 朗读按钮：同一个按钮在「播放 / 停止」之间切换，杜绝连点导致读好几遍且停不下来
let _readingText = null;
function readAloud(text, btn) {
  try {
    if (window.speechSynthesis && speechSynthesis.speaking && _readingText === text) {
      speechSynthesis.cancel(); _readingText = null;
      if (btn) btn.textContent = '🔊 朗读';
      return;
    }
    speechSynthesis.cancel();
    _readingText = text;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.onend = () => { _readingText = null; if (btn) btn.textContent = '🔊 朗读'; };
    u.onerror = () => { _readingText = null; if (btn) btn.textContent = '🔊 朗读'; };
    speechSynthesis.speak(u);
    if (btn) btn.textContent = '⏹ 停止';
  } catch (e) { toast('当前浏览器不支持语音'); }
}

function addStudyButton(w, subject, ids) {
  w.appendChild(el('div', { style: { textAlign: 'center', margin: '20px 0' } },
    el('button', { className: 'btn btn-gold',     onClick: () => {
      addPoints(data[subject].points, subject + '学习');
      data[subject].studyTime += 300;
      data.timeTracking[subject] = (data.timeTracking[subject] || 0) + 300;
      if (ids && ids.length) ids.forEach(id => markLearned(subject, id));
      saveData();
      confetti();
      toast('学习完成！+ ' + data[subject].points + ' 积分 🎉');
      if (subject === 'english') logStudy('study', { dur: 5 });
    } }, '✓ 学习完成 +' + data[subject].points + ' 积分')
  ));
}

// ============ Daily Rotation Utility ============
function pickDailyItems(items, count, salt) {
  if (!items || items.length === 0) return [];
  const dt = today();
  const seedStr = dt + (salt || '');
  let hash = 0;
  for (let i = 0; i < seedStr.length; i++) {
    hash = ((hash << 5) - hash + seedStr.charCodeAt(i)) | 0;
  }
  const start = Math.abs(hash) % items.length;
  const result = [];
  for (let i = 0; i < Math.min(count, items.length); i++) {
    result.push(items[(start + i) % items.length]);
  }
  return result;
}

function markItemStudied(section, itemId) {
  if (!data[section]) return;
  const subj = data[section];
  if (!subj.studied) subj.studied = {};
  const key = today();
  if (!subj.studied[key]) subj.studied[key] = [];
  if (!subj.studied[key].includes(itemId)) {
    subj.studied[key].push(itemId);
    saveData();
  }
}

// 把某 item 标记为该学科「已学会」（全局去重，用于"第二天优先给没学过的"）
function markLearned(subject, id) {
  if (!subject || !id) return;
  const subj = data[subject];
  if (!subj) return;
  if (!subj.learned) subj.learned = [];
  const sid = subject + ':' + id;
  if (!subj.learned.includes(sid)) {
    subj.learned.push(sid);
    saveData();
  }
}
function learnedSet(subject) {
  const subj = data[subject];
  return new Set((subj && subj.learned) || []);
}
// 已学会集合（用于板块"全部学完"判断）
function subjectLearnedCount(subject) {
  const subj = data[subject];
  return (subj && subj.learned) ? subj.learned.length : 0;
}
// 在候选列表里优先挑「没学过」的；学过的放后面补位（保证每天都有内容、且不重复已学过的）
// 返回 { items, ids, allLearned, review }；ids 与 items 一一对应
function learnedFilter(list, subject, idOf, count) {
  const learned = learnedSet(subject);
  const withId = (list || []).map((it, i) => ({ it, id: idOf(it, i) }));
  const un = withId.filter(x => !learned.has(subject + ':' + x.id));
  const le = withId.filter(x => learned.has(subject + ':' + x.id));
  let chosen = un.slice(0, count);
  let review = false;
  if (chosen.length < count) { chosen = chosen.concat(le.slice(0, count - chosen.length)); review = true; }
  return {
    items: chosen.map(x => x.it),
    ids: chosen.map(x => x.id),
    allLearned: un.length === 0,
    review: review || un.length === 0
  };
}

function logMathQuiz(type, correct, total) {
  if (!data.math.log) data.math.log = [];
  data.math.log.push({
    type, correct, total,
    accuracy: total ? Math.round(correct * 100 / total) : 0,
    ts: Date.now()
  });
  saveData();
}

  '阅读理解': [
    { title: '小猴摘桃', para: '小猴看见桃树上结满了又大又红的桃子。它高兴地爬上树，摘了一个又一个，篮子很快就装满了。小猴累得满头大汗，但心里美滋滋的。',
      qs: [ { q: '小猴摘桃时心情怎样？', a: 1, opts: ['难过','开心','害怕'] }, { q: '小猴的篮子最后怎么样了？', a: 0, opts: ['装满了','还是空的','掉地上了'] }, { q: '小猴摘桃累得满头大汗，它开心吗？', a: 0, opts: ['开心','不开心','不知道'] } ] },
    { title: '雪孩子', para: '雪孩子陪小白兔玩了一整天。兔妈妈回来发现屋子着火了，雪孩子冲进火海救出了小白兔，自己却化成了一朵白云。',
      qs: [ { q: '雪孩子最后变成了什么？', a: 1, opts: ['水','白云','雨'] }, { q: '雪孩子为什么冲进火海？', a: 0, opts: ['去救小白兔','去玩火','去睡觉'] }, { q: '这个故事告诉我们雪孩子怎么样？', a: 2, opts: ['很胆小','很贪玩','很勇敢'] } ] },
    { title: '小马过河', para: '小马要过河，但不知道河水深浅。它问牛伯伯，牛说浅；又问小松鼠，鼠说深。最后小马自己试了试，原来水既不深也不浅。',
      qs: [ { q: '小马怎么知道河水深浅的？', a: 2, opts: ['听牛伯伯','听小松鼠','自己试了试'] }, { q: '牛伯伯和小松鼠说的话一样吗？', a: 1, opts: ['一样','不一样','没说'] }, { q: '这个故事告诉我们要怎么做？', a: 0, opts: ['自己试一试','只听别人的','不用管'] } ] },
    { title: '乌鸦喝水', para: '乌鸦看见一只瓶子，瓶子里有水但不多。它把石子一颗一颗地叼进瓶子，水慢慢升高了，乌鸦就喝到了水。',
      qs: [ { q: '乌鸦用什么办法喝到水？', a: 1, opts: ['打翻瓶子','往瓶里放石子','等下雨'] }, { q: '瓶子里的水本来多吗？', a: 1, opts: ['很多','不太多','没有'] }, { q: '乌鸦是一只怎样的鸟？', a: 0, opts: ['爱动脑筋','很懒','很凶'] } ] },
    { title: '小猫钓鱼', para: '小猫跟着妈妈去河边钓鱼。一会儿去捉蝴蝶，一会儿去捉蜻蜓，结果一条鱼也没钓到。妈妈说钓鱼要专心。',
      qs: [ { q: '小猫为什么没钓到鱼？', a: 1, opts: ['鱼太少','不专心','鱼竿坏了'] }, { q: '小猫一会儿捉蝴蝶，一会儿捉蜻蜓，说明它？', a: 1, opts: ['很专心','不专心','很厉害'] }, { q: '妈妈告诉小猫钓鱼要怎样？', a: 0, opts: ['专心','快一点','多睡觉'] } ] },
    { title: '司马光砸缸', para: '司马光和小朋友在花园里玩。一个小朋友掉进了大水缸，其他小朋友都吓哭了。司马光拿起石头砸破水缸，救出了小朋友。',
      qs: [ { q: '司马光用什么办法救人？', a: 1, opts: ['拉人出来','砸破水缸','叫人帮忙'] }, { q: '别的小朋友掉进缸后怎样了？', a: 1, opts: ['笑了','吓哭了','跑了'] }, { q: '司马光是个怎样的孩子？', a: 0, opts: ['聪明勇敢','胆小','马虎'] } ] }
  ],
  '古诗积累': [
    { t: '梅花', a: '王安石', grade: '二上', scene: ['🌸','❄️','🧱','👃'], explain: '冬天别的花都谢了，只有梅花不怕冷，在墙角悄悄开放，还飘来一阵阵淡淡的香味。', lines: ['墙角数枝梅，凌寒独自开。','遥知不是雪，为有暗香来。'] },
    { t: '小儿垂钓', a: '胡令能', grade: '二上', scene: ['🎣','🧒','🌿','🐟'], explain: '一个头发乱乱的小孩在学钓鱼，侧身坐在草丛里。路人问他路，他远远摆手不敢出声，怕把鱼吓跑。', lines: ['蓬头稚子学垂纶，侧坐莓苔草映身。','路人借问遥招手，怕得鱼惊不应人。'] },
    { t: '登鹳雀楼', a: '王之涣', grade: '二上', scene: ['🌅','⛰️','🌊','🏯'], explain: '太阳挨着山慢慢落下，黄河水滚滚流向大海。想要看到更远的地方，就要再爬上一层楼。', lines: ['白日依山尽，黄河入海流。','欲穷千里目，更上一层楼。'] },
    { t: '望庐山瀑布', a: '李白', grade: '二上', scene: ['🏔️','💜','💦','🌌'], explain: '太阳照着香炉峰升起紫色的雾气，远远看见瀑布像挂在山前。水从很高很高的地方冲下来，好像银河从天上掉下来。', lines: ['日照香炉生紫烟，遥看瀑布挂前川。','飞流直下三千尺，疑是银河落九天。'] },
    { t: '江雪', a: '柳宗元', grade: '二上', scene: ['🏔️','❄️','🚣','🧓'], explain: '下大雪的山里，看不见一只鸟，路上也没有脚印。只有一个披着蓑衣、戴着斗笠的老人，坐在小船上独自钓鱼。', lines: ['千山鸟飞绝，万径人踪灭。','孤舟蓑笠翁，独钓寒江雪。'] },
    { t: '夜宿山寺', a: '李白', grade: '二上', scene: ['🌃','🏯','⭐','☁️'], explain: '山上的一座高楼好像有一百尺那么高，伸手就能摘到星星。我不敢大声说话，怕惊动了天上的神仙。', lines: ['危楼高百尺，手可摘星辰。','不敢高声语，恐惊天上人。'] },
    { t: '敕勒歌', a: '北朝民歌', grade: '二上', scene: ['🌾','🐂','🐑','⛰️'], explain: '敕勒族生活的大草原在阴山脚下，天空像圆圆的大帐篷盖在草原上。蓝蓝的天、绿绿的草，风一吹草弯下腰，就露出里面的牛羊。', lines: ['敕勒川，阴山下。','天似穹庐，笼盖四野。','天苍苍，野茫茫，风吹草低见牛羊。'] },
    { t: '村居', a: '高鼎', grade: '二下', scene: ['🌱','🐦','🪁','🌿'], explain: '二月春天，小草发芽、黄莺飞舞，杨柳拂着河堤像喝醉了一样。小朋友放学早，赶快趁着春风去放风筝。', lines: ['草长莺飞二月天，拂堤杨柳醉春烟。','儿童散学归来早，忙趁东风放纸鸢。'] },
    { t: '咏柳', a: '贺知章', grade: '二下', scene: ['🌳','🍃','✂️','🌬️'], explain: '高高的柳树像用碧玉打扮过，垂下千万条绿色的柳枝。细细的柳叶是谁剪出来的？原来是二月的春风像一把剪刀。', lines: ['碧玉妆成一树高，万条垂下绿丝绦。','不知细叶谁裁出，二月春风似剪刀。'] },
    { t: '赋得古原草送别', a: '白居易', grade: '二下', scene: ['🌿','🔥','🌱','🌬️'], explain: '原野上的草长得很茂盛，每年枯萎一次又茂盛一次。野火怎么也烧不完它，春风一吹它又长出来了。', lines: ['离离原上草，一岁一枯荣。','野火烧不尽，春风吹又生。'] },
    { t: '晓出净慈寺送林子方', a: '杨万里', grade: '二下', scene: ['🌊','🪷','🌞','💚'], explain: '到底是六月的西湖，风景和别的季节不一样。莲叶无边无际绿到天边，荷花在阳光下格外红艳。', lines: ['毕竟西湖六月中，风光不与四时同。','接天莲叶无穷碧，映日荷花别样红。'] },
    { t: '绝句', a: '杜甫', grade: '二下', scene: ['🐦','🌳','🕊️','🚢'], explain: '两只黄鹂在绿柳间唱歌，一排白鹭飞上蓝天。窗外是西岭千年不化的雪，门口停着远去东吴的船。', lines: ['两个黄鹂鸣翠柳，','一上白鹭上青天。','窗含西岭千秋雪，门泊东吴万里船。'] },
    { t: '悯农', a: '李绅', grade: '二下', scene: ['🌾','🌱','🍚','😢'], explain: '春天种下一粒种子，秋天能收很多粮食。天下没有空闲的田地，可农民却还是会饿死。告诉我们要爱惜粮食。', lines: ['春种一粒粟，秋收万颗子。','四海无闲田，农夫犹饿死。'] },
    { t: '舟夜书所见', a: '查慎行', grade: '二下', scene: ['🌌','🚣','💡','✨'], explain: '没有月亮的晚上，只见渔船上的一点灯，像一只萤火虫。微风吹起波浪，灯光散开像满河的星星。', lines: ['月黑见渔灯，孤光一点萤。','微微风簇浪，散作满河星。'] },
    { t: '所见', a: '袁枚', grade: '三上', scene: ['🐂','🧒','🐞','🌳'], explain: '放牛的小孩骑在黄牛背上，歌声在树林里回荡。他想捉树上叫的蝉，忽然闭紧嘴巴站住了。', lines: ['牧童骑黄牛，歌声振林樾。','意欲捕鸣蝉，忽然闭口立。'] },
    { t: '山行', a: '杜牧', grade: '三上', scene: ['🍁','⛰️','🚗','☁️'], explain: '弯弯曲曲的石头小路通到远处的山，白云升起的地方还有人家。我停下车是因为太爱傍晚的枫林，霜打的叶子比二月的花还红。', lines: ['远上寒山石径斜，白云生处有人家。','停车坐爱枫林晚，霜叶红于二月花。'] },
    { t: '赠刘景文', a: '苏轼', grade: '三上', scene: ['🍊','🍂','🌼','🍃'], explain: '荷花谢了没有了像伞一样的叶子，菊花虽残却还有不怕霜的枝条。你要记住一年中最好的景色，就是橙子黄、橘子绿的秋天。', lines: ['荷尽已无擎雨盖，菊残犹有傲霜枝。','一年好景君须记，最是橙黄橘绿时。'] },
    { t: '夜书所见', a: '叶绍翁', grade: '三上', scene: ['🍂','🌬️','🦗','🏮'], explain: '梧桐叶沙沙响送来寒意，江上的秋风让出门在外的人想起家乡。知道有小孩在捉蟋蟀，深夜里篱笆下还亮着一盏灯。', lines: ['萧萧梧叶送寒声，江上秋风动客情。','知有儿童挑促织，夜深篱落一灯明。'] },
    { t: '望天门山', a: '李白', grade: '三上', scene: ['⛰️','🌊','⛵','🌅'], explain: '长江把天门山从中间冲开，碧绿的江水东流到这里打转。两岸青山面对面出现，一只小船从太阳那边驶来。', lines: ['天门中断楚江开，碧水东流至此回。','两岸青山相对出，孤帆一片日边来。'] },
    { t: '饮湖上初晴后雨', a: '苏轼', grade: '三上', scene: ['🌊','🌧️','⛰️','💃'], explain: '晴天时湖面波光闪闪很好看，下雨时山色迷蒙也很奇妙。把西湖比作美女西施，淡妆浓妆都好看。', lines: ['水光潋滟晴方好，山色空蒙雨亦奇。','欲把西湖比西子，淡妆浓抹总相宜。'] },
    { t: '望洞庭', a: '刘禹锡', grade: '三上', scene: ['🌕','🌊','🐌','💠'], explain: '秋天的月亮和湖光互相映衬，没有风的湖面像没磨过的镜子。远远看洞庭的山水青翠，就像白银盘里一只青螺。', lines: ['湖光秋月两相和，潭面无风镜未磨。','遥望洞庭山水翠，白银盘里一青螺。'] },
    { t: '早发白帝城', a: '李白', grade: '三上', scene: ['☁️','🚢','🐒','⛰️'], explain: '早晨在彩云间的白帝城出发，千里外的江陵一天就能到。两岸猴子叫个不停，小船已经过了千山万岭。', lines: ['朝辞白帝彩云间，千里江陵一日还。','两岸猿声啼不住，轻舟已过万重山。'] },
    { t: '采莲曲', a: '王昌龄', grade: '三上', scene: ['🪷','👧','🌿','🎶'], explain: '采莲姑娘的绿裙子和荷叶像同一种布做成，荷花对着她的脸开放。她混入荷花池里看不见，听到歌声才知道有人来。', lines: ['荷叶罗裙一色裁，芙蓉向脸两边开。','乱入池中看不见，闻歌始觉有人来。'] },
    { t: '绝句（迟日）', a: '杜甫', grade: '三下', scene: ['🌞','🌸','🐦','🦆'], explain: '春天的太阳让江山格外美丽，春风送来花草香。泥土松软燕子飞来飞去，暖和的沙上鸳鸯在睡觉。', lines: ['迟日江山丽，春风花草香。','泥融飞燕子，沙暖睡鸳鸯。'] },

function pickDailyHomophones(count) {
  const cand = pickDailyItems(HOMOPHONE_BANK, Math.min(count, HOMOPHONE_BANK.length) * 2, 'chinese-homophone');
  const r = learnedFilter(cand, 'chinese', (it) => HOMOPHONE_BANK.indexOf(it), Math.min(count, HOMOPHONE_BANK.length));
  return r.items.map((it, k) => Object.assign({}, it, { _id: r.ids[k] }));
}

function pickDailyChinese(name, count) {
  const bank = CHINESE_BANKS[name];
  if (!bank) return [];
  // 先按日期取一个较大的候选窗口（保证隔天推进、同一天稳定），再优先挑没学过的
  const pool = pickDailyItems(bank, Math.min(count * 3, bank.length), 'chinese-' + name);
  const r = learnedFilter(pool, 'chinese', (it) => name + '#' + bank.indexOf(it), Math.min(count, bank.length));
  return r.items.map((it, k) => Object.assign({}, it, { _id: r.ids[k] }));
}
// 每日英文听音拼写：从 WORD_BANK_G2 取 8 个（按字母分组 salt，每组首字母选不同）；优先没学过的
function pickDailySpellWords() {
  // 每日从字母分组中取若干（salt 包含 'spell'），再在单词里优先挑没学过的
  const groups = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','R','S','T','W','Y'];
  const pickedGroups = pickDailyItems(groups, 6, 'spell');
  const all = WORD_BANK_G2;
  let out = [];
  pickedGroups.forEach(g => {
    const gwords = all.filter(x => x.group === g);
    if (gwords.length) out.push(...gwords.slice(0, 2));
  });
  const r = learnedFilter(out, 'english', (w) => w.word, 8);
  return r.items.map((it, k) => Object.assign({}, it, { _id: r.ids[k] }));
}
// 每日英文单词书写：从 WORD_BANK_G2 取 12 个（按字母分组 salt，避免和听音拼写重复）；优先没学过的
function pickDailyWritingWords() {
  const groups = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','R','S','T','W','Y'];
  const pickedGroups = pickDailyItems(groups, 8, 'writing');
  const all = WORD_BANK_G2;
  let out = [];
  pickedGroups.forEach(g => {
    const gwords = all.filter(x => x.group === g);
    if (gwords.length) out.push(...gwords.slice(0, Math.min(2, gwords.length)));
  });
  // 用 vocab 补足
  const voc = (data.english.vocabulary || []).map(v => ({ word: v.en, zh: v.zh, img: v.image, group: 'V', from: 'vocab', _id: 'vocab#' + (v.id || v.en) }));
  out = out.concat(voc);
  const r = learnedFilter(out, 'english', (w) => w._id || ('word#' + w.word), 12);
  return r.items.map((it, k) => Object.assign({}, it, { _id: r.ids[k] }));
}

  const tabs = el('div', { className: 'tabs' });

      sections.filter(s => s.name !== '学习打卡').forEach(s => {

          el('div', { style: { fontWeight: 'bold' } }, s.name)
        ));
      });
      content.appendChild(grid);
    }
  };
  sections.forEach(s => tabs.appendChild(el('div', { className: 'tab', 'data-t': s.name, onClick: () => { cur = s.name; refresh(); } }, s.name.split(' ')[0])));
  w.appendChild(tabs);
  w.appendChild(content);

function renderMathSummary(w) {
  const log = data.math.log || [];
  const periods = [{ id: 'today', n: '今天' }, { id: 'week', n: '本周' }, { id: 'month', n: '本月' }, { id: 'custom', n: '自定义' }];
  const ctrl = el('div', { className: 'card', style: { marginBottom: '14px' } });
  ctrl.appendChild(el('div', { className: 'card-title' }, '📅 数学学习打卡汇总（可切换时间段回看）'));
  const sel = el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
  const reSel = () => sel.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.t === mathSumPeriod));
  periods.forEach(p => sel.appendChild(el('div', { className: 'tab', 'data-t': p.id, onClick: () => { mathSumPeriod = p.id; reSel(); renderModule(); } }, p.n)));
  ctrl.appendChild(sel);
  reSel();
  if (mathSumPeriod === 'custom') {
    const fromInp = el('input', { type: 'date', value: mathSumFrom || '', style: { marginRight: '8px' } });
    const toInp = el('input', { type: 'date', value: mathSumTo || '' });
    ctrl.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap', marginTop: '8px' } },
      el('span', { style: { color: 'var(--text-light)', fontSize: '13px' } }, '从'), fromInp,
      el('span', { style: { color: 'var(--text-light)', fontSize: '13px' } }, '至'), toInp,
      el('button', { className: 'btn btn-sm', onClick: () => { mathSumFrom = fromInp.value; mathSumTo = toInp.value; renderModule(); } }, '查看')
    ));
  }
  w.appendChild(ctrl);

  const [start, end] = _hwPeriodRange(mathSumPeriod, mathSumFrom, mathSumTo);
  const logs = log.filter(l => l.ts >= start.getTime() && l.ts <= end.getTime());
  const totalQuiz = logs.length;
  const totalQ = logs.reduce((s, l) => s + (l.total || 0), 0);
  const totalR = logs.reduce((s, l) => s + (l.correct || 0), 0);
  const avgAcc = totalQ ? Math.round(totalR * 100 / totalQ) : 0;
  const studyMin = Math.floor((data.timeTracking.math || 0) / 60);

  // 板块今日练习次数
  const byType = {};
  logs.forEach(l => { byType[l.type] = (byType[l.type] || 0) + 1; });
  const typeStats = Object.keys(byType).map(k => ({ n: byType[k], l: k, c: MATH_BANK_COLORS[k] || '#FF9B7A' }));

  // 板块进度条（总览掌握度）
  const totalUnits = 10;
  const masteredUnits = Object.keys(byType).length;
  const masterPct = Math.round(masteredUnits / totalUnits * 100);

  const overview = el('div', { className: 'card', style: { marginBottom: '14px' } });
  overview.appendChild(el('div', { className: 'card-title' }, '📈 学习总览（' + _hwPeriodLabel(mathSumPeriod) + '）'));
  overview.appendChild(el('div', { className: 'mastery-bar' }, el('div', { className: 'mastery-fill', style: { width: masterPct + '%' } })));
  overview.appendChild(el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '10px' } }, '本时段练习过 ' + masteredUnits + ' / ' + totalUnits + ' 个板块（' + masterPct + '%）'));
  const stats = [
    { n: totalQuiz, l: '练习次数', c: '#FF9B7A' },
    { n: totalQ, l: '答题总数', c: '#87CEEB' },
    { n: totalR, l: '答对题数', c: '#B5E2C0' },
    { n: avgAcc + '%', l: '平均正确率', c: '#FFD700' },
    { n: studyMin, l: '累计时长(分)', c: '#FFB6A0' }
  ];
  const grid = el('div', { className: 'sum-overview' });
  stats.forEach(s => grid.appendChild(el('div', { className: 'sum-stat' },
    el('div', { className: 'n', style: { color: s.c } }, String(s.n)),
    el('div', { className: 'l' }, s.l)
  )));
  overview.appendChild(grid);
  if (typeStats.length) {
    overview.appendChild(el('div', { style: { marginTop: '10px', fontSize: '13px', color: 'var(--text-light)' } }, '板块分布：' + typeStats.map(s => s.l + ' ' + s.n + '次').join(' · ')));
  }
  w.appendChild(overview);

  // 最近打卡动态
  const recent = logs.slice().sort((a, b) => b.ts - a.ts).slice(0, 15);
  const timeline = el('div', { className: 'card' });
  timeline.appendChild(el('div', { className: 'card-title' }, '📅 最近打卡动态'));
  if (recent.length === 0) {
    timeline.appendChild(el('div', { style: { textAlign: 'center', color: 'var(--text-light)', padding: '16px' } }, '这个时间段还没有练习记录，去算一算吧~'));
  } else {
    const tl = el('div', { className: 'checkin-list' });
    recent.forEach(l => {
      tl.appendChild(el('div', { className: 'checkin-row' },
        el('span', { className: 'checkin-dot', style: { background: MATH_BANK_COLORS[l.type] || '#FF9B7A' } }),
        el('div', { className: 'checkin-main' },
          el('div', { className: 't' }, l.type + ' · 答对 ' + l.correct + '/' + l.total),
          el('div', { className: 's' }, '正确率 ' + l.accuracy + '%')
        ),
        el('span', { className: 'checkin-date' }, formatTime(l.ts))
      ));
    });
    timeline.appendChild(tl);
  }
  w.appendChild(timeline);
}

const MATH_BANK_COLORS = {
  '计算达标': '#FF9B7A', '乘除法应用': '#FFB6A0', '时间认知': '#FFD4B8',
  '人民币': '#FFD700', '度量衡': '#B5E2C0', '图形空间': '#87CEEB',
  '数据统计': '#D4A5E0', '应用题': '#FF9B7A', '思维训练': '#FFA500',
  '生活中的数学': '#5DADE2'
};
let mathSection = '计算达标';
let mathSumPeriod = 'today';
let mathSumFrom = '';
let mathSumTo = '';

function startMathQuiz(type) {
  const questions = [];
  if (type === '计算达标') {
    for (let i = 0; i < 5; i++) {
      let a = Math.floor(Math.random() * 50) + 1;
      let b = Math.floor(Math.random() * 50) + 1;
      const op = Math.random() > 0.5 ? '+' : '-';
      if (op === '-' && b > a) { const t = a; a = b; b = t; }  // 减法保证非负，更适合低龄儿童
      questions.push({ q: a + ' ' + op + ' ' + b + ' = ?', a: op === '+' ? a + b : a - b });
    }
  } else if (type === '乘除法应用') {
    for (let i = 0; i < 5; i++) {
      const a = Math.floor(Math.random() * 9) + 1;
      const b = Math.floor(Math.random() * 9) + 1;
      questions.push({ q: a + ' × ' + b + ' = ?', a: a * b });
    }
  } else if (type === '时间认知') {
    for (let i = 0; i < 5; i++) {
      const h = Math.floor(Math.random() * 11) + 1;
      const m = Math.floor(Math.random() * 4) * 15;
      const ans = h + 1 > 12 ? h + 1 - 12 : h + 1;
      questions.push({ q: '现在 ' + h + ':' + String(m).padStart(2,'0') + '，再过 1 小时是几点？', a: ans });
    }
  } else if (type === '人民币') {
    for (let i = 0; i < 5; i++) {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 5) + 1;
      questions.push({ q: a + ' 元 + ' + b + ' 元 = ? 元', a: a + b });
    }
  } else if (type === '度量衡') {
    const qs = [{q:'1 米 = ? 厘米', a:100}, {q:'1 千克 = ? 克', a:1000}, {q:'1 小时 = ? 分钟', a:60}, {q:'半米 = ? 厘米', a:50}, {q:'1 公里 = ? 米', a:1000}];
    questions.push(...qs.sort(() => Math.random() - 0.5).slice(0, 5));
  } else if (MATH_BANKS[type]) {
    const bank = MATH_BANKS[type];
    questions.push(...bank.slice().sort(() => Math.random() - 0.5).slice(0, 5));
  }

  let idx = 0, correct = 0;
  const next = () => {
    if (idx >= 5) {
      const pts = Math.round((correct / 5) * data.math.points);
      if (pts > 0) addPoints(pts, '数学' + type);
      data.math.studyTime += 300;
      data.timeTracking.math = (data.timeTracking.math || 0) + 300;
      logMathQuiz(type, correct, 5);
      saveData();
      showModal(el('div', { style: { textAlign: 'center' } },
        el('div', { style: { fontSize: '80px' } }, correct >= 4 ? '🏆' : correct >= 2 ? '👍' : '💪'),
        el('h3', null, '完成！'),
        el('p', null, '答对 ' + correct + '/5 题'),
        el('p', { style: { color: 'var(--primary-dark)' } }, '+ ' + pts + ' 积分')
      ));
      return;
    }
    const q = questions[idx];
    let choices;
    if (q.options) {
      choices = q.options.slice();
    } else {
      choices = [q.a];
      let _guard = 0;
      while (choices.length < 4 && _guard++ < 100) {
        const wrong = q.a + Math.floor(Math.random() * 21) - 10;
        if (wrong !== q.a && !choices.includes(wrong)) choices.push(wrong);
      }
      // 兜底：若（极端情况/答案为负）上面随机仍凑不齐 4 个，用固定偏移补齐，杜绝死循环卡死
      let _off = 1;
      while (choices.length < 4) {
        const cand = q.a + _off;
        if (!choices.includes(cand)) choices.push(cand);
        _off++;
        if (_off > 30) break;
      }
    }
    choices.sort(() => Math.random() - 0.5);
    showModal(el('div', { style: { textAlign: 'center' } },
      el('h3', null, type + ' (' + (idx+1) + '/5)'),
      el('div', { style: { fontSize: '26px', margin: '20px 0', fontWeight: 'bold' } }, q.q),
      el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '10px', maxWidth: '320px', margin: '0 auto' } },
        choices.map(c => el('button', { className: 'btn', onClick: () => {
          if (c === q.a) { toast('✓ 正确！'); correct++; }
          else { toast('✗ 答案是 ' + q.a); }
          idx++; next();
        } }, String(c)))
      )
    ));
  };
  next();
}

// 考一考内容 = 今天在「认一认」里学过的字；没学过则用当天轮换题兜底
function buildSimilarQuizItems() {
  const bank = CHINESE_BANKS['相近字'];
  const seen = (data.chinese.studied && data.chinese.studied[today()]) || [];
  let items = seen.filter(id => String(id).indexOf('相近字#') === 0)
    .map(id => bank[parseInt(String(id).split('#')[1], 10)]).filter(Boolean);
  if (items.length === 0) items = pickDailyChinese('相近字', 6);
  return items;
}

// 由「相近字」成对数据生成考题：给意思，从两个相近字 + 干扰字里选出正确的那个
function buildSimilarQuestions(items) {
  const bank = CHINESE_BANKS['相近字'];
  const pinMap = {};
  bank.forEach(p => { pinMap[p.a] = p.ap; pinMap[p.b] = p.bp; });
  const allChars = [];
  bank.forEach(p => { allChars.push(p.a, p.b); });
  function meaningOf(it, ch) {
    const parts = it.tip.split('；');
    for (const p of parts) {
      const i = p.indexOf('：');
      if (i > 0 && p.slice(0, i).trim() === ch) {
        return p.slice(i + 1).split('（')[0].split('/')[0].trim() || ch;
      }
    }
    return ch;
  }
  return items.map(it => {
    const testCh = Math.random() < 0.5 ? it.a : it.b;
    const partner = testCh === it.a ? it.b : it.a;
    const meaning = meaningOf(it, testCh);
    const distract = allChars.filter(c => c !== testCh && c !== partner);
    for (let i = distract.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [distract[i], distract[j]] = [distract[j], distract[i]]; }
    const choiceChars = [testCh, partner, distract[0], distract[1]].filter(Boolean);
    const choices = choiceChars.map(c => ({ c: c, p: pinMap[c] || '' }));
    for (let i = choices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [choices[i], choices[j]] = [choices[j], choices[i]]; }
    return { question: '表示『' + meaning + '』的是哪个字？', correct: testCh, choices: choices };
  });
}

// 相近字 · 考一考（考当天在「认一认」学过的字；给意思，选正确的字）
function renderSimilarQuiz(w, items) {
  const qs = buildSimilarQuestions(items);
  const pinMap = {};
  CHINESE_BANKS['相近字'].forEach(p => { pinMap[p.a] = p.ap; pinMap[p.b] = p.bp; });
  let idx = 0, score = 0, answered = false, choiceBtns = [], results = [];
  w.innerHTML = '';
  w.appendChild(el('button', { className: 'btn btn-ghost btn-sm', onClick: () => renderChineseSection(w, '相近字') }, '← 返回'));
  w.appendChild(el('div', {
    style: { background: '#FFF3E0', borderRadius: '12px', padding: '10px 14px', margin: '10px 0', fontSize: '14px', color: 'var(--text)', textAlign: 'center' }
  }, '🎧 听老师读题，从两个相近的字里选出意思正确的那个吧！'));
  const progressEl = el('div', { style: { textAlign: 'center', color: 'var(--text-light)', fontSize: '14px', marginTop: '4px' } });
  const hintCard = el('div', { style: { background: '#FFFAF0', borderRadius: '16px', padding: '18px', textAlign: 'center', marginTop: '10px', boxShadow: 'var(--shadow)' } });
  const choicesWrap = el('div', { className: 'grid grid-2', style: { marginTop: '14px', gap: '14px' } });
  const feedbackEl = el('div', { style: { textAlign: 'center', marginTop: '12px', minHeight: '26px', fontSize: '17px', fontWeight: 'bold' } });
  w.appendChild(progressEl);
  w.appendChild(hintCard);
  w.appendChild(choicesWrap);
  w.appendChild(feedbackEl);

  function ask() {
    answered = false; choiceBtns = []; feedbackEl.textContent = '';
    const q = qs[idx];
    progressEl.textContent = '第 ' + (idx + 1) + ' / ' + qs.length + ' 题 · 得分 ' + score;
    hintCard.innerHTML = '';
    hintCard.appendChild(el('div', { style: { fontSize: '14px', color: 'var(--text-light)' } }, '🤫 想一想：下面哪个字是这意思？'));
    hintCard.appendChild(el('div', { style: { fontSize: '34px', fontWeight: 'bold', color: 'var(--primary-dark)', margin: '6px 0', lineHeight: '1.3' } }, q.question));
    hintCard.appendChild(el('button', { className: 'btn btn-sm', onClick: speakQuestion }, '🔊 再听一次'));
    choicesWrap.innerHTML = '';
    q.choices.forEach(ch => {
      const isCorrect = (ch.c === q.correct);
      const btn = el('button', {
        className: 'card',
        style: { textAlign: 'center', padding: '18px', cursor: 'pointer', border: '2px solid var(--border)', background: '#fff', transition: 'all .15s' },
        onClick: () => choose(ch, btn, isCorrect)
      },
        el('div', { style: { fontSize: '56px', fontWeight: 'bold', color: 'var(--primary-dark)' } }, ch.c),
        el('div', { style: { fontSize: '16px', color: 'var(--text-light)', marginTop: '6px' } }, ch.p)
      );
      choiceBtns.push(btn);
      choicesWrap.appendChild(btn);
    });
    speakQuestion();
  }
  function speakQuestion() { speakZh(qs[idx].question); }
  function choose(ch, btn, isCorrect) {
    if (answered) return;
    answered = true;
    const q = qs[idx];
    results.push({ target: q.correct, correct: isCorrect });
    if (isCorrect) {
      score++;
      btn.style.borderColor = 'var(--secondary)';
      btn.style.background = '#EAF7EE';
      feedbackEl.style.color = 'var(--secondary-dark)';
      feedbackEl.textContent = '✅ 真棒！就是「' + q.correct + '」(' + (pinMap[q.correct] || '') + ')';
      speakZh('真棒，就是' + q.correct);
      setTimeout(next, 1300);
    } else {
      btn.style.borderColor = '#FF8A80';
      btn.style.background = '#FFEBEE';
      choiceBtns.forEach(b => { if (b.firstChild && b.firstChild.textContent === q.correct) { b.style.borderColor = 'var(--secondary)'; b.style.background = '#EAF7EE'; } });
      feedbackEl.style.color = '#E53935';
      feedbackEl.textContent = '❌ 再想想～正确的是「' + q.correct + '」(' + (pinMap[q.correct] || '') + ')';
      speakZh('正确答案是' + q.correct);
      setTimeout(next, 1900);
    }
  }
  function next() {
    idx++;
    if (idx >= qs.length) finish();
    else ask();
  }
  function finish() {
    w.innerHTML = '';
    w.appendChild(el('button', { className: 'btn btn-ghost btn-sm', onClick: () => renderChineseSection(w, '相近字') }, '← 返回'));
    const pts = Math.max(1, Math.round(score / qs.length * 5));
    const wrong = results.filter(r => !r.correct).map(r => r.target);
    if (!data.chinese.quizLog) data.chinese.quizLog = [];
    data.chinese.quizLog.push({ date: today(), ts: Date.now(), total: qs.length, score: score, wrong: wrong, results: results.slice() });
    w.appendChild(el('div', { className: 'card', style: { textAlign: 'center', padding: '30px' } },
      el('div', { style: { fontSize: '64px' } }, '🎉'),
      el('h2', null, '闯关成功！'),
      el('p', { style: { fontSize: '18px' } }, '答对 ' + score + ' / ' + qs.length + ' 题 · 正确率 ' + Math.round(score / qs.length * 100) + '%'),
      wrong.length ? el('p', { style: { fontSize: '14px', color: '#E53935' } }, '❌ 答错的字：' + wrong.join('、')) : el('p', { style: { fontSize: '14px', color: 'var(--secondary-dark)' } }, '✅ 全部答对，太棒了！'),
      el('div', { style: { display: 'flex', gap: '10px', justifyContent: 'center', marginTop: '14px', flexWrap: 'wrap' } },
        el('button', { className: 'btn btn-gold', onClick: () => {
          addPoints(pts, '相近字闯关');
          data.chinese.studyTime += 300;
          data.timeTracking.chinese = (data.timeTracking.chinese || 0) + 300;
          items.forEach(it => markLearned('chinese', it._id));
          saveData(); confetti();
          toast('闯关完成！+ ' + pts + ' 积分 🎉');
        } }, '✓ 完成 +' + pts + ' 积分'),
        el('button', { className: 'btn btn-ghost', onClick: () => openSimilarAnalysis() }, '📊 看成绩分析')
      )
    ));
  }
  ask();
}

function openPinyinPractice() {
  // 从今天学的拼音内容里出题：给汉字，选正确拼音（围绕当天学习内容复习）
  const items = pickDailyChinese('拼音加强', 6);
  const bank = [];
  items.forEach(s => (s.ex || []).forEach(ex => {
    const m = ex.match(/^(.+?)\((.+?)\)/);
    if (m && ex.indexOf('vs') < 0) bank.push({ zi: m[1], py: m[2] });
  }));
  if (bank.length === 0) { toast('今天的内容暂不支持练习，换一组再试～'); return; }
  const pool = bank.slice();
  let idx = 0, score = 0, answered = false;
  const box = el('div', { style: { textAlign: 'center' } });
  const prog = el('div', { style: { color: 'var(--text-light)', fontSize: '14px' } });
  const ziEl = el('div', { style: { fontSize: '72px', fontWeight: 'bold', color: 'var(--primary-dark)', margin: '14px 0' } });
  const wrap = el('div', { className: 'grid grid-2', style: { gap: '12px', marginTop: '10px' } });
  const fb = el('div', { style: { minHeight: '24px', fontWeight: 'bold', marginTop: '10px' } });
  const ask = () => {
    answered = false; fb.textContent = '';
    const q = pool[idx];
    prog.textContent = '第 ' + (idx + 1) + ' / ' + pool.length + ' 题 · 得分 ' + score;
    ziEl.textContent = q.zi;
    const others = pool.filter(x => x.py !== q.py).map(x => x.py);
    const opts = [q.py];
    while (opts.length < 4 && others.length) opts.push(others.splice(Math.floor(Math.random() * others.length), 1)[0]);
    opts.sort(() => Math.random() - 0.5);
    wrap.innerHTML = '';
    opts.forEach(o => {
      const b = el('button', { className: 'btn', style: { fontSize: '22px', padding: '16px' }, onClick: () => choose(o, b) }, o);
      wrap.appendChild(b);
    });
    speakZh(q.zi);
  };
  function choose(o, b) {
    if (answered) return; answered = true;
    const q = pool[idx];
    if (o === q.py) { score++; b.style.background = 'var(--secondary)'; b.style.color = '#fff'; fb.style.color = 'var(--secondary-dark)'; fb.textContent = '✅ 正确！' + q.zi + ' 读 ' + q.py; }
    else { b.style.background = '#FF8A80'; fb.style.color = '#E53935'; fb.textContent = '❌ 正确是 ' + q.py; wrap.querySelectorAll('button').forEach(x => { if (x.textContent === q.py) { x.style.background = 'var(--secondary)'; x.style.color = '#fff'; } }); }
    setTimeout(next, 1300);
  }
  function next() { idx++; if (idx >= pool.length) finish(); else ask(); }
  function finish() {
    box.innerHTML = '';
    const pts = Math.max(1, Math.round(score / pool.length * 5));
    box.appendChild(el('div', { style: { textAlign: 'center' } },
      el('div', { style: { fontSize: '60px' } }, '🎉'),
      el('h3', null, '练习完成！'),
      el('p', null, '答对 ' + score + ' / ' + pool.length + ' 题'),
      el('button', { className: 'btn btn-gold', style: { marginTop: '12px' }, onClick: () => {
        addPoints(pts, '拼音练习');
        data.chinese.studyTime += 200;
        data.timeTracking.chinese = (data.timeTracking.chinese || 0) + 200;
        items.forEach(it => markLearned('chinese', it._id));
        saveData(); confetti(); closeModal(); toast('+ ' + pts + ' 积分 🎉');
      } }, '✓ 完成 +' + pts + ' 积分')
    ));
  }
  box.appendChild(prog); box.appendChild(ziEl); box.appendChild(wrap); box.appendChild(fb);
  showModal(box, true);
  ask();
}

function renderClassify(container) {
  const items = pickDailyChinese('词语分类', 5);
  const words = [];
  items.forEach(it => {
    it.words.forEach(w => words.push({ w, c: it.cat, done: false }));
    (it.distractors || []).slice(0, 2).forEach(w => words.push({ w, c: '_noise_', done: false, noise: true }));
  });
  const cats = [...new Set(words.filter(x => !x.noise).map(x => x.c))];
  const card = el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '🏷️ 把词语拖到正确的分类（答案不会提前显示哦）'));
  const state = { words: words.slice() };

function renderWordBuild(container) {

  // 字池：所有正确字 + 几个干扰字
  const correct = []; items.forEach(it => { correct.push(it.a, it.b); });
  const distract = ['大','小','花','鸟','天','水','风','火','车','人'].filter(c => correct.indexOf(c) < 0);
  let pool = shuffle([...new Set(correct.concat(distract.slice(0, Math.min(4, distract.length))))]);
  const slots = items.map(it => ({ it, s1: null, s2: null, done: false }));
  const refresh = () => {
    card.innerHTML = '<div class="card-title">🔤 拼词语：从下面的字里拖出两个字，组成词语</div>';
    slots.forEach((sl, idx) => {
      const row = el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '10px', background: sl.done ? '#EAFBF0' : '#FFFAF0', borderRadius: '12px', marginBottom: '10px' } },
        el('div', { style: { fontSize: '28px' } }, sl.it.icon),
        el('div', { style: { flex: '1' } },
          el('div', { style: { fontSize: '13px', color: 'var(--text-light)' } }, sl.it.hint),
          el('div', { style: { display: 'flex', gap: '8px', marginTop: '6px' } },
            mkSlot(sl, 's1', sl.it.a), mkSlot(sl, 's2', sl.it.b)
          )
        ),
        sl.done ? el('span', { style: { color: 'var(--secondary-dark)', fontWeight: 'bold' } }, '✓ ' + sl.it.a + sl.it.b) : null
      );
      card.appendChild(row);
    });
    card.appendChild(el('div', { style: { padding: '12px', background: '#FFF3E0', borderRadius: '12px', marginTop: '6px' } },
      el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '8px' } }, '👇 字池（拖到上面的空里）：'),
      el('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } },
        pool.map(c => el('span', { draggable: 'true', onDragStart: (e) => e.dataTransfer.setData('text', c), style: { display: 'inline-block', background: 'var(--primary)', color: '#fff', padding: '8px 14px', borderRadius: '12px', fontSize: '20px', cursor: 'move' } }, c))
      )
    ));
  };
  function mkSlot(sl, key, expected) {
    return el('div', {
      onDragOver: (e) => e.preventDefault(),
      onDrop: (e) => {
        const c = e.dataTransfer.getData('text');
        if (c === expected && sl[key] === null) {
          sl[key] = c; pool = pool.filter(x => x !== c);
          if (sl.s1 && sl.s2) sl.done = true;
          refresh();
          if (slots.every(s => s.done)) {
            addPoints(data.chinese.points, '组词');
            items.forEach(it => markLearned('chinese', it._id));
            saveData();
            card.appendChild(el('p', { style: { textAlign: 'center', color: 'var(--secondary-dark)', fontSize: '18px', marginTop: '8px' } }, '🎉 全部拼对啦！'));
          }
        } else if (c !== expected) { toast('这个字放这里不对，再看看～'); }
        else { toast('这个空已经填好啦'); }
      },
      style: { minWidth: '44px', height: '44px', border: '2px dashed var(--primary)', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '22px', color: 'var(--primary-dark)', background: '#fff' }
    }, sl[key] || '');
  }
  refresh();
  container.appendChild(card);
}
function renderKebenLesson(w, it) {
