  const solved = {};
  let allDone = false;
  const card = el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '📚 课本同步 · 今天一课（' + total + ' 题）'),
    el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '6px' } }, '📖 ' + it.lesson + '（人教版' + (it.grade || '二年级') + '）'),
    el('p', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '4px' } }, '不显示答案哦，自己想一想～ 全部 ' + total + ' 题都答对，这一课就算学会啦！')
  );
  const status = el('div', { style: { textAlign: 'center', color: 'var(--text-light)', fontSize: '14px', margin: '6px 0 10px' } }, '已答对 0 / ' + total + ' 题');
  card.appendChild(status);
  const checkDone = () => {
    const n = Object.keys(solved).filter(k => solved[k]).length;
    status.textContent = '已答对 ' + n + ' / ' + total + ' 题';
    if (n >= total && !allDone) {
      allDone = true;
      addPoints(5, '课本同步'); markLearned('chinese', it._id); saveData();
      card.appendChild(el('p', { style: { textAlign: 'center', color: 'var(--secondary-dark)', fontSize: '18px', marginTop: '8px' } }, '🎉 这一课学会啦！明天换新课~'));
    }
  };
  qs.forEach((qq, i) => {
    const row = el('div', { className: 'kb-q', style: { padding: '12px', background: '#fff', borderRadius: '12px', marginBottom: '10px', border: '1px solid var(--border)' } },
      el('div', { style: { fontWeight: 'bold', marginBottom: '8px' } }, (i+1) + '. ' + qq.q)
    );
    const markSolved = () => {
      if (solved[i]) return;
      solved[i] = true;
      row.style.borderColor = 'var(--secondary)';
      row.appendChild(el('div', { style: { color: 'var(--secondary-dark)', fontSize: '13px', marginTop: '6px' } }, '✅ 答对啦'));
      checkDone();
    };
    if (qq.type === 'choice' || qq.type === 'fill' || qq.type === 'circle') {
      const wrap = el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
      qq.opts.forEach((o, oi) => {
        const b = el('button', { className: 'btn btn-sm', onClick: () => {
          if (solved[i]) return;
          if (oi === qq.a) { b.style.background = 'var(--secondary)'; b.style.color = '#fff'; markSolved(); }
          else { b.style.background = '#FFB3B3'; toast('再想想，这题不对哦～'); }
        } }, o);
        if (oi === qq.a) b.setAttribute('data-kb', '1');
        wrap.appendChild(b);
      });
      row.appendChild(wrap);
    } else if (qq.type === 'judge') {
      const wrap = el('div', { style: { display: 'flex', gap: '8px' } });
      const bYes = el('button', { className: 'btn btn-sm', onClick: () => { if (solved[i]) return; if (qq.a === true) { bYes.style.background = 'var(--secondary)'; bYes.style.color = '#fff'; markSolved(); } else { bYes.style.background = '#FFB3B3'; toast('再想想～'); } } }, '✓ 对');
      const bNo = el('button', { className: 'btn btn-sm', onClick: () => { if (solved[i]) return; if (qq.a === false) { bNo.style.background = 'var(--secondary)'; bNo.style.color = '#fff'; markSolved(); } else { bNo.style.background = '#FFB3B3'; toast('再想想～'); } } }, '✗ 错');
      if (qq.a === true) bYes.setAttribute('data-kb', '1'); else bNo.setAttribute('data-kb', '1');
      wrap.appendChild(bYes); wrap.appendChild(bNo); row.appendChild(wrap);
    } else if (qq.type === 'read') {
      const wrap = el('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } });
      wrap.appendChild(el('button', { className: 'btn btn-sm btn-ghost', onClick: () => { try { speakZh(qq.q.replace('跟读：', '')); } catch (e) {} } }, '🔊 听一听'));
      wrap.appendChild(el('button', { className: 'btn btn-sm btn-green', onClick: () => { if (solved[i]) return; markSolved(); } }, '✅ 我会读啦'));
      row.appendChild(wrap);
    } else if (qq.type === 'write') {
      const input = el('input', { type: 'text', placeholder: '写在这里', style: { padding: '8px', fontSize: '15px', borderRadius: '8px', border: '1px solid var(--border)', minWidth: '140px' } });
      input.setAttribute('data-kb-answer', qq.answer);
      const submit = el('button', { className: 'btn btn-sm btn-green', onClick: () => {
        if (solved[i]) return;
        const norm = (s) => (s || '').replace(/[\s　]/g, '');
        if (norm(input.value) === norm(qq.answer)) markSolved();
        else toast('再想想，写对这个词～');
      } }, '✅ 提交');
      row.appendChild(el('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } }, input, submit));
    } else if (qq.type === 'sort') {
      const items = qq.items;
      const display = shuffle(items.map((t, idx) => ({ t, idx })));
      let picked = [];
      const orderText = el('div', { style: { fontSize: '13px', color: 'var(--text-light)', margin: '6px 0' } }, '已点：');
      const chips = [];
      const resetSort = () => { picked = []; orderText.textContent = '已点：'; chips.forEach(cc => { cc.style.background = '#FFF3D0'; cc.style.color = '#333'; cc._locked = false; }); };
      const trySolve = () => { if (picked.length !== items.length) return; if (picked.every((v, k) => v === qq.ans[k])) markSolved(); else { toast('顺序还不对，再排一次～'); resetSort(); } };
      const mkClick = (d, k) => () => {
        if (solved[i] || chips[k]._locked) return;
        picked.push(d.idx); chips[k].style.background = 'var(--primary)'; chips[k].style.color = '#fff'; chips[k]._locked = true;
        orderText.textContent = '已点：' + picked.map(x => items[x]).join(' → '); trySolve();
      };
      display.forEach((d, k) => {
        const c = el('div', { style: { padding: '8px 12px', background: '#FFF3D0', borderRadius: '10px', cursor: 'pointer', fontSize: '14px', border: '1px solid var(--border)' } }, d.t);
        c.setAttribute('data-kb-pos', String(d.idx)); c.onclick = mkClick(d, k); chips.push(c);
      });
      row.appendChild(el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } }, ...chips));
      row.appendChild(orderText);
      row.appendChild(el('button', { className: 'btn btn-sm btn-ghost', onClick: () => { if (solved[i]) return; resetSort(); } }, '↺ 重新排'));
    } else if (qq.type === 'match') {
      const pairs = qq.pairs;
      const left = shuffle(pairs.map((p, idx) => ({ t: p.l, idx })));
      const right = shuffle(pairs.map((p, idx) => ({ t: p.r, idx })));
      let selLeft = null;
      const lWrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', flex: '1' } });
      const rWrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', flex: '1' } });
      left.forEach(d => {
        const c = el('div', { style: { padding: '8px 10px', background: '#EAF6FF', borderRadius: '10px', cursor: 'pointer', fontSize: '14px', border: '1px solid var(--border)' } }, d.t );
        c.setAttribute('data-kb-pair', String(d.idx));
        c.onclick = () => { if (solved[i] || c._done) return; lWrap.querySelectorAll('div').forEach(x => x.style.outline = ''); selLeft = c; c.style.outline = '3px solid var(--primary)'; };
        lWrap.appendChild(c);
      });
      right.forEach(d => {
        const c = el('div', { style: { padding: '8px 10px', background: '#FFF0F5', borderRadius: '10px', cursor: 'pointer', fontSize: '14px', border: '1px solid var(--border)' } }, d.t );
        c.setAttribute('data-kb-pair', String(d.idx));
        c.onclick = () => {
          if (solved[i] || c._done) return;
          if (!selLeft) { toast('先点左边一个词～'); return; }
          const li = parseInt(selLeft.getAttribute('data-kb-pair'), 10);
          if (li === d.idx) {
            selLeft._done = true; c._done = true; selLeft.style.background = '#EAFBF0'; selLeft.style.outline = ''; selLeft.onclick = null;
            c.style.background = '#EAFBF0'; c.onclick = null; selLeft = null;
            if (left.every(d2 => lWrap.querySelectorAll('div')[left.indexOf(d2)]._done)) markSolved();
          } else { toast('这两组不是一对，再试试～'); selLeft.style.outline = ''; selLeft = null; }
        };
        rWrap.appendChild(c);
      });
      row.appendChild(el('div', { style: { display: 'flex', gap: '12px' } }, lWrap, rWrap));
    }
    card.appendChild(row);
  });
  w.appendChild(card);
  addStudyButton(w, 'chinese', [it._id]);
}

      card.appendChild(el('div', { className: 'card-title' }, mode === 'type' ? '🔍 这是什么句型？（选对才算学会，不显示答案）' : '🔄 把句子换一种说法（选对才算学会）'));
      if (mode === 'type') {
        const items = sentences.filter(s => /(反问句|陈述句|感叹句)\s*→/.test(s.from)).map(s => ({ sent: s.a, type: s.from.split('→')[0].trim(), id: s._id }));
        items.forEach((it, i) => {
          const row = el('div', { style: { padding: '12px', background: '#FFFAF0', borderRadius: '12px', marginBottom: '10px' } },
            el('div', { style: { fontWeight: 'bold', color: 'var(--primary-dark)', marginBottom: '8px' } }, '“' + it.sent + '”'),
            el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } })
          );
          ['陈述句', '反问句', '感叹句'].forEach(t => {
            const b = el('button', { className: 'btn btn-sm', onClick: () => {
              if (solved[it.id]) return;
              if (t === it.type) { b.style.background = 'var(--secondary)'; b.style.color = '#fff'; solved[it.id] = true; addPoints(2, '句子训练'); markLearned('chinese', it.id); saveData(); toast('✅ 答对啦！'); checkDone(items); }
              else { b.style.background = '#FFB3B3'; toast('再想想，这不是' + t); }
            } }, t);
            row.lastChild.appendChild(b);
          });
          card.appendChild(row);
        });
      } else {
        const items = sentences.filter(s => /把字句|被字句/.test(s.from));
        const allB = items.map(x => x.b);
        items.forEach((it, i) => {
          const target = it.from.split('→')[1].trim();
          const opts = [it.b];
          const poolB = allB.filter(x => x !== it.b);
          while (opts.length < 3 && poolB.length) opts.push(poolB.splice(Math.floor(Math.random() * poolB.length), 1)[0]);
          for (let k = opts.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [opts[k], opts[j]] = [opts[j], opts[k]]; }
          const row = el('div', { style: { padding: '12px', background: '#FFFAF0', borderRadius: '12px', marginBottom: '10px' } },
            el('div', { style: { fontWeight: 'bold', color: 'var(--primary-dark)', marginBottom: '4px' } }, '原句：' + it.a),
            el('div', { style: { fontSize: '13px', color: 'var(--secondary-dark)', marginBottom: '8px' } }, '👉 改成：' + target),
            el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } })
          );
          opts.forEach(o => {
            const b = el('button', { className: 'btn btn-sm', onClick: () => {
              if (solved[it._id]) return;
              if (o === it.b) { b.style.background = 'var(--secondary)'; b.style.color = '#fff'; solved[it._id] = true; addPoints(2, '句子训练'); markLearned('chinese', it._id); saveData(); toast('✅ 改对啦！'); checkDone(items); }
              else { b.style.background = '#FFB3B3'; toast('再想想，这样改不对'); }
            } }, o);
            row.lastChild.appendChild(b);
          });
          card.appendChild(row);
        });
      }
    }
    function checkDone(items) { if (items.every(it => solved[it.id || it._id])) card.appendChild(el('p', { style: { textAlign: 'center', color: 'var(--secondary-dark)', fontSize: '18px', marginTop: '8px' } }, '🎉 全部做对啦！')); }
    render();
    addStudyButton(w, 'chinese', sentences.map(s => s._id));
  } else if (name === '课本同步') {
    // 一课一练：每天只学一个课题（不显示答案，8 种不同类型题，全部答对才算学会）
    const it = pickDailyChinese('课本同步', 1)[0];
    renderKebenLesson(w, it);
  } else if (name === '阅读理解') {
    // 一天一个主题，主题里有多道不同类型题；全部答对才能闯关成功（不显示答案）
    const theme = pickDailyChinese('阅读理解', 1)[0];
    const card = el('div', { className: 'card' },
      el('div', { className: 'card-title' }, '📖 阅读理解 · 今天一个主题'),
      el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '4px' } }, '📖 《' + theme.title + '》'),
      el('div', { style: { marginBottom: '12px', lineHeight: '1.8', background: '#FFFAF0', borderRadius: '10px', padding: '10px', fontSize: '15px' } }, theme.para)
    );
    const solved = {};
    theme.qs.forEach((qq, i) => {
      const row = el('div', { style: { padding: '12px', background: '#fff', borderRadius: '12px', marginBottom: '10px', border: '1px solid var(--border)' } },
        el('div', { style: { fontWeight: 'bold', marginBottom: '8px' } }, (i+1) + '. ' + qq.q),
        el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } })
      );
      qq.opts.forEach((o, oi) => {
        const b = el('button', { className: 'btn btn-sm', onClick: () => {
          if (solved[i]) return;
          if (oi === qq.a) { b.style.background = 'var(--secondary)'; b.style.color = '#fff'; solved[i] = true; toast('✅ 第' + (i+1) + '题答对！'); checkDone(); }
          else { b.style.background = '#FFB3B3'; toast('再想想，这题不对哦～'); }
        } }, o);
        row.lastChild.appendChild(b);
      });
      card.appendChild(row);
    });
    const status = el('div', { style: { textAlign: 'center', color: 'var(--text-light)', fontSize: '14px', marginTop: '6px' } }, '已答对 0 / ' + theme.qs.length + ' 题');
    card.appendChild(status);
    function checkDone() {

      status.textContent = '已答对 ' + n + ' / ' + theme.qs.length + ' 题';
      if (n === theme.qs.length) {
        addPoints(data.chinese.points, '阅读理解');

    ));

}

function logSport(name, durationSec) {

// 每个运动的真人跟练视频（B站 BV 号）。即使旧数据丢失了 bvid，也能稳定播放真人视频
const SPORT_DEFAULT_VIDEOS = {
  's1': 'BV1rM4y1j7Mc', 's2': 'BV1sv4y1R7ng', 's3': 'BV1kB3ezyE5Q',
  's4': 'BV1TV411Z7pq', 's5': 'BV1Ny4y1873d', 's6': 'BV11A41187kr'
};
function startSportFollow(item) {
  let elapsed = 0;
  const total = item.time * 60; // 秒
  let playing = false, timer = null;
  const cues = ['开合跳！💥', '深蹲！🔽', '高抬腿！🦵', '扭扭腰！🌀', '踮脚尖！⤴️', '拍拍手！👏', '转个圈！🔄'];
  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  const effBvid = item.bvid || SPORT_DEFAULT_VIDEOS[item.id] || SPORT_DEFAULT_VIDEOS[item.name] || null;
  const hasVideo = !!(effBvid || item.videoUrl);
  let videoSrc = null;
  if (hasVideo) videoSrc = item.videoUrl || ('https://player.bilibili.com/player.html?bvid=' + effBvid + '&page=1&high_quality=1&danmaku=0&autoplay=0');
  const pageUrl = effBvid ? ('https://www.bilibili.com/video/' + effBvid + '/') : (item.videoUrl || null);

  const progFill = el('div', { style: { height: '100%', width: '0%', background: '#FF7A59', borderRadius: '4px' } });
  const prog = el('div', { style: { height: '8px', background: 'rgba(255,255,255,.6)', borderRadius: '4px', overflow: 'hidden' }, }, progFill);
  const stage = el('div', { style: { position: 'relative', width: '100%', aspectRatio: '16 / 9', background: 'linear-gradient(135deg,#FFF0E0,#FFE0EC)', borderRadius: '16px', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center' } });
  const instructor = el('div', { style: { fontSize: '110px', transition: 'transform .3s', filter: 'drop-shadow(0 6px 10px rgba(0,0,0,.15))' } }, item.icon);
  const cue = el('div', { style: { position: 'absolute', bottom: '18px', left: '0', right: '0', textAlign: 'center', fontSize: '24px', fontWeight: 'bold', color: '#C2562E' } }, '准备开始～');

  if (hasVideo) {
    // 真人教练视频（点视频里的播放键即可听到声音）
    const iframe = el('iframe', { src: videoSrc, allowfullscreen: true, frameborder: '0', style: { width: '100%', height: '100%', border: 'none' }, allow: 'autoplay; encrypted-media; picture-in-picture; fullscreen' });
    stage.appendChild(iframe);
  } else {
    stage.appendChild(instructor); stage.appendChild(cue);
  }

  const timeLabel = el('span', { style: { fontWeight: 'bold', fontVariantNumeric: 'tabular-nums' } }, '00:00 / ' + fmt(total));
  const playBtn = hasVideo ? null : el('button', { className: 'btn btn-green', onClick: () => { play(); playBtn.textContent = '⏸ 暂停'; } }, '▶ 开始跟练');
  const doneBtn = el('button', { className: 'btn btn-gold', onClick: () => finish(true) }, '✓ 我做完啦！');

  function bounce() { instructor.style.transform = 'translateY(-18px) scale(1.06)'; setTimeout(() => { instructor.style.transform = 'translateY(0) scale(1)'; }, 300); }
  function tick() {
    elapsed++;
    const pct = Math.min(100, elapsed / total * 100);
    progFill.style.width = pct + '%';
    timeLabel.textContent = fmt(elapsed) + ' / ' + fmt(total);
    if (!hasVideo) { cue.textContent = cues[elapsed % cues.length]; bounce(); }
    if (elapsed >= total) finish(false);
  }
  function play() { if (playing) return; playing = true; timer = setInterval(tick, 1000); }
  function pause() { playing = false; if (timer) { clearInterval(timer); timer = null; } }
  function finish(manual) {
    pause();
    const dur = manual ? total : elapsed;
    data.sports.studyTime += dur;
    data.timeTracking.sports = (data.timeTracking.sports || 0) + dur;
    addPoints(data.sports.points, '运动：' + item.name);
    logSport(item.name, dur);
    saveData();
    confetti();
    closeModal();
    showModal(el('div', { style: { textAlign: 'center', padding: '24px', background: 'linear-gradient(135deg,#FFF0D6,#FFE3C2)', borderRadius: '16px' } },
      el('div', { style: { fontSize: '70px' } }, '🏆'),
      el('h2', { style: { color: '#C2562E' } }, '你太厉害了！'),
      el('p', { style: { fontSize: '18px' } }, '完成了「' + item.name + '」跟练'),
      el('p', { style: { color: 'var(--primary-dark)', fontWeight: 'bold', fontSize: '20px' } }, '+ ' + data.sports.points + ' 积分'),
      el('p', { style: { color: 'var(--text-light)' } }, '运动 ' + Math.round(dur / 60) + ' 分钟，身体棒棒哒！💪')
    ));
  }

  const box = el('div', { style: { width: '100%' } },
    el('h3', { style: { marginTop: 0, marginBottom: '12px' } }, '📺 跟练：' + item.name + '（' + item.time + '分钟）'),
    stage,
    prog,
    el('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', justifyContent: 'center', marginTop: '14px', flexWrap: 'wrap' } },
      playBtn, doneBtn, timeLabel
    ),
    hasVideo
      ? el('div', { style: { textAlign: 'center', marginTop: '8px' } },
          el('p', { style: { color: '#C2562E', fontSize: '13px', margin: '0 0 6px' } }, '🎬 点视频里的 ▶ 播放键就能听到声音，跟着真人教练一起跳吧！做完点「我做完啦」领取奖励 🎁'),
          pageUrl ? el('a', { href: pageUrl, target: '_blank', className: 'btn btn-ghost btn-sm', style: { textDecoration: 'none' } }, '🔗 在 B站打开（播放器不可用时点这）') : null
        )
      : el('p', { style: { textAlign: 'center', color: 'var(--text-light)', fontSize: '13px', marginTop: '8px' } }, '点「开始跟练」跟着教练做，做完点「我做完啦」领取奖励 🎁')
  );
  showModal(box, true);
  _modalCleanup = () => { try { if (timer) clearInterval(timer); } catch (e) {} };
}

function renderSportSummary(w) {
  const head = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '🗓️ 选择时间'));
  const seg = el('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } });
  const dateRow = el('div', { style: { display: 'none', gap: '8px', alignItems: 'center', marginTop: '10px', flexWrap: 'wrap' } });
  const body = el('div');

  const fInp = el('input', { type: 'date', value: sportSumFrom });
  const tInp = el('input', { type: 'date', value: sportSumTo });
  fInp.onchange = () => { sportSumFrom = fInp.value; refresh(); };
  tInp.onchange = () => { sportSumTo = tInp.value; refresh(); };
  dateRow.appendChild(el('span', { style: { fontSize: '13px' } }, '从'));
  dateRow.appendChild(fInp);
  dateRow.appendChild(el('span', { style: { fontSize: '13px' } }, '到'));
  dateRow.appendChild(tInp);

  function refresh() {
    const ids = ['today', 'week', 'month', 'custom'];
    seg.querySelectorAll('button').forEach((b, i) => {
      b.style.background = ids[i] === sportSumPeriod ? 'var(--primary)' : '#FFE9D9';
      b.style.fontWeight = ids[i] === sportSumPeriod ? 'bold' : 'normal';
    });
    dateRow.style.display = sportSumPeriod === 'custom' ? 'flex' : 'none';

    const [start, end] = _hwPeriodRange(sportSumPeriod, sportSumFrom, sportSumTo);
    const logs = (data.sports.log || []).filter(l => l.ts >= start.getTime() && l.ts <= end.getTime());
    const totalSec = logs.reduce((s, l) => s + l.duration, 0);
    const sessions = logs.length;
    const byName = {};
    logs.forEach(l => { byName[l.name] = (byName[l.name] || 0) + l.duration; });

    body.innerHTML = '';
    body.appendChild(el('div', { className: 'card' },
      el('div', { className: 'card-title' }, '📊 ' + _hwPeriodLabel(sportSumPeriod) + '运动汇总'),
      el('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap', textAlign: 'center' } },
        el('div', { style: { flex: '1', minWidth: '90px' } }, el('div', { style: { fontSize: '28px', fontWeight: 'bold', color: 'var(--primary-dark)' } }, Math.round(totalSec / 60) + ' 分'), el('div', { style: { fontSize: '12px', color: 'var(--text-light)' } }, '总时长')),
        el('div', { style: { flex: '1', minWidth: '90px' } }, el('div', { style: { fontSize: '28px', fontWeight: 'bold', color: 'var(--primary-dark)' } }, sessions), el('div', { style: { fontSize: '12px', color: 'var(--text-light)' } }, '运动次数')),
        el('div', { style: { flex: '1', minWidth: '90px' } }, el('div', { style: { fontSize: '28px', fontWeight: 'bold', color: 'var(--primary-dark)' } }, sessions ? Math.round(totalSec / 60 / sessions * 10) / 10 + ' 分' : '0 分'), el('div', { style: { fontSize: '12px', color: 'var(--text-light)' } }, '平均每次'))
      )
    ));

    const names = Object.keys(byName);
    if (names.length > 0) {
      const maxV = Math.max.apply(null, names.map(n => byName[n]));
      const dist = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '🏃 做了哪些运动'));
      names.sort((a, b) => byName[b] - byName[a]).forEach(n => {
        const sec = byName[n];
        const bar = el('div', { style: { height: '10px', borderRadius: '5px', background: '#FFE9D9', overflow: 'hidden', marginTop: '4px' } },
          el('div', { style: { height: '100%', width: Math.max(6, Math.round(sec / maxV * 100)) + '%', background: 'linear-gradient(90deg,#FFB88C,#FF7A59)' } }));
        dist.appendChild(el('div', { style: { padding: '8px 0', borderBottom: '1px dashed var(--border)' } },
          el('div', { style: { display: 'flex', justifyContent: 'space-between' } },
            el('span', null, n),
            el('span', { style: { color: 'var(--primary-dark)', fontWeight: 'bold' } }, Math.round(sec / 60) + ' 分钟')),
          bar
        ));
      });
      body.appendChild(dist);
    }

    const list = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '📋 ' + _hwPeriodLabel(sportSumPeriod) + '记录（共 ' + logs.length + ' 条）'));
    if (logs.length === 0) list.appendChild(el('p', { style: { color: 'var(--text-light)' } }, '这段时间还没有运动记录哦，去跟练一下吧！'));
    logs.slice().reverse().forEach(l => {
      list.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px dashed var(--border)' } },
        el('span', null, '🏃 ' + l.name),
        el('span', { style: { color: 'var(--text-light)', fontSize: '13px' } }, formatDate(new Date(l.ts)) + ' · ' + Math.round(l.duration / 60) + '分')
      ));
    });
    body.appendChild(list);
  }

  [{ id: 'today', n: '今天' }, { id: 'week', n: '本周' }, { id: 'month', n: '本月' }, { id: 'custom', n: '自定义' }].forEach(o => {
    seg.appendChild(el('button', { className: 'btn btn-sm', style: { background: '#FFE9D9' }, onClick: () => { sportSumPeriod = o.id; refresh(); } }, o.n));
  });
  head.appendChild(seg);
  head.appendChild(dateRow);
  w.appendChild(head);
  w.appendChild(body);
  refresh();
}

function dailyKey(type, subType) { return today() + (type === 'lottery' ? ('_' + (subType || 'grid')) : ''); }
function bumpDaily(type, subType) {
  const store = type === 'lottery' ? data.lotteryDailyCount : data.mysteryDailyCount;
  const k = dailyKey(type, subType);
  store[k] = (store[k] || 0) + 1;
  saveData();
}
function getDailyRemaining(type, subType) {
  const store = type === 'lottery' ? data.lotteryDailyCount : data.mysteryDailyCount;
  const count = store[dailyKey(type, subType)] || 0;
  const max = type === 'lottery' ? data.lottery[subType || 'grid'].daily : data.mystery.daily;
  return Math.max(0, max - count);
}

function renderLotteryWheel(w) {
  const canvas = el('canvas', { className: 'wheel-canvas', width: 320, height: 320 });
  const ctx = canvas.getContext('2d');
  const prizes = data.lottery.wheel.prizes;
  const n = prizes.length;
  const step = 360 / n;
  const colors = ['#FF6B6B', '#FFA500', '#FFD700', '#87CEEB', '#B5E2C0', '#D4A5E0', '#FFB6A0', '#9AD0EC'];
  const draw = () => {
    const cx = 160, cy = 160, r = 150;
    prizes.forEach((p, i) => {
      const start = (i / n) * Math.PI * 2, end = ((i + 1) / n) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath();
      ctx.fillStyle = colors[i % colors.length]; ctx.fill();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + (end - start) / 2);
      ctx.fillStyle = 'white'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('❓', r - 42, 6);
      ctx.restore();
    });
  };
  draw();
  let angle = 0, velocity = 0, spinning = false, raf = null;
  const wrap = el('div', { className: 'wheel-container' },
    el('div', { className: 'wheel-pointer' }, '▼'),
    canvas,
    el('button', { className: 'wheel-btn', onClick: () => {
      if (!spinning) return;
      spinning = false;
      const decel = () => {
        velocity *= 0.96; angle += velocity;
        canvas.style.transform = 'rotate(' + angle + 'deg)';
        if (velocity > 0.3) raf = requestAnimationFrame(decel);
        else finish();
      };
      raf = requestAnimationFrame(decel);
    } }, '🛑 停！')
  );
  const spin = () => {
    if (spinning) return;
    if (getPointsBalance() < data.lottery.wheel.cost) { toast('积分不足！'); return; }
    if (getDailyRemaining('lottery', 'wheel') <= 0) { toast('今日次数已用完'); return; }
    spendPoints(data.lottery.wheel.cost, '大转盘抽奖');
      bumpDaily('lottery', 'wheel');
    saveData();
    spinning = true; velocity = 16 + Math.random() * 5;
    const loop = () => {
      if (!spinning) return;
      angle += velocity; velocity += 0.04;
      canvas.style.transform = 'rotate(' + angle + 'deg)';
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  };
  const finish = () => {
    if (raf) cancelAnimationFrame(raf);
    const norm = ((angle % 360) + 360) % 360;
    const raw = ((270 - norm) % 360 + 360) % 360;
    const idx = Math.floor(raw / step) % n;
    const prize = prizes[idx];
    awardLotteryPrize(prize, '大转盘');
  };
  w.appendChild(wrap);
  w.appendChild(el('div', { style: { textAlign: 'center', marginTop: '12px' } },
    el('button', { className: 'btn btn-gold', onClick: spin }, '🎡 开始转动 (-' + data.lottery.wheel.cost + ' 积分)')
  ));
  w.appendChild(el('p', { style: { textAlign: 'center', color: 'var(--text-light)', fontSize: '13px', marginTop: '8px' } }, '点「开始转动」转盘飞快转，自己按「停」让它慢下来，指针指到哪就中哪！'));
}

function buildMCQ(correct, others) {
  const seen = new Set([correct]);
  const arr = [correct];
  others.filter(x => x !== correct).forEach(o => { if (!seen.has(o)) { arr.push(o); seen.add(o); } });
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  // Take up to 4 options, but the correct answer MUST be among them — otherwise the
  // question would be unsolvable (ans would point past the displayed options).
  let pool = arr.slice(0, 4);
  if (pool.indexOf(correct) === -1) pool[Math.floor(Math.random() * pool.length)] = correct;
  return { opts: pool, ans: pool.indexOf(correct) };
}
function makeEnQ() {

  const others = DRIVE_EN_BANK.filter(x => x[1] !== z).map(x => x[1]).sort(() => Math.random() - 0.5).slice(0, 6);
  const mc = buildMCQ(z, others);

function makeMathQ() {
  // 二年级：100 以内加减 + 2~5 乘法表
  const r = Math.random();

  if (r < 0.4) { const a = 1 + Math.floor(Math.random() * 89), b = 1 + Math.floor(Math.random() * (99 - a)); ans = a + b; q = '🔢 ' + a + ' + ' + b + ' = ?'; }
  else if (r < 0.7) { const a = 10 + Math.floor(Math.random() * 90), b = 1 + Math.floor(Math.random() * (a - 1)); ans = a - b; q = '🔢 ' + a + ' − ' + b + ' = ?'; }
  else { const x = 2 + Math.floor(Math.random() * 4), y = 1 + Math.floor(Math.random() * 9); ans = x * y; q = '✖️ ' + x + ' × ' + y + ' = ?'; }
  const others = new Set(); let guard = 0;
  while (others.size < 6 && guard++ < 60) { const d = ans + (Math.floor(Math.random() * 17) - 8); if (d !== ans && d >= 0) others.add(d); }
  const mc = buildMCQ(ans, Array.from(others));
  return { q, opts: mc.opts, ans: mc.ans };

function makeZhQ() {
  const [ch, py] = DRIVE_ZH_BANK[Math.floor(Math.random() * DRIVE_ZH_BANK.length)];

function drawDriveQuestion() {

  if (driveGame.animTimer) { try { clearInterval(driveGame.animTimer); } catch (e) {} driveGame.animTimer = null; }
  const timer = setInterval(() => {
    step++;
    const left = 6 + (86 - 6) * Math.min(1, step / 60);
    if (car) car.style.left = left + '%';
    if (step >= 60) { clearInterval(timer); driveGame.animTimer = null; onArrive(); return; }
    const ev = driveGame.pendingEvents && driveGame.pendingEvents.find(e => e.step === step);
    if (ev) {
      driveGame.pendingEvents = driveGame.pendingEvents.filter(e => e !== ev);
      clearInterval(timer); driveGame.animTimer = null;
      driveEvent(ev.type, () => startDriveAnimation(step, onArrive));
    }
  }, 45);
  driveGame.animTimer = timer;

// 背诵相似度（忽略标点/空格，用 F1 重合率）
function reciteScore(orig, input) {
  const norm = s => (s || '').replace(/[\s，。、？！,.?!；;：:""''《》()（）]/g, '');
  const a = norm(orig), b = norm(input);
  if (!b) return 0;
  const set = new Set(a.split(''));
  let hit = 0;
  for (const ch of b) if (set.has(ch)) hit++;
  const recall = hit / Math.max(1, a.length);
  const prec = hit / Math.max(1, b.length);
  return Math.round((2 * recall * prec / (recall + prec || 1)) * 100);
}

function poemMaskLines(p, mode) {
  if (mode === 'none') return (p.lines || []).join('\n');
  if (mode === 'half') {
    return (p.lines || []).map(l => {
      const chars = Array.from(l);
      return chars.map((c, i) => (i < 2 ? c : '●')).join('');
    }).join('\n');
  }
  return (p.lines || []).map(() => '● ● ● ● ●').join('\n');
}

function openPoemProgress() {
  const bank = CHINESE_BANKS['古诗积累'] || [];
  const prog = data.poemProgress || {};
  const learned = bank.filter(p => prog[p.t] && prog[p.t].learned);
  const list = bank.map(p => {
    const pr = prog[p.t];

    if (pr && pr.learned) {

      else if (best >= 60) { label = '一般 ' + best + '分'; color = '#E9A23B'; }
      else { label = '不熟练 ' + best + '分'; color = 'var(--red)'; }
    }

function openPoemPractice(p) {
  data.poemProgress = data.poemProgress || {};
  let mode = 'half';
  const wrap = el('div', null);
  const maskBox = el('div', { style: { whiteSpace: 'pre-line', padding: '12px', background: '#FFFAF0', borderRadius: '12px', fontSize: '17px', lineHeight: '1.8', textAlign: 'center', margin: '8px 0', minHeight: '48px' } }, poemMaskLines(p, mode));
  const resultBox = el('div', { style: { textAlign: 'center', margin: '10px 0', minHeight: '40px' } });
  const textArea = el('textarea', { placeholder: '在这里把诗背写出来（也可以用上面的录音背诵）～', style: { width: '100%', minHeight: '90px', borderRadius: '12px', border: '1px solid var(--border)', padding: '10px', fontSize: '15px', fontFamily: 'inherit' } });

  function refreshMask() { maskBox.textContent = poemMaskLines(p, mode); }

  function finish(score, how) {
    const pr = data.poemProgress[p.t] || {};
    const best = Math.max(pr.best || 0, score);
    data.poemProgress[p.t] = Object.assign({}, pr, { learned: true, best, last: today(), title: p.t, author: p.a });
    const gain = Math.round((data.poemPoints || 10) * Math.max(0, score) / 100);
    if (score > 0) addPoints(gain, '古诗背诵：' + p.t);
    saveData();
    let msg, color;
    if (score >= 85) { msg = '🌟 太棒了！背得真熟练，+' + gain + ' 积分'; color = 'var(--green)'; confetti(); }
    else if (score >= 60) { msg = '👍 不错哦，继续加油～ +' + gain + ' 积分'; color = '#E9A23B'; }
    else { msg = '💪 再读几遍就会啦，多练习～'; color = 'var(--red)'; }
    resultBox.innerHTML = '';
    resultBox.appendChild(el('div', { style: { fontSize: '22px', fontWeight: 'bold', color } }, '得分 ' + score + ' 分'));
    resultBox.appendChild(el('div', { style: { fontSize: '14px', marginTop: '4px', color: 'var(--text)' } }, msg + '（' + how + '）'));
    if (gain > 0) toast('+ ' + gain + ' 积分');
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recBtn = el('button', { className: 'btn btn-sm' }, SR ? '🎤 开始背诵' : '🎤 背诵（家长打分）');
  let recognizing = false, rec = null, finalText = '';
  recBtn.onclick = () => {
    if (SR) {
      if (!recognizing) {
        try {
          rec = new SR(); rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = false;
          rec.onresult = (e) => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; finalText = t; textArea.value = t; };
          rec.onend = () => { recognizing = false; recBtn.textContent = '🎤 开始背诵'; if (finalText) finish(reciteScore(poemText(p), finalText), '录音识别'); };
          rec.onerror = () => { recognizing = false; recBtn.textContent = '🎤 开始背诵'; toast('没听清，换书写或再试一次'); };
          rec.start(); recognizing = true; recBtn.textContent = '⏹ 停止';
        } catch (e) { toast('语音识别不可用'); }
      } else { try { rec.stop(); } catch (e) {} }
    } else {
      promptModal('家长打分（0-100）', '80', (v) => { const s = Math.max(0, Math.min(100, parseInt(v, 10) || 0)); finish(s, '家长打分'); });
    }
  };

  const keys = ['full', 'half', 'none'];
  const maskBtns = ['全屏蔽', '半屏蔽', '不屏蔽'].map((m, i) => {
    const b = el('button', { className: 'btn btn-sm' + (keys[i] === mode ? ' btn-blue' : '') }, m);
    b.onclick = () => { mode = keys[i]; refreshMask(); maskBtns.forEach((x, j) => { x.className = 'btn btn-sm' + (keys[j] === mode ? ' btn-blue' : ''); }); };
    return b;
  });

  const submit = el('button', { className: 'btn btn-sm btn-green', onClick: () => { finish(reciteScore(poemText(p), textArea.value), '书写背诵'); } }, '✍️ 提交背诵');

  wrap.appendChild(el('div', { className: 'card-title' }, '🎴 练一练 ·《' + p.t + '》'));
  wrap.appendChild(el('div', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '4px' } }, '① 选背诵提示方式：'));
  wrap.appendChild(el('div', { style: { display: 'flex', gap: '8px' } }, ...maskBtns));
  wrap.appendChild(el('div', { style: { fontSize: '13px', color: 'var(--text-light)', margin: '10px 0 2px' } }, '② 看着提示，把诗背出来：'));
  wrap.appendChild(maskBox);
  wrap.appendChild(el('div', { style: { fontSize: '13px', color: 'var(--text-light)', margin: '8px 0 2px' } }, '③ 录音背诵 或 写下来 再提交：'));
  wrap.appendChild(el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } }, recBtn, submit));
  wrap.appendChild(el('div', { style: { marginTop: '8px' } }, textArea));
  wrap.appendChild(resultBox);
  wrap.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '10px' }, onClick: () => { closeModal(); renderModule(); } }, '完成'));
  showModal(wrap, true);
}

function petGameMemory(id) {

  const deck = shuffle([...emojis, ...emojis]).map((e, i) => ({ e, i, open: false, done: false }));
  let first = null, lock = false, matched = 0;
  const box = el('div', { style: { textAlign: 'center', padding: '10px' } },
    el('h3', null, '🧠 记忆翻牌'),
    el('p', { style: { color: 'var(--text-light)', fontSize: '13px' } }, '翻开两张一样的就配对成功，配完 8 对得奖励～'),
    el('div', { id: 'mg-grid', style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px', maxWidth: '320px', margin: '10px auto' } })
  );
  const grid = box.lastChild;
  const render = () => {
    grid.innerHTML = '';
    deck.forEach(c => {
      const face = c.done ? c.e : (c.open ? c.e : '❓');
      const cell = el('div', { style: { fontSize: '26px', height: '52px', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '10px', cursor: c.done ? 'default' : 'pointer', background: c.done ? '#EAFBF0' : (c.open ? '#FFF3D0' : '#FFF'), border: '1px solid var(--border)' } }, face);

          else { lock = true; const f = first, s = c; setTimeout(() => { if (f) f.open = false; if (s) s.open = false; if (first === f) first = null; lock = false; render(); }, 700); }
        }
      };
      grid.appendChild(cell);
    });
  };
  render();
  showModal(box, true);
}

function petLearnQuiz(id, subject, title, tip) {
  const p = data.pet.pets[id];
  const pool = PET_LEARN_BANK.filter(x => subject === 'all' || x.subject === subject || (subject === 'zh' && x.subject === 'math'));
  const picks = [];
  for (let i = 0; i < 5; i++) picks.push(pool[Math.floor(Math.random() * pool.length)]);
  let idx = 0, correct = 0, hpDelta = 0;
  function render() {
    if (idx >= picks.length) { finish(); return; }
    const q = picks[idx];
    const box = el('div', { style: { textAlign: 'center', padding: '10px' } },
      el('h3', null, title),
      el('p', { style: { color: 'var(--text-light)', fontSize: '13px' } }, tip),
      el('div', { style: { fontSize: '14px', color: 'var(--text-light)', margin: '4px 0' } }, '第 ' + (idx + 1) + ' / ' + picks.length + ' 题 · 生命值 ' + Math.round(p.health)),
      el('div', { style: { fontSize: '20px', fontWeight: 'bold', margin: '10px 0' } }, q.q,
        q.speak ? el('button', { className: 'btn btn-sm btn-ghost', style: { marginLeft: '8px' }, onClick: () => speak(q.speak) }, '🔊') : null
      ),
      el('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', justifyContent: 'center', marginTop: '10px' } })
    );
    const wrap = box.lastChild;
    q.opts.forEach((opt, oi) => wrap.appendChild(el('button', { className: 'btn', onClick: () => {
      if (box._done) return; box._done = true;
      if (oi === q.ans) { correct++; hpDelta += 5; p.health = Math.min(100, p.health + 5); toast('🎉 答对啦！'); }
      else { hpDelta -= 8; p.health = Math.max(0, p.health - 8); wrap.querySelectorAll('button').forEach(b => { if (b.textContent === q.opts[q.ans]) { b.style.background = 'var(--secondary)'; b.style.color = '#fff'; } }); toast('❌ 正确答案是 ' + q.opts[q.ans]); }
      saveData();
      idx++;
      setTimeout(() => { closeModal(); if (idx < picks.length) render(); else finish(); }, 850);
    } }, opt)));
    showModal(box, true);
  }
  function finish() {
    if (correct === 0) { p.health = 0; saveData(); showPetDead(id); return; }
    const gain = correct * 5;
    addPoints(gain, '宠物学习：' + title);
    saveData(); confetti();
    showModal(el('div', { style: { textAlign: 'center', padding: '16px' } },
      el('h3', null, '📚 学习完成！'),
      el('div', { style: { fontSize: '40px' } }, p.icon),
      el('p', null, '答对 ' + correct + ' / ' + picks.length + ' 题'),
      el('p', { style: { color: 'var(--secondary-dark)' } }, '生命值 ' + (hpDelta >= 0 ? '+' : '') + hpDelta + '，+' + gain + ' 积分'),
      el('button', { className: 'btn btn-block', style: { marginTop: '10px' }, onClick: () => { closeModal(); renderModule(); } }, '好棒！')
    ));
  }
  render();
}

function updatePetStatus() {
  const now = Date.now();
  Object.values(data.pet.pets).forEach(p => {
    if (!p.lastUpdate) { p.lastUpdate = now; return; }
    const hours = (now - p.lastUpdate) / 3600000;
    p.hunger = Math.max(0, p.hunger - hours * 3);
    p.mood = Math.max(0, p.mood - hours * 2);
    if (p.hunger < 30) p.health = Math.max(0, p.health - hours * 2);
    p.lastUpdate = now;
  });
  saveData();
}

let petEngineTimer = null;
function startPetEngine() {
  if (petEngineTimer) return;
  petEngineTimer = setInterval(() => {
    const id = data.pet.active;
    if (!id || data.pet.owned.indexOf(id) < 0) return;
    const p = data.pet.pets[id];
    if (!p) return;
    p.hunger = Math.max(0, p.hunger - 2);
    p.mood = Math.max(0, p.mood - 1.5);
    if (p.hunger < 30 || p.health <= 0) p.health = Math.max(0, p.health - 1.5);
    p.lastUpdate = Date.now();
    const k = id;
    checkPetAlerts(id);
    if (p.hunger >= 40) petAlerted[k + 'hungry'] = false;
    if (p.health >= 40) petAlerted[k + 'sick'] = false;
    if (p.mood >= 40) petAlerted[k + 'sad'] = false;
    if (p.health > 0) petAlerted[k + 'dead'] = false;
    saveData();
  }, 15000);
}
function checkPetAlerts(id) {
  const p = data.pet.pets[id];
  if (!p) return;
  const k = id;
  const maybePetAlert = (stateKey, msg) => {
    if (petPopupDismissCount >= 2) return;   // 本次进入页面已关闭 2 次 → 不再自动弹
    petAlerted[k + stateKey] = true;
    petEmergency(p, msg);
  };
  if (p.health <= 0 && !petAlerted[k + 'dead']) maybePetAlert('dead', '💀 ' + petDisplayName(id) + '晕倒了！快去做任务赚积分，再来「看医生」救它～');
  else if (p.hunger < 20 && !petAlerted[k + 'hungry']) maybePetAlert('hungry', '🍖 ' + petDisplayName(id) + '好饿呀，去喂它吃点东西吧！');
  else if (p.health < 25 && !petAlerted[k + 'sick']) maybePetAlert('sick', '🤒 ' + petDisplayName(id) + '好像生病了，带它看医生吧！');
  else if (p.mood < 20 && !petAlerted[k + 'sad']) maybePetAlert('sad', '😞 ' + petDisplayName(id) + '不开心，陪它玩一会儿～');
}
function petEmergency(p, msg) {
  showModal(el('div', { style: { textAlign: 'center', padding: '20px' } },
    iconEl(p.icon, 64, { margin: '0 auto' }),
    el('h3', { style: { color: '#C2562E' } }, '突发任务！'),

    el('button', { className: 'btn btn-block', style: { marginTop: '12px' }, onClick: () => closeModal() }, '知道啦，这就去！')
  ));
  _activePetEmergency = true;   // showModal 已置 false，此处重新标记为宠物弹窗，使本次关闭被计数
}

      if (chk.checked && data.lottery.enabledTypes.indexOf(t) < 0) data.lottery.enabledTypes.push(t);
      else if (!chk.checked) data.lottery.enabledTypes = data.lottery.enabledTypes.filter(x => x !== t);

        onNum: v => { prizes[i].points = v; prizes[i].noWin = (v <= 0 && (prizes[i].name || '').indexOf('谢谢') >= 0); saveData(); },
        onDel: () => { confirm('删除奖品「' + prizes[i].name + '」？', () => { prizes.splice(i, 1); saveData(); toast('已删除'); _parentRefresh(); }); }
      }));
    });
    card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '8px' }, onClick: () => {
      promptModal('奖品名称（如：20积分 / 一个冰淇淋）：', '新奖品', (name) => {

        const num = (String(name).match(/\d+/) || [0])[0] | 0;
        prizes.push({ name: name, icon: '🎁', points: num });
        saveData(); toast('已添加：' + name); _parentRefresh();
      });
    } }, '➕ 添加奖品'));
    w.appendChild(card);
  });
}

function renderMysterySettings(w) {
  if (!data.mystery) data.mystery = { cost: 10, daily: 3, prizes: [] };
  if (!Array.isArray(data.mystery.prizes)) data.mystery.prizes = [];
  const prizes = data.mystery.prizes;
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '📦 盲盒设置'));
  const costInp = el('input', { type: 'number', value: data.mystery.cost, min: '0', style: { width: '80px' } });
  costInp.onchange = () => { data.mystery.cost = parseInt(costInp.value) || 0; saveData(); toast('已保存'); };
  const dailyInp = el('input', { type: 'number', value: data.mystery.daily, min: '0', style: { width: '80px' } });
  dailyInp.onchange = () => { data.mystery.daily = parseInt(dailyInp.value) || 0; saveData(); toast('已保存'); };
  card.appendChild(el('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap', fontSize: '13px' } },
    '消耗', costInp, '积分/次', el('span', { style: { width: '10px' } }, ''), '每日', dailyInp, '次'));
  card.appendChild(el('div', { style: { marginTop: '14px', fontWeight: 'bold' } }, '盲盒奖品池（当前 ' + prizes.length + ' 个）'));
  card.appendChild(el('div', { style: { fontSize: '12px', color: 'var(--text-light)', marginBottom: '8px' } }, '12 个盲盒会从奖池随机抽取，可自由增删'));
  prizes.forEach((p, i) => {
    card.appendChild(itemEditor({
      pack: 'prize', icon: p.icon, name: p.name, num: p.points, numLabel: '积分', fallback: '🎁',
      onIcon: v => { if (prizes[i]) { prizes[i].icon = v; saveData(); toast('图标已更新'); _parentRefresh(); } },
      onName: v => { prizes[i].name = v; saveData(); },
      onNum: v => { prizes[i].points = v; saveData(); },
      onDel: () => { confirm('删除奖品「' + prizes[i].name + '」？', () => { prizes.splice(i, 1); saveData(); toast('已删除'); _parentRefresh(); }); }
    }));
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '8px' }, onClick: () => {
    promptModal('盲盒奖品名称：', '新奖品', (name) => {
      if (!name) return;
      const num = (String(name).match(/\d+/) || [0])[0] | 0;
      prizes.push({ name: name, icon: '🎁', points: num });
      saveData(); toast('已添加：' + name); _parentRefresh();
    });
  } }, '➕ 添加盲盒奖品'));
  w.appendChild(card);
}

function renderStationSettings(w) {
  if (!data.station) data.station = { vehicles: [], owned: [], activeVehicle: null, passengers: [], roadDecor: [] };
  if (!Array.isArray(data.station.vehicles)) data.station.vehicles = [];
  const vs = data.station.vehicles;
  const card = el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '🚗 车辆管理（共 ' + vs.length + ' 辆）'),

  );
  vs.forEach((v, i) => {
    card.appendChild(itemEditor({
      pack: 'vehicle', icon: v.image, name: v.name, num: v.price, numLabel: '积分', fallback: '🚗',
      onIcon: val => { if (vs[i]) { vs[i].image = val; saveData(); toast('图片已更新'); _parentRefresh(); } },
      onName: val => { vs[i].name = val; saveData(); },
      onNum: val => { vs[i].price = val; saveData(); },
      onDel: () => { confirm('删除车辆「' + vs[i].name + '」？', () => { const id = vs[i].id; vs.splice(i, 1); data.station.owned = (data.station.owned || []).filter(x => x !== id); if (data.station.activeVehicle === id) data.station.activeVehicle = null; saveData(); toast('已删除'); _parentRefresh(); }); }
    }));
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '10px' }, onClick: () => {
    promptModal('车辆名称（如：深圳地铁）：', '新车', (name) => {
      if (!name) return;
      vs.push({ id: uid(), name: name, price: 100, image: '🚗' });
      saveData(); toast('已添加：' + name); _parentRefresh();
    });
  } }, '➕ 添加车辆'));
  w.appendChild(card);
}

function renderSportVideoSettings(w) {
  if (!data.sports.items) data.sports.items = [];
  const card = el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '🎬 运动跟练视频'),
    el('div', { style: { fontSize: '12px', color: 'var(--text-light)', marginBottom: '10px' } }, '每个运动可换成你想要的「真人跟练视频」。填 B站视频号（BV 开头）或完整视频链接（以 http 开头）；留空则用内置动画教练。修改自动保存。')
  );
  data.sports.items.forEach((it, i) => {
    const bvidInp = el('input', { type: 'text', value: it.bvid || '', placeholder: 'B站视频号，如 BV1rM4y1j7Mc', style: { width: '100%', marginBottom: '6px' } });
    const urlInp = el('input', { type: 'text', value: it.videoUrl || '', placeholder: '或填完整视频链接 http...（与上面二选一）', style: { width: '100%' } });
    bvidInp.onchange = () => { data.sports.items[i].bvid = bvidInp.value.trim(); data.sports.items[i].videoUrl = ''; saveData(); toast('已保存'); _parentRefresh(); };
    urlInp.onchange = () => { data.sports.items[i].videoUrl = urlInp.value.trim(); data.sports.items[i].bvid = ''; saveData(); toast('已保存'); _parentRefresh(); };
    card.appendChild(el('div', { style: { border: '1px solid var(--border)', borderRadius: '12px', padding: '10px', marginBottom: '10px', background: '#FFFCF8' } },
      el('div', { style: { fontWeight: 'bold', marginBottom: '6px' } }, it.icon + ' ' + it.name),
      el('label', { style: { fontSize: '12px', color: 'var(--text-light)' } }, 'B站视频号'), bvidInp,
      el('label', { style: { fontSize: '12px', color: 'var(--text-light)', marginTop: '6px' } }, '视频链接'), urlInp
    ));
  });
  w.appendChild(card);
}

function renderVisionSettings(w) {
  if (!data.english.visionApi) data.english.visionApi = { enabled: false, endpoint: '', key: '', model: '' };
  const cfg = data.english.visionApi;
  const en = el('input', { type: 'checkbox' }); en.checked = !!cfg.enabled;
  const ep = el('input', { type: 'text', value: cfg.endpoint || '', placeholder: 'https://.../v1/chat/completions', style: { width: '100%' } });
  const key = el('input', { type: 'text', value: cfg.key || '', placeholder: 'sk-...', style: { width: '100%' } });
  const model = el('input', { type: 'text', value: cfg.model || '', placeholder: '模型名，如 gpt-4o-mini', style: { width: '100%' } });
  const save = () => { cfg.enabled = en.checked; cfg.endpoint = ep.value.trim(); cfg.key = key.value.trim(); cfg.model = model.value.trim(); saveData(); toast('已保存'); };
  en.onchange = save; ep.onchange = save; key.onchange = save; model.onchange = save;
  w.appendChild(el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '🤖 拍照自动识别（已默认开启）'),
    el('p', { style: { fontSize: '13px', color: 'var(--text-light)', marginBottom: '12px' } }, '默认已开启「离线自动识别」：手机内模型，拍实物照片（苹果/猫/球/车…常见物品）会自动认出并填好英文单词，无需任何账号或 key。识别不到或想认纸上文字/更复杂的图，可开启下方「云端视觉接口」并填 key。任何识别失败都会自动退回手动选库。'),
    el('label', { style: { display: 'flex', gap: '8px', alignItems: 'center', fontWeight: 'bold', marginBottom: '12px' } }, en, '开启云端视觉接口（识别纸上文字/更复杂图片）'),
    el('label', null, '接口地址（OpenAI 兼容）'), ep,
    el('label', { style: { marginTop: '10px' } }, 'API Key'), key,
    el('label', { style: { marginTop: '10px' } }, '模型名'), model
  ));
}

function renderPetSettings(w) {
  if (!data.pet.pets) data.pet.pets = {};
  const ids = Object.keys(data.pet.pets);
  const card = el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '🐾 宠物管理（共 ' + ids.length + ' 只）'),
    el('div', { style: { fontSize: '12px', color: 'var(--text-light)', marginBottom: '10px' } }, '宠物形象可用表情，也可上传照片 · 修改自动保存')
  );
  ids.forEach(id => {
    const p = data.pet.pets[id];
    card.appendChild(itemEditor({
      pack: 'pet', icon: p.icon, name: p.name, num: p.price, numLabel: '积分', fallback: '🐱',
      onIcon: v => { if (data.pet.pets[id]) { data.pet.pets[id].icon = v; saveData(); toast('形象已更新'); _parentRefresh(); } },
      onName: v => { data.pet.pets[id].name = v; saveData(); },
      onNum: v => { data.pet.pets[id].price = v; saveData(); },
      onDel: () => { confirm('删除宠物「' + data.pet.pets[id].name + '」？', () => { delete data.pet.pets[id]; data.pet.owned = (data.pet.owned || []).filter(x => x !== id); if (data.pet.active === id) data.pet.active = null; saveData(); toast('已删除'); _parentRefresh(); }); }
    }));
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '10px' }, onClick: () => {
    promptModal('宠物名称（如：小乌龟）：', '新宠物', (name) => {
      if (!name) return;
      const id = 'p' + uid();
      data.pet.pets[id] = { name: name, icon: '🐢', price: 200, species: 'cat' };
      saveData(); toast('已添加：' + name); _parentRefresh();
    });
  } }, '➕ 添加宠物'));
  w.appendChild(card);
}

function renderWalletsSettings(w) {
  const card = el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '💎 钱包管理'),
    el('div', { style: { fontSize: '12px', color: 'var(--text-light)', marginBottom: '10px' } }, '家长可直接给小朋友充值 · 充值会记入账单明细')
  );
  data.wallets.forEach((wal, i) => {
    const nameInp = el('input', { type: 'text', value: wal.name, style: { flex: '1', minWidth: '90px' } });
    nameInp.onchange = () => { data.wallets[i].name = nameInp.value; saveData(); toast('已保存'); };
    const balSpan = el('span', { style: { fontWeight: 'bold', fontSize: '20px', color: 'var(--primary-dark)' } }, String(wal.balance));

    const doAdd = (amt) => {
      if (!amt) return;
      data.wallets[i].balance = (data.wallets[i].balance || 0) + amt;
      if (data.wallets[i].balance < 0) data.wallets[i].balance = 0;
      data.transactions.unshift({ id: uid(), wallet: data.wallets[i].name, type: amt > 0 ? '存入' : '取出', amount: Math.abs(amt), note: '家长' + (amt > 0 ? '充值' : '扣减'), ts: Date.now() });
      saveData();
      balSpan.textContent = String(data.wallets[i].balance);
      toast((amt > 0 ? '已充值 +' : '已扣减 ') + amt);
    };

    const quick = el('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '8px' } });
    [10, 20, 50, 100].forEach(n => quick.appendChild(el('button', { className: 'btn btn-sm', onClick: () => doAdd(n) }, '+' + n)));
    quick.appendChild(el('button', { className: 'btn btn-sm btn-blue', onClick: () => {
      promptModal('要充值多少？（输入负数为扣减）', '50', (v) => { const n = parseInt(v); if (!isNaN(n)) doAdd(n); });
    } }, '✏️ 自定义'));
    quick.appendChild(el('button', { className: 'btn btn-sm btn-ghost', onClick: () => {
      promptModal('把余额直接改成：', String(data.wallets[i].balance), (v) => {
        const n = parseInt(v);
        if (isNaN(n) || n < 0) { toast('请输入 0 或正整数'); return; }
        data.wallets[i].balance = n; saveData(); balSpan.textContent = String(n); toast('余额已设为 ' + n);
      });
    } }, '🎯 直接设值'));

    card.appendChild(el('div', { style: { border: '1px solid var(--border)', borderRadius: '12px', padding: '10px', marginBottom: '10px', background: '#FFFCF8' } },
      el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' } },
        el('span', { style: { fontSize: '22px' } }, wal.icon || '💰'),
        nameInp,
        el('span', { style: { fontSize: '12px', color: 'var(--text-light)' } }, '余额'),
        balSpan,
        wal.id !== 'points'
          ? el('button', { className: 'btn btn-ghost btn-sm', onClick: () => { confirm('删除钱包「' + wal.name + '」？', () => { data.wallets.splice(i, 1); saveData(); toast('已删除'); _parentRefresh(); }); } }, '🗑️')
          : el('span', { style: { fontSize: '11px', color: 'var(--text-light)' } }, '系统积分钱包')
      ),
      quick
    ));
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '8px' }, onClick: () => {
    promptModal('钱包名称：', '新钱包', (name) => {
      if (!name) return;
      data.wallets.push({ id: uid(), name: name, balance: 0, color: 'purple', icon: '👛' });
      saveData(); toast('已添加：' + name); _parentRefresh();
    });
  } }, '➕ 添加钱包'));
  w.appendChild(card);
}

loadData();
startAlarmEngine();
startPetEngine();
navigate('home');
</script>
