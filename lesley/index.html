  function toast(msg,dur=2000){
    const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),dur);
  }

  // Confirm
  function confirm(msg,okText='确认'){
    return new Promise(res=>{
      _confirmResolve=res;
      document.getElementById('confirmMsg').textContent=msg;
      document.getElementById('confirmOkBtn').textContent=okText;
      document.getElementById('confirmOverlay').classList.add('show');
    });
  }
  function _resolveConfirm(v){
    document.getElementById('confirmOverlay').classList.remove('show');
    if(_confirmResolve){_confirmResolve(v);_confirmResolve=null;}
  }

  // Modal
  function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalOverlay').classList.add('show');}
  function hideModal(){document.getElementById('modalOverlay').classList.remove('show');}

  // Navigate
  function navigate(page,params={}){state.currentPage=page;Object.assign(state,params);render();window.scrollTo(0,0);}

  // ================================================================
  // RENDER: HOME PAGE (v2 - customizable sections, no duplicate quick bar)
  // ================================================================
  async function renderHome(){
    const items=state.items;
    const expiredItems=[],warningItems=[];
    items.forEach(item=>{const s=getExpiryStatus(item);if(s){if(s.status==='expired')expiredItems.push({...item,...s});else warningItems.push({...item,s});}});
    const alerts=[...expiredItems,...warningItems].sort((a,b)=>{
      if((a.status==='expired')!==(b.status==='expired'))return a.status==='expired'?-1:1;
      return(a.days||a.s?.days)-(b.days||b.s?.days);
    });

    // ---- Low stock alerts ----
    const threshold = state.lowStockThreshold || 10;
    const lowStockItems = items.filter(i => i.quantity <= threshold).sort((a,b)=>a.quantity-b.quantity);
    const lowStockCount = lowStockItems.length;

    // ---- Today's activity stats ----
    const now=new Date(), todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()), todayEnd=new Date(todayStart.getTime()+86400000);
    const todayRecs = state.records.filter(r=>{const t=new Date(r.timestamp);return t>=todayStart&&t<todayEnd;});
    const todayIn = todayRecs.filter(r=>r.type==='in').reduce((s,r)=>s+r.quantity,0);
    const todayOut = todayRecs.filter(r=>r.type==='out').reduce((s,r)=>s+r.quantity,0);
    const todayConsume = todayRecs.filter(r=>r.type==='consume').reduce((s,r)=>s+r.quantity,0);
    // Count new items created today
    const todayNewItems = items.filter(i=>{const d=i.createdAt?new Date(i.createdAt):null;return d&&d>=todayStart&&d<todayEnd;}).length;

    // Load custom sections config
    const sectionConfig = await getHomeSections();
    const enabledSections = sectionConfig[0]?.sections || ['modules','expiryAlert'];

    return `
    <div class="page active" id="page-home">
      <div class="app-header" style="position:relative">
        ${lowStockCount > 0 ? `<div class="stock-alert-badge">${lowStockCount}</div>` : ''}
        <div class="header-top">
          <div class="header-title">🏠 LESLEY公司仓储</div>
          <div class="header-actions">
            <div class="header-btn" onclick="App.showRegionManager()">✏️</div>
            <div class="header-btn" onclick="App.navigate('settings')">⚙️</div>
          </div>
        </div>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input class="search-input" type="text" placeholder="搜索物品名称、位置..." value="${escapeHtml(state.searchQuery)}"
            oninput="App.state.searchQuery=this.value"
            onkeydown="if(event.key==='Enter'){App.addSearchHistory(this.value);App.navigate('search')}">
        </div>
      </div>

      ${enabledSections.includes('todayActivity') ? `
      <!-- 今日动态 -->
      <div class="today-activity">
        <div class="today-activity-title">📊 今日动态</div>
        <div class="today-stats-row">
          入库 <span class="today-stat-num in">${todayIn}</span> 件
          <span class="today-stat-sep">|</span>
          出库 <span class="today-stat-num out">${todayOut}</span> 件
          <span class="today-stat-sep">|</span>
          消耗 <span class="today-stat-num out" style="color:#B8860B">${todayConsume}</span> 件
          <span class="today-stat-sep">|</span>
          新增 <span class="today-stat-num new">${todayNewItems}</span> 个商品
          ${lowStockCount > 0 ? `<span class="today-stat-sep">|</span> 预警 <span class="today-stat-num alert">${lowStockCount}</span> 项` : ''}
        </div>
      </div>` : ''}

      ${enabledSections.includes('stockAlert') && lowStockCount > 0 ? `
      <!-- 库存预警横幅 -->
      <div class="alert-banner show" style="margin:12px 16px 0">
        <div class="alert-header warning"
          onclick="this.parentElement.querySelector('.alert-list').style.display=this.parentElement.querySelector('.alert-list').style.display==='block'?'none':'block'">
          <div class="alert-title warning">
            ⚠️ 库存预警（${lowStockCount}项低于${threshold}）<span class="alert-count">${lowStockCount}</span>
          </div><span style="font-size:12px">▼</span>
        </div>
        <div class="alert-list" style="display:${lowStockCount<=5?'block':'none'}">
          ${lowStockItems.slice(0,10).map(item=>{
            const mod=MODULES.find(m=>m.id===item.moduleId);
            return `<div class="alert-item" onclick="App.navigate('detail',{currentItem:'${item.id}'})">
              <div class="alert-dot yellow"></div>
              <div class="alert-info">
                <div class="alert-name">${escapeHtml(item.name)}</div>
                <div class="alert-meta">${mod?.name||''} · 库存仅剩 ${item.quantity} 件</div>
              </div>
              <div class="alert-days yellow" style="color:#E07050;font-weight:700">${item.quantity}</div>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      ${enabledSections.includes('expiryAlert') && alerts.length > 0 ? `
      <div class="alert-banner show">
        <div class="alert-header ${expiredItems.length>0?'expired':'warning'}"
          onclick="this.parentElement.querySelector('.alert-list').style.display=this.parentElement.querySelector('.alert-list').style.display==='block'?'none':'block'">
          <div class="alert-title ${expiredItems.length>0?'expired':'warning'}">
            ${expiredItems.length>0?'🚨 到期提醒':'⚠️ 即将到期'}<span class="alert-count">${alerts.length}</span>
          </div><span style="font-size:12px">▼</span>
        </div>
        <div class="alert-list" style="display:${alerts.length<=5?'block':'none'}">
          ${alerts.slice(0,10).map(a=>`
            <div class="alert-item" onclick="App.navigate('detail',{currentItem:'${a.id}'})">
              <div class="alert-dot ${a.status==='expired'?'red':'yellow'}"></div>
              <div class="alert-info">
                <div class="alert-name">${escapeHtml(a.name)}</div>
                <div class="alert-meta">${MODULES.find(m=>m.id===a.moduleId)?.name||''} · ${formatDate(a.expiryDate)}</div>
              </div>
              <div class="alert-days ${a.status==='expired'?'red':'yellow'}">${a.status==='expired'?a.label:a.s?.label}</div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${enabledSections.includes('modules') ? `
      <div class="module-grid">
        ${MODULES.map(m=>{
          const count=items.filter(i=>i.moduleId===m.id).length;
          return `<div class="module-card" onclick="App.navigate('module',{currentModule:'${m.id}'})">
            <div class="module-name">${m.name}</div>
            <div class="module-icon ${m.cls}">${m.icon}</div>
            <div class="module-count">${count} 件</div>
          </div>`;
        }).join('')}
      </div>` : ''}

      <!-- Quick action buttons (only unique ones, not duplicating tab bar) -->
      <div class="home-fab-row">
        <button class="mini-fab primary" onclick="App.navigate('consume')">⚡ 每日消耗登记</button>
        <button class="mini-fab success" onclick="App.navigate('quick-add')">➕ 快速添加</button>
      </div>

      <div class="tab-bar">
        <div class="tab-item active" onclick="App.navigate('home')"><div class="tab-icon">🏠</div><div class="tab-label">首页</div></div>
        <div class="tab-item" onclick="App.navigate('search')"><div class="tab-icon">🔍</div><div class="tab-label">搜索</div></div>
        <div class="tab-item" onclick="App.navigate('stats')"><div class="tab-icon">📊</div><div class="tab-label">统计</div></div>
        <div class="tab-item" onclick="App.navigate('settings')"><div class="tab-icon">⚙️</div><div class="tab-label">设置</div></div>
      </div>
    </div>`;
    // 进入首页时，若有低库存则弹窗提醒一次（避免每次渲染重复弹）
    if(lowStockCount>0 && !state._stockPopupShown){
      state._stockPopupShown=true;
      setTimeout(()=>showStockAlertPopup(lowStockItems, threshold), 400);
    }
  }

  // ================================================================
  // HOME SECTION MANAGER (add/delete/rename areas)
  // ================================================================
  async function showRegionManager(){
    const cfg = await getHomeSections();
    const current = cfg[0]?.sections || ['modules','expiryAlert'];
    const availableSections = [
      {id:'todayActivity',name:'📊 今日动态'},
      {id:'modules',name:'📦 区域宫格（首页模块）'},
      {id:'stockAlert',name:'⚠️ 库存预警横幅'},
      {id:'expiryAlert',name:'🚨 到期提醒横幅'},
      {id:'quickConsume',name:'⚡ 每日消耗快捷入口'}
    ];
    const itemCounts = {};
    for(const it of state.items){ itemCounts[it.moduleId]=(itemCounts[it.moduleId]||0)+1; }

    showModal(`
      <div class="modal-title">区域管理</div>
      <div style="font-size:12px;color:var(--gray-400);margin-bottom:10px">修改区域名称、增删区域板块</div>

      <div style="font-weight:600;font-size:13px;margin:6px 0">区域板块（${MODULES.length}）</div>
      <div class="region-manage-list">
        ${MODULES.map(m=>`
          <div class="region-manage-item">
            <div class="region-manage-icon ${m.cls}">${m.icon}</div>
            <div class="region-manage-body">
              <div class="region-manage-name">${escapeHtml(m.name)} <span style="color:var(--gray-400);font-size:11px">(${itemCounts[m.id]||0}件)</span></div>
            </div>
            <div class="region-manage-actions">
              <button class="region-btn" onclick="App.renameRegion('${m.id}')">改名</button>
              <button class="region-btn delete" onclick="App.removeRegion('${m.id}')">删除</button>
            </div>
          </div>`).join('')}
      </div>

      <div style="display:flex;gap:8px;margin:12px 0">
        <input class="modal-input" id="newRegionName" placeholder="新区域名称" style="flex:1">
        <button class="region-btn add" onclick="App.addRegion()">+ 添加区域</button>
      </div>

      <div style="height:1px;background:var(--gray-100);margin:12px 0"></div>
      <div style="font-weight:600;font-size:13px;margin:6px 0">首页板块显示</div>
      ${availableSections.map(s=>`
        <div class="section-manage-item">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" value="${s.id}" ${current.includes(s.id)?'checked':''}
              onchange="App.toggleHomeSection('${s.id}',this.checked)"
              style="width:18px;height:18px;accent-color:var(--red)">
            <span class="section-manage-name">${s.name}</span>
          </label>
        </div>
      `).join('')}
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="App.hideModal()">完成</button>
      </div>
    `);
    setTimeout(()=>{const el=document.getElementById('newRegionName'); if(el) el.focus();},100);
  }

  async function renameRegion(id){
    const m=MODULES.find(x=>x.id===id); if(!m)return;
    const newName=prompt('修改区域名称：',m.name);
    if(!newName||!newName.trim())return;
    await renameModule(id,newName.trim());
    toast('区域已改名'); showRegionManager();
  }
  async function removeRegion(id){
    const m=MODULES.find(x=>x.id===id); if(!m)return;
    const cnt=state.items.filter(i=>i.moduleId===id).length;
    const ok=await confirm(`确定删除区域「${m.name}」？\n该区域下 ${cnt} 件物品及相关分类、记录也会被删除。`,'删除');
    if(!ok)return;
    await removeModule(id);
    toast('区域已删除'); showRegionManager();
  }
  async function addRegion(){
    const input=document.getElementById('newRegionName');
    const name=(input?.value||'').trim();
    if(!name){toast('请输入区域名称'); return;}
    await addModule(name);
    toast('区域已添加'); showRegionManager();
  }

  async function toggleHomeSection(sectionId,enabled){
    const cfg = await getHomeSections();
    let sections = [...(cfg[0]?.sections||[])];
    if(enabled && !sections.includes(sectionId)) sections.push(sectionId);
    else if(!enabled) sections = sections.filter(s=>s!==sectionId);
    await saveHomeSections({sections});
    showRegionManager();
  }

  // ================================================================
  // RENDER: MODULE PAGE
  // ================================================================
  async function renderModule(){
    const mod=MODULES.find(m=>m.id===state.currentModule);
    if(!mod)return'<div class="page active"><div class="empty-state">模块不存在</div></div>';
    const cats=await getCategories(state.currentModule);
    const threshold=state.lowStockThreshold||10;
    let items=state.items.filter(i=>i.moduleId===state.currentModule);
    if(state.currentCategory) items=items.filter(i=>i.categoryId===state.currentCategory);

    return `
    <div class="page active" id="page-module">
      <div class="app-header">
        <div class="header-top">
          <div class="header-btn" onclick="App.navigate('home')" style="background:rgba(255,255,255,.2)">←</div>
          <div class="header-title">${mod.icon} ${mod.name}</div>
          <div class="header-btn" onclick="App.showCatManager('${state.currentModule}')">🏷️</div>
        </div>
      </div>
      <div class="category-bar">
        <div class="cat-tab ${!state.currentCategory?'active':''}" onclick="App.state.currentCategory=null;App.render()">全部</div>
        ${cats.map(c=>`<div class="cat-tab ${state.currentCategory===c.id?'active':''}" onclick="App.state.currentCategory='${c.id}';App.render()">${escapeHtml(c.name)}</div>`).join('')}

      </div>
      <div class="stock-filter-tabs">
        <div class="stock-tab ${!state.stockFilterStatus?'active':''}" onclick="App.state.stockFilterStatus='';App.render()">全部</div>
        <div class="stock-tab ${state.stockFilterStatus==='normal'?'active':''}" onclick="App.state.stockFilterStatus='normal';App.render()">正常</div>
        <div class="stock-tab ${state.stockFilterStatus==='warn'?'warn-active':''}" onclick="App.state.stockFilterStatus='warn';App.render()">⚠️ 预警</div>
      </div>
      <div class="item-list">
        ${items.length===0?`<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">暂无物品</div><div class="empty-sub">点击右下角按钮添加物品</div></div>`
        :items.map(item=>{
          const exp=getExpiryStatus(item);
          const cat=cats.find(c=>c.id===item.categoryId);
          const catName=cat?cat.name:'未分类';
          const catCls=cat?cat.cls:'';
          const low=(item.quantity<=state.lowStockThreshold);
          // 库存筛选
          if(state.stockFilterStatus==='normal'&&low) return '';
          if(state.stockFilterStatus==='warn'&&!low) return '';
          return `<div class="prod-card" onclick="App.navigate('detail',{currentItem:'${item.id}'})">
            <div class="prod-card-img">${(item.images&&item.images.length>0)?`<img src="${item.images[0]}" alt="">`:`<div class="placeholder-icon">📦</div>`}</div>
            <div class="prod-card-body">
              <div class="prod-card-name">${escapeHtml(item.name)}</div>
              <div class="prod-card-sku">${item.barcode?escapeHtml(item.barcode):(item.id?'ID '+item.id.slice(0,8):'')}</div>
              <div class="prod-card-cat-tag ${catCls}">${escapeHtml(catName)}</div>
              <div class="prod-card-location">📍 ${item.location?escapeHtml(item.location):'未设置位置'}</div>
            </div>
            <div class="prod-card-right">
              <div class="prod-card-qty-row"><span class="prod-card-qty-label">库存</span><span class="prod-card-qty ${low?'low':'normal'}">${item.quantity}</span><span class="prod-card-qty-unit">件</span></div>
              <div class="prod-card-status"><div class="prod-status-dot ${low?'warn':'ok'}"></div><span class="status-text ${low?'warn':'ok'}">${low?'预警':'充足'}</span></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <button class="fab-btn" onclick="App.navigate('add-item',{editingModule:'${state.currentModule}'})">+</button>
      <div class="tab-bar">
        <div class="tab-item" onclick="App.navigate('home')"><div class="tab-icon">🏠</div><div class="tab-label">首页</div></div>
        <div class="tab-item active"><div class="tab-icon">📦</div><div class="tab-label">模块</div></div>
        <div class="tab-item" onclick="App.navigate('stats')"><div class="tab-icon">📊</div><div class="tab-label">统计</div></div>
        <div class="tab-item" onclick="App.navigate('settings')"><div class="tab-icon">⚙️</div><div class="tab-label">设置</div></div>
      </div>
    </div>`;
  }

  async function renderConsumeRecords(viewDate){
    const dateStr = viewDate || formatDate(new Date(),'YYYY-MM-DD');
    const start = new Date(dateStr+'T00:00:00');
    const end = new Date(start.getTime()+86400000);
    const recs = state.records.filter(r=>{const t=new Date(r.timestamp);return t>=start&&t<end&&r.type==='consume';})
                              .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));

    const isToday = dateStr === formatDate(new Date(),'YYYY-MM-DD');
    const totalQty = recs.reduce((s,r)=>s+r.quantity,0);

    // Resolve category names from the categories store
    const allCats = await dbOp('categories','readonly',s=>s.getAll()).catch(()=>[]);
    const catNameOf = (item) => {
      if(!item || !item.categoryId) return '未分类';
      const c = allCats.find(x=>x.id===item.categoryId);
      return c ? c.name : '未分类';
    };

    // Group by category for summary header
    const byCat={};
    for(const r of recs){
      const item=state.items.find(i=>i.id===r.itemId);
      const catKey=item?.categoryId||'_nocat';
      if(!byCat[catKey])byCat[catKey]={name:catNameOf(item),total:0,count:0};
      byCat[catKey].total+=r.quantity; byCat[catKey].count++;
    }

    if(recs.length===0){
      return `<div class="chart-container" style="margin-top:12px">
        <div class="chart-title">📋 ${isToday?'今日':'当天'}消耗记录明细</div>
        <div style="text-align:center;padding:18px;color:var(--gray-400);font-size:13px">${dateStr} 暂无消耗记录</div>
      </div>`;
    }

    return `
      <div class="chart-container" style="margin-top:12px">
        <div class="chart-title">📋 ${isToday?'今日':'当天'}消耗记录明细（${dateStr} · 共 ${totalQty} 件）</div>
        <!-- Category summary -->
        <div class="consume-cat-summary">
          ${Object.entries(byCat).map(([k,d])=>`
            <div class="consume-cat-chip"><span>${escapeHtml(d.name||'未分类')}</span><strong>${d.total}件</strong></div>
          `).join('')}
        </div>
        <!-- Detail table -->
        <div class="consume-table">
          <div class="consume-row consume-head"><div>物品</div><div>区域/分类</div><div>数量</div><div>时间</div></div>
          ${recs.map(r=>{
            const item=state.items.find(i=>i.id===r.itemId);
            const mod=MODULES.find(m=>m.id===r.moduleId);
            return `<div class="consume-row" ${item?`onclick="App.navigate('detail',{currentItem:'${r.itemId}'})"`:''}>
              <div class="consume-name">${escapeHtml(item?.name||'未知')}${r.note?`<span class="consume-note">📝${escapeHtml(r.note)}</span>`:''}</div>
              <div class="consume-meta">${mod?.icon||''}${escapeHtml(mod?.name||'')}</div>
              <div class="consume-qty">-${r.quantity}</div>
              <div class="consume-time">${formatDate(r.timestamp,'HH:mm')}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  function selectConsumeItem(itemId){state.consumeSelectedItemId=itemId;render();}

  async function doConsume(){
    const itemId=state.consumeSelectedItemId;
    if(!itemId){toast('请先选择一个产品');return;}
    const qty=parseInt(document.getElementById('consumeQty')?.value)||0;
    if(qty<=0){toast('请输入有效数量');return;}
    const note=document.getElementById('consumeNote')?.value.trim()||'';

    const item=state.items.find(i=>i.id===itemId);
    if(!item)return;

    if(qty>item.quantity){
      const ok=await confirm(`消耗数量（${qty}）超过当前库存（${item.quantity}），确定继续？`,'强制扣取');
      if(!ok)return;
    }

    const newQty=Math.max(0,item.quantity-qty);
    await updateItem({...item,quantity:newQty});
    await addRecord({itemId, moduleId:item.moduleId, type:'consume', quantity:qty, note:note||undefined, remainingQty:newQty});

    toast(`消耗成功！扣除 ${qty} 件`);
    state.consumeSelectedItemId='';
    state.consumeSearchQuery='';
    render();
  }

  // ================================================================
  // RENDER: STATS (with module/category/time detail filters)
  // ================================================================
  function renderStats(){
    const range=state.statsTimeRange, now=new Date();
    let start,end,label;
    switch(range){
      case'today':start=new Date(now.getFullYear(),now.getMonth(),now.getDate());end=new Date(start.getTime()+86400000);label='今天';break;
      case'yesterday':start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);end=new Date(start.getTime()+86400000);label='昨天';break;
      case'week':{const d=now.getDay()||7;start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d+1);end=new Date(start.getTime()+7*86400000);label='本周';break;}
      case'month':start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,1);label='本月';break;
      case'custom':{
        const ds=state.statsCustomDate||formatDate(now,'YYYY-MM-DD');
        start=new Date(ds+'T00:00:00');end=new Date(start.getTime()+86400000);
        label=ds+'（单日）';break;
      }
      default:start=new Date(2020,0,1);end=new Date(2030,0,1);label='全部';
    }

    const filteredRecs=state.records.filter(r=>{const t=new Date(r.timestamp);return t>=start&&t<end;});

    // Apply detail filters
    let detailRecs=[...filteredRecs];

    state.searchHistory=loadSearchHistory();
    const app=document.getElementById('app');

      switch(state.currentPage){
        case'home':app.innerHTML=await renderHome();break;

        case'add-item':app.innerHTML=renderAddItemForm();break;
        case'quick-add':app.innerHTML=renderQuickAddForm();break;

        case'search':app.innerHTML=renderSearch();break;
        case'stats':app.innerHTML=renderStats();drawChart();break;
        case'records':app.innerHTML=renderRecords();break;
        case'settings':app.innerHTML=renderSettings();break;

      console.error('render error:',err);
      app.innerHTML=`<div class="page active" style="padding:24px;text-align:center">

  // ================================================================
  // CHART DRAWING
  // ================================================================
  function drawChart(){
    setTimeout(()=>{
      const canvas=document.getElementById('statsChart');if(!canvas)return;
      const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
      canvas.width=canvas.offsetWidth*dpr;canvas.height=canvas.offsetHeight*dpr;ctx.scale(dpr,dpr);
      const W=canvas.offsetWidth,H=canvas.offsetHeight;ctx.clearRect(0,0,W,H);
      const range=state.statsTimeRange,now=new Date();let start,end;
      switch(range){
        case'today':start=new Date(now.getFullYear(),now.getMonth(),now.getDate());end=new Date(start.getTime()+86400000);break;
        case'yesterday':start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);end=new Date(start.getTime()+86400000);break;
        case'week':{const d=now.getDay()||7;start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d+1);end=new Date(start.getTime()+7*86400000);break;}
        case'lastWeek':{const d=(now.getDay()||7)+7;start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d+1);end=new Date(start.getTime()+7*86400000);break;}
        case'month':start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,1);break;
        case'lastMonth':start=new Date(now.getFullYear(),now.getMonth()-1,1);end=new Date(now.getFullYear(),now.getMonth(),1);break;
        case'year':start=new Date(now.getFullYear(),0,1);end=new Date(now.getFullYear()+1,0,1);break;
        default:start=new Date(2020,0,1);end=new Date(2030,0,1);
      }
      const filtered=state.records.filter(r=>{const t=new Date(r.timestamp);return t>=start&&t<end;});
      const data={};MODULES.forEach(m=>{data[m.id]={name:m.name,in:0,out:0,consume:0};});
      filtered.forEach(r=>{if(data[r.moduleId]){if(r.type==='in')data[r.moduleId].in+=r.quantity;else if(r.type==='out')data[r.moduleId].out+=r.quantity;else if(r.type==='consume')data[r.moduleId].consume+=r.quantity;}});
      const values=Object.values(data),maxVal=Math.max(...values.flatMap(v=>[v.in,v.out,v.consume]),1);
      const barW=Math.min(24,(W-60)/values.length/3-2),groupW=barW*3+4,startX=(W-groupW*values.length)/2,chartH=H-40,baseY=chartH-10;
      ctx.strokeStyle='#E5E7EB';ctx.lineWidth=.5;
      for(let i=0;i<=4;i++){const y=baseY-(chartH-20)*i/4;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(W-10,y);ctx.stroke();ctx.fillStyle='#9CA3AF';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(maxVal*i/4),26,y+3);}
      const colorsIn=['#6BAF5A','#4A90C8','#F0C848','#9B7BC0','#E07050','#50B8D0','#7B68A0','#608060','#D4453A'];
      const colorsOut=['#D4453A','#E07050','#F0C848','#7B68A0','#4A90C8','#9B7BC0','#50B8D0','#D4453A','#6BAF5A'];
      values.forEach((v,i)=>{
        const cx=startX+i*groupW+groupW/2;
        const hIn=Math.max(2,(v.in/maxVal)*(chartH-30)),hOut=Math.max(2,(v.out/maxVal)*(chartH-30)),hCon=Math.max(2,(v.consume/maxVal)*(chartH-30));
        ctx.fillStyle=colorsIn[i%colorsIn.length];roundRect(ctx,cx-barW-3,baseY-hIn,barW,hIn,2);
        ctx.fillStyle=colorsOut[i%colorsOut.length];roundRect(ctx,cx-barW*0.1,baseY-hOut,barW,hOut,2);
        ctx.fillStyle='#F0C848';roundRect(ctx,cx+barW*0.8,baseY-hCon,barW,hCon,2);
        ctx.fillStyle='#4B5563';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText(v.name.length>3?v.name.substr(0,3):v.name,cx,H-3);
      });
      ctx.fillStyle='#6BAF5A';ctx.fillRect(W-110,4,8,8);ctx.fillStyle='#4B5563';ctx.font='9px sans-serif';ctx.textAlign='left';ctx.fillText('入库',W-98,12);
      ctx.fillStyle='#D4453A';ctx.fillRect(W-70,4,8,8);ctx.fillText('出库',W-58,12);
      ctx.fillStyle='#F0C848';ctx.fillRect(W-34,4,8,8);ctx.fillText('消耗',W-22,12);
    },50);
  }
  function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();}

  async function saveItem(e){
    e.preventDefault();
    const id=document.getElementById('formItemId').value;
    const name=document.getElementById('itemName').value.trim();
    const qtyRaw=document.getElementById('itemQty').value;
    const quantity = qtyRaw==='' ? 1 : (parseInt(qtyRaw)||0);
    const location=document.getElementById('itemLocation').value.trim();
    const usage=document.getElementById('itemUsage').value.trim();
    const supplier=document.getElementById('itemSupplier').value.trim();
    const categoryId=document.getElementById('itemCategory').value||'';
    const barcode=document.getElementById('itemBarcode').value.trim();
    const arrival=document.getElementById('itemArrival').value;
    const expiry=document.getElementById('itemExpiry').value;
    const reminder=parseInt(document.getElementById('itemReminder').value)||7;
    if(!name){toast('请输入物品名称');return;}
    if(quantity<0){toast('数量不能为负数');return;}
    const mediaPreviews=document.querySelectorAll('#mediaPreview .media-thumb img');
    const images=Array.from(mediaPreviews).map(img=>img.src);
    if(id&&state.editingItem){const existingImages=state.editingItem.images||[];images.unshift(...existingImages);}
    const item={id:id||undefined,name,quantity,location,usageNote:usage,supplierNote:supplier,categoryId,moduleId:state.editingModule||(state.editingItem?.moduleId)||'finished',arrivalDate:arrival||null,expiryDate:expiry||null,reminderDays:reminder,barcode:barcode||undefined,images:images.length>0?images:[]};
    try{
      if(id){
        await updateItem(item);toast('修改成功！');
        const oldQty=state.editingItem?.quantity||0;

  async function pushTable(table, getAllFn, mapFn){
    const sb=getSB(); if(!sb||!sbUser) return;
    const local = (await getAllFn()) || [];
    const localIds = local.map(function(o){return o.id;});
    if(local.length){
      const rows = local.map(mapFn).filter(Boolean);
      const {error} = await sb.from(table).upsert(rows, {onConflict:'id'});
      if(error) throw error;
    }
    // 同步删除：云端存在但本地已删的，从云端删除
    const {data:cloud, error:ce} = await sb.from(table).select('id').eq('user_id', sbUser.id);
    if(ce) throw ce;
    const toDelete = (cloud||[]).map(function(c){return c.id;}).filter(function(id){return localIds.indexOf(id)<0;});
    if(toDelete.length){
      const {error:de} = await sb.from(table).delete().in('id', toDelete);
      if(de) throw de;
    }
  }
  async function pushAll(){
    await pushTable('categories', function(){return dbOp('categories','readonly',function(s){return s.getAll();});}, mapCatToDB);
    await pushTable('items', function(){return getAllItems();}, mapItemToDB);
    await pushTable('records', function(){return getAllRecords();}, mapRecToDB);
  }

  async function pullTableMerge(table, storeName, mapFn, cloudTimeField, localTimeField){
    const sb=getSB(); if(!sb||!sbUser) return;
    const {data,error} = await sb.from(table).select('*').eq('user_id', sbUser.id);
    if(error) throw error;
    if(!data || !data.length) return;
    const localAll = await dbOp(storeName,'readonly',function(s){return s.getAll();});
    const localMap = {}; localAll.forEach(function(o){ localMap[o.id]=o; });
    for(const row of data){
      const obj = mapFn(row);
      const local = localMap[obj.id];
      if(!local){ await dbOp(storeName,'readwrite',function(s){return s.put(obj);}); continue; }
      if(!cloudTimeField) continue; // 分类无时间戳：保留本地，稍后推送上云
      const tCloud = new Date(row[cloudTimeField]||0).getTime();
      const tLocal = new Date(local[localTimeField]||0).getTime();
      if(tCloud > tLocal) await dbOp(storeName,'readwrite',function(s){return s.put(obj);});
    }
  }
  async function pullAll(){
    await pullTableMerge('categories','categories', mapCatFromDB, null, null);
    await pullTableMerge('items','items', mapItemFromDB, 'updated_at', 'updatedAt');
    await pullTableMerge('records','records', mapRecFromDB, 'created_at', 'timestamp');
  }

      bar=document.createElement('div');
      bar.id='swUpdateBar';
      bar.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:var(--red);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;box-shadow:0 -2px 10px rgba(0,0,0,.2)';
      bar.innerHTML='<span>🔄 已发布新版本</span><button onclick="location.reload()" style="background:#fff;color:var(--red);border:none;padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer">立即刷新</button>';
      document.body.appendChild(bar);
    }
    const observer=new MutationObserver(()=>{
      if(document.getElementById('itemCategory')||document.getElementById('quickCat'))loadCategoriesIntoSelect();
    });
    observer.observe(document.getElementById('app'),{childList:true,subtree:true});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();

  // 首屏渲染完成后，空闲时段静默预热扫码引擎：点扫码时秒开，且不拖慢启动
  function _warmupScanEngine(){
    try{
      if(typeof window.BarcodeDetector!=='undefined') return; // 原生可用，无需预热
      ensureZxing().catch(function(){});
    }catch(e){}
  }
  if('requestIdleCallback' in window){ requestIdleCallback(_warmupScanEngine,{timeout:4000}); }
  else { setTimeout(_warmupScanEngine,2500); }

  // ================================================================
  // STOCK ALERT POPUP (首页进入时弹窗提醒)
  // ================================================================
  function showStockAlertPopup(lowStockItems, threshold){
    const list=lowStockItems.slice(0,12).map(item=>{
      const mod=MODULES.find(m=>m.id===item.moduleId);
      return `<div class="alert-item" style="cursor:default">
        <div class="alert-dot yellow"></div>
        <div class="alert-info">
          <div class="alert-name">${escapeHtml(item.name)}</div>
          <div class="alert-meta">${mod?.name||''} · 库存仅剩 ${item.quantity} 件</div>
        </div>
        <div class="alert-days yellow" style="color:#E07050;font-weight:700">${item.quantity}</div>
      </div>`;
    }).join('');
    showModal(`
      <div class="modal-title">⚠️ 库存预警提醒</div>
      <div style="font-size:13px;color:var(--gray-500);margin-bottom:8px">以下 ${lowStockItems.length} 项物品库存 ≤ ${threshold} 件，请及时补货：</div>
      <div style="max-height:50vh;overflow:auto;border-radius:var(--radius-sm)">${list}</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-confirm" onclick="App.hideModal()">我知道了</button>
      </div>`);
  }

  // ================================================================
  // SCAN (扫码录入 / 扫码消耗)
  // ================================================================
  let _zxReader=null;       // ZXing BrowserMultiFormatReader 实例
  let _zxControls=null;     // 实时解码 controls（用于停止）
  let _bdDetector=null;     // BarcodeDetector 实例（原生，最强）
  let _bdVideo=null;        // BarcodeDetector 路径的 video
  let _bdStream=null;       // 摄像头 MediaStream
  let _bdRAF=null;          // rAF id
  let _bdRunning=false;     // BarcodeDetector 是否运行
  let _qrScanner=null;      // html5-qrcode 兜底（二维码相册）

  function ensureZxing(){
    if(typeof ZXing!=='undefined') return Promise.resolve();
    return new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='./zxing.min.js';
      s.onload=function(){ (typeof ZXing!=='undefined')?res():rej(new Error('ZXing库加载失败')); };
      s.onerror=function(){ rej(new Error('ZXing库加载失败')); };
      document.head.appendChild(s);
    });
  }
  function ensureQr(){
    if(typeof Html5Qrcode!=='undefined') return Promise.resolve();
    return new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='./html5-qrcode.min.js';
      s.onload=function(){ (typeof Html5Qrcode!=='undefined')?res():rej(new Error('识别库加载失败')); };
      s.onerror=function(){ rej(new Error('识别库加载失败')); };
      document.head.appendChild(s);
    });
  }
  function findItemByCode(code){
    if(!code) return [];
    const c=code.trim();
    return state.items.filter(i=>
      (i.barcode && i.barcode===c) ||
      (i.name && (i.name===c || i.name.includes(c)))
    );
  }

  function stopAllEngines(){
    if(_zxControls){ try{ _zxControls.stop(); }catch(e){} _zxControls=null; }
    _zxReader=null;
    if(_bdRAF){ cancelAnimationFrame(_bdRAF); _bdRAF=null; }
    _bdRunning=false;
    if(_bdStream){ try{ _bdStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} _bdStream=null; }
    if(_bdVideo && _bdVideo.parentNode){ try{ _bdVideo.parentNode.removeChild(_bdVideo); }catch(e){} _bdVideo=null; }
    _bdDetector=null;
    if(_qrScanner){ try{ _qrScanner.stop().catch(function(){}); }catch(e){} _qrScanner=null; }
    var sr=document.getElementById('scanReader'); if(sr){ try{ sr.innerHTML=''; }catch(e){} }
  }

  function onScanSuccess(code){
    if(!code) return;
    stopAllEngines();
    var hint=document.getElementById('scanHint'); if(hint) hint.textContent='✅ 识别成功：'+code;
    var rt=document.getElementById('scanResultText'); if(rt) rt.textContent=code;
    var bar=document.getElementById('scanResultBar'); if(bar) bar.classList.add('show');
    state._lastScan=code;
  }

  function startScan(mode){
    state.scanMode=mode;
    var bar=document.getElementById('scanResultBar'); if(bar) bar.classList.remove('show');
    var rt=document.getElementById('scanResultText'); if(rt) rt.textContent='';
    var hint=document.getElementById('scanHint'); if(hint) hint.textContent='正在启动摄像头…';
    var ov=document.getElementById('scanOverlay'); if(ov) ov.classList.add('show');
    var man=document.getElementById('scanManual'); if(man) man.style.display='flex';
    var fin=document.getElementById('scanFileInput'); if(fin) fin.value='';

    // 启动超时兜底：8 秒仍卡在“启动中”则提示改用相册/手动，避免无限转圈
    var startTimer=setTimeout(function(){
      if(hint && hint.textContent==='正在启动摄像头…'){
        if(hint) hint.textContent='摄像头启动较慢，请稍候，或改用「📁 相册识别」/手动输入条码';
      }
    },8000);

    var hasCam=!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    if(!hasCam){ clearTimeout(startTimer); if(hint) hint.textContent='当前环境无法调用摄像头，请用「📁 从相册识别」或手动输入条码'; return; }

    // 优先原生 BarcodeDetector（最强，含 1D+二维码）；否则 ZXing 纯JS引擎（已验证可解商品条码）
    var useBD=(typeof window.BarcodeDetector!=='undefined');
    // 原生 BarcodeDetector 可用时无需下载 ZXing；否则只下 ZXing（不预载 375KB 的 html5-qrcode）
    var libs=useBD?[]:[ensureZxing()];
    Promise.all(libs).then(function(){
      if(useBD){ startBarcodeDetector(startTimer,hint); }
      else { startZXingRealtime(startTimer,hint); }
    }).catch(function(err){
      clearTimeout(startTimer);
      if(hint) hint.textContent=(err&&err.message)?err.message:'识别库加载失败，请刷新页面';
    });
  }

  function startBarcodeDetector(startTimer,hint){
    var formats=['qr_code','ean_13','ean_8','code_128','code_39','code_93','upc_a','upc_e','itf','aztec','data_matrix','pdf_417','codabar'];
    var bd;
    try{ bd=new BarcodeDetector({formats:formats}); }catch(e){ startZXingRealtime(startTimer,hint); return; }
    _bdDetector=bd; _bdRunning=true;
    var video=document.createElement('video');
    video.setAttribute('playsinline','true'); video.muted=true;
    video.style.width='100%'; video.style.height='100%'; video.style.objectFit='cover';
    var target=document.getElementById('scanReader'); target.innerHTML=''; target.appendChild(video);
    _bdVideo=video;
    function attach(constraints){
      return navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
        _bdStream=stream; video.srcObject=stream; return video.play();
      });
    }
    attach({video:{facingMode:'environment'}}).catch(function(){ return attach({video:true}); })
      .then(function(){
        clearTimeout(startTimer);
        if(hint) hint.textContent='将条码/二维码对准取景框';
        loopDetect();
      })
      .catch(function(err){
        clearTimeout(startTimer);
        if(hint) hint.textContent='摄像头启动失败：'+(err&&err.message?err.message:err)+'。可改用「📁 相册识别」或手动输入';
      });
    function loopDetect(){
      if(!_bdRunning) return;
      _bdRAF=requestAnimationFrame(loopDetect);
      if(video.readyState<2) return;
      bd.detect(video).then(function(res){
        if(res&&res.length){ onScanSuccess(res[0].rawValue); }
      }).catch(function(){});
    }
  }

  function startZXingRealtime(startTimer,hint){
    var target=document.getElementById('scanReader'); target.innerHTML='';
    var video=document.createElement('video');
    video.setAttribute('playsinline','true'); video.muted=true;
    video.style.width='100%'; video.style.height='100%'; video.style.objectFit='cover';
    target.appendChild(video);
    try{ if(!_zxReader) _zxReader=new ZXing.BrowserMultiFormatReader(); }
    catch(e){ if(hint) hint.textContent='识别引擎初始化失败，请刷新页面'; return; }
    function begin(constraints){
      return _zxReader.decodeFromConstraints(constraints, video, function(result, err, controls){
        _zxControls=controls;
        if(result){ onScanSuccess(result.getText()); }
      });
    }
    begin({video:{facingMode:'environment'}}).then(function(){
      clearTimeout(startTimer);
      if(hint) hint.textContent='将商品条码对准取景框（EAN / CODE128 等）';
    }).catch(function(){
      begin({video:true}).then(function(){
        clearTimeout(startTimer);
        if(hint) hint.textContent='将商品条码对准取景框（EAN / CODE128 等）';
      }).catch(function(err){
        clearTimeout(startTimer);
        if(hint) hint.textContent='摄像头启动失败：'+(err&&err.message?err.message:err)+'。可改用「📁 相册识别」或手动输入';
      });
    });
  }

  // 相册/文件识别：多引擎依次尝试，命中即用
  function scanFromFile(){ var inp=document.getElementById('scanFileInput'); if(inp) inp.click(); }
  function onScanFilePicked(e){
    var file=e.target.files && e.target.files[0];
    e.target.value='';
    if(!file) return;
    var hint=document.getElementById('scanHint');
    if(hint) hint.textContent='正在识别图片…';
    var engines=[];
    if(typeof window.BarcodeDetector!=='undefined'){
      engines.push(function(){
        var bd=new BarcodeDetector({formats:['qr_code','ean_13','ean_8','code_128','code_39','code_93','upc_a','upc_e','itf','aztec','data_matrix','pdf_417','codabar']});
        return bd.detect(file).then(function(res){ if(res&&res.length) return res[0].rawValue; throw new Error('no'); });
      });
    }
    engines.push(function(){
      return ensureZxing().then(function(){ return new Promise(function(res,rej){
        var r=new ZXing.BrowserMultiFormatReader();
        r.decodeFromImageUrl(URL.createObjectURL(file)).then(function(x){ res(x.getText()); }).catch(function(err){ rej(err); });
      }); });
    });
    engines.push(function(){
      return ensureQr().then(function(){ return new Promise(function(res,rej){
        if(typeof Html5Qrcode==='undefined'){ rej(new Error('no')); return; }
        var qr=new Html5Qrcode('scanReader',{verbose:false});
        qr.scanFile(file,false).then(function(t){ res(t); }).catch(function(err){ rej(err); });
      }); });
    });
    runEngines(engines, hint);
  }
  function runEngines(engines, hint){
    var i=0;
    function next(){
      if(i>=engines.length){ if(hint) hint.textContent='图片未识别到条码，请换清晰照片，或手动输入条码'; return; }
      var eng=engines[i++];
      eng().then(function(code){
        if(hint) hint.textContent='✅ 识别成功：'+code;
        document.getElementById('scanResultText').textContent=code;
        document.getElementById('scanResultBar').classList.add('show');
        state._lastScan=code;
      }).catch(function(){ next(); });
    }
    next();
  }

  function useManualScan(){
    var inp=document.getElementById('scanManualInput');
    var code=inp? inp.value.trim():'';
    if(!code){ toast('请输入条码'); return; }
    state._lastScan=code;
    var man=document.getElementById('scanManual'); if(man) man.style.display='none';
    useScanResult();
  }

  function useScanResult(){
    const code=state._lastScan;
    if(!code){ toast('未识别到内容'); return; }
    const mode=state.scanMode;
    stopScan();
    if(mode==='quick-add' || mode==='add-item'){
      if(mode==='quick-add'){
        const elName=document.getElementById('quickName');
        const elCode=document.getElementById('quickBarcode');
        if(!elName || !elCode){ toast('请先打开「快速录入」页面再扫码'); return; }
        const match=findItemByCode(code)[0];
        // 匹配到已有产品就回填产品名；否则名称留空让用户填，条码只进条码框
        elName.value = match ? match.name : '';
        elCode.value = code;
        if(match){
          const elMod=document.getElementById('quickModule');
          if(elMod && match.moduleId) elMod.value=match.moduleId;
          toast('已匹配「'+match.name+'」，可修改数量后保存');
        } else {
          toast('条码已填入，请补全产品名称');
        }
      } else {
        const el=document.getElementById('itemBarcode');
        if(!el){ toast('请先打开产品编辑页面再扫码'); return; }
        el.value=code;
        toast('条码已填入，请补全产品名称');
      }
    } else if(mode==='consume'){
      const matches=findItemByCode(code);
      if(matches.length===0){
        toast('未找到匹配产品：'+code);
        return;
      }
      if(matches.length===1){
        state.consumeSearchQuery=matches[0].name;
        state.consumeSelectedItemId=matches[0].id;
        render();
      } else {
        const opts=matches.map(m=>{
          const mod=MODULES.find(x=>x.id===m.moduleId);
          return `<div class="consume-match-item" onclick="App.state.consumeSelectedItemId='${m.id}';App.state.consumeSearchQuery='${escapeHtml(m.name)}';App.hideModal();App.render()">
            <div class="consume-match-img">${(m.images&&m.images.length>0)?`<img src="${m.images[0]}">`:`<div class="placeholder-icon" style="font-size:20px">📦</div>`}</div>
            <div class="consume-match-info"><div class="consume-match-name">${escapeHtml(m.name)}</div><div class="consume-match-meta">${mod?.name||''} · 库存 ${m.quantity}</div></div>
            <div class="consume-match-qty">${m.quantity}</div>
          </div>`;
        }).join('');
        showModal(`<div class="modal-title">选择匹配产品（${matches.length}）</div><div class="consume-search-result">${opts}</div><div class="modal-actions"><button class="modal-btn modal-btn-cancel" onclick="App.hideModal()">取消</button></div>`);
      }
    }
  }

  function stopScan(){
    stopAllEngines();
    const ov=document.getElementById('scanOverlay'); if(ov) ov.classList.remove('show');
    const man=document.getElementById('scanManual'); if(man){ man.style.display='none'; const inp=document.getElementById('scanManualInput'); if(inp) inp.value=''; }
  }

  function saveLowStockThreshold(val){
    const t=parseInt(val);
    if(isNaN(t)||t<0){ toast('请输入有效的阈值'); return; }
    state.lowStockThreshold=t;
    try{ localStorage.setItem('lw_threshold', String(t)); }catch(e){}
    toast('✅ 阈值已保存：库存 ≤ '+t+' 件预警');
    render();
  }

  // Public API
  return {
    state,navigate,render,toast,confirm,
    exportData:showExportPreview,showImportModal,handleImportFile,confirmImport,copyLinkForWechat,saveItem,handleMediaUpload,
    showStockAction,doStockAction,handleDeleteItem,
    showCatManager,showAddCategory,doAddCategory,renameCategory,deleteCategoryConfirm,
    clearAllDataConfirm,hideModal,showModal,_resolveConfirm,
    loadCategoriesIntoSelect,addSearchHistory,saveSearchHistory,
    showRegionManager,toggleHomeSection,renameRegion,removeRegion,addRegion,
    selectConsumeItem,doConsume,doExport,saveQuickItem,handleQuickMediaUpload,
    showExportPreview,cancelAddItem,showNameSuggestions,fillNameSuggestion,
    startScan,stopScan,useScanResult,scanFromFile,onScanFilePicked,useManualScan,
    saveLowStockThreshold,showStockAlertPopup,resetView
  };
})();
</script>
</body>
