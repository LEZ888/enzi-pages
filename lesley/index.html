<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#D4453A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LESLEY公司仓储">
<title>LESLEY公司仓储</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
:root{
  --red:#D4453A;--red-light:#F5E6E4;--blue:#4A90C8;--blue-light:#E4EFF7;
  --green:#6BAF5A;--green-light:#EDF5EA;--yellow:#F0C848;--yellow-light:#FCF5E4;
  --yellow-badge:#FFF3CD;--purple:#9B7BC0;--purple-light:#F0EBF7;
  --cream:#FAF6EE;--white:#FFF;--gray-50:#F9FAFB;--gray-100:#F3F4F6;
  --gray-200:#E5E7EB;--gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;
  --gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;
  --danger:#EF4444;--danger-light:#FEE2E2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 2px 8px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--radius-xl:20px
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;color:var(--gray-800);background:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:inherit;font-size:inherit;outline:none;border:none}
img{max-width:100%;display:block}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:70px}
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Header */
.app-header{background:linear-gradient(135deg,var(--red),#E85A4F);padding:16px 16px 20px;color:#fff;position:relative;overflow:hidden}
.app-header::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.app-header::after{content:'';position:absolute;bottom:-20px;left:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.05)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;position:relative;z-index:1}
.header-title{font-size:18px;font-weight:700;letter-spacing:.5px}
.header-actions{display:flex;gap:8px}
.header-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;cursor:pointer;border:none;transition:background .2s}
.header-btn:active{background:rgba(255,255,255,.35)}

/* Search */
.search-bar{position:relative;z-index:1}
.search-input{width:100%;height:40px;border-radius:20px;background:rgba(255,255,255,.95);padding:0 16px 0 38px;font-size:14px;color:var(--gray-800);transition:all .2s}
.search-input::placeholder{color:var(--gray-400)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:16px;pointer-events:none}

/* Alert Banner */
.alert-banner{margin:12px 16px 0;border-radius:var(--radius);overflow:hidden;display:none}
.alert-banner.show{display:block}
.alert-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.alert-header.expired{background:var(--danger-light);border-left:4px solid var(--danger)}
.alert-header.warning{background:var(--yellow-badge);border-left:4px solid var(--yellow)}
.alert-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.alert-title.expired{color:var(--danger)}.alert-title.warning{color:#B8860B}
.alert-count{font-size:12px;background:rgba(0,0,0,.06);padding:2px 8px;border-radius:10px}
.alert-list{padding:0 14px 10px;background:var(--white)}
.alert-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);cursor:pointer}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-right:10px;flex-shrink:0}
.alert-dot.red{background:var(--danger)}.alert-dot.yellow{background:var(--yellow)}
.alert-info{flex:1;min-width:0}
.alert-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-meta{font-size:11px;color:var(--gray-400);margin-top:2px}
.alert-days{font-size:12px;font-weight:600;flex-shrink:0;margin-left:8px}
.alert-days.red{color:var(--danger)}.alert-days.yellow{color:#B8860B}

/* Module Grid */
.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.module-card{background:var(--white);border-radius:var(--radius-lg);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.module-card:active{transform:scale(.96)}
.module-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.module-icon.m1{background:linear-gradient(135deg,var(--red),#E85A4F)}.module-icon.m2{background:linear-gradient(135deg,var(--blue),#6AAAD9)}
.module-icon.m3{background:linear-gradient(135deg,var(--green),#8BC77A)}.module-icon.m4{background:linear-gradient(135deg,var(--yellow),#F5DB6A)}
.module-icon.m5{background:linear-gradient(135deg,var(--purple),#B59BD4)}.module-icon.m6{background:linear-gradient(135deg,#E07050,#F09868)}
.module-icon.m7{background:linear-gradient(135deg,#50B8D0,#70D0E8)}.module-icon.m8{background:linear-gradient(135deg,#7B68A0,#9B88C0)}
.module-icon.m9{background:linear-gradient(135deg,#608060,#80A080)}
.module-name{font-size:12px;font-weight:600;color:var(--gray-700);text-align:center}
.module-count{font-size:11px;color:var(--gray-400);background:var(--gray-100);padding:1px 8px;border-radius:10px}

/* Quick Add FAB on Home */
.home-fab-row{display:flex;justify-content:center;padding:8px 16px 4px;gap:10px}
.mini-fab{height:38px;padding:0 18px;border-radius:19px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;border:none;transition:all .2s;color:#fff}
.mini-fab.primary{background:linear-gradient(135deg,var(--red),#E85A4F);box-shadow:0 2px 10px rgba(212,69,58,.35)}
.mini-fab.success{background:linear-gradient(135deg,var(--green),#8BC77A);box-shadow:0 2px 10px rgba(107,175,90,.35)}
.mini-fab:active{transform:scale(.95)}

/* Category Tabs */
.category-bar{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.category-bar::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;border:1.5px solid transparent;white-space:nowrap}
.cat-tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.cat-tab:not(.active){background:var(--white);color:var(--gray-600);border-color:var(--gray-200)}
.cat-add{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--white);border:2px dashed var(--gray-300);display:flex;align-items:center;justify-content:center;color:var(--gray-400);font-size:16px;cursor:pointer;align-self:center}

/* Item List */
.item-list{padding:12px 16px}
.item-card{background:var(--white);border-radius:var(--radius);padding:12px;margin-bottom:10px;display:flex;gap:12px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s;position:relative}
.item-card:active{transform:scale(.98)}
.item-img{width:64px;height:64px;border-radius:var(--radius-sm);object-fit:cover;background:var(--gray-100);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item-img img{width:100%;height:100%;object-fit:cover}
.item-img .placeholder-icon{font-size:28px;color:var(--gray-300)}
.item-body{flex:1;min-width:0;display:flex;flex-direction-column;gap:4px}
.item-name-row{display:flex;align-items:center;justify-content:space-between}
.item-name{font-size:15px;font-weight:600;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.item-qty{font-size:15px;font-weight:700;color:var(--red)}
.item-location{font-size:12px;color:var(--gray-400);display:flex;align-items:center;gap:4px}
.item-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag-expired{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--danger-light);color:var(--danger);font-weight:600}
.tag-warning{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--yellow-badge);color:#B8860B;font-weight:600}
.tag-cat{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--gray-100);color:var(--gray-500)}

/* FAB Button */
.fab-btn{position:fixed;right:20px;bottom:80px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--red),#E85A4F);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(212,69,58,.4);cursor:pointer;border:none;z-index:100;transition:transform .2s}
.fab-btn:active{transform:scale(.92)}

/* Detail Page */
.detail-header{position:relative}
.detail-images{width:100%;height:260px;background:var(--gray-100);position:relative;overflow:hidden}
.detail-images img{width:100%;height:100%;object-fit:cover}
.image-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.image-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.image-dot.active{background:#fff;width:18px;border-radius:3px}
.detail-back{position:absolute;top:12px;left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:2}
.detail-info{padding:16px;background:var(--white);margin-top:-20px;border-radius:var(--radius-xl) var(--radius-xl) 0 0;position:relative;z-index:1}
.detail-name{font-size:20px;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.detail-qty-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.detail-qty{font-size:28px;font-weight:800;color:var(--red)}
.detail-qty-label{font-size:13px;color:var(--gray-500)}
.detail-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-field{padding:8px 0;border-bottom:1px solid var(--gray-100)}
.field-label{font-size:11px;color:var(--gray-400);margin-bottom:2px}
.field-value{font-size:14px;color:var(--gray-700)}
.field-value.expiry-expired{color:var(--danger);font-weight:600;background:var(--danger-light);padding:2px 6px;border-radius:4px}
.field-value.expiry-warning{color:#B8860B;font-weight:600;background:var(--yellow-badge);padding:2px 6px;border-radius:4px}
.detail-actions{display:flex;gap:8px;padding:16px;background:var(--white);margin-top:8px;flex-wrap:wrap}
.action-btn{flex:1;min-width:calc(50% - 4px);height:44px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .2s;border:none}
.action-btn.primary{background:var(--red);color:#fff}.action-btn.success{background:var(--green);color:#fff}
.action-btn.warning{background:var(--yellow);color:var(--gray-800)}.action-btn.default{background:var(--gray-100);color:var(--gray-700)}
.action-btn.danger{background:var(--danger-light);color:var(--danger)}

/* Record List */
.record-section{background:var(--white);margin-top:8px;padding:16px}
.record-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer}
.record-title{font-size:16px;font-weight:700;color:var(--gray-800)}
.record-toggle{color:var(--gray-400);font-size:12px;transition:transform .3s}
.record-toggle.open{transform:rotate(180deg)}
.record-list{display:none}.record-list.show{display:block}
.record-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--gray-100)}
.record-item:last-child{border-bottom:none}
.record-type{width:44px;height:24px;border-radius:12px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.record-type.in{background:var(--green-light);color:var(--green)}.record-type.out{background:var(--red-light);color:var(--red)}
.record-type.consume{background:var(--yellow-badge);color:#B8860B}
.record-detail{flex:1;margin-left:10px}
.record-qty-change{font-size:14px;font-weight:600}
.record-qty-change.in{color:var(--green)}.record-qty-change.out{color:var(--red)}.record-qty-change.consume{color:#B8860B}
.record-note{font-size:11px;color:var(--gray-400);margin-top:2px}
.record-time{font-size:11px;color:var(--gray-400);flex-shrink:0}
.record-after{font-size:12px;color:var(--gray-500);flex-shrink:0;margin-left:8px;font-weight:500}

/* Form Page */
.form-page{padding:16px;background:var(--cream);min-height:100vh}
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;display:block}
.form-label .required{color:var(--red);margin-left:2px}
.form-input,.form-textarea,.form-select{width:100%;padding:12px 14px;border-radius:var(--radius);background:var(--white);border:1.5px solid var(--gray-200);font-size:14px;color:var(--gray-800);transition:border-color .2s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--red)}
.form-textarea{min-height:80px;resize:vertical}
.form-hint{font-size:11px;color:var(--gray-400);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.submit-btn{width:100%;height:50px;border-radius:var(--radius);background:linear-gradient(135deg,var(--red),#E85A4F);color:#fff;font-size:16px;font-weight:700;cursor:pointer;border:none;margin-top:8px;transition:all .2s}
.submit-btn:active{opacity:.9}
.cancel-btn{width:100%;height:44px;border-radius:var(--radius);background:var(--white);color:var(--gray-600);font-size:14px;cursor:pointer;border:1.5px solid var(--gray-200);margin-top:8px}

/* Media Upload */
.media-upload{border:2px dashed var(--gray-300);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.media-upload:active{border-color:var(--red);background:var(--red-light)}
.media-upload-icon{font-size:32px;color:var(--gray-300);margin-bottom:8px}
.media-upload-text{font-size:13px;color:var(--gray-400)}
.media-preview{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.media-thumb{width:72px;height:72px;border-radius:var(--radius-sm);object-fit:cover;position:relative;overflow:hidden}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* Stats Page */
.stats-page{padding:16px;background:var(--cream);min-height:100vh}
.time-filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.time-filters::-webkit-scrollbar{display:none}
.time-filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;border:1.5px solid var(--gray-200);background:var(--white);color:var(--gray-600)}
.time-filter-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.time-filter-btn.custom{padding:0;overflow:hidden}
.time-filter-date{border:none;background:transparent;font-size:13px;color:inherit;padding:6px 10px;width:100%;outline:none;font-family:inherit}
.stat-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-num{font-size:22px;font-weight:800}
.stat-num.in{color:var(--green)}.stat-num.out{color:var(--red)}.stat-num.net{color:var(--blue)}.stat-num.consume{color:#B8860B}
.stat-label{font-size:11px;color:var(--gray-400);margin-top:2px}
.chart-container{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:16px}
.chart-title{font-size:14px;font-weight:700;color:var(--gray-700);margin-bottom:12px}
.chart-canvas{width:100%;height:200px}

/* Records / Stats Detail Filters */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-select{flex:1;min-width:120px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--white);border:1.5px solid var(--gray-200);font-size:13px;color:var(--gray-700)}

/* Settings Page */
.settings-page{padding:16px;background:var(--cream);min-height:100vh}
.setting-group{background:var(--white);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--gray-100);cursor:pointer}
.setting-item:last-child{border-bottom:none}
.setting-item:active{background:var(--gray-50)}
.setting-left{display:flex;align-items:center;gap:12px}
.setting-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.setting-name{font-size:14px;font-weight:500;color:var(--gray-700)}
.setting-desc{font-size:11px;color:var(--gray-400);margin-top:1px}
.setting-arrow{color:var(--gray-300);font-size:14px}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--white);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 16px 30px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:20px;color:var(--gray-800)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-btn{flex:1;height:44px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;border:none}
.modal-btn-cancel{background:var(--gray-100);color:var(--gray-600)}.modal-btn-confirm{background:var(--red);color:#fff}
.modal-input{width:100%;padding:12px 14px;border-radius:var(--radius);background:var(--gray-50);border:1.5px solid var(--gray-200);font-size:14px;margin-bottom:12px}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--gray-800);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:2000;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:56px;margin-bottom:12px;opacity:.3}
.empty-text{font-size:15px;color:var(--gray-400)}
.empty-sub{font-size:12px;color:var(--gray-300);margin-top:4px}

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--white);display:flex;border-top:1px solid var(--gray-200);z-index:99;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;cursor:pointer;transition:all .2s;position:relative}
.tab-icon{font-size:22px;color:var(--gray-400);transition:color .2s}
.tab-label{font-size:10px;color:var(--gray-400);transition:color .2s}
.tab-item.active .tab-icon{color:var(--red)}.tab-item.active .tab-label{color:var(--red);font-weight:600}
.tab-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--red);border-radius:0 0 3px 3px}

/* Category Management Modal */
.cat-modal-list{margin-bottom:16px}
.cat-modal-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gray-100)}
.cat-modal-name{font-size:14px;color:var(--gray-700)}
.cat-modal-actions{display:flex;gap:8px}
.cat-modal-btn{padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;border:1px solid var(--gray-200);background:var(--white);color:var(--gray-600)}
.cat-modal-btn.delete{color:var(--danger);border-color:var(--danger-light);background:var(--danger-light)}

/* Stock Action Modal */
.stock-action-tabs{display:flex;margin-bottom:16px;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--gray-200)}
.stock-action-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.stock-action-tab.active.in{background:var(--green-light);color:var(--green);border:1.5px solid var(--green)}
.stock-action-tab.active.out{background:var(--red-light);color:var(--red);border:1.5px solid var(--red)}
.stock-action-tab:not(.active){background:var(--white);color:var(--gray-500)}

/* Confirm Dialog */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1100;display:none;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:var(--white);border-radius:var(--radius-lg);width:280px;padding:24px 20px;text-align:center}
.confirm-msg{font-size:15px;color:var(--gray-700);line-height:1.5;margin-bottom:20px}
.confirm-btns{display:flex;gap:10px}
.confirm-btn{flex:1;height:40px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none}

/* ===== NEW: Export Preview Modal ===== */
.export-preview{max-height:50vh;overflow-y:auto;background:var(--gray-50);border-radius:var(--radius);padding:12px;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;color:var(--gray-700)}
.export-format-btns{display:flex;gap:8px;margin-bottom:16px}
.export-format-btn{flex:1;padding:10px;border-radius:var(--radius);text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--gray-200);background:var(--white);color:var(--gray-700);transition:all .2s}
.export-format-btn.active{border-color:var(--red);color:var(--red);background:var(--red-light)}
.export-image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.export-image-item{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;position:relative;cursor:pointer}
.export-image-item img{width:100%;height:100%;object-fit:cover}

/* ===== NEW: Search History ===== */
.search-history{padding:12px 16px 0}
.search-history-title{font-size:12px;color:var(--gray-400);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.search-history-tags{display:flex;gap:6px;flex-wrap:wrap}
.search-history-tag{padding:4px 12px;border-radius:14px;font-size:12px;background:var(--white);color:var(--gray-600);border:1px solid var(--gray-200);cursor:pointer;transition:all .2s}
.search-history-tag:active{background:var(--red);color:#fff;border-color:var(--red)}
.search-clear-btn{font-size:11px;color:var(--gray-400);cursor:pointer}

/* ===== NEW: Consume (Daily Usage) Page ===== */
.consume-form{background:var(--white);border-radius:var(--radius-lg);padding:16px;margin:12px 16px;box-shadow:var(--shadow)}
.consume-search-result{max-height:200px;overflow-y:auto;margin-top:8px}
.consume-match-item{display:flex;align-items:center;padding:10px 8px;border-bottom:1px solid var(--gray-100);cursor:pointer;gap:10px}
.consume-match-item:last-child{border-bottom:none}
.consume-match-item:active{background:var(--gray-50)}
.consume-match-img{width:40px;height:40px;border-radius:var(--radius-sm);object-fit:cover;background:var(--gray-100);flex-shrink:0}
.consume-match-info{flex:1;min-width:0}
.consume-match-name{font-size:14px;font-weight:600;color:var(--gray-800)}
.consume-match-meta{font-size:11px;color:var(--gray-400)}
.consume-match-qty{font-size:14px;font-weight:700;color:var(--red)}

/* ===== NEW: Homepage Section Management ===== */
.section-manage-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gray-100)}
.section-manage-name{font-size:14px;color:var(--gray-700)}
.section-manage-actions{display:flex;gap:6px}
.section-manage-btn{padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;border:1px solid var(--gray-200);background:var(--white);color:var(--gray-600)}

/* ===== Region Manager (rename/add/remove areas) ===== */
.region-manage-list{max-height:260px;overflow-y:auto;margin:4px 0}
.region-manage-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100)}
.region-manage-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.region-manage-body{flex:1;min-width:0}
.region-manage-name{font-size:14px;font-weight:600;color:var(--gray-800)}
.region-manage-actions{display:flex;gap:6px;flex-shrink:0}
.region-btn{padding:5px 12px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;border:1px solid var(--gray-200);background:var(--white);color:var(--gray-700)}
.region-btn.delete{color:var(--red);border-color:#f3c0bd}
.region-btn.add{background:var(--red);color:#fff;border-color:var(--red)}

/* ===== Consume date bar ===== */
.consume-date-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--white);
  margin:0 16px;border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.consume-date-label{font-size:13px;color:var(--gray-600);font-weight:600}
.consume-date-input{flex:1;padding:8px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;color:var(--gray-800)}
.consume-date-today{padding:8px 14px;border:none;border-radius:var(--radius-sm);background:var(--red);color:#fff;font-size:13px;cursor:pointer}

/* ===== Consume record table ===== */
.consume-cat-summary{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.consume-cat-chip{display:flex;align-items:center;gap:5px;background:var(--yellow-light);color:#8a6d1a;
  padding:4px 10px;border-radius:12px;font-size:12px}
.consume-cat-chip strong{font-weight:700}
.consume-table{border:1px solid var(--gray-100);border-radius:var(--radius);overflow:hidden}
.consume-row{display:grid;grid-template-columns:1.4fr 1fr 0.6fr 0.7fr;align-items:center;gap:6px;
  padding:9px 10px;border-bottom:1px solid var(--gray-100);font-size:12px}
.consume-row:last-child{border-bottom:none}
.consume-row.consume-head{background:var(--gray-50);font-weight:700;color:var(--gray-500);font-size:11px}
.consume-name{font-size:13px;font-weight:600;color:var(--gray-800);display:flex;flex-direction:column}
.consume-note{font-size:11px;font-weight:400;color:var(--gray-400);margin-top:2px}
.consume-meta{font-size:12px;color:var(--gray-500)}
.consume-qty{font-size:14px;font-weight:700;color:var(--red)}
.consume-time{font-size:12px;color:var(--gray-400);text-align:right}

/* ===== Name suggestion dropdown (add item) ===== */
.name-suggest{position:relative}
.suggest-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--gray-200);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);z-index:30;max-height:200px;overflow-y:auto;margin-top:2px}
.suggest-item{padding:10px 12px;font-size:14px;color:var(--gray-800);cursor:pointer;border-bottom:1px solid var(--gray-100)}
.suggest-item:last-child{border-bottom:none}
.suggest-item:active{background:var(--gray-50)}
.suggest-item .suggest-qty{float:right;font-size:12px;color:var(--gray-400)}

/* ===== Today's Activity Card (今日动态) ===== */
.today-activity{background:var(--white);border-radius:var(--radius-lg);margin:12px 16px;padding:16px;box-shadow:var(--shadow-sm)}
.today-activity-title{font-size:15px;font-weight:700;color:var(--gray-800);margin-bottom:12px}
.today-stats-row{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--gray-600);flex-wrap:wrap;line-height:1.8}
.today-stat-num{font-weight:700;font-size:16px}
.today-stat-num.in{color:var(--green)}.today-stat-num.out{color:var(--red)}
.today-stat-num.new{color:var(--blue)}.today-stat-num.alert{color:var(--danger)}
.today-stat-sep{color:var(--gray-300);margin:0 4px}

/* ===== Stock Alert Badge on Header ===== */
.stock-alert-badge{position:absolute;top:6px;right:42px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;z-index:2}
.stock-alert-badge:empty{display:none}

/* ===== Product Card Layout v6 (红框修正：清晰分区) ===== */
.prod-card{background:var(--white);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .15s;position:relative;border:1px solid #f0f0f0}
.prod-card:active{transform:scale(.985);background:#fafafa}

/* 左侧图标 */
.prod-card-img{width:76px;height:76px;border-radius:14px;background:#f5f6f8;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #eee}
.prod-card-img img{width:100%;height:100%;object-fit:cover}
.prod-card-img .placeholder-icon{font-size:34px;opacity:.45}

/* 中间内容区 — 每行独立、不重叠 */
.prod-card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;overflow:hidden}
/* 第1行：产品名称（大字、清晰） */
.prod-card-name{font-size:17px;font-weight:700;color:#1a1a1a;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
/* 第2行：条码/ID */
.prod-card-sku{font-size:12px;color:#999;font-family:monospace;margin-bottom:5px;letter-spacing:.3px}
/* 第3行：分类标签 */
.prod-card-cat-tag{display:inline-block;font-size:11.5px;padding:2.5px 10px;border-radius:20px;font-weight:600;margin-bottom:6px;align-self:flex-start}
/* 第4行：位置（底部） */
.prod-card-location{font-size:12.5px;color:#888;display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:7px;border-top:1px dashed #eee;width:100%;box-sizing:border-box}

/* 右侧区域 — 库存数+状态垂直排列 */
.prod-card-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:0;min-width:64px;padding-top:2px}
.prod-card-qty-row{display:flex;align-items:baseline;gap:2px}
.prod-card-qty-label{font-size:11px;color:#aaa;font-weight:500}
.prod-card-qty{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.8px}
.prod-card-qty.normal{color:var(--blue)}.prod-card-qty.low{color:#E07050}
.prod-card-qty-unit{font-size:12px;color:#bbb;font-weight:500}
.prod-card-status{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-top:5px}
.prod-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prod-status-dot.ok{background:var(--green)}.status-text.ok{color:var(--green)}
.prod-status-dot.warn{background:#E07050}.status-text.warn{color:#E07050}

/* ===== Scan UI ===== */
.scan-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:2000;display:none;flex-direction:column}
.scan-overlay.show{display:flex}
.scan-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,.7);color:#fff;z-index:1}
.scan-header-title{font-size:16px;font-weight:600}
.scan-close-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.scan-video-container{flex:1;position:relative;overflow:hidden}
.scan-video{width:100%;height:100%;object-fit:cover}
.scan-hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;text-align:center;background:rgba(0,0,0,.5);padding:8px 20px;border-radius:20px;pointer-events:none}
.scan-result-bar{padding:12px 16px;background:var(--white);display:none;align-items:center;gap:10px}
.scan-result-bar.show{display:flex}
.scan-result-text{flex:1;font-size:14px;color:var(--gray-800)}
.scan-btn{padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none}
.scan-btn-primary{background:var(--red);color:#fff}
.scan-btn-cancel{background:var(--gray-100);color:var(--gray-600)}
.scan-footer{display:flex;gap:10px;padding:12px 16px;background:rgba(0,0,0,.75);z-index:1}
.scan-footer .scan-btn{flex:1;padding:13px;border-radius:10px;font-size:14px;font-weight:600}

/* ===== Settings: Alert Threshold ===== */
.threshold-setting{display:flex;align-items:center;gap:10px;padding:14px 16px}
.threshold-input{width:80px;padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-200);font-size:15px;text-align:center;font-weight:700;color:var(--red)}

/* ===== Module Page Filter Tabs (全部/正常/预警) ===== */
.stock-filter-tabs{display:flex;gap:8px;padding:8px 16px 0}
.stock-tab{flex-shrink:0;padding:5px 14px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);background:var(--white);color:var(--gray-600);transition:all .2s}
.stock-tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.stock-tab.warn-active{background:var(--yellow);color:#8a6d1a;border-color:var(--yellow)}
.scan-manual{display:none;gap:8px;padding:10px 16px;background:rgba(0,0,0,.82);z-index:1}
.scan-manual-input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.96);font-size:14px;color:#222}
.scan-manual-input::placeholder{color:#999}

/* 扫描取景框 */
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72%;max-width:300px;height:170px;border:2px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.4);pointer-events:none;z-index:6}
.scan-frame::before,.scan-frame::after{content:'';position:absolute;width:26px;height:26px;border:3px solid #2dd4bf}
.scan-frame::before{top:-3px;left:-3px;border-right:none;border-bottom:none;border-top-left-radius:10px}
.scan-frame::after{bottom:-3px;right:-3px;border-left:none;border-top:none;border-bottom-right-radius:10px}
.scan-line{position:absolute;left:8px;right:8px;top:10%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#2dd4bf,transparent);animation:scanMove 1.8s ease-in-out infinite}
@keyframes scanMove{0%{top:10%}50%{top:88%}100%{top:10%}}
#scanReader video{width:100%!important;height:100%!important;object-fit:cover!important;display:block}
#scanReader canvas{display:none}

/* ====== Auth Modal Styles ====== */
.auth-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:#fff;border-radius:16px;width:100%;max-width:380px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.auth-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--red);color:#fff}
.auth-title{font-size:17px;font-weight:700}
.auth-close-btn{background:none;color:#fff;font-size:22px;padding:4px 8px}
.auth-tabs{display:flex;border-bottom:1px solid var(--gray-200)}
.auth-tab{flex:1;padding:12px;font-size:15px;font-weight:600;color:var(--gray-500);background:none;border-bottom:2px solid transparent;transition:all .2s}
.auth-tab.active{color:var(--red);border-bottom-color:var(--red)}
.auth-body{padding:18px}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:5px}
.auth-field input{width:100%;padding:11px 13px;border:1.5px solid var(--gray-300);border-radius:10px;font-size:15px;background:var(--gray-50);transition:border-color .2s}
.auth-field input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(212,69,58,.12)}
.auth-btn-primary{width:100%;padding:12px;background:var(--red);color:#fff;border-radius:10px;font-size:16px;font-weight:700;margin-top:6px;transition:opacity .2s}
.auth-btn-primary:active{opacity:.85}
.auth-error{margin-top:10px;padding:10px 12px;background:var(--danger-light);color:var(--danger);border-radius:8px;font-size:13px;display:block}
.auth-footer-text{text-align:center;padding:14px;font-size:12px;color:var(--gray-400);border-top:1px solid var(--gray-100)}

/* Cloud bar (logged-in top bar) */
.cloud-bar{position:fixed;top:0;left:0;right:0;z-index:998;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cloud-status{font-weight:600}
.cloud-actions{display:flex;gap:6px}
.cloud-btn{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35)}
.cloud-btn-danger{background:rgba(239,68,68,.25);border-color:rgba(239,68,68,.4)}

.scan-hint{z-index:7!important}
.scan-footer,.scan-result-bar,.scan-manual{z-index:8;position:relative}
</style>
<!-- 扫码识别库改为懒加载（见 ensureZxing / ensureQr），避免 700KB 同步脚本拖慢首屏 -->
<link rel="prefetch" href="./zxing.min.js" as="script">
<!-- Supabase JS SDK（本地内置，避免 CDN 被墙导致页面卡死无法打开） -->
<script defer src="./supabase.min.js"></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn modal-btn-cancel" onclick="App._resolveConfirm(false)">取消</button>
      <button class="confirm-btn modal-btn-confirm" id="confirmOkBtn" onclick="App._resolveConfirm(true)">确认</button>
    </div>
  </div>
</div>

<!-- ====== 云端同步 / 登录弹窗 ====== -->
<div class="auth-overlay" id="authOverlay" style="display:none">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-title" id="authTitle">登录 LESLEY 云端</div>
      <button class="auth-close-btn" onclick="App.hideAuth()">✕</button>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabLogin" onclick="App.switchAuthTab('login')">登录</button>
      <button class="auth-tab" id="authTabRegister" onclick="App.switchAuthTab('register')">注册</button>
    </div>
    <div class="auth-body">
      <div class="auth-form" id="authLoginForm">
        <div class="auth-field">
          <label>邮箱</label>
          <input type="email" id="authEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label>密码</label>
          <input type="password" id="authPassword" placeholder="至少6位" autocomplete="current-password">
        </div>
        <button class="auth-btn-primary" id="authLoginBtn" onclick="App.handleLogin()">登录</button>
        <div class="auth-error" id="authError" style="display:none"></div>
      </div>
      <div class="auth-form" id="authRegisterForm" style="display:none">
        <div class="auth-field">
          <label>邮箱</label>
          <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label>密码（至少6位）</label>
          <input type="password" id="regPassword" placeholder="设置密码" autocomplete="new-password">
        </div>
        <div class="auth-field">
          <label>确认密码</label>
          <input type="password" id="regPassword2" placeholder="再输一次密码" autocomplete="new-password">
        </div>
        <button class="auth-btn-primary" id="authRegBtn" onclick="App.handleRegister()">注册</button>
        <div class="auth-error" id="regError" style="display:none"></div>
      </div>
    </div>
    <div class="auth-footer-text">数据加密存储在云端，多设备自动同步</div>
  </div>
</div>

<!-- 已登录状态栏（顶部） -->
<div class="cloud-bar" id="cloudBar" style="display:none">
  <span class="cloud-status" id="cloudStatus">☁️ 已连接云端</span>
  <div class="cloud-actions">
    <button class="cloud-btn" onclick="App.syncNow()" title="立即同步">🔄 同步</button>
    <button class="cloud-btn cloud-btn-danger" onclick="App.handleLogout()" title="退出登录">退出</button>
  </div>
</div>

<!-- 扫码层 -->
<div class="scan-overlay" id="scanOverlay">
  <div class="scan-header">
    <div class="scan-header-title">📷 扫码录入</div>
    <button class="scan-close-btn" onclick="App.stopScan()">✕</button>
  </div>
  <div class="scan-video-container">
    <div id="scanReader" style="width:100%;height:100%"></div>
    <div class="scan-frame"><div class="scan-line"></div></div>
      <div class="scan-hint" id="scanHint">将条码/二维码对准取景框…</div>
    </div>
    <div class="scan-manual" id="scanManual">
      <input class="scan-manual-input" id="scanManualInput" type="text" placeholder="相机/相册识别不了？手动输入条码后点「使用」" onkeydown="if(event.key==='Enter')App.useManualScan()">
      <button type="button" class="scan-btn scan-btn-primary" onclick="App.useManualScan()">使用</button>
    </div>
    <div class="scan-footer">
      <button type="button" class="scan-btn scan-btn-cancel" onclick="App.scanFromFile()">📁 从相册识别</button>
      <input type="file" id="scanFileInput" accept="image/*" style="display:none" onchange="App.onScanFilePicked(event)">
    </div>
    <div class="scan-result-bar" id="scanResultBar">
    <div class="scan-result-text" id="scanResultText"></div>
    <button class="scan-btn scan-btn-primary" onclick="App.useScanResult()">使用</button>
  </div>
</div>

<script>
const App = (() => {
  // ---- Constants ----
  let MODULES = [
    {id:'finished',name:'成品区',icon:'📦',cls:'m1'},
    {id:'semi',name:'半成品区',icon:'🔧',cls:'m2'},
    {id:'packing',name:'包材区',icon:'🎁',cls:'m3'},
    {id:'boxes',name:'盒子区',icon:'📦',cls:'m4'},
    {id:'labels',name:'标签区',icon:'🏷️',cls:'m5'},
    {id:'parts',name:'配件区',icon:'⚙️',cls:'m6'},
    {id:'other',name:'其他区',icon:'📋',cls:'m7'},
    {id:'tools',name:'工具区',icon:'🛠️',cls:'m8'},
    {id:'misc',name:'杂物区',icon:'🗄️',cls:'m9'}
  ];
  const MODULE_CLASSES = ['m1','m2','m3','m4','m5','m6','m7','m8','m9','m1','m2','m3','m4','m5','m6','m7','m8','m9'];
  const MODULE_ICONS = ['📦','🔧','🎁','📦','🏷️','⚙️','📋','🛠️','🗄️','📊','📁','🗃️','🔩','🧰','📦','🍱','📦','💼'];
  const DEFAULT_MODULES = JSON.parse(JSON.stringify(MODULES));

  // ---- Modules (regions) persistence: editable + rename/add/remove ----
  async function loadModules(){
    try{ const saved=await dbOp('modules','readonly',s=>s.getAll()); if(saved&&saved.length) return saved; }catch(e){}
    try{ const ls=JSON.parse(localStorage.getItem('lw_modules')||'null'); if(ls&&ls.length) return ls; }catch(e){}
    return DEFAULT_MODULES.map(m=>({...m}));
  }
  async function saveModules(){
    try{
      await dbOp('modules','readwrite',s=>s.clear());
      for(const m of MODULES) await dbOp('modules','readwrite',s=>s.put(m));
    }catch(e){}
    try{ localStorage.setItem('lw_modules', JSON.stringify(MODULES)); }catch(e){}
  }
  async function addModule(name, icon){
    name=(name||'').trim(); if(!name) return;
    const cls=MODULE_CLASSES[MODULES.length % MODULE_CLASSES.length];
    const m={id:'mod_'+makeId(), name, icon:icon||'📦', cls};
    MODULES.push(m); await saveModules();
  }
  async function renameModule(id, name){
    name=(name||'').trim(); if(!name) return;
    const m=MODULES.find(x=>x.id===id); if(m){ m.name=name; await saveModules(); }
  }
  async function removeModule(id){
    MODULES=MODULES.filter(m=>m.id!==id);
    // cascade: delete items, categories, records of this module
    for(const it of state.items.filter(i=>i.moduleId===id)){ try{ await deleteItem(it.id); }catch(e){} }
    const cats=await getCategories(id); for(const c of cats){ try{ await deleteCategory(c.id); }catch(e){} }
    await saveModules();
  }

  const DB_NAME = 'LesleyWarehouseDB';
  const DB_VERSION = 3;
  let db = null;

  // ---- localStorage fallback (when IndexedDB is unavailable, e.g. file:// preview / private mode) ----
  const LW_KEYS = { items:'lw_items', records:'lw_records', categories:'lw_categories', homeSections:'lw_homeSections', modules:'lw_modules' };
  const _loadLS = (s) => { try { return JSON.parse(localStorage.getItem(LW_KEYS[s]) || '[]'); } catch(e) { return []; } };
  const _saveLS = (s, a) => { try { localStorage.setItem(LW_KEYS[s], JSON.stringify(a)); } catch(e) {} };

  // ---- State ----
  let state = {
    currentPage: 'home',
    currentModule: null,
    currentItem: null,
    currentCategory: null,
    searchQuery: '',
    items: [],
    records: [],
    editingItem: null,
    statsTimeRange: 'month',
    statsCustomDate: '',
    statsCustomDate: '',
    recordFilterMod: '',
    recordFilterType: '',
    recordFilterCat: '',
    searchFilterMod: '',
    searchFilterCat: '',
    consumeModuleId: '',
    consumeCategoryId: '',
    consumeSearchQuery: '',
    consumeViewDate: '',
    addItemNameSuggest: '',
    exportFormat: 'json',
    homeSections: ['todayActivity','stockAlert','modules','expiryAlert'], // customizable homepage sections (今日动态+库存预警默认开启)
    searchHistory: [],
    lowStockThreshold: 10, // default low stock alert threshold
    stockFilterStatus: '', // '' | 'normal' | 'warn' — for module page filter
    scanMode: '', // 'quick-add' | 'consume' — which page initiated scan
    scanResult: null, // last scanned barcode text
  };

  let _confirmResolve = null;

  // ---- IndexedDB Setup (v2 adds homeSections & searchHistory stores) ----
  function initDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('items')) {
          const s = d.createObjectStore('items', {keyPath: 'id'});
          s.createIndex('moduleId','moduleId',{unique:false});
          s.createIndex('categoryId','categoryId',{unique:false});
          s.createIndex('name','name',{unique:false});
          s.createIndex('expiryDate','expiryDate',{unique:false});
        }
        if (!d.objectStoreNames.contains('records')) {
          const s = d.createObjectStore('records', {keyPath: 'id'});
          s.createIndex('itemId','itemId',{unique:false});
          s.createIndex('moduleId','moduleId',{unique:false});
          s.createIndex('timestamp','timestamp',{unique:false});
          s.createIndex('type','type',{unique:false});
        }
        if (!d.objectStoreNames.contains('categories')) {
          d.createObjectStore('categories', {keyPath: 'id'});
        }
        if (!d.objectStoreNames.contains('homeSections')) {
          d.createObjectStore('homeSections', {keyPath: 'id'});
        }
        if (!d.objectStoreNames.contains('modules')) {
          d.createObjectStore('modules', {keyPath: 'id'});
        }
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function dbOp(storeName, mode, fn) {
    // ---- IndexedDB path ----
    if (db) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        const result = fn(store);
        if (result && result.request) {
          result.request.onsuccess = () => resolve(result.request.result);
          result.request.onerror = () => reject(result.request.error);
        } else if (result instanceof IDBRequest) {
          result.onsuccess = () => resolve(result.result);
          result.onerror = () => reject(result.error);
        } else {
          tx.oncomplete = () => resolve(result);
          tx.onerror = () => reject(tx.error);
        }
      });
    }
    // ---- localStorage fallback path ----
    return new Promise((resolve, reject) => {
      const working = _loadLS(storeName);
      const mkReq = (value) => ({ result: value, onsuccess: null, onerror: null, error: null });
      const fakeStore = {
        getAll: () => mkReq(working.slice()),
        get: (id) => mkReq(working.find(x => x.id === id)),
        add: (val) => { working.push(val); return mkReq(val); },
        put: (val) => { const i = working.findIndex(x => x.id === val.id); if (i >= 0) working[i] = val; else working.push(val); return mkReq(val); },
        delete: (id) => { const i = working.findIndex(x => x.id === id); if (i >= 0) working.splice(i, 1); return mkReq(undefined); },
        index: (name) => ({ getAll: (val) => mkReq(working.filter(x => x[name] === val)), openCursor: () => mkReq(null) })
      };
      let req;
      try { req = fn(fakeStore); } catch (e) { reject(e); return; }
      const finalReq = (req && req.request) ? req.request : req;
      Promise.resolve().then(() => {
        _saveLS(storeName, working);
        if (finalReq && typeof finalReq.onsuccess === 'function') {
          finalReq.onsuccess({ target: { result: finalReq.result } });
        }
        resolve(finalReq ? finalReq.result : undefined);
      });
    });
  }

  async function getAllItems() { return dbOp('items','readonly',s=>s.getAll()); }
  async function getItem(id) { return dbOp('items','readonly',s=>s.get(id)); }

  function makeId() { return Date.now().toString(36)+Math.random().toString(36).substr(2,5); }

  async function addItem(item) {
    item.id = makeId(); item.createdAt = new Date().toISOString(); item.updatedAt = item.createdAt;
    const r = await dbOp('items','readwrite',s=>s.add(item));
    schedulePush();
    return r;
  }
  async function updateItem(item) { item.updatedAt = new Date().toISOString(); const r=await dbOp('items','readwrite',s=>s.put(item)); schedulePush(); return r; }

  async function deleteItem(id) {
    const recs = await getAllRecords();
    for (const r of recs.filter(r => r.itemId === id)) {
      await dbOp('records','readwrite', s => s.delete(r.id));
    }
    const r = await dbOp('items','readwrite', s => s.delete(id));
    schedulePush();
    return r;
  }

  async function addRecord(record) {
    record.id = makeId(); record.timestamp = new Date().toISOString();
    const r = await dbOp('records','readwrite',s=>s.add(record));
    schedulePush();
    return r;
  }

  async function getRecordsByItemId(itemId) {
    const all = await getAllRecords();
    return all.filter(r => r.itemId === itemId).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  }
  async function getAllRecords() { return dbOp('records','readonly',s=>s.getAll()); }

  function indexGetAll(index,val){
    if(index.getAll)return index.getAll(val);
    const r=[];return new Promise((res,rej)=>{
      const req=index.openCursor(IDBKeyRange.only(val));
      req.onsuccess=e=>{const c=e.target.result;if(c){r.push(c.value);c.continue()}else res(r.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)))};
      req.onerror=()=>rej(req.error);
    });
  }

  // Categories
  async function getCategories(moduleId) {
    const all = await dbOp('categories','readonly',s=>s.getAll());
    return all.filter(c=>c.moduleId===moduleId);
  }
  async function addCategory(moduleId,name) {
    const c={id:makeId(),moduleId,name}; const r=await dbOp('categories','readwrite',s=>s.add(c)); schedulePush(); return r;
  }
  async function updateCategory(cat) { const r=await dbOp('categories','readwrite',s=>s.put(cat)); schedulePush(); return r; }
  async function deleteCategory(id) { const r=await dbOp('categories','readwrite',s=>s.delete(id)); schedulePush(); return r; }

  // Home Sections (customizable)
  async function getHomeSections() {
    try {
      const all = await dbOp('homeSections','readonly',s=>s.getAll());
      if(all.length === 0) return [{id:'default',sections:['todayActivity','stockAlert','modules','expiryAlert']}];
      // 自动迁移：老用户配置补上今日动态+库存预警
      const cfg = all[0];
      const needed = ['todayActivity','stockAlert'];
      let migrated = false;
      for (const n of needed) { if (!cfg.sections.includes(n)) { cfg.sections.unshift(n); migrated = true; } }
      if (migrated) { await saveHomeSections(cfg); }
      return [cfg];
    } catch(e) { return [{id:'default',sections:['todayActivity','stockAlert','modules','expiryAlert']}]; }
  }
  async function saveHomeSections(data) {
    return dbOp('homeSections','readwrite',s=>s.put({id:'default',sections:data.sections}));
  }

  // ---- Search History (localStorage for simplicity) ----
  function loadSearchHistory() {
    try { return JSON.parse(localStorage.getItem('lw_search_history')||'[]'); } catch(e){return[];}
  }
  function saveSearchHistory(arr) {
    localStorage.setItem('lw_search_history',JSON.stringify(arr.slice(0,30))); // keep last 30
  }
  function addSearchHistory(q) {
    if(!q.trim())return;
    const h=loadSearchHistory();
    h.unshift(q.trim());
    const filtered=[...new Set(h)]; // dedupe
    saveSearchHistory(filtered);
    state.searchHistory=filtered;
  }

  // ---- Data Export (multi-format + preview) ----
  async function prepareExportData() {
    const [items,records,catsRaw,modsRaw]=await Promise.all([
      getAllItems(), getAllRecords(),
      dbOp('categories','readonly',s=>s.getAll()),
      loadModules()
    ]);
    return {version:3,exportTime:new Date().toISOString(),appName:'LESLEY公司仓储',items,records,categories:catsRaw,modules:modsRaw};
  }

  async function showExportPreview() {
    const data = await prepareExportData();
    showModal(`
      <div class="modal-title">备份数据导出</div>
      <div style="font-size:13px;color:var(--gray-500);margin-bottom:12px;text-align:center">选择导出格式，预览数据后下载</div>
      <div class="export-format-btns">
        <div class="export-format-btn ${state.exportFormat==='json'?'active':''}" onclick="App.state.exportFormat='json';this.parentElement.querySelectorAll('.export-format-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">📄 JSON</div>
        <div class="export-format-btn ${state.exportFormat==='csv'?'active':''}" onclick="App.state.exportFormat='csv';this.parentElement.querySelectorAll('.export-format-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">📊 CSV</div>
        <div class="export-format-btn ${state.exportFormat==='images'?'active':''}" onclick="App.state.exportFormat='images';this.parentElement.querySelectorAll('.export-format-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">🖼️ 图片</div>
        <div class="export-format-btn ${state.exportFormat==='xml'?'active':''}" onclick="App.state.exportFormat='xml';this.parentElement.querySelectorAll('.export-format-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">📄 XML</div>
        <div class="export-format-btn ${state.exportFormat==='xlsx'?'active':''}" onclick="App.state.exportFormat='xlsx';this.parentElement.querySelectorAll('.export-format-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">📊 Excel</div>
      </div>
      <div class="form-label">导出说明</div>
      <div class="export-preview">${ state.exportFormat==='json' ? 'JSON：完整备份，含物品/记录/分类/模块及图片' : state.exportFormat==='csv' ? 'CSV：物品清单，Excel/WPS 可直接打开（不含图片）' : state.exportFormat==='images' ? '图片：逐张下载所有物品图片' : state.exportFormat==='xml' ? 'XML：结构化备份，含全部字段与图片，可被本应用重新导入' : 'Excel：含「物品 / 记录 / 分类 / 模块」四个工作表，Excel/WPS/Numbers 可打开' }</div>
      <div style="font-size:12px;color:var(--gray-400);margin:8px 0">
        📦 物品：${data.items.length}个 | 📋 记录：${data.records.length}条 | 🏷️ 分类：${data.categories.length}个
      </div>
      ${state.exportFormat==='images'?`
        <div class="form-label">图片导出（共${data.items.filter(i=>i.images&&i.images.length).length}个有图物品）</div>
        <div class="export-image-grid">${data.items.filter(i=>i.images&&i.images.length).slice(0,9).map(i=>`<div class="export-image-item"><img src="${i.images[0]}" alt="${escapeHtml(i.name)}"></div>`).join('')}</div>
        <div style="font-size:11px;color:var(--gray-400)">点击下方导出将逐张下载所有物品图片</div>
      `:''}
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="App.hideModal()">取消</button>
        <button class="modal-btn modal-btn-confirm" onclick="App.doExport()">下载导出文件</button>
      </div>
    `);
  }

  async function doExport() {
    const data = await prepareExportData();
    hideModal();

    switch(state.exportFormat) {
      case 'json': {
        const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        downloadBlob(blob,`LESLEY公司仓储备份_${formatDate(new Date(),'YYYYMMDD_HHmmss')}.json`);
        toast('JSON备份已导出！');
        break;
      }
      case 'csv': {
        // Items CSV
        let csv='\uFEFF物品名称,数量,存放位置,所属模块,分类,到货日期,到期时间,用途备注\n';
        data.items.forEach(i=>{
          const mod=MODULES.find(m=>m.id===i.moduleId)?.name||'';
          csv+=`"${i.name}",${i.quantity},"${i.location||''}","${mod}","","${i.arrivalDate||''}","${i.expiryDate||''}","${(i.usageNote||'').replace(/"/g,'""')}"\n`;
        });
        downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`LESLEY公司仓储_物品列表_${formatDate(new Date(),'YYYYMMDD')}.csv`);
        toast('CSV文件已导出！');
        break;
      }
      case 'xml': {
        const blob=new Blob([buildXml(data)],{type:'application/xml;charset=utf-8'});
        downloadBlob(blob,`LESLEY公司仓储备份_${formatDate(new Date(),'YYYYMMDD_HHmmss')}.xml`);
        toast('XML备份已导出！');
        break;
      }
      case 'xlsx': {
        const blob=buildXlsx(data);
        downloadBlob(blob,`LESLEY公司仓储_${formatDate(new Date(),'YYYYMMDD')}.xlsx`);
        toast('Excel文件已导出！');
        break;
      }
      case 'images': {
        // Download each image individually
        const itemsWithImages=data.items.filter(i=>i.images&&i.images.length);
        if(itemsWithImages.length===0){toast('没有图片可导出');return;}
        toast(`开始导出 ${itemsWithImages.length} 个物品的图片...`);
        let delay=0;
        itemsWithImages.forEach((item,idx)=>{
          item.images.forEach((src,imgIdx)=>{
            setTimeout(()=>{
              fetch(src).then(r=>r.blob()).then(blob=>{
                const ext=src.includes('data:image/png')?'.png':src.includes('data:image/webp')?'.webp':'.jpg';
                const a=document.createElement('a');a.href=URL.createObjectURL(blob);
                a.download=`${item.name.replace(/[/\\?%*:|"<>]/g,'_')}_${imgIdx+1}${ext}`;a.click();
                URL.revokeObjectURL(a.href);
              }).catch(()=>{});
            },delay);
            delay+=300;
          });
        });
        toast(`共触发 ${itemsWithImages.reduce((s,i)=>s+i.images.length,0)} 张图片下载`);
        break;
      }
    }
  }

  function downloadBlob(blob,filename){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;a.click();
    URL.revokeObjectURL(url);
  }

  // Import

  // ===== 多格式导出/导入辅助 =====
  function colLetter(n){let s='';n++;while(n>0){s=String.fromCharCode(65+((n-1)%26))+s;n=Math.floor((n-1)/26);}return s;}
  function colToNum(s){let n=0;for(let i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);return n-1;}
  function xmlEscape(s){if(s===null||s===undefined)return '';return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));}
  function resolveModuleId(name){if(!name)return 'finished';const m=MODULES.find(x=>x.name===name);if(m)return m.id;if(MODULES.find(x=>x.id===name))return name;return 'finished';}

  function buildXml(data){
    let x='<?xml version="1.0" encoding="UTF-8"?>\n<LESLEYWarehouseExport version="3" exportTime="'+xmlEscape(data.exportTime)+'">\n';
    x+='  <items>\n';
    (data.items||[]).forEach(i=>{
      x+='    <item>\n';
      x+='      <id>'+xmlEscape(i.id)+'</id>\n';
      x+='      <name>'+xmlEscape(i.name)+'</name>\n';
      x+='      <quantity>'+xmlEscape(i.quantity)+'</quantity>\n';
      x+='      <moduleId>'+xmlEscape(i.moduleId)+'</moduleId>\n';
      x+='      <moduleName>'+xmlEscape((MODULES.find(m=>m.id===i.moduleId)||{}).name||'')+'</moduleName>\n';
      x+='      <categoryId>'+xmlEscape(i.categoryId)+'</categoryId>\n';
      x+='      <location>'+xmlEscape(i.location)+'</location>\n';
      x+='      <barcode>'+xmlEscape(i.barcode)+'</barcode>\n';
      x+='      <arrivalDate>'+xmlEscape(i.arrivalDate)+'</arrivalDate>\n';
      x+='      <expiryDate>'+xmlEscape(i.expiryDate)+'</expiryDate>\n';
      x+='      <reminderDays>'+xmlEscape(i.reminderDays)+'</reminderDays>\n';
      x+='      <usageNote>'+xmlEscape(i.usageNote)+'</usageNote>\n';
      x+='      <supplierNote>'+xmlEscape(i.supplierNote)+'</supplierNote>\n';
      x+='      <images>\n';
      (i.images||[]).forEach(im=>{x+='        <image>'+xmlEscape(im)+'</image>\n';});
      x+='      </images>\n';
      x+='    </item>\n';
    });
    x+='  </items>\n';
    x+='  <records>\n';
    (data.records||[]).forEach(r=>{
      x+='    <record>\n';
      x+='      <id>'+xmlEscape(r.id)+'</id>\n';
      x+='      <itemId>'+xmlEscape(r.itemId)+'</itemId>\n';
      x+='      <moduleId>'+xmlEscape(r.moduleId)+'</moduleId>\n';
      x+='      <type>'+xmlEscape(r.type)+'</type>\n';
      x+='      <quantity>'+xmlEscape(r.quantity)+'</quantity>\n';
      x+='      <remainingQty>'+xmlEscape(r.remainingQty)+'</remainingQty>\n';
      x+='      <note>'+xmlEscape(r.note)+'</note>\n';
      x+='      <timestamp>'+xmlEscape(r.timestamp)+'</timestamp>\n';
      x+='    </record>\n';
    });
    x+='  </records>\n';
    x+='  <categories>\n';
    (data.categories||[]).forEach(c=>{
      x+='    <category><id>'+xmlEscape(c.id)+'</id><moduleId>'+xmlEscape(c.moduleId)+'</moduleId><name>'+xmlEscape(c.name)+'</name></category>\n';
    });
    x+='  </categories>\n';
    x+='  <modules>\n';
    (data.modules||[]).forEach(m=>{
      x+='    <module><id>'+xmlEscape(m.id)+'</id><name>'+xmlEscape(m.name)+'</name><icon>'+xmlEscape(m.icon)+'</icon></module>\n';
    });
    x+='  </modules>\n';
    x+='</LESLEYWarehouseExport>\n';
    return x;
  }

  const XLSX_COLS={
    items:[['id','ID'],['name','物品名称'],['quantity','数量'],['moduleId','模块ID'],['moduleName','所属模块'],['categoryId','分类ID'],['location','存放位置'],['barcode','条码'],['arrivalDate','到货日期'],['expiryDate','到期时间'],['reminderDays','预警天数'],['usageNote','用途备注'],['supplierNote','供应商'],['imagesCount','图片数']],

  function sheetXml(rows){
    let c='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach((row,rIdx)=>{

        const ref=colLetter(ci)+(rIdx+1);
        if(typeof cell==='number'||(cell!==''&&!isNaN(cell)&&rIdx>0)){
          c+='<c r="'+ref+'"><v>'+cell+'</v></c>';
        }else{
          c+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(cell)+'</t></is></c>';
        }

    });

  }
  function crc32(buf){

      dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);
      dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint32(14,crc,true);
      dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);dv.setUint16(26,nb.length,true);dv.setUint16(28,0,true);
      lh.set(nb,30);parts.push(lh,data);
      const cd=new Uint8Array(46+nb.length);const cv=new DataView(cd.buffer);
      cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
      cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint32(14,crc,true);
      cv.setUint32(18,data.length,true);cv.setUint32(22,data.length,true);cv.setUint16(26,nb.length,true);cv.setUint16(28,0,true);
      cv.setUint32(42,offset,true);cd.set(nb,46);central.push(cd);

  function buildXlsx(data){
    const sheets=[
      {name:'物品',rows:[XLSX_COLS.items.map(c=>c[1])].concat((data.items||[]).map(i=>XLSX_COLS.items.map(c=>{
        if(c[0]==='moduleName')return (MODULES.find(m=>m.id===i.moduleId)||{}).name||'';
        if(c[0]==='imagesCount')return (i.images?i.images.length:0);
        return i[c[0]];
      })))},

      {name:'分类',rows:[XLSX_COLS.categories.map(c=>c[1])].concat((data.categories||[]).map(c=>XLSX_COLS.categories.map(c2=>c[c2[0]])))},
      {name:'模块',rows:[XLSX_COLS.modules.map(c=>c[1])].concat((data.modules||[]).map(m=>XLSX_COLS.modules.map(c=>m[c[0]])))}

    const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
    const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,idx)=>'<sheet name="'+xmlEscape(s.name)+'" sheetId="'+(idx+1)+'" r:id="rId'+(idx+1)+'"/>').join('')+'</sheets></workbook>';
    const wbrels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,idx)=>'<Relationship Id="rId'+(idx+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(idx+1)+'.xml"/>').join('')+'</Relationships>';
    const files=[{name:'[Content_Types].xml',content:ct},{name:'_rels/.rels',content:rels},{name:'xl/workbook.xml',content:wb},{name:'xl/_rels/workbook.xml.rels',content:wbrels}];

  function parseCsvText(text){
    text=text.replace(/^\uFEFF/,'');
    const rows=[];let row=[],field='',inQ=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(inQ){
        if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; }
        else field+=ch;
      }else{
        if(ch==='"')inQ=true;
        else if(ch===','){row.push(field);field='';}
        else if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';}
        else if(ch==='\r'){}
        else field+=ch;
      }
    }
    if(field.length||row.length){row.push(field);rows.push(row);}
    return rows;
  }
  function parseXmlText(text){
    const doc=new DOMParser().parseFromString(text,'application/xml');
    if(doc.querySelector('parsererror'))throw new Error('XML 解析失败');
    const T=(el,tag)=>{const n=el.querySelector(tag);return n?n.textContent:'';};
    const N=s=>{const n=parseInt(s);return isNaN(n)?0:n;};
    const items=Array.from(doc.querySelectorAll('items > item')).map(it=>({
      id:T(it,'id'),name:T(it,'name'),quantity:N(T(it,'quantity')),moduleId:T(it,'moduleId'),
      categoryId:T(it,'categoryId'),location:T(it,'location'),barcode:T(it,'barcode'),
      arrivalDate:T(it,'arrivalDate'),expiryDate:T(it,'expiryDate'),reminderDays:N(T(it,'reminderDays')),
      usageNote:T(it,'usageNote'),supplierNote:T(it,'supplierNote'),
      images:Array.from(it.querySelectorAll('images > image')).map(n=>n.textContent)
    }));
    const records=Array.from(doc.querySelectorAll('records > record')).map(r=>({
      id:T(r,'id'),itemId:T(r,'itemId'),moduleId:T(r,'moduleId'),type:T(r,'type'),
      quantity:N(T(r,'quantity')),remainingQty:N(T(r,'remainingQty')),note:T(r,'note'),timestamp:T(r,'timestamp')
    }));
    const categories=Array.from(doc.querySelectorAll('categories > category')).map(c=>({id:T(c,'id'),moduleId:T(c,'moduleId'),name:T(c,'name')}));
    const modules=Array.from(doc.querySelectorAll('modules > module')).map(m=>({id:T(m,'id'),name:T(m,'name'),icon:T(m,'icon')}));
    return {items,records,categories,modules};
  }
  function sheetXmlToRows(xml){
    const rows=[];
    const rowMatches=xml.match(/<row[^>]*>[\s\S]*?<\/row>/g)||[];
    rowMatches.forEach(rm=>{
      const tmp=[];let maxCol=0;
      (rm.match(/<c[^>]*>[\s\S]*?<\/c>/g)||[]).forEach(cell=>{
        const ref=(cell.match(/r="([A-Z]+)\d+"/)||[])[1];
        const colIdx=colToNum(ref);
        let val='';
        if(/t="inlineStr"/.test(cell)){const t=cell.match(/<t[^>]*>([\s\S]*?)<\/t>/);if(t)val=t[1];}
        else{const v=cell.match(/<v>([\s\S]*?)<\/v>/);if(v)val=v[1];}
        tmp.push({colIdx,val});
        if(colIdx>maxCol)maxCol=colIdx;
      });
      const arr=new Array(maxCol+1).fill('');
      tmp.forEach(c=>arr[c.colIdx]=c.val);
      rows.push(arr);
    });
    return rows;
  }
  async function inflateRaw(bytes){
    const ds=new DecompressionStream('deflate-raw');
    const w=ds.writable.getWriter();w.write(bytes);w.close();
    const r=ds.readable.getReader();const chunks=[];let done=false;
    while(!done){const x=await r.read();if(x.done){done=true;break;}chunks.push(x.value);}
    let total=chunks.reduce((s,c)=>s+c.length,0);const merged=new Uint8Array(total);let o=0;
    chunks.forEach(c=>{merged.set(c,o);o+=c.length;});
    return new TextDecoder().decode(merged);
  }
  async function parseZipBuf(buf){
    const dv=new DataView(buf);let eocd=-1;
    for(let i=buf.byteLength-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
    if(eocd<0)throw new Error('不是有效的压缩包');
    const cdOffset=dv.getUint32(eocd+16,true);const cdCount=dv.getUint16(eocd+10,true);
    const files={};let p=cdOffset;
    for(let i=0;i<cdCount;i++){
      if(dv.getUint32(p,true)!==0x02014b50)break;
      const method=dv.getUint16(p+10,true);const compSize=dv.getUint32(p+20,true);
      const nameLen=dv.getUint16(p+28,true);const extraLen=dv.getUint16(p+30,true);
      let name='';for(let j=0;j<nameLen;j++)name+=String.fromCharCode(buf[p+46+j]);
      const localOff=dv.getUint32(p+42,true);
      files[name]={method,compSize,localOff};p+=46+nameLen+extraLen;
    }
    const out={};
    for(const name in files){
      const f=files[name];const lh=new DataView(buf,f.localOff);
      const lNameLen=lh.getUint16(26,true);const lExtraLen=lh.getUint16(28,true);
      const dataStart=f.localOff+30+lNameLen+lExtraLen;
      const bytes=new Uint8Array(buf,dataStart,f.compSize);
      if(f.method===0){out[name]=new TextDecoder().decode(bytes);}
      else if(f.method===8){try{out[name]=await inflateRaw(bytes);}catch(e){out[name]='';}}
    }
    return out;
  }
  async function parseXlsxBuf(buf){
    const files=await parseZipBuf(buf);
    const wb=files['xl/workbook.xml']||'';
    const wbrels=files['xl/_rels/workbook.xml.rels']||'';
    const sheetDefs=[];
    (wb.match(/<sheet[^>]*>/g)||[]).forEach(s=>{
      const name=(s.match(/name="([^"]*)"/)||[])[1];
      const rid=(s.match(/r:id="([^"]*)"/)||[])[1];
      if(name&&rid)sheetDefs.push({name,rid});
    });
    const relMap={};
    (wbrels.match(/<Relationship[^>]*>/g)||[]).forEach(r=>{
      const id=(r.match(/Id="([^"]*)"/)||[])[1];
      const tgt=(r.match(/Target="([^"]*)"/)||[])[1];
      if(id&&tgt)relMap[id]=tgt;
    });
    function rowsOf(name){
      const def=sheetDefs.find(d=>d.name===name);if(!def)return [];
      let tgt=relMap[def.rid];if(!tgt)return [];
      if(tgt.startsWith('/'))tgt=tgt.slice(1);else if(!tgt.startsWith('xl/'))tgt='xl/'+tgt;
      return sheetXmlToRows(files[tgt]||'');
    }

      for(let i=1;i<rows.length;i++){const o={};header.forEach((h,ci)=>o[h]=rows[i][ci]);out.push(o);}
      return out;
    }
    const items=toObjs(rowsOf('物品')).map(o=>({
      id:o['ID']||makeId(),name:o['物品名称']||'',quantity:parseInt(o['数量']||o['quantity'])||0,
      moduleId:o['模块ID']||resolveModuleId(o['所属模块']),categoryId:o['分类ID']||'',location:o['存放位置']||'',barcode:o['条码']||'',
      arrivalDate:o['到货日期']||'',expiryDate:o['到期时间']||'',reminderDays:parseInt(o['预警天数']||o['reminderDays'])||7,
      usageNote:o['用途备注']||'',supplierNote:o['供应商']||'',images:[]
    }));
    const records=toObjs(rowsOf('记录')).map(o=>({
      id:o['ID']||makeId(),itemId:o['物品ID']||'',moduleId:o['模块ID']||'',type:o['类型']||'in',
      quantity:parseInt(o['数量']||o['quantity'])||0,remainingQty:parseInt(o['剩余']||o['remainingQty'])||0,note:o['备注']||'',timestamp:o['时间']||new Date().toISOString()
    }));
    const categories=toObjs(rowsOf('分类')).map(o=>({id:o['ID']||makeId(),moduleId:o['模块ID']||'',name:o['名称']||''}));
    const modules=toObjs(rowsOf('模块')).map(o=>({id:o['ID']||makeId(),name:o['名称']||'',icon:o['图标']||'📦'}));
    return {items,records,categories,modules};
  }
  function csvToData(text){
    const rows=parseCsvText(text);
    if(rows.length<2)return {items:[],records:[],categories:[],modules:[]};
    const header=rows[0];
    const items=rows.slice(1).filter(r=>r[0]).map(r=>{const o={};header.forEach((h,ci)=>o[h]=r[ci]||'');return o;}).filter(o=>o['物品名称']);
    return {items:items.map(o=>({
      id:o['ID']||makeId(),name:o['物品名称']||'',quantity:parseInt(o['数量']||o['quantity'])||0,
      moduleId:o['模块ID']||resolveModuleId(o['所属模块']),categoryId:o['分类ID']||'',location:o['存放位置']||'',barcode:o['条码']||'',
      arrivalDate:o['到货日期']||'',expiryDate:o['到期时间']||'',reminderDays:parseInt(o['预警天数']||o['reminderDays'])||7,
      usageNote:o['用途备注']||'',supplierNote:o['供应商']||'',images:[]

  }

  async function handleImportFile(file){
    if(!file)return;
    const name=(file.name||'').toLowerCase();
    let parsed=null,kind='';
    try{
      if(name.endsWith('.json')){parsed=JSON.parse(await file.text());kind='json';}
      else if(name.endsWith('.csv')){parsed=csvToData(await file.text());kind='csv';}
      else if(name.endsWith('.xml')){parsed=parseXmlText(await file.text());kind='xml';}
      else if(name.endsWith('.xlsx')){parsed=await parseXlsxBuf(await file.arrayBuffer());kind='xlsx';}
      else{
        const head=(await file.slice(0,4).text());
        if(head==='PK\u0003\u0004'){parsed=await parseXlsxBuf(await file.arrayBuffer());kind='xlsx';}
        else{const t=await file.text();if(t.trim().startsWith('<')){parsed=parseXmlText(t);kind='xml';}else if(t.trim().startsWith('{')){parsed=JSON.parse(t);kind='json';}else{parsed=csvToData(t);kind='csv';}}
      }
    }catch(e){toast('解析失败：'+e.message);return;}
    if(!parsed||!parsed.items||!parsed.items.length){toast('文件中未找到可导入的物品数据');return;}
    state._pendingImport=parsed;
    showImportConfirm(parsed,kind);
  }

  // ---- Utility ----
  function formatDate(d,fmt='YYYY-MM-DD'){
    if(!d)return '';
    if(typeof d==='string')d=new Date(d);
    const m={YYYY:d.getFullYear(),MM:String(d.getMonth()+1).padStart(2,'0'),DD:String(d.getDate()).padStart(2,'0'),HH:String(d.getHours()).padStart(2,'0'),mm:String(d.getMinutes()).padStart(2,'0'),ss:String(d.getSeconds()).padStart(2,'0')};
    return fmt.replace(/YYYY|MM|DD|HH|mm|ss/g,k=>m[k]);
  }
  function daysUntil(ds){if(!ds)return null;return Math.ceil(new Date(ds)-new Date())/86400000;}
  function getExpiryStatus(item){
    if(!item.expiryDate)return null;
    const days=daysUntil(item.expiryDate),warnDays=item.reminderDays||7;
    if(days<=0)return{status:'expired',days,label:'已过期 '+Math.abs(days)+'天',cls:'expired'};
    if(days<=warnDays)return{status:'warning',days,label:'即将到期 '+days+'天',cls:'warning'};
    return null;
  }
