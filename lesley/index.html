<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9ed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LESLEY公司仓储" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>LESLEY公司仓储</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fff5e6; color: #5d4e37; font-size: 15px; line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    #root { max-width: 560px; margin: 0 auto; }
    .app { min-height: 100vh; display: flex; flex-direction: column; background: #fff5e6; }
    .content { flex: 1; padding: 12px; padding-bottom: 84px; }
    .loading { padding: 40px; text-align: center; color: #9c8c76; }
    .toast {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(93,78,55,.92); color: #fff; padding: 10px 18px; border-radius: 12px;
      font-size: 14px; z-index: 999; max-width: 80%; text-align: center;
    }
    .img-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 1000;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    .img-overlay img { max-width: 96%; max-height: 82%; border-radius: 8px; }
    .img-overlay-tip { color: #f0e6d3; font-size: 12px; margin-top: 10px; }

    /* 顶栏 / 底栏 */
    .topbar { background: #fff9ed; color: #5d4e37; padding: 16px; text-align: center; border-bottom: 1px solid #f0e6d3; }
    .brand { font-weight: 800; letter-spacing: .5px; font-size: 17px; }
    .subbar { background: #fff9ed; color: #5d4e37; display: flex; align-items: center; padding: 12px 12px; border-bottom: 1px solid #f0e6d3; }
    .subbar .back { background: none; border: none; color: #5d4e37; font-size: 16px; cursor: pointer; font-weight: 600; }
    .subbar .subtitle { flex: 1; text-align: center; font-weight: 700; }
    .subbar .subspacer { width: 48px; }
    .bottom-tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px;
      display: flex; background: #fff; border-top: 1px solid #f0e6d3; padding: 6px 0; z-index: 50; }
    .tab { flex: 1; background: none; border: none; display: flex; flex-direction: row; align-items: center; justify-content: center;
      padding: 6px 0; color: #9c8c76; font-size: 12px; cursor: pointer; gap: 4px; }
    .tab.active { color: #8fcb9b; }
    .tab-ico { font-size: 18px; line-height: 1; }
    .tab-tx { margin-top: 0; }

    /* 通用卡片 */
    .card { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(93,78,55,.06); }
    .card-title { font-weight: 700; margin: 4px 0 10px; color: #5d4e37; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge.overdue { background: #fceae8; color: #c0392b; }
    .badge.soon { background: #fff4e0; color: #b7791f; }
    .badge.ok { background: #e8f5e9; color: #2e7d32; }

    /* 按钮 — 默认横向 */
    .btn-primary { background: #8fcb9b; color: #fff; border: none; border-radius: 12px; padding: 11px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-warn { background: #f9c784; color: #5d4e37; border: none; border-radius: 12px; padding: 11px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-ghost { background: #fff; color: #5d4e37; border: 1px solid #f0e6d3; border-radius: 12px; padding: 10px 14px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .btn-danger { background: #e86a5c; color: #fff; border: none; border-radius: 12px; padding: 11px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-mini { background: #fff4e6; border: none; border-radius: 8px; padding: 5px 12px; font-size: 13px; margin-left: 6px; cursor: pointer; color: #5d4e37; font-weight: 600; }
    .btn-mini.danger { background: #fceae8; color: #c0392b; }
    .btn-block { display: block; width: 100%; margin-top: 8px; text-align: center; }
    .block { width: 100%; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-actions { margin-top: 12px; display: flex; flex-direction: row; gap: 10px; flex-wrap: wrap; }
    .form-actions button { flex: 1; min-width: 80px; }
    .row-btns { display: flex; flex-direction: row; gap: 6px; }
    .settings-actions { display: flex; flex-direction: row; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .settings-actions button { flex: 1; min-width: 90px; }
    .backup-actions { display: flex; flex-direction: row; gap: 10px; margin-top: 10px; }
    .backup-actions button { flex: 1; }
    .sheet-actions { display: flex; flex-direction: row; gap: 10px; margin-top: 12px; }
    .sheet-actions button { flex: 1; }

    /* 输入控件 */
    .inp { width: 100%; border: 1px solid #f0e6d3; border-radius: 12px; padding: 10px 12px; font-size: 15px; background: #fff; font-family: inherit; color: #5d4e37; }
    textarea.inp { resize: vertical; }
    .form-section { margin-bottom: 12px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-section { flex: 1; }
    .lbl { display: block; font-size: 13px; color: #7d6e57; margin-bottom: 5px; font-weight: 700; }

    /* 首页 */
    .home .stat-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .stat { flex: 1; background: #fff; border-radius: 18px; padding: 12px; text-align: center; box-shadow: 0 2px 8px rgba(93,78,55,.06); }
    .stat-n { font-size: 22px; font-weight: 800; color: #5d4e37; }
    .stat-l { font-size: 12px; color: #9c8c76; margin-top: 2px; }
    .remind-card { border-left: 4px solid #f9c784; }
    .remind-item { display: flex; align-items: center; padding: 8px 0; border-top: 1px solid #f9f2e7; gap: 8px; }
    .remind-item:first-of-type { border-top: none; }
    .remind-name { flex: 1; font-weight: 700; }
    .remind-meta { flex: 2; font-size: 12px; color: #9c8c76; }
    .remind-item.overdue { background: #fff5f4; border-radius: 10px; padding-left: 6px; }
    .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .module-card { border: none; border-radius: 18px; padding: 16px 8px; text-align: center;
      box-shadow: 0 3px 10px rgba(93,78,55,.12); cursor: pointer; color: #fff; }
    .mc-name { font-weight: 800; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .mc-count { font-size: 12px; margin-top: 4px; opacity: .92; }
    /* 高对比模块色（与奶油底色明显区分） */
    .module-card.c-red { background: linear-gradient(135deg, #ff8a80 0%, #ff5252 100%); }
    .module-card.c-blue { background: linear-gradient(135deg, #81d4fa 0%, #29b6f6 100%); }
    .module-card.c-green { background: linear-gradient(135deg, #a5d6a7 0%, #66bb6a 100%); }
    .module-card.c-yellow { background: linear-gradient(135deg, #fff59d 0%, #ffee58 100%); color: #5d4e37; }
    .module-card.c-purple { background: linear-gradient(135deg, #ce93d8 0%, #ab47bc 100%); }
    .module-card.c-orange { background: linear-gradient(135deg, #ffcc80 0%, #ffa726 100%); color: #5d4e37; }
    .module-card.c-teal { background: linear-gradient(135deg, #80cbc4 0%, #26a69a 100%); }
    .module-card.c-pink { background: linear-gradient(135deg, #f48fb1 0%, #ec407a 100%); }
    .module-card.c-brown { background: linear-gradient(135deg, #bcaaa4 0%, #8d6e63 100%); }
    .module-card.consume-entry { background: linear-gradient(135deg, #ff7043 0%, #f4511e 100%); }
    .home-actions { display: flex; gap: 10px; margin-bottom: 12px; }
    .home-actions .btn-ghost, .home-actions .btn-primary { flex: 1; text-align: center; padding: 11px 0; }
    .footer-note { font-size: 12px; color: #9c8c76; text-align: center; padding: 14px 6px; line-height: 1.6; }
    .consume-banner { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #ff7043 0%, #f4511e 100%); color: #fff; border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: 0 3px 10px rgba(244,81,30,.25); cursor: pointer; }
    .consume-banner .cb-ico { font-size: 32px; }
    .consume-banner .cb-title { font-weight: 800; font-size: 16px; }
    .consume-banner .cb-sub { font-size: 12px; opacity: .9; margin-top: 2px; }

    /* 模块页 */
    .mp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .mp-title { font-size: 18px; font-weight: 800; color: #5d4e37; }
    .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
    .cat-tab { border: none; background: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #7d6e57; white-space: nowrap; cursor: pointer; }
    .cat-tab.active { background: #8fcb9b; color: #fff; }
    .item-list { display: flex; flex-direction: column; gap: 8px; }
    .item-card { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 10px; box-shadow: 0 2px 8px rgba(93,78,55,.05); cursor: pointer; }
    .ic-thumb { width: 46px; height: 46px; border-radius: 10px; background-size: cover; background-position: center; background-color: #f9f2e7; flex-shrink: 0; }
    .ic-body { flex: 1; min-width: 0; }
    .ic-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #5d4e37; }
    .ic-meta { font-size: 12px; color: #9c8c76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ic-qty { font-size: 18px; font-weight: 800; color: #8fcb9b; padding: 0 4px; }
    .empty { text-align: center; color: #9c8c76; padding: 24px; font-size: 13px; }
    .fab { position: fixed; bottom: 76px; left: 50%; transform: translateX(calc(280px - 28px)); width: 56px; height: 56px;
      border-radius: 50%; background: #f9c784; color: #5d4e37; border: none; font-size: 28px; box-shadow: 0 4px 12px rgba(249,199,132,.5);
      cursor: pointer; z-index: 60; max-width: calc(560px - 24px); }

    /* 底部弹层 */
    .sheet-mask { position: fixed; inset: 0; background: rgba(93,78,55,.35); z-index: 200; display: flex; align-items: flex-end; }
    .sheet { background: #fff; width: 100%; max-width: 560px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 16px; max-height: 85vh; overflow-y: auto; }
    .sheet-tall { max-height: 92vh; }
    .sheet-title { font-weight: 800; margin-bottom: 12px; color: #5d4e37; }
    .form-scroll { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
    .cat-add { display: flex; gap: 8px; margin-bottom: 12px; align-items: stretch; }
    .cat-add .inp { flex: 1; min-width: 0; }
    .cat-add .btn-primary { flex-shrink: 0; border-radius: 12px; padding: 10px 18px; }
    .cat-manage-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .cat-manage-item { display: flex; justify-content: space-between; align-items: center; background: #fff9ed; padding: 10px 12px; border-radius: 10px; }

    /* 媒体 */
    .media-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .media-thumb { position: relative; width: 74px; height: 74px; border-radius: 10px; overflow: hidden; background: #f9f2e7; }
    .media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .media-del { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(93,78,55,.6); color: #fff; border: none; font-size: 14px; line-height: 1; cursor: pointer; }
    .media-add { width: 74px; height: 74px; border: 2px dashed #e0d4c0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #b0a08a; cursor: pointer; }

    /* 详情 */
    .carousel { position: relative; background: #3a322a; border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
    .carousel .slide { display: none; }
    .carousel .slide.active { display: block; }
    .carousel .slide img, .carousel .slide video { width: 100%; max-height: 320px; object-fit: contain; background: #2a231d; }
    .carousel-nav { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 16px; color: #fff; }
    .carousel-nav button { background: rgba(0,0,0,.4); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; }
    .detail-noimg { background: #f9f2e7; border-radius: 14px; padding: 30px; text-align: center; color: #9c8c76; margin-bottom: 12px; cursor: pointer; }
    .detail-card { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 12px; }
    .detail-name { font-size: 19px; font-weight: 800; margin-bottom: 4px; color: #5d4e37; }
    .detail-qty { font-size: 15px; color: #7d6e57; margin-bottom: 8px; }
    .kv { display: flex; padding: 6px 0; border-top: 1px solid #f9f2e7; font-size: 14px; }
    .kv span { width: 84px; color: #9c8c76; flex-shrink: 0; }
    .kv b { font-weight: 700; flex: 1; word-break: break-word; color: #5d4e37; }
    .detail-actions { display: flex; gap: 8px; margin-bottom: 14px; }
    .detail-actions .btn-primary, .detail-actions .btn-warn, .detail-actions .btn-ghost { flex: 1; }

    /* 消耗登记 */
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .mode-tab { flex: 1; border: none; background: #f9f2e7; padding: 8px; border-radius: 12px; font-size: 14px; color: #7d6e57; cursor: pointer; font-weight: 600; }
    .mode-tab.active { background: #f4b9b2; color: #fff; }
    .match-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; margin-bottom: 12px; }
    .match-item { background: #f9f2e7; border-radius: 12px; padding: 8px 10px; cursor: pointer; }
    .match-item.active { background: #e8f5e9; border: 1px solid #8fcb9b; }
    .match-name { font-weight: 700; color: #5d4e37; }
    .match-meta { font-size: 12px; color: #9c8c76; }
    .selected-item { background: #e8f5e9; border-radius: 12px; padding: 10px; margin-bottom: 12px; color: #2e7d32; font-weight: 700; }
    .selected-stock { font-size: 13px; color: #7d6e57; font-weight: 600; }

    /* 记录 / 统计 */
    .range-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
    .range-tab { border: none; background: #fff; padding: 7px 12px; border-radius: 20px; font-size: 13px; color: #7d6e57; white-space: nowrap; cursor: pointer; }
    .range-tab.active { background: #8fcb9b; color: #fff; }
    .range-custom { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .summary { display: flex; gap: 8px; margin-bottom: 12px; }
    .sum { flex: 1; background: #fff; border-radius: 14px; padding: 10px; text-align: center; }
    .sum-n { font-size: 18px; font-weight: 800; }
    .sum-n.in { color: #8fcb9b; } .sum-n.out { color: #e86a5c; } .sum-n.consume { color: #f9a825; }
    .sum-l { font-size: 11px; color: #9c8c76; margin-top: 2px; }
    .chart { background: #fff; border-radius: 14px; padding: 8px; margin-bottom: 12px; }
    .cat-summary { background: #fff; border-radius: 14px; padding: 10px; margin-bottom: 12px; }
    .cat-sum-row { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid #f9f2e7; }
    .cat-sum-row:first-child { border-top: none; }
    .rec-list { display: flex; flex-direction: column; gap: 6px; }
    .rec-item { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 8px 10px; }
    .rec-tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
    .rec-tag.in { background: #e8f5e9; color: #2e7d32; }
    .rec-tag.out { background: #fceae8; color: #c0392b; }
    .rec-tag.consume { background: #fff8e1; color: #f57f17; }
    .rec-qty { font-weight: 800; }
    .rec-time { font-size: 12px; color: #9c8c76; flex: 1; }

    /* 备份 */
    .fmt-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    .fmt-tab { flex: 1; border: none; background: #f9f2e7; padding: 8px; border-radius: 12px; font-size: 14px; color: #7d6e57; cursor: pointer; font-weight: 600; }
    .fmt-tab.active { background: #a7c7e7; color: #fff; }
    .file-btn { display: block; text-align: center; cursor: pointer; }
    .preview-sheet .preview-body { max-height: 60vh; overflow: auto; background: #fff9ed; border-radius: 12px; padding: 10px; }
    .preview-body pre { white-space: pre-wrap; font-size: 12px; color: #5d4e37; margin: 0; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .preview-table td { border: 1px solid #f0e6d3; padding: 4px; color: #5d4e37; }
    .preview-html table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .preview-html th, .preview-html td { border: 1px solid #f0e6d3; padding: 6px; text-align: left; }

    /* 设置 */
    .sync-steps { background: #fff9ed; border-radius: 12px; padding: 10px; margin-bottom: 12px; }
    .sync-step { font-size: 13px; color: #7d6e57; padding: 5px 0; }
    .sync-step b { display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; background: #f4b9b2; color: #fff; border-radius: 50%; margin-right: 6px; font-size: 12px; }
    .backup-page .card, .settings-page .card { margin-bottom: 12px; }
    mark { background: #fff9c4; color: inherit; padding: 0 2px; border-radius: 3px; }
    .hint { font-size: 13px; color: #9c8c76; margin: 0 0 10px; line-height: 1.5; }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 10px; color: #5d4e37; }
    .history-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .history-tag { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #f0e6d3; border-radius: 20px; padding: 5px 10px; font-size: 13px; color: #5d4e37; cursor: pointer; }
    .history-tag button { background: none; border: none; color: #9c8c76; font-size: 14px; cursor: pointer; padding: 0 0 0 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/htm.umd.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('SW 注册失败（不影响使用）:', e); });
      });
    }
  </script>
</body>
</html>
