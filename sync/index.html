  terminated:["已终止","b-terminated"],archived:["已归档","b-archived"]};

async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function unlock(){
  const v = document.getElementById('pw').value;
  const h = await sha256(v);
  if(h === PWHASH){
    localStorage.setItem('sc_ok','1');
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    render();
  } else {
    document.getElementById('err').textContent = '口令错误，请重试';
  }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
if(localStorage.getItem('sc_ok')==='1'){
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='block';
}
// 容许离线缓存解锁状态（同浏览器）
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtSize(b){if(!b)return '';if(b<1024)return b+'B';if(b<1048576)return (b/1024).toFixed(0)+'KB';return (b/1048576).toFixed(1)+'MB';}
function fmtTs(ms){if(!ms)return '';const d=new Date(ms/1000);const p=n=>(''+n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function switchTab(t){
  document.getElementById('tab-tasks').classList.toggle('on',t==='tasks');
  document.getElementById('tab-spaces').classList.toggle('on',t==='spaces');
  document.getElementById('tasksView').style.display = t==='tasks'?'block':'none';
  document.getElementById('spacesView').style.display = t==='spaces'?'block':'none';
  render();
}
function render(){
  document.getElementById('meta').textContent = '最近同步：'+DATA.generated+' · 共 '+DATA.tasks.length+' 个任务 / '+DATA.workspaces.length+' 个空间';
  const q = (document.getElementById('search').value||'').toLowerCase();
  const active = document.getElementById('tasksView').style.display!=='none';
  if(active){
    const box=document.getElementById('tasksView'); box.innerHTML='';
    const list=DATA.tasks.filter(t=>(t.title||'').toLowerCase().includes(q));
    if(!list.length){box.innerHTML='<div class="empty">没有匹配的任务</div>';return;}
    list.forEach(t=>{
      const [label,cls]=STATUS_MAP[t.status]||[t.status,'b-terminated'];
      const dels=t.deliverables.filter(d=>d.hosted);
      const locals=t.deliverables.filter(d=>!d.hosted && d.size>0);
      let html='<div class="card"><div class="top"><div class="t">'+esc(t.title)+
        '</div><span class="badge '+cls+'">'+esc(label)+'</span></div>'+
        '<div class="ws-tag">📁 '+esc(t.ws)+'</div>'+
        '<div class="upd">更新：'+fmtTs(t.updated)+'</div>';
      if(dels.length||locals.length){
        html+='<div class="dlist">';
        dels.forEach(d=>{
          const href='files/'+t.id+'/'+encodeURIComponent(d.name);
          html+='<div class="ditem"><a href="'+href+'" target="_blank">📄 '+esc(d.name)+'</a><span class="sz">'+fmtSize(d.size)+' · 可打开</span></div>';
        });
        locals.forEach(d=>{
          html+='<div class="ditem"><span class="local">📦 '+esc(d.name)+'</span><span class="sz">'+fmtSize(d.size)+' · 本地未同步</span></div>';
        });
        html+='</div>';
      }
      html+='</div>';
      box.insertAdjacentHTML('beforeend',html);
    });
  } else {
    const box=document.getElementById('spacesView'); box.innerHTML='';
    DATA.workspaces.forEach(w=>{
      let html='<div class="sec-title">'+esc(w.name)+' · <span style="font-weight:400">'+esc(w.path)+'</span></div><div class="card">';
      if(!w.files.length){html+='<div class="empty">空目录</div>';}
      // 建立交付文件快速索引（按文件名）
      w.files.forEach(f=>{
        const m=f.dir?('📁 '+esc(f.name)+' <span class="mt">'+ (f.count||0) +' 项</span>')
                     :('📄 '+esc(f.name)+' <span class="mt">'+fmtSize(f.size)+'</span>');
        html+='<div class="wfile"><span class="nm">'+m+'</span></div>';
      });
      html+='</div>';
      box.insertAdjacentHTML('beforeend',html);
    });
  }
}
</script>
</body>
</html>
