<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD4B8">
<title>廖廖的空间</title>
<style>
  :root {
    --bg: #FFF8E7;
    --bg2: #FAF3E0;
    --primary: #FFB6A0;
    --primary-dark: #FF9B7A;
    --secondary: #B5E2C0;
    --secondary-dark: #87CEEB;
    --accent: #FFD700;
    --card: #FFFFFF;
    --text: #4A4A4A;
    --text-light: #888;
    --border: #FFE0CC;
    --shadow: 0 4px 16px rgba(255, 182, 160, 0.18);
    --shadow-lg: 0 8px 24px rgba(255, 182, 160, 0.25);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  #app { display: flex; min-height: 100vh; }
  #sidebar {
    width: 200px;
    background: linear-gradient(180deg, #FFE9D9 0%, #FFD4B8 100%);
    padding: 16px 0;
    transition: width 0.3s;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
    box-shadow: 4px 0 16px rgba(255, 182, 160, 0.1);
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
  #sidebar.collapsed { width: 68px; }
  #sidebar .logo {
    text-align: center; padding: 8px 16px 20px;
    font-size: 22px; font-weight: bold; color: var(--primary-dark);
  }
  #sidebar.collapsed .logo { font-size: 28px; }
  #sidebar .logo .sub { font-size: 11px; color: var(--text-light); display: block; margin-top: 2px; }
  #sidebar.collapsed .logo .sub { display: none; }
  .nav-item {
    display: flex; align-items: center; padding: 11px 20px;
    cursor: pointer; color: var(--text);
    border-radius: 0 24px 24px 0; margin: 3px 8px 3px 0;
    transition: all 0.2s;
    user-select: none;
  }
  .nav-item:hover { background: rgba(255, 255, 255, 0.5); }
  .nav-item.active {
    background: var(--card);
    color: var(--primary-dark);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(255, 182, 160, 0.2);
  }
  .nav-item .icon { font-size: 20px; margin-right: 12px; flex-shrink: 0; }
  #sidebar.collapsed .nav-item .label { display: none; }
  #sidebar.collapsed .nav-item { justify-content: center; padding: 12px; margin: 3px 4px; border-radius: 16px; }
  #sidebar.collapsed .nav-item .icon { margin-right: 0; font-size: 22px; }
  #content { flex: 1; padding: 24px 32px; min-width: 0; }
  .module { display: none; }
  .module.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card-title {
    color: var(--primary-dark);
    margin-bottom: 16px;
    font-size: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 9px 20px;
    border-radius: 22px;
    font-size: 14px;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(255, 182, 160, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 182, 160, 0.4); }
  .btn:active { transform: translateY(0); }
  .btn-green { background: var(--secondary); color: #2D5F3F; box-shadow: 0 2px 8px rgba(181, 226, 192, 0.4); }
  .btn-blue { background: #87CEEB; color: #2A5F7F; box-shadow: 0 2px 8px rgba(135, 206, 235, 0.4); }
  .btn-gold { background: linear-gradient(135deg, #FFD700, #FFA500); color: #6B4A00; box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4); }
  .btn-ghost { background: transparent; color: var(--primary-dark); border: 1.5px solid var(--primary); box-shadow: none; }
  .btn-ghost:hover { background: var(--primary); color: white; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-block { width: 100%; }
  input[type=text], input[type=number], input[type=password], input[type=time], input[type=date], textarea, select {
    padding: 9px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    outline: none;
    background: #FFFAF0;
    color: var(--text);
    transition: border 0.2s;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--primary); background: white; }
  textarea { resize: vertical; line-height: 1.7; }
  label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 4px; }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .badge {
    background: #FF4757; color: white;
    border-radius: 12px; padding: 1px 8px;
    font-size: 12px; min-width: 22px; text-align: center;
    display: inline-block; font-weight: 600;
  }
  .badge-circle { border-radius: 50%; min-width: 24px; height: 24px; line-height: 22px; padding: 0; }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s;
  }
  .modal-box {
    background: white; border-radius: 18px; padding: 28px;
    max-width: 520px; width: 92%;
    max-height: 85vh; overflow-y: auto;
    animation: pop 0.3s;
    box-shadow: var(--shadow-lg);
  }
  .modal-box.wide { max-width: 720px; }
  .modal-box h3 { color: var(--primary-dark); margin-bottom: 16px; font-size: 20px; }
  .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .greeting {
    background: linear-gradient(135deg, #FFD4B8 0%, #FFB6A0 60%, #FF9B7A 100%);
    color: white; padding: 28px 32px; border-radius: 22px; margin-bottom: 18px;
    box-shadow: var(--shadow-lg);
    position: relative; overflow: hidden;
  }
  .greeting::before {
    content: '☀️'; position: absolute; top: -20px; right: 20px;
    font-size: 100px; opacity: 0.2;
  }
  .greeting h1 { font-size: 30px; margin-bottom: 8px; font-weight: 700; }
  .greeting .info { display: flex; gap: 16px; font-size: 14px; opacity: 0.95; flex-wrap: wrap; }
  .greeting .info span { display: inline-flex; align-items: center; gap: 4px; }
  .notice {
    background: linear-gradient(90deg, #FFF3D6 0%, #FFE5B4 100%);
    padding: 12px 20px; border-radius: 14px;
    margin-bottom: 18px; color: #8B6F00; font-size: 14px;
    overflow: hidden; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(255, 215, 0, 0.1);
    border-left: 4px solid #FFD700;
  }
  .notice-content { display: inline-block; animation: scroll 30s linear infinite; padding-left: 100%; }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  .home-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .quick-entries { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .quick-entry {
    text-align: center; padding: 18px 8px;
    background: var(--card); border-radius: 18px;
    cursor: pointer; transition: all 0.25s;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
  }
  .quick-entry:hover { transform: translateY(-4px); border-color: var(--primary); }
  .quick-entry .icon { font-size: 36px; margin-bottom: 6px; }
  .quick-entry .label { font-size: 13px; color: var(--text); font-weight: 500; }
  .homework-card {
    cursor: pointer; transition: all 0.2s;
    background: linear-gradient(135deg, #FFF3D6 0%, #FFE5B4 100%);
  }
  .homework-card:hover { transform: translateY(-2px); }
  .homework-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .homework-card .head h2 { color: #B8860B; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .homework-card .preview { color: var(--text); font-size: 14px; }
  .homework-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: #FFFAF0; border-radius: 14px; margin-bottom: 10px;
    transition: all 0.2s;
  }
  .homework-item:hover { transform: translateX(4px); box-shadow: var(--shadow); }
  .homework-item.done { opacity: 0.6; }
  .homework-item.done .text { text-decoration: line-through; }
  .homework-item.priority-high { border-left: 4px solid #FF4757; }
  .homework-item.priority-mid { border-left: 4px solid #FFA500; }
  .homework-item.priority-low { border-left: 4px solid var(--secondary); }
  .homework-item .priority-icon { font-size: 18px; }
  .homework-item .text { flex: 1; }
  .homework-item .meta { font-size: 12px; color: var(--text-light); }
  .wallet-card {
    background: linear-gradient(135deg, #FFD4B8 0%, #FFB6A0 100%);
    color: white; padding: 22px 24px; border-radius: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .wallet-card.green { background: linear-gradient(135deg, #C8F0D0 0%, #87CEEB 100%); color: #2D5F3F; }
  .wallet-card.purple { background: linear-gradient(135deg, #D4A5E0 0%, #B19CD9 100%); color: #4A2D6B; }
  .wallet-card.gold { background: linear-gradient(135deg, #FFE066 0%, #FFA500 100%); color: #6B4A00; }
  .wallet-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; opacity: 0.9; }
  .wallet-card .balance { font-size: 36px; font-weight: bold; margin: 4px 0 12px; }
  .wallet-card .actions { display: flex; gap: 8px; }
  .wallet-card .actions button { background: rgba(255, 255, 255, 0.3); color: inherit; border: none; padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer; }
  .wallet-card .actions button:hover { background: rgba(255, 255, 255, 0.5); }
  .mood-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .mood-day {
    aspect-ratio: 1; background: #FAF3E0; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; color: var(--text);
    border: 2px solid transparent; transition: all 0.2s;
  }
  .mood-day:hover { transform: scale(1.05); border-color: var(--primary); }
  .mood-day.recorded { background: linear-gradient(135deg, #FFD4B8, #FFB6A0); color: white; font-weight: bold; }
  .mood-day.today { border-color: var(--primary-dark); }
  .mood-emoji-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .mood-emoji-picker span {
    font-size: 32px; padding: 8px; cursor: pointer;
    border-radius: 12px; transition: all 0.2s;
  }
  .mood-emoji-picker span:hover { background: var(--bg2); transform: scale(1.15); }
  .mood-emoji-picker span.selected { background: var(--primary); }
  .diary-editor {
    background: #FFFEF8; border: 2px dashed var(--primary);
    border-radius: 18px; padding: 20px; min-height: 240px;
    background-image: repeating-linear-gradient(transparent, transparent 31px, #FFE0CC 31px, #FFE0CC 32px);
    line-height: 32px;
  }
  .diary-editor:empty:before {
    content: attr(data-placeholder); color: #ccc; pointer-events: none;
  }
  .diary-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .diary-tool {
    padding: 6px 12px; background: #FFE9D9; border-radius: 18px;
    cursor: pointer; font-size: 13px; user-select: none;
    transition: all 0.2s;
  }
  .diary-tool:hover { background: var(--primary); color: white; }
  .diary-tool.active { background: var(--primary); color: white; }
  .emoji-panel {
    display: none; flex-wrap: wrap; gap: 4px; padding: 12px;
    background: white; border-radius: 12px; max-height: 200px; overflow-y: auto;
    border: 1px solid var(--border);
    width: 100%;
  }
  .emoji-panel.show { display: flex; }
  .emoji-panel span { font-size: 24px; padding: 4px; cursor: pointer; border-radius: 6px; }
  .emoji-panel span:hover { background: var(--bg2); }
  .drawing-canvas { border: 2px solid var(--border); border-radius: 12px; cursor: crosshair; background: white; display: block; }
  .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 0 0 1px var(--border); }
  .lottery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 400px; margin: 20px auto; }
  .lottery-cell {
    aspect-ratio: 1; background: linear-gradient(135deg, #FF6B6B, #FF4757);
    color: white; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
  }
  .lottery-cell.flash { animation: flash 0.3s; }
  @keyframes flash { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 30px #FFD700; } 100% { transform: scale(1); } }
  .lottery-cell.winner {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #6B4A00; animation: bounce 0.5s;
  }
  @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .wheel-container { position: relative; width: 320px; height: 320px; margin: 20px auto; }
  .wheel-canvas { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.17, 0.67, 0.34, 1.05); }
  .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 32px; color: #FF4757; }
  .wheel-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #FFD700, #FFA500); border: 4px solid white; box-shadow: 0 4px 16px rgba(0,0,0,0.2); font-size: 18px; font-weight: bold; color: #6B4A00; cursor: pointer; }
  .egg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 400px; margin: 20px auto; }
  .egg { font-size: 60px; text-align: center; cursor: pointer; transition: all 0.3s; user-select: none; }
  .egg:hover { transform: scale(1.1) rotate(5deg); }
  .egg.cracked { animation: crack 0.5s; }
  @keyframes crack { 0% { transform: scale(1); } 50% { transform: scale(1.3) rotate(10deg); filter: brightness(1.5); } 100% { transform: scale(1); } }
  .egg.opened { filter: grayscale(0.3); opacity: 0.6; }
  .mystery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .mystery-box {
    aspect-ratio: 1; font-size: 60px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    border-radius: 16px; transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(255, 165, 0, 0.3);
    user-select: none;
  }
  .mystery-box:hover { transform: translateY(-4px) rotate(-3deg); }
  .mystery-box.opened { background: linear-gradient(135deg, #C8F0D0, #87CEEB); animation: openBox 0.6s; }
  @keyframes openBox { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .station-scene {
    background: linear-gradient(180deg, #87CEEB 0%, #B5E2C0 100%);
    border-radius: 18px; padding: 20px; min-height: 280px;
    position: relative; overflow: hidden;
    margin-bottom: 16px;
  }
  .road {
    background: #555; height: 80px; border-radius: 8px;
    position: relative; margin-top: 60px;
    background-image: linear-gradient(90deg, transparent 0, transparent 30px, #FFD700 30px, #FFD700 50px);
    background-size: 80px 4px; background-position: 0 50%; background-repeat: repeat-x;
  }
  .road-vehicle { position: absolute; top: 50%; transform: translateY(-50%); font-size: 40px; }
  .pet-card {
    text-align: center; padding: 24px;
    background: linear-gradient(180deg, #FFFEF8 0%, #FFFAF0 100%);
    border-radius: 18px;
    border: 2px solid var(--border);
  }
  .pet-icon { font-size: 100px; line-height: 1; margin-bottom: 12px; }
  .pet-stat { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
  .pet-stat .label { min-width: 60px; text-align: left; }
  .pet-stat .progress-bar { flex: 1; background: #FFE9D9; height: 10px; border-radius: 5px; overflow: hidden; }
  .pet-stat .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark)); transition: width 0.5s; }
  .pet-stat .value { min-width: 40px; text-align: right; font-weight: bold; color: var(--primary-dark); }
  .stat-card { text-align: center; padding: 20px; }
  .stat-value { font-size: 32px; font-weight: bold; color: var(--primary-dark); margin-bottom: 4px; }
  .stat-label { color: var(--text-light); font-size: 13px; }
  .progress-bar { background: var(--bg2); height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0; }
  .progress-bar-fill { background: linear-gradient(90deg, var(--primary), var(--primary-dark)); height: 100%; transition: width 0.5s; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    padding: 8px 18px; cursor: pointer; border-radius: 18px;
    background: var(--bg2); color: var(--text); font-size: 14px;
    transition: all 0.2s;
  }
  .tab:hover { background: #FFE9D9; }
  .tab.active { background: var(--primary); color: white; font-weight: 600; }
  .confetti-piece {
    position: fixed; pointer-events: none; z-index: 9999;
    font-size: 24px; user-select: none;
    animation: confetti 1.5s ease-out forwards;
  }
  @keyframes confetti {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--dx), 200px) rotate(720deg); }
  }
  .recording { background: #FF4757 !important; color: white !important; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  audio { width: 100%; max-width: 280px; height: 36px; }
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--primary-dark); color: white;
    padding: 12px 24px; border-radius: 24px; z-index: 9999;
    box-shadow: var(--shadow-lg);
    animation: slideDown 0.3s, fadeOut 0.3s 2.2s forwards;
  }
  @keyframes slideDown { from { transform: translate(-50%, -100%); } to { transform: translate(-50%, 0); } }
  @keyframes fadeOut { to { opacity: 0; transform: translate(-50%, -20px); } }
  .list-item {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: #FFFAF0; border-radius: 12px; margin-bottom: 8px;
  }
  .menu-toggle { display: none; }
  @media (max-width: 900px) {
    .home-grid { grid-template-columns: 1fr; }
    .quick-entries { grid-template-columns: repeat(3, 1fr); }
    .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .menu-toggle { display: flex; position: fixed; top: 12px; left: 12px; z-index: 200; width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }
    #sidebar { position: fixed; left: 0; top: 0; z-index: 150; box-shadow: 8px 0 24px rgba(0,0,0,0.15); }
    #sidebar.collapsed { transform: translateX(-100%); }
    #content { padding: 60px 16px 24px; }
    .greeting { padding: 20px 22px; }
    .greeting h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</div>
<div id="app">
  <nav id="sidebar" class="collapsed">
    <div class="logo">🌟<span class="sub">廖廖的空间</span></div>
    <div class="nav-item active" data-module="home"><span class="icon">🏠</span><span class="label">首页</span></div>
    <div class="nav-item" data-module="mood"><span class="icon">😊</span><span class="label">今日心情</span></div>
    <div class="nav-item" data-module="diary"><span class="icon">📔</span><span class="label">小廖日记</span></div>
    <div class="nav-item" data-module="wealth"><span class="icon">💰</span><span class="label">财富中心</span></div>
    <div class="nav-item" data-module="homework"><span class="icon">📚</span><span class="label">今天作业</span></div>
    <div class="nav-item" data-module="english"><span class="icon">🔤</span><span class="label">英语园地</span></div>
    <div class="nav-item" data-module="math"><span class="icon">🔢</span><span class="label">数学园地</span></div>
    <div class="nav-item" data-module="chinese"><span class="icon">📖</span><span class="label">语文园地</span></div>
    <div class="nav-item" data-module="sports"><span class="icon">⚽</span><span class="label">运动中心</span></div>
    <div class="nav-item" data-module="rewards"><span class="icon">🎁</span><span class="label">奖励中心</span></div>

let data;
function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      data = mergeDeep(JSON.parse(JSON.stringify(defaultData)), parsed);
    } else {
      data = JSON.parse(JSON.stringify(defaultData));
    }
    Object.values(data.pet.pets).forEach(p => { if (!p.lastUpdate) p.lastUpdate = Date.now(); });
  } catch (e) {
    data = JSON.parse(JSON.stringify(defaultData));
  }
}
function mergeDeep(target, source) {
  for (const key in source) {
    if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
      target[key] = mergeDeep(target[key] || {}, source[key]);
    } else if (source[key] !== undefined) {
      target[key] = source[key];
    }
  }
  return target;
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { toast('保存失败：' + e.message); }
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'className') e.className = attrs[k];
    else if (k === 'onClick') e.onclick = attrs[k];
    else if (k === 'onInput') e.oninput = attrs[k];
    else if (k === 'onChange') e.onchange = attrs[k];
    else if (k === 'onMouseDown') e.onmousedown = attrs[k];
    else if (k === 'onDragStart') e.ondragstart = attrs[k];
    else if (k === 'onDragOver') e.ondragover = attrs[k];
    else if (k === 'onDrop') e.ondrop = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
    else if (k.startsWith('data-')) e.setAttribute(k, attrs[k]);
    else e[k] = attrs[k];
  }
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getGreeting() {
  const h = new Date().getHours();
  if (h < 11) return '早上好';
  if (h < 14) return '中午好';
  if (h < 18) return '下午好';
  return '晚上好';
}
function getWeekday() {
  return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][new Date().getDay()];
}
function getWeather() {
  const w = ['☀️ 晴朗', '⛅ 多云', '🌤️ 晴转多云', '🌧️ 小雨', '☁️ 阴', '🌈 雨后彩虹'];
  return w[Math.floor(Math.random() * w.length)];
}
function formatDate(d) {
  if (typeof d === 'string') d = new Date(d);
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function formatTime(ts) {
  const d = new Date(ts);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function uid() { return 'id' + Date.now() + Math.random().toString(36).substr(2,5); }
function showModal(content, wide) {
  const c = document.getElementById('modal-container');
  c.innerHTML = '';
  const overlay = el('div', { className: 'modal-overlay', onClick: (ev) => { if (ev.target === overlay) closeModal(); } },
    el('div', { className: 'modal-box' + (wide ? ' wide' : '') }, content)
  );
  c.appendChild(overlay);
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
function toast(msg) {
  const c = document.getElementById('toast-container');
  const t = el('div', { className: 'toast' }, msg);
  c.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
function confirm(msg, onYes, onNo) {
  showModal(el('div', null,
    el('h3', null, '🤔 确认'),
    el('p', { style: { color: 'var(--text-light)', marginBottom: '16px' } }, msg),
    el('div', { className: 'modal-actions' },
      el('button', { className: 'btn btn-ghost', onClick: () => { closeModal(); onNo && onNo(); } }, '取消'),
      el('button', { className: 'btn', onClick: () => { closeModal(); onYes && onYes(); } }, '确定')
    )
  ));
}
function confetti() {
  const emojis = ['🎉', '✨', '🌟', '💖', '🎊', '⭐', '💕'];
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const p = el('div', { className: 'confetti-piece', style: {
        left: Math.random() * 100 + 'vw', top: '40vh',
        '--dx': (Math.random() - 0.5) * 200 + 'px'
      } }, emojis[Math.floor(Math.random() * emojis.length)]);
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }, i * 50);
  }
}

function getPointsBalance() { const w = data.wallets.find(x => x.id === 'points'); return w ? w.balance : 0; }
function addPoints(amount, reason) {
  const w = data.wallets.find(x => x.id === 'points');
  if (!w) return;
  w.balance += amount;
  data.transactions.unshift({ id: uid(), wallet: w.name, type: '存入', amount, note: reason || '', ts: Date.now() });
  saveData();
}
function spendPoints(amount, reason) {
  const w = data.wallets.find(x => x.id === 'points');
  if (!w || w.balance < amount) { toast('积分不足！'); return false; }
  w.balance -= amount;
  data.transactions.unshift({ id: uid(), wallet: w.name, type: '取出', amount, note: reason || '', ts: Date.now() });
  saveData();
  return true;
}

  updateNav();
  renderModule();
  if (window.innerWidth < 700) document.getElementById('sidebar').classList.add('collapsed');
}
function updateNav() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.module === currentModule);
  });
}

function renderModule() {

function switchCalendarView(type) {
  const cont = document.getElementById('mood-calendar-container');
  if (!cont) return;
  cont.innerHTML = '';
  const days = type === 'week' ? 7 : 30;
  const calendar = el('div', { className: 'mood-calendar' });
  const todayD = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(todayD);
    d.setDate(d.getDate() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const hasMood = data.moods[key];
    const isToday = key === today();
    const day = el('div', {
      className: 'mood-day' + (hasMood ? ' recorded' : '') + (isToday ? ' today' : ''),
      onClick: () => {
        if (hasMood) {
          showModal(el('div', null,
            el('h3', null, key + ' 的心情'),
            hasMood.emoji ? el('div', { style: { fontSize: '60px', textAlign: 'center', margin: '12px 0' } }, hasMood.emoji) : null,
            hasMood.text ? el('p', null, hasMood.text) : null,
            hasMood.image ? el('img', { src: hasMood.image, style: { maxWidth: '100%', borderRadius: '12px' } }) : null,
            hasMood.audio ? el('audio', { src: hasMood.audio, controls: true, style: { width: '100%', marginTop: '8px' } }) : null
          ));
        }
      }
    }, hasMood ? hasMood.emoji : (d.getMonth()+1) + '/' + d.getDate());
    calendar.appendChild(day);
  }
  cont.appendChild(calendar);
  const weekTab = document.getElementById('tab-week');
  const monthTab = document.getElementById('tab-month');
  if (weekTab && monthTab) {
    weekTab.classList.toggle('active', type === 'week');
    monthTab.classList.toggle('active', type === 'month');
  }
}

let recognition;
function startVoiceRecognition(input) {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    toast('当前浏览器不支持语音输入，请用 Chrome 或 Edge');
    return;
  }
  try {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = () => toast('请开始说话...');
    recognition.onresult = (e) => {
      const text = e.results[0][0].transcript;
      input.value = (input.value || '') + text;
      toast('已识别：' + text);
    };
    recognition.onerror = (e) => toast('识别失败：' + e.error);
    recognition.onend = () => {};
    recognition.start();
  } catch (e) { toast('语音启动失败：' + e.message); }
}

let mediaRecorder, audioChunks = [];
async function toggleAudioRecord(btn, audioDiv) {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    btn.classList.remove('recording');
    btn.textContent = '🔴 录音';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => {
        audioDiv.innerHTML = '';
        audioDiv.appendChild(el('audio', { src: reader.result, controls: true }));
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    btn.classList.add('recording');
    btn.textContent = '⏹️ 停止';
    toast('开始录音...');
  } catch (e) { toast('无法录音：' + e.message); }
}

function openDrawing() {
  const canvas = el('canvas', { className: 'drawing-canvas', width: 600, height: 400 });
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white'; ctx.fillRect(0, 0, 600, 400);
  let drawing = false, lastX = 0, lastY = 0, currentColor = '#FF4757', currentSize = 4;
  const tools = el('div', { className: 'drawing-tools', style: { flexWrap: 'wrap' } });
  ['#FF4757','#FFA500','#FFD700','#2D5F3F','#4A90E2','#9B59B6','#000000'].forEach(c =>
    tools.appendChild(el('div', { className: 'color-swatch', style: { background: c }, onClick: () => currentColor = c }))
  );
  [2, 4, 8, 16].forEach(s =>
    tools.appendChild(el('button', { className: 'btn btn-sm', onClick: () => currentSize = s }, '·'.repeat(s)))
  );
  tools.appendChild(el('button', { className: 'btn btn-sm', onClick: () => { currentColor = 'white'; currentSize = 16; } }, '🧽 橡皮'));

  const start = (e) => {
    drawing = true;
    const r = canvas.getBoundingClientRect();
    const tx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const ty = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    lastX = tx; lastY = ty;
  };
  const move = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    ctx.strokeStyle = currentColor; ctx.lineWidth = currentSize; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
    lastX = x; lastY = y;
  };
  const end = () => drawing = false;
  canvas.onmousedown = canvas.ontouchstart = start;
  canvas.onmousemove = canvas.ontouchmove = move;
  canvas.onmouseup = canvas.onmouseleave = canvas.ontouchend = end;

  showModal(el('div', null,
    el('h3', null, '🎨 画画板'),
    tools,
    canvas,
    el('div', { className: 'modal-actions' },
      el('button', { className: 'btn btn-ghost', onClick: () => { ctx.fillStyle = 'white'; ctx.fillRect(0, 0, 600, 400); } }, '清空'),
      el('button', { className: 'btn', onClick: () => {
        const dataURL = canvas.toDataURL('image/png');
        const editor = document.querySelector('.diary-editor');
        if (editor) editor.innerHTML += '<img src="' + dataURL + '" style="max-width:100%;border-radius:12px;margin:8px 0;">';
        closeModal();
      } }, '插入日记')
    )
  ), true);
}

function openTracingCanvas(letter) {
  const canvas = el('canvas', { width: 300, height: 300, className: 'drawing-canvas' });
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFAF0'; ctx.fillRect(0, 0, 300, 300);
  ctx.font = '200px cursive';
  ctx.fillStyle = 'rgba(255, 182, 160, 0.3)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, 150, 150);
  let drawing = false, lastX = 0, lastY = 0;
  const start = (e) => {
    drawing = true; const r = canvas.getBoundingClientRect();
    lastX = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    lastY = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  };
  const move = (e) => {
    if (!drawing) return; e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    ctx.strokeStyle = '#FF4757'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
    lastX = x; lastY = y;
  };
  const end = () => drawing = false;
  canvas.onmousedown = canvas.ontouchstart = start;
  canvas.onmousemove = canvas.ontouchmove = move;
  canvas.onmouseup = canvas.onmouseleave = canvas.ontouchend = end;
  return canvas;
}

function startMathQuiz(type) {
  const questions = [];
  if (type === '计算达标') {
    for (let i = 0; i < 5; i++) {
      const a = Math.floor(Math.random() * 50) + 1;
      const b = Math.floor(Math.random() * 50) + 1;
      const op = Math.random() > 0.5 ? '+' : '-';
      questions.push({ q: a + ' ' + op + ' ' + b + ' = ?', a: op === '+' ? a + b : a - b });
    }
  } else if (type === '乘除法应用') {
    for (let i = 0; i < 5; i++) {
      const a = Math.floor(Math.random() * 9) + 1;
      const b = Math.floor(Math.random() * 9) + 1;
      questions.push({ q: a + ' × ' + b + ' = ?', a: a * b });
    }
  } else if (type === '时间认知') {
    for (let i = 0; i < 5; i++) {
      const h = Math.floor(Math.random() * 11) + 1;
      const m = Math.floor(Math.random() * 4) * 15;
      const ans = h + 1 > 12 ? h + 1 - 12 : h + 1;
      questions.push({ q: '现在 ' + h + ':' + String(m).padStart(2,'0') + '，再过 1 小时是几点？', a: ans });
    }
  } else if (type === '人民币') {
    for (let i = 0; i < 5; i++) {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 5) + 1;
      questions.push({ q: a + ' 元 + ' + b + ' 元 = ? 元', a: a + b });
    }
  } else if (type === '度量衡') {
    const qs = [{q:'1 米 = ? 厘米', a:100}, {q:'1 千克 = ? 克', a:1000}, {q:'1 小时 = ? 分钟', a:60}, {q:'半米 = ? 厘米', a:50}, {q:'1 公里 = ? 米', a:1000}];
    questions.push(...qs.sort(() => Math.random() - 0.5).slice(0, 5));
  } else if (type === '应用题') {
    const qs = [
      {q:'小明有 5 个苹果，吃了 2 个，还剩几个？', a:3},
      {q:'妈妈买了 10 个鸡蛋，用了 4 个，还剩几个？', a:6},
      {q:'小红有 8 颗糖，分给小明 3 颗，还剩几颗？', a:5},
      {q:'一盒铅笔 12 支，用了 5 支，还剩几支？', a:7},
      {q:'书架上有 15 本书，借走 9 本，还剩几本？', a:6}
    ];
    questions.push(...qs.sort(() => Math.random() - 0.5).slice(0, 5));
  } else {
    for (let i = 0; i < 5; i++) {
      const a = Math.floor(Math.random() * 30) + 1;
      const b = Math.floor(Math.random() * 30) + 1;
      questions.push({ q: a + ' + ' + b + ' = ?', a: a + b });
    }
  }

  let idx = 0, correct = 0;
  const next = () => {
    if (idx >= 5) {
      const pts = Math.round((correct / 5) * data.math.points);
      if (pts > 0) addPoints(pts, '数学' + type);
      data.math.studyTime += 300;
      data.timeTracking.math = (data.timeTracking.math || 0) + 300;
      saveData();
      showModal(el('div', { style: { textAlign: 'center' } },
        el('div', { style: { fontSize: '80px' } }, correct >= 4 ? '🏆' : correct >= 2 ? '👍' : '💪'),
        el('h3', null, '完成！'),
        el('p', null, '答对 ' + correct + '/5 题'),
        el('p', { style: { color: 'var(--primary-dark)' } }, '+ ' + pts + ' 积分')
      ));
      return;
    }
    const q = questions[idx];
    const choices = [q.a];
    while (choices.length < 4) {
      const wrong = q.a + Math.floor(Math.random() * 20) - 10;
      if (wrong !== q.a && wrong >= 0 && !choices.includes(wrong)) choices.push(wrong);
    }
    choices.sort(() => Math.random() - 0.5);
    showModal(el('div', { style: { textAlign: 'center' } },
      el('h3', null, type + ' (' + (idx+1) + '/5)'),
      el('div', { style: { fontSize: '32px', margin: '20px 0', fontWeight: 'bold' } }, q.q),
      el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '10px', maxWidth: '300px', margin: '0 auto' } },
        choices.map(c => el('button', { className: 'btn', onClick: () => {
          if (c === q.a) { toast('✓ 正确！'); correct++; }
          else { toast('✗ 答案是 ' + q.a); }
          idx++; next();
        } }, c))
      )
    ));
  };
  next();
}

function getDailyRemaining(type, subType) {
  const todayKey = today();
  const count = (type === 'lottery' ? data.lotteryDailyCount : data.mysteryDailyCount)[todayKey] || 0;
  const max = type === 'lottery' ? data.lottery[subType || 'grid'].daily : data.mystery.daily;
  return Math.max(0, max - count);
}

function renderLotteryGrid(w) {
  const grid = el('div', { className: 'lottery-grid' });
  const prizes = data.lottery.grid.prizes;
  let spinning = false;
  const cells = prizes.map((p, i) => {
    const cell = el('div', { className: 'lottery-cell' }, p === 0 ? '谢谢' : '+' + p);
    cell.dataset.idx = i;
    grid.appendChild(cell);
    return cell;
  });
  w.appendChild(grid);
  w.appendChild(el('div', { style: { textAlign: 'center' } },
    el('button', { className: 'btn btn-gold', onClick: () => {
      if (spinning) return;
      if (getPointsBalance() < data.lottery.grid.cost) { toast('积分不足！'); return; }
      if (getDailyRemaining('lottery', 'grid') <= 0) { toast('今日次数已用完'); return; }
      spendPoints(data.lottery.grid.cost, '九宫格抽奖');
      data.lotteryDailyCount[today()] = (data.lotteryDailyCount[today()] || 0) + 1;
      saveData();
      spinning = true;
      let count = 0, current = 0, total = 20 + Math.floor(Math.random() * 10);
      const timer = setInterval(() => {
        cells.forEach(c => c.classList.remove('flash'));
        cells[current].classList.add('flash');
        current = (current + 1) % 9;
        count++;
        if (count >= total) {
          clearInterval(timer);
          spinning = false;
          cells.forEach(c => c.classList.remove('flash'));
          const winIdx = (current - 1 + 9) % 9;
          cells[winIdx].classList.add('winner');
          const prize = prizes[winIdx];
          if (prize > 0) {
            addPoints(prize, '九宫格中奖');
            toast('🎉 恭喜中奖 +' + prize + ' 积分！');
          } else {
            toast('谢谢参与，再来一次吧~');
          }
          confetti();
          setTimeout(() => { cells.forEach(c => c.classList.remove('winner')); renderLottery(w); }, 1500);
        }
      }, 100);
    } }, '🎰 开始抽奖 (-' + data.lottery.grid.cost + ' 积分)')
  ));
}

function renderLotteryWheel(w) {
  const canvas = el('canvas', { className: 'wheel-canvas', width: 320, height: 320 });
  const ctx = canvas.getContext('2d');
  const prizes = data.lottery.wheel.prizes;
  const colors = ['#FF6B6B', '#FFA500', '#FFD700', '#87CEEB', '#B5E2C0', '#D4A5E0', '#FFB6A0'];
  const draw = () => {
    const cx = 160, cy = 160, r = 150;
    prizes.forEach((p, i) => {
      const start = (i / prizes.length) * Math.PI * 2;
      const end = ((i + 1) / prizes.length) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + (end - start) / 2);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(p, r - 10, 5);
      ctx.restore();
    });
  };
  draw();
  let spinning = false;
  const wrap = el('div', { className: 'wheel-container' },
    el('div', { className: 'wheel-pointer' }, '▼'),
    canvas,
    el('button', { className: 'wheel-btn', onClick: () => {
      if (spinning) return;
      if (getPointsBalance() < data.lottery.wheel.cost) { toast('积分不足！'); return; }
      if (getDailyRemaining('lottery', 'wheel') <= 0) { toast('今日次数已用完'); return; }
      spinning = true;
      spendPoints(data.lottery.wheel.cost, '大转盘抽奖');
      data.lotteryDailyCount[today()] = (data.lotteryDailyCount[today()] || 0) + 1;
      saveData();
      const target = 360 * 5 + Math.random() * 360;
      canvas.style.transform = 'rotate(' + target + 'deg)';
      setTimeout(() => {
        const idx = Math.floor(((360 - (target % 360)) / (360 / prizes.length) + prizes.length) % prizes.length);
        const prize = prizes[idx];
        const ptsMatch = prize.match(/\d+/);
        const pts = ptsMatch ? parseInt(ptsMatch[0]) : 0;
        if (pts > 0) addPoints(pts, '大转盘中奖');
        showModal(el('div', { style: { textAlign: 'center' } },
          el('div', { style: { fontSize: '80px' } }, '🎉'),
          el('h3', null, '恭喜！'),
          el('p', null, '获得：' + prize)
        ));
        confetti();
        spinning = false;
      }, 4200);
    } }, '抽奖')
  );
  w.appendChild(wrap);
}

function completePassengerTask(p) {
  const taskType = ['math', 'english', 'chinese'][Math.floor(Math.random() * 3)];
  if (taskType === 'math') {
    const a = Math.floor(Math.random() * 50) + 1;
    const b = Math.floor(Math.random() * 50) + 1;
    const ans = prompt('完成任务：' + a + ' + ' + b + ' = ?');
    if (ans && parseInt(ans) === a + b) {
      p.completed = true;
      addPoints(p.fare, '完成乘客任务');
      saveData();
      toast('✓ 任务完成！+ ' + p.fare + ' 积分');
      renderModule();
    } else {
      toast('答案错误，再想想~');
    }
  } else if (taskType === 'english') {
    const words = [['apple','苹果'],['cat','猫'],['dog','狗'],['book','书'],['sun','太阳']];
    const [w, c] = words[Math.floor(Math.random() * words.length)];
    const ans = prompt('完成任务：' + w + ' 的中文是什么？');
    if (ans && ans.trim() === c) {
      p.completed = true;
      addPoints(p.fare, '完成乘客任务');
      saveData();
      toast('✓ 任务完成！+ ' + p.fare + ' 积分');
      renderModule();
    } else {
      toast('答案错误，正确答案是 ' + c);
    }
  } else {
    const ans = prompt('完成任务：请拼出"太阳"的拼音？');
    if (ans && ans.replace(/\s/g,'').toLowerCase() === 'taiyang') {
      p.completed = true;
      addPoints(p.fare, '完成乘客任务');
      saveData();
      toast('✓ 任务完成！+ ' + p.fare + ' 积分');
      renderModule();
    } else {
      toast('答案错误，正确答案是 tai yang');
    }
  }
}

function updatePetStatus() {
  const now = Date.now();
  Object.values(data.pet.pets).forEach(p => {
    if (!p.lastUpdate) { p.lastUpdate = now; return; }
    const hours = (now - p.lastUpdate) / 3600000;
    p.hunger = Math.max(0, p.hunger - hours * 3);
    p.mood = Math.max(0, p.mood - hours * 2);
    if (p.hunger < 30) p.health = Math.max(0, p.health - hours * 2);
    p.lastUpdate = now;
  });
  saveData();
}

      data.settings.modalEmoji = emoji.value;
      data.settings.popupStyle = style.value;
      data.moodPoints = parseInt(moodPointsInput.value) || 5;
      saveData();
      toast('设置已保存');
    } }, '保存设置')
  ));
}

function renderPointsSettings(w) {
  const fields = [
    { key: 'moodPoints', name: '记录心情', sub: 'mood' },
    { key: 'diaryPoints', name: '写日记', sub: 'diary' },
    { key: 'homeworkDonePoints', name: '作业全完成红包', sub: 'homework' },
    { key: 'english.points', name: '英语学习', sub: 'english' },
    { key: 'math.points', name: '数学练习', sub: 'math' },
    { key: 'chinese.points', name: '语文学习', sub: 'chinese' },
    { key: 'sports.points', name: '运动完成', sub: 'sports' }
  ];
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '💰 积分设置'));
  fields.forEach(f => {
    const current = f.key.includes('.') ? data[f.key.split('.')[0]][f.key.split('.')[1]] : data[f.key];
    const inp = el('input', { type: 'number', value: current, min: '0', style: { width: '120px' } });
    card.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 0', borderBottom: '1px dashed var(--border)' } },
      el('div', null, f.name),
      el('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
        el('span', null, '+'),
        inp,
        el('span', null, '积分')
      )
    ));
    inp.dataset.key = f.key;
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '16px' }, onClick: () => {
    card.querySelectorAll('input[data-key]').forEach(inp => {
      const key = inp.dataset.key;
      const val = parseInt(inp.value) || 0;
      if (key.includes('.')) {
        const [k1, k2] = key.split('.');
        data[k1][k2] = val;
      } else {
        data[key] = val;
      }
    });
    saveData();
    toast('积分设置已保存');
  } }, '保存设置'));
  w.appendChild(card);
}

function renderRewardsSettings(w) {
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '🎁 奖励礼品管理'));
  data.rewards.forEach((r, i) => {
    const nameInp = el('input', { type: 'text', value: r.name, style: { width: '30%', marginRight: '8px' } });
    const ptsInp = el('input', { type: 'number', value: r.points, min: '1', style: { width: '100px', marginRight: '8px' } });
    const imgInp = el('input', { type: 'text', value: r.image, placeholder: 'emoji', style: { width: '60px' } });
    nameInp.dataset.idx = i; nameInp.dataset.field = 'name';
    ptsInp.dataset.idx = i; ptsInp.dataset.field = 'points';
    imgInp.dataset.idx = i; imgInp.dataset.field = 'image';
    card.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', gap: '4px', marginBottom: '8px' } },
      imgInp, nameInp, ptsInp, el('span', null, '积分'),
      el('button', { className: 'btn btn-ghost btn-sm', onClick: () => { data.rewards.splice(i, 1); saveData(); renderModule(); } }, '🗑️')
    ));
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '12px' }, onClick: () => {
    data.rewards.push({ id: uid(), name: '新礼品', points: 100, image: '🎁' });
    saveData(); renderModule();
  } }, '➕ 添加礼品'));
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '8px' }, onClick: () => {
    card.querySelectorAll('input').forEach(inp => {
      const i = parseInt(inp.dataset.idx);
      const f = inp.dataset.field;
      if (!isNaN(i) && f) {
        data.rewards[i][f] = f === 'points' ? (parseInt(inp.value) || 0) : inp.value;
      }
    });
    saveData();
    toast('已保存');
  } }, '💾 保存'));
  w.appendChild(card);
}

function renderLotterySettings(w) {
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '🎰 抽奖设置'));
  ['grid','wheel','egg'].forEach(t => {
    const label = {grid:'九宫格', wheel:'大转盘', egg:'砸金蛋'}[t];
    const enabled = data.lottery.enabledTypes.includes(t);
    const costInp = el('input', { type: 'number', value: data.lottery[t].cost, min: '0', style: { width: '100px' } });
    const dailyInp = el('input', { type: 'number', value: data.lottery[t].daily, min: '0', style: { width: '100px' } });
    const chk = el('input', { type: 'checkbox', checked: enabled });
    chk.onchange = () => {
      if (chk.checked && !data.lottery.enabledTypes.includes(t)) data.lottery.enabledTypes.push(t);
      else if (!chk.checked) data.lottery.enabledTypes = data.lottery.enabledTypes.filter(x => x !== t);
      saveData();
    };
    costInp.onchange = () => { data.lottery[t].cost = parseInt(costInp.value) || 0; saveData(); };
    dailyInp.onchange = () => { data.lottery[t].daily = parseInt(dailyInp.value) || 0; saveData(); };
    card.appendChild(el('div', { style: { padding: '8px 0', borderBottom: '1px dashed var(--border)' } },
      el('label', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
        chk,
        el('span', { style: { fontWeight: 'bold' } }, label)
      ),
      el('div', { style: { marginTop: '6px', marginLeft: '24px', fontSize: '13px', color: 'var(--text-light)' } },
        '消耗：', costInp, ' 积分/次    每日：', dailyInp, ' 次'
      )
    ));
  });
  w.appendChild(card);
  toast && toast('设置自动保存');
}

function renderMysterySettings(w) {
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '📦 盲盒设置'));
  const costInp = el('input', { type: 'number', value: data.mystery.cost, min: '0', style: { width: '100%' } });
  costInp.onchange = () => { data.mystery.cost = parseInt(costInp.value) || 0; saveData(); };
  const dailyInp = el('input', { type: 'number', value: data.mystery.daily, min: '0', style: { width: '100%' } });
  dailyInp.onchange = () => { data.mystery.daily = parseInt(dailyInp.value) || 0; saveData(); };
  card.appendChild(el('label', null, '消耗积分'), costInp);
  card.appendChild(el('label', { style: { marginTop: '12px' } }, '每日次数'), dailyInp);
  card.appendChild(el('label', { style: { marginTop: '12px' } }, '奖品池（用|分隔，含"积分"或"金币"字样会被识别为积分）'));
  const prizesInp = el('textarea', { value: data.mystery.prizes.join('|'), style: { width: '100%', minHeight: '60px' } });
  prizesInp.onchange = () => { data.mystery.prizes = prizesInp.value.split('|').map(x => x.trim()).filter(x => x); saveData(); };
  card.appendChild(prizesInp);
  w.appendChild(card);
}

function renderStationSettings(w) {
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '🚗 车辆管理'));
  data.station.vehicles.forEach((v, i) => {
    const nameInp = el('input', { type: 'text', value: v.name, style: { width: '30%', marginRight: '8px' } });
    const priceInp = el('input', { type: 'number', value: v.price, style: { width: '100px', marginRight: '8px' } });
    const imgInp = el('input', { type: 'text', value: v.image, style: { width: '60px' } });
    nameInp.onchange = () => { data.station.vehicles[i].name = nameInp.value; saveData(); };
    priceInp.onchange = () => { data.station.vehicles[i].price = parseInt(priceInp.value) || 0; saveData(); };
    imgInp.onchange = () => { data.station.vehicles[i].image = imgInp.value; saveData(); };
    card.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '8px' } },
      imgInp, nameInp, priceInp, '积分',
      el('button', { className: 'btn btn-ghost btn-sm', onClick: () => { data.station.vehicles.splice(i, 1); saveData(); renderModule(); } }, '🗑️')
    ));
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '12px' }, onClick: () => {
    data.station.vehicles.push({ id: uid(), name: '新车', price: 100, image: '🚗' });
    saveData(); renderModule();
  } }, '➕ 添加车辆'));
  w.appendChild(card);
}

function renderPetSettings(w) {
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '🐾 宠物管理'));
  Object.entries(data.pet.pets).forEach(([id, p], i) => {
    const nameInp = el('input', { type: 'text', value: p.name, style: { width: '30%', marginRight: '8px' } });
    const priceInp = el('input', { type: 'number', value: p.price, style: { width: '100px', marginRight: '8px' } });
    const iconInp = el('input', { type: 'text', value: p.icon, style: { width: '60px' } });
    nameInp.onchange = () => { data.pet.pets[id].name = nameInp.value; saveData(); };
    priceInp.onchange = () => { data.pet.pets[id].price = parseInt(priceInp.value) || 0; saveData(); };
    iconInp.onchange = () => { data.pet.pets[id].icon = iconInp.value; saveData(); };
    card.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '8px' } },
      iconInp, nameInp, priceInp, '积分',
      el('button', { className: 'btn btn-ghost btn-sm', onClick: () => { delete data.pet.pets[id]; saveData(); renderModule(); } }, '🗑️')
    ));
  });
  w.appendChild(card);
}

function renderWalletsSettings(w) {
  const card = el('div', { className: 'card' }, el('div', { className: 'card-title' }, '💎 钱包管理'));
  data.wallets.forEach((w, i) => {
    const nameInp = el('input', { type: 'text', value: w.name, style: { width: '50%', marginRight: '8px' } });
    const balInp = el('input', { type: 'number', value: w.balance, style: { width: '100px' } });
    nameInp.onchange = () => { data.wallets[i].name = nameInp.value; saveData(); };
    balInp.onchange = () => { data.wallets[i].balance = parseInt(balInp.value) || 0; saveData(); };
    card.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', marginBottom: '8px' } },
      nameInp, balInp,
      w.id !== 'points' ? el('button', { className: 'btn btn-ghost btn-sm', onClick: () => { data.wallets.splice(i, 1); saveData(); renderModule(); } }, '🗑️') : el('span', { style: { fontSize: '12px', color: 'var(--text-light)' } }, '系统钱包')
    ));
  });
  card.appendChild(el('button', { className: 'btn btn-block', style: { marginTop: '12px' }, onClick: () => {
    const name = prompt('钱包名称：');
    if (name) { data.wallets.push({ id: uid(), name, balance: 0, color: 'purple' }); saveData(); renderModule(); }
  } }, '➕ 添加钱包'));
  w.appendChild(card);
}

// ============ Init ============
loadData();
navigate('home');
</script>
