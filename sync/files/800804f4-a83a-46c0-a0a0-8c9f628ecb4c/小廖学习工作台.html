<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 小廖的学习工作台</title>
<style>
  :root{
    --purple:#6C5CE7; --purple-d:#5849c4; --yellow:#FDCB6E; --teal:#00B894;
    --bg:#F3F0FF; --card:#FFFFFF; --ink:#3d3d52; --soft:#8a86a8;
    --red:#ff6b6b; --green:#00B894; --shadow:0 6px 18px rgba(108,92,231,.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:18px;}
  body{padding-top:64px;padding-bottom:74px;}
  button{font-family:inherit;cursor:pointer;border:none;outline:none;}
  .btn{background:var(--purple);color:#fff;border-radius:16px;padding:12px 18px;font-size:18px;
    font-weight:700;box-shadow:var(--shadow);transition:transform .12s,filter .12s;}
  .btn:hover{filter:brightness(1.07);} .btn:active{transform:scale(.94);}
  .btn.y{background:var(--yellow);color:#7a5b00;} .btn.t{background:var(--teal);color:#fff;}
  .btn.ghost{background:#efeaff;color:var(--purple);box-shadow:none;}
  .btn.sm{font-size:15px;padding:8px 12px;border-radius:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .center{text-align:center;}
  /* top bar */
  #topbar{position:fixed;top:0;left:0;right:0;height:64px;background:linear-gradient(90deg,var(--purple),#8a7bf0);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50;color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.15);}
  #topbar .logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;}
  #topbar .scores{display:flex;gap:10px;font-size:15px;font-weight:700;}
  #topbar .scores span{background:rgba(255,255,255,.18);padding:5px 9px;border-radius:12px;}
  #modeBtn{background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;}
  /* bottom nav */
  #bottomnav{position:fixed;bottom:0;left:0;right:0;height:74px;background:#fff;display:flex;
    justify-content:space-around;align-items:center;z-index:50;box-shadow:0 -3px 12px rgba(0,0,0,.08);}
  #bottomnav a{flex:1;text-align:center;color:var(--soft);text-decoration:none;font-size:12px;font-weight:700;padding:6px 0;}
  #bottomnav a .ic{font-size:24px;display:block;margin-bottom:2px;}
  #bottomnav a.active{color:var(--purple);}
  /* views */
  .view{display:none;max-width:760px;margin:0 auto;padding:6px 0 20px;animation:fade .35s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  h2.t{color:var(--purple);margin:14px 14px 4px;font-size:22px;}
  .sub{color:var(--soft);font-size:14px;margin:0 14px 6px;}
  /* subject cards */
  .subj{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:22px;
    padding:18px 8px;color:#fff;font-weight:800;font-size:18px;box-shadow:var(--shadow);text-align:center;}
  .subj .ic{font-size:40px;margin-bottom:6px;}
  .subj.cn{background:linear-gradient(135deg,#6C5CE7,#a78bfa);}
  .subj.mt{background:linear-gradient(135deg,#00B894,#34e0c4);}
  .subj.en{background:linear-gradient(135deg,#FDCB6E,#ffb14e);color:#7a5b00;}
  .subj.sp{background:linear-gradient(135deg,#ff7675,#fd9644);}
  .quick{display:flex;gap:10px;margin:14px;}
  .quick .q{flex:1;background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow);font-weight:700;position:relative;}
  .quick .q .ic{font-size:30px;display:block;}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;min-width:22px;height:22px;line-height:22px;font-size:13px;font-weight:800;padding:0 4px;}
  /* module list */
  .modbtn{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px 16px;margin:10px 14px;box-shadow:var(--shadow);text-align:left;width:calc(100% - 28px);font-weight:700;font-size:17px;}
  .modbtn .ic{font-size:26px;} .modbtn small{display:block;color:var(--soft);font-weight:500;font-size:13px;}
  /* quiz */
  .qtext{font-size:20px;font-weight:800;margin:6px 0 12px;line-height:1.5;}
  .opt{display:block;width:100%;text-align:left;background:#f1eeff;border:none;border-radius:14px;padding:13px 16px;margin:8px 0;font-size:17px;font-weight:600;color:var(--ink);}
  .opt:hover{background:#e6e0ff;} .opt.correct{background:#d6f7ec;color:#067a5e;} .opt.wrong{background:#ffe0e0;color:#b3322c;}
  .opt:disabled{cursor:default;}
  .feedback{margin:10px 0;font-weight:800;font-size:17px;min-height:24px;}
  .feedback.ok{color:var(--teal);} .feedback.no{color:var(--red);}
  input.ans{width:100%;padding:12px 14px;font-size:20px;border-radius:14px;border:2px solid #e0dbff;margin:8px 0;font-weight:700;}
  input.ans:focus{border-color:var(--purple);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .pill{background:#efeaff;color:var(--purple);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:700;}
  .timer{font-weight:800;color:var(--purple);}
  /* moles */
  .moles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0;}
  .hole{background:#cdbff5;border-radius:0 0 60px 60px;height:90px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;}
  .mole{font-size:30px;font-weight:800;background:var(--yellow);border-radius:16px;padding:10px 8px;margin-bottom:6px;color:#7a5b00;cursor:pointer;transition:transform .1s;user-select:none;}
  .mole:active{transform:scale(.92);}
  /* match grid */
  .mtile{background:#fff;border-radius:16px;padding:16px 8px;text-align:center;font-size:22px;font-weight:800;box-shadow:var(--shadow);user-select:none;}
  .mtile.sel{outline:3px solid var(--purple);} .mtile.done{visibility:hidden;}
  /* poem */
  .poem{font-size:19px;line-height:1.9;text-align:center;font-weight:600;}
  .puzzle .ptile{display:inline-block;background:#efeaff;border-radius:12px;padding:8px 12px;margin:5px;font-weight:700;cursor:grab;}
  /* table */
  table.mt{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px;}
  table.mt td,table.mt th{border:1px solid #e6e2ff;padding:8px;text-align:center;}
  /* pet canvas */
  #petCanvas{width:100%;max-width:320px;height:240px;background:#eafaf4;border-radius:20px;display:block;margin:10px auto;}
  .bar{height:18px;background:#eee;border-radius:10px;overflow:hidden;margin:4px 0 10px;}
  .bar>i{display:block;height:100%;border-radius:10px;}
  /* wheel */
  #wheel{width:260px;height:260px;border-radius:50%;margin:10px auto;display:block;transition:transform 3.5s cubic-bezier(.17,.67,.3,1);}
  /* generic */
  .listrow{background:#fff;border-radius:14px;padding:12px 14px;margin:8px 14px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .muted{color:var(--soft);font-size:13px;}
  .tag{font-size:12px;background:#efeaff;color:var(--purple);border-radius:8px;padding:2px 8px;font-weight:700;}
  .scrollx{overflow-x:auto;white-space:nowrap;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3d3d52;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:300;}
  .modal.show{display:flex;}
  .modal .box{background:#fff;border-radius:22px;padding:22px;max-width:90%;width:360px;text-align:center;}
  .clr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;}
  .emo{font-size:34px;cursor:pointer;padding:6px;border-radius:12px;}
  .emo.sel{background:#efeaff;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal div{background:#fff;border-radius:10px;padding:8px 2px;text-align:center;font-size:18px;min-height:46px;}
  .cal .hd{background:transparent;font-size:12px;color:var(--soft);font-weight:800;}
  .back{margin:10px 14px;display:inline-flex;align-items:center;gap:6px;color:var(--purple);font-weight:700;}
  .big{font-size:40px;text-align:center;margin:10px 0;}
  .coinbig{font-size:30px;text-align:center;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">🌟 小廖的学习工作台</div>

<div id="app"></div>

/* ============================ 状态 ============================ */
const KEY="wb_";
const def={stars:0,points:0,coins:0,mode:"weekday",checkin:{},homework:[],mood:{},pet:null,recIn:[],recOut:[],vocab:[["window","窗户"],["door","门"],["school","学校"]],rules:{}};
function load(){try{let s=JSON.parse(localStorage.getItem(KEY+"state"));return Object.assign({},def,s||{});}catch(e){return JSON.parse(JSON.stringify(def));}}
function save(){localStorage.setItem(KEY+"state",JSON.stringify(S));}
let S=load();

function nowStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+" "+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes();}
function weekKey(){const d=new Date();const onejan=new Date(d.getFullYear(),0,1);const wk=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);return d.getFullYear()+"-W"+wk;}
function todayIdx(){const d=new Date().getDay();return d===0?6:d-1;}

function addStars(n,src){S.stars+=n; if(n>0)S.recIn.push({t:"⭐",n,src:src||"",time:nowStr()}); refreshTop(); save();}
function addPoints(n,src){S.points+=n; if(n>0)S.recIn.push({t:"💰",n,src:src||"",time:nowStr()}); else if(n<0){S.points=Math.max(0,S.points);S.recOut.push({t:"💰",n:-n,src:src||"",time:nowStr()});} refreshTop(); save();}
function addCoins(n,src){S.coins+=n; if(n>0)S.recIn.push({t:"🪙",n,src:src||"",time:nowStr()}); else if(n<0){S.coins=Math.max(0,S.coins);S.recOut.push({t:"🪙",n:-n,src:src||"",time:nowStr()});} refreshTop(); save();}
function spend(n){if(S.points<n){toast("积分不够，继续学习赚积分吧！");return false;} addPoints(-n,"消费"); return true;}

function refreshTop(){
  document.getElementById("tStars").textContent=S.stars;
  document.getElementById("tPoints").textContent=S.points;
  document.getElementById("tCoins").textContent=S.coins;
  document.getElementById("modeBtn").textContent = S.mode==="weekday"?"📅 工作日":"🎉 周末";
}
function toggleMode(){S.mode=S.mode==="weekday"?"weekend":"weekday"; save(); refreshTop();}

/* ============================ 工具 ============================ */
function speak(txt,lang){try{const u=new SpeechSynthesisUtterance(txt);u.lang=lang||"zh-CN";u.rate=0.9;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function $(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
/* view() attaches the container to #app immediately so that getElementById lookups
   on its inner elements resolve during build (router later re-appends the same node). */
function view(){const v=document.createElement("div");v.className="view active";document.getElementById("app").appendChild(v);return v;}
function modal(html){const m=document.getElementById("modal");document.getElementById("modalBox").innerHTML=html;m.classList.add("show");}
function closeModal(){document.getElementById("modal").classList.remove("show");}

/* generic multiple-choice quiz */
function mcQuiz(questions,onDone,eachPt,addToScore){
  let i=0,score=0;
  const wrap=$('<div class="card"></div>');
  function render(){
    if(i>=questions.length){wrap.innerHTML='<div class="big">🎉 完成！</div><div class="center">本组获得 <b>'+score+'</b> 积分</div><div class="center" style="margin-top:12px"><button class="btn" onclick="document.getElementById(\'app\').innerHTML=\'\';location.hash=location.hash;">再来一组</button></div>';if(onDone)onDone(score);return;}
    const q=questions[i];
    const ans=q[q.length-1];
    const opts=q.slice(1,1+ (q.length-2));
    wrap.innerHTML='<div class="muted">第 '+(i+1)+' / '+questions.length+' 题</div><div class="qtext">'+q[0]+'</div>';
    opts.forEach((o,k)=>{
      const b=$('<button class="opt"></button>');b.textContent=o;b.onclick=()=>{
        wrap.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        if(k===ans){b.classList.add("correct");score+=(eachPt||1);if(addToScore)addPoints(eachPt||1,"答题");toast("✅ 正确 +"+(eachPt||1));}
        else{b.classList.add("wrong");wrap.querySelectorAll(".opt")[ans].classList.add("correct");toast("❌ 正确答案："+opts[ans]);}
        i++;setTimeout(render,700);
      };
      wrap.appendChild(b);
    });
  }
  render();
  return wrap;
}

window.startPinyin=function(){
  let time=60,score=0;
  const moles=document.getElementById("pmMoles");
  const fb=document.getElementById("pmFb");const timeEl=document.getElementById("pmTime");
  const timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0){clearInterval(timer);moles.innerHTML="";fb.className="feedback ok";fb.textContent="🎉 时间到！本局获得 "+score+" 积分";addPoints(score,"拼音打地鼠");}},1000);
  function round(){
    if(time<=0)return;
    const q=shuffle(D.pinyin)[0];
    const wrong=shuffle(D.pinyin.filter(x=>x[1]!==q[1])).slice(0,2).map(x=>x[1]);
    const opts=shuffle([q[1],...wrong]);
    moles.innerHTML="";
    speak(q[0]); // hear the word, pick its pinyin
    fb.textContent="🔊 听发音，选出拼音："+q[0];
    opts.forEach(o=>{
      const h=$('<div class="hole"></div>');const m=$('<div class="mole"></div>');m.textContent=o;
      m.onclick=()=>{if(o===q[1]){score+=10;fb.className="feedback ok";fb.textContent="✅ +10 正确！";addPoints(10,"拼音打地鼠");}else{fb.className="feedback no";fb.textContent="❌ 正确是 "+q[1];}round();};
      h.appendChild(m);moles.appendChild(h);
    });
  }
  round();
};

function renderCharGroup(g){

}

window.togglePoemM=function(i){const e=document.getElementById("pm"+i);e.classList.toggle("hidden");};
window.poemPuzzle=function(i){
  const p=D.poems[i];
  const lines=p.o.slice();
  const shuffled=shuffle(lines);
  let html='<div class="card"><div class="qtext">把诗句按顺序排好（拖拽或点击交换）</div><div class="puzzle" id="pz'+i+'">';
  shuffled.forEach((l,k)=>{html+='<span class="ptile" draggable="true" data-k="'+k+'">'+l+'</span>';});
  html+='</div><div class="feedback" id="pzf'+i+'"></div><button class="btn t" onclick="checkPuzzle(\''+i+'\')">检查 ✅</button></div>';
  modal(html);
  // simple drag swap
  let dragEl=null;
  setTimeout(()=>{
    const cont=document.getElementById("pz"+i);
    cont.querySelectorAll(".ptile").forEach(t=>{
      t.ondragstart=()=>dragEl=t;

window.startMental=function(i){
  const lv=D.mental[i];const box=document.getElementById("mentalBox");
  let qIdx=0,time=lv.time,correct=0,timer=null;
  function show(){
    box.innerHTML='<div class="card center"><div class="row" style="justify-content:center"><span class="timer">⏱ <span id="mT">'+time+'</span></span><span class="pill">第'+(qIdx+1)+'/'+lv.q.length+'题</span></div><div class="qtext" style="font-size:30px">'+lv.q[qIdx][0]+' = ?</div><input class="ans" id="mA" type="number" placeholder="答案"><div class="feedback" id="mF"></div><div class="row" style="justify-content:center"><button class="btn" onclick="submitMental()">提交</button></div></div>';
    clearInterval(timer);timer=setInterval(()=>{time--;const e=document.getElementById("mT");if(e)e.textContent=time;if(time<=0){clearInterval(timer);end();}},1000);
  }
  window.submitMental=function(){
    const ans=parseInt(document.getElementById("mA").value,10);
    const f=document.getElementById("mF");
    if(ans===lv.q[qIdx][1]){correct++;f.className="feedback ok";f.textContent="✅ 正确！";}
    else{f.className="feedback no";f.textContent="❌ 正确答案："+lv.q[qIdx][1];}
    qIdx++;
    if(qIdx>=lv.q.length){clearInterval(timer);end();}
    else setTimeout(show,500);
  };
  function end(){
    const allRight=correct===lv.q.length;
    box.innerHTML='<div class="card center"><div class="big">'+(allRight?'🎉 全对！':'💪 完成')+'</div><div>答对 '+correct+'/'+lv.q.length+'</div><div class="feedback '+(allRight?'ok':'no')+'" style="margin-top:8px">'+(allRight?('+10 积分'):'继续加油！')+'</div><button class="btn" onclick="startMental('+i+')" style="margin-top:8px">再做一次</button></div>';

};

reg("mt_table",()=>{
  const v=view();
  let tbl='<table class="mt"><tr>';

  const colors=["#6C5CE7","#7c6ef0","#8a7bf0","#00B894","#16c79a","#FDCB6E","#ffb14e","#ff9a3d","#ff7675"];
  for(let r=1;r<=9;r++){tbl+='<tr>';for(let c=1;c<=9;c++){tbl+='<td style="background:'+colors[r-1]+';color:#fff;font-weight:700">'+r*c+'</td>';}tbl+='</tr>';}
  tbl+='</table>';
  v.innerHTML='<a class="back" onclick="location.hash=\'#/math\'">← 数学王国</a><h2 class="t">🔢 乘法口诀</h2><div class="card" style="overflow-x:auto">'+tbl+'</div><div class="card" id="mtFillBox"></div>';
  const box=document.getElementById("mtFillBox");
  function fill(){
    const qs=[];for(let k=0;k<20;k++){const a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9);qs.push([a+"×"+b,a*b]);}
    box.innerHTML='<div class="qtext">乘法填空（20题，每对+1）</div><div id="mfArea"></div><button class="btn t" onclick="checkFill(\'mfArea\',\''+"mul"+'\')">提交</button>';
    const area=document.getElementById("mfArea");
    qs.forEach((q,k)=>{const r=$('<div class="row" style="margin:6px 0"><span style="min-width:70px">'+q[0]+'=</span><input class="ans" style="width:100px" id="mf'+k+'" type="number"><span class="fb"></span></div>');area.appendChild(r);});
    window._mf=qs;
  }
  function divi(){
    const qs=[];for(let k=0;k<10;k++){const b=1+Math.floor(Math.random()*9),a=b*(1+Math.floor(Math.random()*9));qs.push([a+"÷"+b,a/b]);}
    box.innerHTML='<div class="qtext">除法填空（10题，每对+1）</div><div id="dvArea"></div><button class="btn t" onclick="checkFill(\'dvArea\',\'div\')">提交</button>';
    const area=document.getElementById("dvArea");
    qs.forEach((q,k)=>{const r=$('<div class="row" style="margin:6px 0"><span style="min-width:70px">'+q[0]+'=</span><input class="ans" style="width:100px" id="dv'+k+'" type="number"><span class="fb"></span></div>');area.appendChild(r);});
    window._dv=qs;
  }
  window.checkFill=function(areaId,kind){
    const qs=kind==="mul"?window._mf:window._dv;const pre=kind==="mul"?"mf":"dv";let right=0;
    qs.forEach((q,k)=>{const inp=document.getElementById(pre+k);const fb=inp.parentElement.querySelector(".fb");if(parseInt(inp.value,10)===q[1]){right++;fb.textContent="✅";fb.style.color="var(--teal)";}else{fb.textContent="❌"+q[1];fb.style.color="var(--red)";}});
    addPoints(right,(kind==="mul"?"乘法练习":"除法练习"));toast("答对 "+right+" 题，+"+right+"积分");
  };
  fill();
  // add buttons to switch
  const sw=$('<div class="row" style="padding:0 14px;margin-bottom:10px"></div>');
  sw.innerHTML='<button class="btn sm" onclick="mtFillMode(\'mul\')">乘法填空</button><button class="btn sm ghost" onclick="mtFillMode(\'div\')">除法填空</button>';
  v.appendChild(sw);
  window.mtFillMode=function(m){if(m==="mul")fill();else divi();};
  return v;
});

  box.appendChild(p);
  window.initHrd=function(){
    let arr=[1,2,3,4,5,6,7,8,0];
    for(let k=0;k<200;k++){const z=arr.indexOf(0);const nb=[];if(z%3>0)nb.push(z-1);if(z%3<2)nb.push(z+1);if(z>2)nb.push(z-3);if(z<6)nb.push(z+3);const t=nb[Math.floor(Math.random()*nb.length)];[arr[z],arr[t]]=[arr[t],arr[z]];}
    renderHrd(arr);
  };
  function renderHrd(arr){
    const g=document.getElementById("hrd");g.innerHTML="";
    arr.forEach((n,k)=>{const t=$('<div class="mtile" style="height:60px;display:flex;align-items:center;justify-content:center"></div>');if(n===0){t.style.visibility="hidden";}else{t.textContent=n;t.onclick=()=>moveHrd(arr,k);}g.appendChild(t);});

  };
  setTimeout(window.initHrd,50);
  return v;
});

function randQA(){ // pull a random question from subjects
  const pools=[];
  D.pinyin.forEach(p=>pools.push({q:"「"+p[0]+"」的拼音？",a:[p[1]],ans:p[1],type:"text"}));
  D.chars.forEach(c=>pools.push({q:"「"+c[2]+"」的汉字是？",a:[c[0]],ans:c[0],type:"text"}));
  D.mental.forEach(l=>l.q.forEach(x=>pools.push({q:x[0]+"=?",a:[String(x[1])],ans:String(x[1]),type:"text"})));
  D.alphabet.forEach(a=>pools.push({q:a[3]+" 的字母？",a:[a[0]],ans:a[0],type:"text"}));
  D.words.colors.concat(D.words.animals,D.words.food).forEach(w=>pools.push({q:w[1]+" 的英文？",a:[w[0]],ans:w[0],type:"text"}));
  return pools[Math.floor(Math.random()*pools.length)];
}

/* Canvas: 打气球 */
reg("sp_balloon",()=>{
  const v=view();
  if(!spend(3)){v.innerHTML='<a class="back" onclick="location.hash=\'#/spend\'">← 积分消费</a><h2 class="t">🎈 打气球</h2><div class="sub">需要3积分</div>';return v;}
  v.innerHTML='<a class="back" onclick="location.hash=\'#/spend\'">← 积分消费</a><h2 class="t">🎈 打气球</h2><div class="sub">30秒：红+3 蓝+2 绿+1 黑炸弹-5</div><div class="card center"><canvas id="blCv" width="320" height="360" style="background:#eaf6ff;border-radius:16px"></canvas><div class="row" style="justify-content:center"><span class="timer" id="blT">30</span> 分：<b id="blS">0</b></div></div>';
  setTimeout(runBalloon,50);
  return v;
});
function runBalloon(){
  const cv=document.getElementById("blCv");if(!cv)return;const ctx=cv.getContext("2d");
  const balls=[];let score=0,time=30;
  const cols=[{c:"#ff6b6b",p:3},{c:"#4a90e2",p:2},{c:"#00B894",p:1},{c:"#222",p:-5}];
  const timer=setInterval(()=>{time--;document.getElementById("blT").textContent=time;if(time<=0){clearInterval(timer);clearInterval(sp);const fb=score>=61?"大奖 +10":score>=31?"中奖 +5":"小奖 +2";addPoints(score>=61?10:score>=31?5:2,"打气球");ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,320,360);ctx.fillStyle="#fff";ctx.font="bold 22px sans-serif";ctx.textAlign="center";ctx.fillText("时间到！"+fb,160,180);}},1000);
  const sp=setInterval(()=>{if(balls.length<6){const col=cols[Math.random()<0.15?3:Math.floor(Math.random()*3)];balls.push({x:20+Math.random()*280,y:360,r:18,col,s:0.8+Math.random()*0.8});}},400);
  function loop(){ctx.clearRect(0,0,320,360);for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.y-=b.s*2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle=b.col.c;ctx.fill();if(b.y<-20)balls.splice(i,1);}requestAnimationFrame(loop);}
  loop();
  cv.onclick=e=>{const rct=cv.getBoundingClientRect();const x=(e.clientX-rct.left)*(320/rct.width);const y=(e.clientY-rct.top)*(360/rct.height);for(let i=balls.length-1;i>=0;i--){const b=balls[i];if((x-b.x)**2+(y-b.y)**2<b.r*b.r){score+=b.col.p;document.getElementById("blS").textContent=score;balls.splice(i,1);break;}}};
}

/* Canvas: 切水果 */
reg("sp_fruit",()=>{
  const v=view();
  if(!spend(3)){v.innerHTML='<a class="back" onclick="location.hash=\'#/spend\'">← 积分消费</a><h2 class="t">🍉 切水果</h2><div class="sub">需要3积分</div>';return v;}
  v.innerHTML='<a class="back" onclick="location.hash=\'#/spend\'">← 积分消费</a><h2 class="t">🍉 切水果</h2><div class="sub">30秒：划过水果+1，炸弹-3</div><div class="card center"><canvas id="frCv" width="320" height="360" style="background:#eafaf0;border-radius:16px"></canvas><div class="row" style="justify-content:center"><span class="timer" id="frT">30</span> 分：<b id="frS">0</b></div></div>';
  setTimeout(runFruit,50);
  return v;
});
function runFruit(){
  const cv=document.getElementById("frCv");if(!cv)return;const ctx=cv.getContext("2d");
  const items=[];let score=0,time=30;
  const fr=[{e:"🍉",p:1},{e:"🍎",p:1},{e:"🍓",p:1},{e:"💣",p:-3}];
  const timer=setInterval(()=>{time--;document.getElementById("frT").textContent=time;if(time<=0){clearInterval(timer);clearInterval(sp);const fb=score>=61?"大奖 +10":score>=31?"中奖 +5":"小奖 +2";addPoints(score>=61?10:score>=31?5:2,"切水果");ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,320,360);ctx.fillStyle="#fff";ctx.font="bold 22px sans-serif";ctx.textAlign="center";ctx.fillText("时间到！"+fb,160,180);}},1000);
  const sp=setInterval(()=>{if(items.length<5){const f=fr[Math.random()<0.18?3:Math.floor(Math.random()*3)];items.push({x:20+Math.random()*280,y:360,r:20,f,s:1+Math.random()});}},400);
  function loop(){ctx.clearRect(0,0,320,360);for(let i=items.length-1;i>=0;i--){const b=items[i];b.y-=b.s*2.5;ctx.font="32px serif";ctx.textAlign="center";ctx.fillText(b.f,b.x,b.y);if(b.y<-20)items.splice(i,1);}requestAnimationFrame(loop);}
  loop();
  let lastX=0,lastY=0;
  cv.onmousemove=e=>{const rct=cv.getBoundingClientRect();const x=(e.clientX-rct.left)*(320/rct.width);const y=(e.clientY-rct.top)*(360/rct.height);if(lastX){for(let i=items.length-1;i>=0;i--){const b=items[i];if((x-b.x)**2+(y-b.y)**2<b.r*b.r){score+=b.f.p;document.getElementById("frS").textContent=score;items.splice(i,1);}}}lastX=x;lastY=y;};
}
