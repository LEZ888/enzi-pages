  const rows = orders.map(o => [o.id, o.order_date, maskName(o.customer_name), en(o.employee_id),

  exportRows(format, '股东报表_' + month, headers, rows);
}

function downloadEmpTemplate() {
  const headers = ['name', 'role', 'phone'];
  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet([headers]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '员工');
    XLSX.writeFile(wb, '员工导入模板.xlsx');
  } else {
    downloadText('﻿' + headers.join(',') + '\n', '员工导入模板.csv');
  }
}
function importEmp(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    let rows = [];
    try {
      if (window.XLSX && /\.xlsx$/i.test(file.name)) {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      } else {
        rows = parseCSV(e.target.result);
      }
    } catch (err) { toast('解析失败：' + err.message); return; }
    importEmpRows(rows);
  };
  if (window.XLSX && /\.xlsx$/i.test(file.name)) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
  file.value = '';
}
function importEmpRows(rows) {
  let ok = 0, skip = 0;
  rows.forEach(r => {
    const name = (r.name != null ? r.name : r['姓名'] || '').toString().trim();
    let role = (r.role != null ? r.role : r['角色'] || '').toString().trim().toLowerCase();
    const phone = (r.phone != null ? r.phone : r['手机号'] || '').toString().trim();
    if (!name) { skip++; return; }
    if (role !== 'owner' && role !== 'beautician') role = 'beautician';
    if (DB.getList('employees').some(x => x.name === name)) { skip++; return; }
    DB.insert('employees', { name, role, phone, created_at: new Date().toISOString().slice(0, 10) });
    ok++;
  });
  toast(`导入完成：成功 ${ok} 条，跳过 ${skip} 条（缺姓名或重名）`);
  empListRender();
}

function openModal(html) {
  let mask = document.getElementById('modalMask');
  if (!mask) {
    mask = document.createElement('div'); mask.className = 'modal-mask'; mask.id = 'modalMask';
    mask.innerHTML = '<div class="modal" id="modalBox"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
  }
  document.getElementById('modalBox').innerHTML = html;
  mask.classList.add('show');
}
function closeModal() { const m = document.getElementById('modalMask'); if (m) m.classList.remove('show'); }
// 应用内确认弹窗（不依赖 window.confirm，沙箱 iframe 预览也能用）
function confirmDialog(msg, onYes, title) {
  openModal(`<div class="modal-card">
    <h3>${esc(title || '请确认')}</h3>
    <p style="margin:8px 0 18px;white-space:pre-line;color:#374151;line-height:1.6;font-size:14px">${esc(msg)}</p>
    <div class="modal-act">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn danger" id="confirmYesBtn">确定</button>
    </div>
  </div>`);
  const btn = document.getElementById('confirmYesBtn');
  if (btn) btn.onclick = () => { closeModal(); if (typeof onYes === 'function') onYes(); };
}

    fileToBase64(f).then(b64 => {
      App._acImgs.push(b64);

function removeAcImg(i) {

}

function copyActivityCard(id) {
  const a = DB.getList('activity_cards').find(x => x.id === id);
  if (!a) return;
  const copy = JSON.parse(JSON.stringify(a));
  delete copy.id;
  copy.title = (copy.title || '活动卡') + '（副本）';
  openActivityCardForm(null, copy);
}

function saveActivityCard(id) {
  const title = document.getElementById('ac_title').value.trim();
  const priceRaw = document.getElementById('ac_price').value.trim();
  const price = priceRaw === '' ? null : (Number(priceRaw) || 0);
  const method = document.getElementById('ac_method').value;
  const detail = document.getElementById('ac_detail').value;
  const audience = document.getElementById('ac_audience').value;
  const note = document.getElementById('ac_note').value;
  const category_ids = Array.from(document.querySelectorAll('#ac_cats input:checked')).map(c => c.value);
  const images = App._acImgs.slice();
  if (id) {
    DB.update('activity_cards', id, { title, price, method, detail, audience, internal_note: note, category_ids, images });
    toast('已保存');
  } else {
    DB.insert('activity_cards', { title, price, method, detail, audience, internal_note: note, category_ids, images, created_at: new Date().toISOString().slice(0, 10) });
    toast('已新建');
  }
  closeModal();
  renderActivityCards(document.getElementById('content'));
}

function deleteActivityCard(id) {
  const a = DB.getList('activity_cards').find(x => x.id === id);
  if (!a) return;
  confirmDialog('确定删除活动卡「' + (a.title || '(未命名)') + '」？删除后不可恢复。', () => {
    DB.delete('activity_cards', id);
    renderActivityCards(document.getElementById('content'));
    toast('已删除');

}

function toggleKCat(id) {

  renderKGrid();
}

function addKCategory() {
  const inp = document.getElementById('k_newcat');
  const name = inp.value.trim();
  if (!name) return;
  let cat = DB.getList('knowledge_categories').find(c => c.name === name);

  inp.value = '';
  renderKCatTree();
  toast('已添加分类');
}

function deleteKCategory(id) {
  const cat = DB.getList('knowledge_categories').find(c => c.id === id);
  if (!cat) return;
  confirmDialog(`确定删除分类「${cat.name}」？\n该分类会从所有知识中移除（知识本身不删）。`, () => {
    DB.getList('knowledge_articles').forEach(a => {

    });
    DB.delete('knowledge_categories', id);
    App.kCats = (App.kCats || []).filter(x => x !== id);
    renderKCatTree();
    renderKGrid();

function renderKExpList() {
  const el = document.getElementById('kExpList');

function openExpertForm(id) {

function saveExpert(id) {

function deleteExpert(id) {

function renderKGrid() {
  const el = document.getElementById('kGrid');
  if (!el) return;
  const kw = (App.kSearch || '').toLowerCase();

  if ((App.kCats || []).length) list = list.filter(a => App.kCats.includes(a.category_id));

    return `
      <div class="kg-card">

function kCoverChange(file) {
  if (!file) return;
  fileToBase64(file).then(b64 => {

function kCoverClear() { App._kCover = ''; document.getElementById('kCoverPrev').innerHTML = ''; }

function fillKExpOptions() {

  const exps = DB.getList('expert_profiles');

function saveKnowledge(id) {

function stripHtml(html) {

  inp.value = '';

function deleteCaseCategory(id) {
  const cat = DB.getList('case_categories').find(c => c.id === id);
  if (!cat) return;
  confirmDialog('确定删除分类「' + cat.name + '」？\n引用该分类的案例会被置为「未分类」（案例本身不删）。', () => {
    DB.getList('cases').forEach(x => { if (x.category_id === id) DB.update('cases', x.id, { category_id: null }); });
    DB.delete('case_categories', id);
    if (App.caseCats === id) App.caseCats = null;
    renderCases(document.getElementById('content'));
    toast('已删除分类：' + cat.name);
  }, '删除分类');
}

function renderCaseImgPreview() {
  const box = document.getElementById('case_imgs'); if (!box) return;
  box.innerHTML = (App._caseImgs || []).map((u, i) =>
    `<div style="position:relative">
      <img src="${u}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openCaseImageEditor(${i})">
      <button type="button" onclick="removeCaseImg(${i})" style="position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;border:none;cursor:pointer" title="删除">×</button>
      <button type="button" onclick="openCaseImageEditor(${i})" style="position:absolute;bottom:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:#7c3aed;color:#fff;border:none;cursor:pointer;font-size:11px" title="编辑">✎</button>
    </div>`).join('');
}
function addCaseImages() {
  const inp = document.getElementById('case_file');
  const files = Array.from(inp.files || []);
  if (!files.length) return;
  let pending = files.length;
  files.forEach(f => fileToBase64(f).then(b64 => { App._caseImgs.push(b64); renderCaseImgPreview(); }).catch(() => {}).finally(() => { if (--pending === 0) inp.value = ''; }));
}
function removeCaseImg(i) { App._caseImgs.splice(i, 1); renderCaseImgPreview(); }

function addCaseCategoryFromForm() {
  const inp = document.getElementById('case_newcat2');
  const name = (inp && inp.value || '').trim(); if (!name) return;
  let cat = DB.getList('case_categories').find(c => c.name === name);
  if (!cat) cat = DB.insert('case_categories', { name });
  inp.value = '';
  const sel = document.getElementById('case_cat');
  const opt = document.createElement('option'); opt.value = cat.id; opt.textContent = cat.name; opt.selected = true;
  sel.appendChild(opt);
  toast('已添加并选中分类');
}

function openCaseForm(id, copyData) {
  let a = null;
  if (copyData) a = copyData;
  else if (id) a = DB.getList('cases').find(x => x.id === id);
  const cats = DB.getList('case_categories');
  App._caseImgs = (a && a.images) ? a.images.slice() : [];
  const catOpts = `<option value="">未分类</option>` + cats.map(c => `<option value="${c.id}" ${(a && a.category_id === c.id) ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const html = `
    <h3>${copyData ? '复制新建案例' : (id ? '编辑案例' : '新建案例')}</h3>
    <div class="field"><label>标题（选填）</label><input id="case_title" value="${esc(a ? a.title : '')}" placeholder="如：XX祛痘案例"></div>
    <div class="field"><label>分类（选填）</label>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="case_cat">${catOpts}</select>
        <input id="case_newcat2" class="inp" placeholder="新分类名" style="width:100px">
        <button class="btn sm" onclick="addCaseCategoryFromForm()">+ 新增</button>
      </div>
    </div>
    <div class="field"><label>图片（选填，可多张，点图片上的✎可编辑）</label>
      <div id="case_imgs" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px"></div>
      <input type="file" id="case_file" multiple accept="image/*" onchange="addCaseImages()">
    </div>
    <div class="field"><label>视频链接（选填）</label><input id="case_video" value="${esc(a ? a.video_url : '')}" placeholder="如：B站/抖音/腾讯视频分享链接"></div>
    <div class="field"><label>内容（富文本，选填）</label>
      <div style="margin-bottom:4px">
        <button type="button" class="btn sm ghost" onclick="document.execCommand('bold')"><b>B</b></button>
        <button type="button" class="btn sm ghost" onclick="document.execCommand('insertLineBreak')">换行</button>
      </div>
      <div id="case_content" contenteditable="true" style="border:1px solid #d1d5db;border-radius:8px;padding:8px;min-height:80px">${a && a.content ? a.content : ''}</div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" style="flex:1" onclick="saveCase('${id || ''}')">保存</button>
      <button class="btn ghost" style="flex:1" onclick="closeModal()">取消</button>
    </div>`;
  openModal(html);
  renderCaseImgPreview();
}

function copyCase(id) {
  const a = DB.getList('cases').find(x => x.id === id);
  if (!a) return;
  const copy = Object.assign({}, a); delete copy.id;
  copy.title = (copy.title || '案例') + '（副本）';
  openCaseForm(null, copy);
}

function saveCase(id) {
  const title = document.getElementById('case_title').value.trim();
  const category_id = document.getElementById('case_cat').value || null;
  const video_url = document.getElementById('case_video').value.trim();
  const content = document.getElementById('case_content').innerHTML;
  const images = App._caseImgs.slice();
  if (id) {
    DB.update('cases', id, { title: title || null, category_id, video_url, content, images });
    toast('已保存');
  } else {
    DB.insert('cases', { title: title || null, category_id, video_url, content, images, sort_order: 0, created_at: new Date().toISOString().slice(0, 10) });
    toast('已新建');
  }
  closeModal();
  renderCases(document.getElementById('content'));
}

function deleteCase(id) {
  const a = DB.getList('cases').find(x => x.id === id);
  confirmDialog('确定删除案例「' + (a ? a.title : '') + '」？该操作不可撤销。', () => {
    DB.delete('cases', id);
    renderCases(document.getElementById('content'));
    toast('已删除');
  }, '删除案例');
}

/* ---- Canvas 图片编辑器（滤镜 / 加文字 / 裁剪）---- */
function openCaseImageEditor(index) {
  const src = App._caseImgs[index];
  if (!src) return;
  App._ed = { index, img: null, canvas: null, filters: { brightness: 100, contrast: 100, saturate: 100 }, texts: [], cropMode: false, cropStart: null, cropRect: null, dragging: null };
  const html = `
    <h3>图片编辑</h3>
    <div class="case-imgedit">
      <canvas id="edCanvas"></canvas>
      <div id="edCrop" class="ed-cropbox" style="display:none"></div>
    </div>
    <div class="ed-tool">
      <label>亮度 <input type="range" id="edBright" min="0" max="200" value="100" oninput="edApplyFilters()"></label>
      <label>对比度 <input type="range" id="edContrast" min="0" max="200" value="100" oninput="edApplyFilters()"></label>
      <label>饱和度 <input type="range" id="edSat" min="0" max="200" value="100" oninput="edApplyFilters()"></label>
    </div>
    <div class="ed-tool">
      <input id="edText" placeholder="输入文字" style="width:120px">
      <input id="edTextSize" type="text" inputmode="numeric" value="28" style="width:48px">
      <input id="edTextColor" type="color" value="#ffffff" style="width:38px;height:30px;border:none;background:none">
      <button class="btn sm" onclick="edAddText()">添加文字</button>
    </div>
    <div class="ed-tool">
      <button class="btn sm ghost" onclick="edStartCrop()" id="edCropBtn">裁剪</button>
      <button class="btn sm ghost" onclick="edReset()">重置</button>
      <button class="btn sm" onclick="edSaveImg()">保存修改</button>
      <button class="btn sm ghost" onclick="closeModal()">取消</button>
    </div>
    <div style="font-size:12px;color:#9ca3af;margin-top:6px">拖动滑块调滤镜；输入文字点「添加文字」后可拖动位置；「裁剪」后在图片上拖拽选区自动裁剪。</div>`;
  openModal(html);
  const canvas = document.getElementById('edCanvas');
  App._ed.canvas = canvas;
  const img = new Image();
  img.onload = () => { canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; App._ed.img = img; edDraw(); };
  img.onerror = () => toast('图片加载失败');
  img.src = src;
  bindEdEvents(canvas);
}

function edDraw() {
  const s = App._ed; if (!s || !s.canvas || !s.img) return;
  const ctx = s.canvas.getContext('2d');
  ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
  ctx.filter = `brightness(${s.filters.brightness}%) contrast(${s.filters.contrast}%) saturate(${s.filters.saturate}%)`;
  ctx.drawImage(s.img, 0, 0, s.canvas.width, s.canvas.height);
  ctx.filter = 'none';
  s.texts.forEach(t => { ctx.font = `${t.size}px sans-serif`; ctx.fillStyle = t.color; ctx.textBaseline = 'middle'; ctx.fillText(t.text, t.x, t.y); });
}

function edApplyFilters() {
  const s = App._ed; if (!s) return;
  s.filters.brightness = +document.getElementById('edBright').value;
  s.filters.contrast = +document.getElementById('edContrast').value;
  s.filters.saturate = +document.getElementById('edSat').value;
  edDraw();
}

function edAddText() {
  const s = App._ed; if (!s || !s.img) return;
  const text = (document.getElementById('edText').value || '').trim();
  if (!text) return;
  const size = +document.getElementById('edTextSize').value || 28;
  const color = document.getElementById('edTextColor').value;
  s.texts.push({ text, x: s.canvas.width / 2, y: s.canvas.height / 2, size, color });
  edDraw();
}

function edStartCrop() {
  const s = App._ed; if (!s) return;
  s.cropMode = true; s.cropRect = null; s.cropStart = null;
  const box = document.getElementById('edCrop'); if (box) box.style.display = 'none';
  const btn = document.getElementById('edCropBtn'); if (btn) btn.textContent = '拖拽选区自动裁剪';
  toast('在图片上拖拽选择裁剪区域');
}

function edApplyCrop() {
  const s = App._ed; if (!s || !s.cropRect) return;
  const canvas = s.canvas;
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
  const cx = s.cropRect.x * sx, cy = s.cropRect.y * sy, cw = s.cropRect.w * sx, ch = s.cropRect.h * sy;
  if (cw < 5 || ch < 5) return;
  const tmp = document.createElement('canvas'); tmp.width = cw; tmp.height = ch;
  tmp.getContext('2d').drawImage(canvas, cx, cy, cw, ch, 0, 0, cw, ch);
  canvas.width = cw; canvas.height = ch;
  canvas.getContext('2d').drawImage(tmp, 0, 0);
  s.cropMode = false; s.cropRect = null;
  const box = document.getElementById('edCrop'); if (box) box.style.display = 'none';
  const btn = document.getElementById('edCropBtn'); if (btn) btn.textContent = '裁剪';
  toast('已裁剪');
}

function edReset() {
  const s = App._ed; if (!s) return;
  s.filters = { brightness: 100, contrast: 100, saturate: 100 };
  s.texts = []; s.cropMode = false; s.cropRect = null;
  const box = document.getElementById('edCrop'); if (box) box.style.display = 'none';
  const b = document.getElementById('edBright'); if (b) b.value = 100;
  const c = document.getElementById('edContrast'); if (c) c.value = 100;
  const sat = document.getElementById('edSat'); if (sat) sat.value = 100;
  const btn = document.getElementById('edCropBtn'); if (btn) btn.textContent = '裁剪';
  edDraw();
}

function edSaveImg() {
  const s = App._ed; if (!s) return;
  try {
    const isPng = (App._caseImgs[s.index] || '').startsWith('data:image/png');
    const data = s.canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', 0.92);
    App._caseImgs[s.index] = data;
    renderCaseImgPreview();
    closeModal();
    toast('已更新图片');
  } catch (err) { toast('保存失败'); }
}

function bindEdEvents(canvas) {
  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx, y: cy, rect };
  };
  const down = (e) => {
    const s = App._ed; if (!s || !s.img) return;
    e.preventDefault();
    const p = getPos(e);
    if (s.cropMode) { s.cropStart = p; return; }
    const scaleX = s.canvas.width / p.rect.width, scaleY = s.canvas.height / p.rect.height;
    const px = p.x * scaleX, py = p.y * scaleY;
    for (let i = s.texts.length - 1; i >= 0; i--) {
      const t = s.texts[i];
      if (Math.abs(px - t.x) < t.size / 2 && Math.abs(py - t.y) < t.size) { s.dragging = { i, ox: px - t.x, oy: py - t.y }; break; }
    }
  };
  const move = (e) => {
    const s = App._ed; if (!s || !s.img) return;
    const p = getPos(e);
    if (s.cropMode && s.cropStart) {
      e.preventDefault();
      const x = Math.min(s.cropStart.x, p.x), y = Math.min(s.cropStart.y, p.y);
      const w = Math.abs(p.x - s.cropStart.x), h = Math.abs(p.y - s.cropStart.y);
      s.cropRect = { x, y, w, h };
      const box = document.getElementById('edCrop');
      if (box) { box.style.display = 'block'; box.style.left = x + 'px'; box.style.top = y + 'px'; box.style.width = w + 'px'; box.style.height = h + 'px'; }
      return;
    }
    if (s.dragging) {
      e.preventDefault();
      const scaleX = s.canvas.width / p.rect.width, scaleY = s.canvas.height / p.rect.height;
      s.texts[s.dragging.i].x = p.x * scaleX - s.dragging.ox;
      s.texts[s.dragging.i].y = p.y * scaleY - s.dragging.oy;
      edDraw();
    }
  };
  const up = () => {
    const s = App._ed; if (!s) return;
    if (s.cropMode && s.cropRect) edApplyCrop();
    s.cropStart = null; s.dragging = null;
  };
  canvas.onmousedown = down; canvas.onmousemove = move; canvas.onmouseup = up;
  canvas.ontouchstart = down; canvas.ontouchmove = move; canvas.ontouchend = up;
}

/* ============================================================
 * 启动
 * ============================================================ */
DB.init();
render();
</script>
</body>
</html>
