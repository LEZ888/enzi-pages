<style>
  :root{
    --c-primary:#e4393c; --c-primary-d:#c1272d;
    --c-text:#222; --c-sub:#888; --c-line:#ececec; --c-bg:#f5f5f7; --c-card:#fff;
    --radius:4px; --shadow:0 2px 12px rgba(0,0,0,.08);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    --fs:15px; --gap:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--c-text);background:var(--c-bg);font-size:var(--fs);line-height:1.5;padding-bottom:64px}
  .hidden{display:none !important}
  button{font-family:var(--font);cursor:pointer;border:none;background:none}
  .btn-row{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:var(--radius);font-size:14px;background:#fff;color:var(--c-text);border:1px solid var(--c-line);font-weight:500}
  .btn:hover{border-color:#bbb}
  .btn.primary{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
  .btn.primary:hover{background:var(--c-primary-d)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{background:#fff;color:var(--c-primary);border-color:var(--c-primary)}
  .btn.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
  input,textarea,select{font-family:var(--font);font-size:14px;border:1px solid var(--c-line);border-radius:var(--radius);padding:9px 10px;width:100%;outline:none;background:#fff;color:var(--c-text)}
  input:focus,textarea:focus,select:focus{border-color:var(--c-primary)}
  textarea{resize:vertical;min-height:64px}

  .title{flex:1;min-width:0}.title h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title .sub{font-size:11px;color:var(--c-sub)}
  .mode-tag{font-size:11px;padding:3px 8px;border-radius:var(--radius);background:#f0f0f0;color:var(--c-sub)}
  .mode-tag.cloud{background:#e8f6ec;color:#1a9e4b}

  /* Banner */
  .banner{position:relative;overflow:hidden;background:#eee}
  .banner .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .banner .track::-webkit-scrollbar{display:none}
  .banner .slide{flex:0 0 100%;scroll-snap-align:start}
  .banner img{width:100%;height:150px;object-fit:cover;display:block}
  .banner .dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px}
  .banner .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}
  .banner .dots i.on{background:#fff;width:14px;border-radius:3px}

  /* 搜索/分类 */
  .bar{padding:10px 14px;display:flex;flex-direction:column;gap:10px;background:var(--c-card);border-bottom:1px solid var(--c-line)}
  .cats{display:flex;flex-direction:row;gap:8px;overflow-x:auto;padding-bottom:2px}
  .cats .cat{flex:0 0 auto;padding:6px 14px;border:1px solid var(--c-line);border-radius:var(--radius);font-size:13px;color:var(--c-sub);background:#fff;white-space:nowrap}
  .cats.round .cat{border-radius:20px}
  .cats.pill .cat{border-radius:20px;background:#f3f3f5;border-color:transparent}
  .cats.underline .cat{border:none;border-bottom:2px solid transparent;border-radius:0}
  .cats .cat.on{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
  .cats.underline .cat.on{border-bottom-color:var(--c-primary);background:transparent;color:var(--c-primary)}

  /* 板块 */
  .section{padding:14px 0}
  .section .sec-head{padding:0 14px;margin-bottom:10px}
  .section .sec-head h2{font-size:18px;margin:0;font-weight:700}
  .section .sec-head .st{font-size:12px;color:var(--c-sub);margin-top:2px}
  .sec-cover{width:100%;height:120px;object-fit:cover;display:block;margin-bottom:10px}

  /* 商品卡 */
  .card{background:var(--c-card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column}
  .card .img{position:relative;width:100%;aspect-ratio:1/1;background:#f0f0f0;overflow:hidden}
  .card .img img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;top:8px;left:8px;background:var(--c-primary);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:var(--radius);letter-spacing:1px}
  .offshelf{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .collected{position:absolute;top:8px;right:8px;font-size:16px}
  .card .body{padding:10px;display:flex;flex-direction:column;gap:5px}
  .card .nm{font-size:14px;font-weight:600;line-height:1.35}
  .card .br{font-size:12px;color:var(--c-sub)}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11px;color:#555;background:#f3f3f5;padding:2px 7px;border-radius:var(--radius)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--gap);padding:0 14px}
  @media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}

  /* 布局变体 */
  .lay-nine .grid{grid-template-columns:repeat(3,1fr)}
  .lay-custom .grid{grid-template-columns:repeat(var(--cols,3),1fr)}
  .lay-carousel .track{display:flex;overflow-x:auto;gap:10px;padding:0 14px;scroll-snap-type:x mandatory}
  .lay-carousel .track .card{flex:0 0 80%;scroll-snap-align:start}
  .lay-list .list{display:flex;flex-direction:column;gap:10px;padding:0 14px}
  .lay-list .card{flex-direction:row}
  .lay-list .card .img{width:110px;height:110px;flex:0 0 110px}
  .lay-waterfall{column-count:2;column-gap:var(--gap);padding:0 14px}
  @media(min-width:760px){.lay-waterfall{column-count:3}}
  .lay-waterfall .card{break-inside:avoid;margin-bottom:var(--gap)}
  .lay-stack .stack{display:flex;flex-direction:column;gap:12px;padding:0 14px}
  .lay-menu .menuwrap{display:flex;gap:10px;padding:0 14px}
  .lay-menu .mlist{width:38%;max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}

  <div class="field"><label>产品图片（多张，第一张主图，可在线编辑）</label><input id="f_imgs" type="file" accept="image/*" multiple><div class="thumbs" id="f_thumbs"></div></div>
  <div class="field"><label>产品视频（一个，可不传）</label><input id="f_video" type="file" accept="video/*"><div id="f_video_name" style="font-size:12px;color:var(--c-sub);margin-top:4px"></div></div>
  <div class="field"><label>详情长图（可选）</label><input id="f_long" type="file" accept="image/*"><div id="f_long_name" style="font-size:12px;color:var(--c-sub);margin-top:4px"></div></div>

    <div style="flex:1"><label>库存数量（可不填）</label><input id="f_stock" type="number" placeholder="留空=不显示"></div>
    <div style="flex:1"><label>活动结束时间（可选倒计时）</label><input id="f_end" type="datetime-local"></div>
  </div>

    <div style="flex:1"><label>去购买按钮文字</label><input id="f_buytxt" placeholder="如：去购买"></div>
    <div style="flex:1"><label>去购买链接</label><input id="f_buylink" placeholder="https://…"></div>
  </div>
  <div class="field"><label>单品分享卡片（可选，留空则用分享模板/默认主图）</label>
    <input id="f_sharetitle" placeholder="分享标题">
    <input id="f_sharedesc" placeholder="分享描述" style="margin-top:6px">
    <input id="f_sharethumb" placeholder="缩略图URL（或留空用主图）" style="margin-top:6px">
  </div>
  <div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="f_shelf" checked style="width:auto"> 上架销售（取消=下架，前端不显示）</label></div>
  <div class="field"><label>排序（数字越小越靠前）</label><input id="f_order" type="number" value="0"></div>
  <div id="draftTip" class="help hidden"></div>
  <div class="btn-row" style="justify-content:flex-end"><button class="btn" id="formCancel">取消</button><button class="btn primary" id="formSave">保存</button></div>
</div></div>

<div class="mask hidden" id="mask"></div>
<div class="toast" id="toast"></div>
<div class="corner" id="corner"></div>
<footer class="foot">© LESLEY<span id="adminHint"></span></footer>

<script>
"use strict";
/* ============ 默认设置 ============ */
const LS_KEY="leslie_app_v2";
const DEFAULT_PWD="admin888";
const DEF=(o)=>JSON.parse(JSON.stringify(o));
const DEFAULT_SETTINGS={
  adminPassword:DEFAULT_PWD,
  switches:{search:true,category:true,activityTag:true,video:true,collections:true,browseHistory:true,points:true,longImage:true,buyButton:true,bottomNav:true,banner:true,series:true,moments:true,mall:true,scripts:true,welcome:true,consult:true,compare:true,activityCountdown:true,tutorial:true,shareCard:true,guide:true,imgEdit:true,videoEdit:true},
  supabase:{url:"",key:"",enabled:false},
  shop:{name:"LESLEY",subtitle:"",logo:"",theme:"light",colors:{primary:"#e4393c",bg:"#f5f5f7",text:"#222",btn:"#e4393c"},fontScale:1,radius:4,spacing:12,bgImage:null,contact:{wechat:"",phone:""}},
  nav:{style:"bottom",barColor:"#ffffff",activeColor:"#e4393c",inactiveColor:"#888888",items:[
    {id:"home",name:"产品展示",icon:"🛍️",type:"home"},
    {id:"moments",name:"朋友圈动态",icon:"💬",type:"moments"},
    {id:"mall",name:"积分商城",icon:"🎁",type:"mall"},
    {id:"profile",name:"个人中心",icon:"👤",type:"profile"}
  ]},
  banner:{enabled:false,items:[]},
  catTabStyle:"round",
  categories:[],
  series:[],
  sections:[{id:"s1",title:"全部产品",subtitle:"",cover:"",layout:"grid",filter:{type:"all"},order:0,hidden:false}],
  redeemItems:[],
  moments:{
    cover:"",
    author:{avatar:"",nickname:"LESLEY"},
    auditMode:"manual",
    posts:[]
  },
  virtualUsers:[],
  points:{perBrowse:1, perInviteOpen:10, perForward:5, enabledForward:true},
  agents:[],
  shareCards:{page:[], product:[], defaultPage:null, defaultProduct:null},
  scripts:{enabled:true, items:[]},
  redeemRecords:[],
  welcome:{enabled:true,title:"",body:"",image:""},
  guide:true,
  tutorials:[],
  customers:[]
};

let STATE={products:[],settings:null,identity:null,isAdmin:false,view:"home",currentCat:"all",search:"",detailId:null,detailImg:0,editDesc:"",filterTag:null};

/* ============ 存储 ============ */
const Store={
  sb:null,
  async init(){const s=STATE.settings;if(s.supabase&&s.supabase.enabled&&s.supabase.url&&s.supabase.key&&window.supabase){try{this.sb=window.supabase.createClient(s.supabase.url,s.supabase.key);}catch(e){this.sb=null;}}else this.sb=null;},
  _g(){try{return JSON.parse(localStorage.getItem(LS_KEY))||{};}catch(e){return{};}},
  _s(d){localStorage.setItem(LS_KEY,JSON.stringify(d));},
  async loadAll(){if(this.sb){try{const{data,error}=await this.sb.from("app_state").select("id,value").in("id",["products","settings"]);if(!error&&data){const m={};data.forEach(r=>m[r.id]=r.value);return{products:m.products||[],settings:m.settings||null};}}catch(e){}}const d=this._g();return{products:d.products||[],settings:d.settings||null};},
  async saveAll(){if(this.sb){try{await this.sb.from("app_state").upsert({id:"products",value:STATE.products});await this.sb.from("app_state").upsert({id:"settings",value:STATE.settings});return true;}catch(e){toast("云端保存失败，已回退本地");}}const d=this._g();d.products=STATE.products;d.settings=STATE.settings;this._s(d);return true;},
  async loadIdentities(){if(this.sb){try{const{data}=await this.sb.from("app_state").select("value").eq("id","identities");return(data&&data[0]&&data[0].value)||{};}catch(e){}}return this._g().identities||{};},
  async saveIdentities(o){if(this.sb){try{await this.sb.from("app_state").upsert({id:"identities",value:o});return;}catch(e){}}const d=this._g();d.identities=o;this._s(d);}
};

/* ============ 工具 ============ */
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function plain(t){const d=document.createElement("div");d.innerHTML=t||"";return (d.textContent||"").replace(/\s+/g," ").trim();}
async function fileToCompressedDataURL(file,maxW=1200,q=0.82){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let{w,h}=img;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",q));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
async function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function applyTheme(){
  const c=STATE.settings.shop.colors,s=STATE.settings.shop;
  const root=document.documentElement.style;
  root.setProperty("--c-primary",c.primary);root.setProperty("--c-primary-d",shade(c.primary,-18));
  root.setProperty("--c-bg",c.bg);root.setProperty("--c-text",c.text);root.setProperty("--c-card",pickCard(c.bg,c.text));
  root.setProperty("--radius",s.radius+"px");root.setProperty("--gap",s.spacing+"px");root.setProperty("--fs",(15*s.fontScale)+"px");
  document.getElementById("shopName").textContent=STATE.settings.shop.name;
  const _shopSub=document.getElementById("shopSub"); if(_shopSub)_shopSub.textContent=STATE.settings.shop.subtitle||"";
  if(STATE.settings.shop.logo){document.getElementById("logo").textContent="";document.getElementById("logo").style.background=`url(${STATE.settings.shop.logo}) center/cover`;}
  const bg=STATE.settings.shop.bgImage;document.body.style.backgroundImage=bg?`url(${bg.src})`:"";
  if(bg){document.body.style.backgroundSize=bg.tile?"auto":"cover";document.body.style.backgroundAttachment="fixed";document.body.style.opacity=1;}
  const n=STATE.settings.nav;document.documentElement.style.setProperty("--nav-bar",n.barColor);document.documentElement.style.setProperty("--nav-active",n.activeColor);document.documentElement.style.setProperty("--nav-inactive",n.inactiveColor);
}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function pickCard(bg,text){return (bg.replace("#","").length>=6 && lum(bg)>140)?"#ffffff":"#1c1c1e";}
function lum(hex){const n=parseInt(hex.slice(1),16);const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;return 0.2126*r+0.7152*g+0.0722*b;}

/* ============ 身份 ============ */
async function ensureIdentity(){let id=localStorage.getItem("leslie_id");if(!id){id=uid();localStorage.setItem("leslie_id",id);}let ids=await Store.loadIdentities();STATE.identity=ids[id]||{id,phone:null,collections:[],history:[],points:0,createdAt:Date.now(),momentsReadAt:0,inviteCode:"",invitedBy:null,pointsLog:[],invites:[],redeemed:[]};STATE.identity.id=id;if(STATE.identity.momentsReadAt===undefined)STATE.identity.momentsReadAt=0;if(!STATE.identity.inviteCode)STATE.identity.inviteCode=(STATE.identity.phone?STATE.identity.phone.slice(-4):"")+Math.random().toString(36).slice(2,6).toUpperCase();}
async function persistIdentity(){const ids=await Store.loadIdentities();ids[STATE.identity.id]=STATE.identity;await Store.saveIdentities(ids);}

/* ============ 数据筛选 ============ */
function onShelfProducts(){return STATE.products.filter(p=>p.onShelf!==false);}
function productsByFilter(f){
  let list=onShelfProducts();
  if(!f||f.type==="all")return list;
  if(f.type==="cat")return list.filter(p=>p.cat===f.value);
  if(f.type==="series")return list.filter(p=>p.series===f.value);
  if(f.type==="manual")return list.filter(p=>Array.isArray(f.value)&&f.value.includes(p.id));
  if(f.type==="tag")return list.filter(p=>(p.tags||[]).includes(f.value));
  return list;
}
function sortProducts(list){return list.slice().sort((a,b)=>(a.order||0)-(b.order||0));}

/* ============ 卡片渲染 ============ */
function cardHTML(p){
  const img=(p.images&&p.images[0])||"";
  const act=(STATE.settings.switches.activityTag&&p.activity)?`<div class="badge">${esc(p.activity)}</div>`:"";
  const col=(STATE.settings.switches.collections&&STATE.identity.collections.includes(p.id))?`<div class="collected">★</div>`:"";
  const off=(p.onShelf===false)?`<div class="offshelf">已下架</div>`:"";
  const tags=(p.tags||[]).map(t=>`<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join("");
  return `<div class="card" data-id="${p.id}"><div class="img"><img loading="lazy" src="${img}" alt="">${act}${col}${off}</div>
    <div class="body"><div class="nm">${esc(p.name||"（未命名产品）")}</div>${p.brand?`<div class="br">${esc(p.brand)}</div>`:""}<div class="tags">${tags}</div></div></div>`;
}

/* ============ 渲染：首页(产品展示) ============ */
function renderBanner(){
  const b=document.getElementById("banner");const cfg=STATE.settings.banner;
  if(!STATE.settings.switches.banner||!cfg.enabled||!cfg.items.length){b.classList.add("hidden");return;}
  b.classList.remove("hidden");
  b.innerHTML=`<div class="track">${cfg.items.map(it=>`<div class="slide" data-link="${esc(it.link||"")}"><img src="${it.img}" loading="lazy"></div>`).join("")}</div><div class="dots">${cfg.items.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>`;
  b.querySelectorAll(".slide").forEach(s=>s.onclick=()=>{if(s.dataset.link)window.open(s.dataset.link,"_blank");});
}
function renderCats(){
  const wrap=document.getElementById("cats");
  if(!STATE.settings.switches.category||!STATE.settings.categories.filter(c=>!c.hidden).length){wrap.classList.add("hidden");return;}
  wrap.classList.remove("hidden");wrap.className="cats "+STATE.settings.catTabStyle;
  const vis=STATE.settings.categories.filter(c=>!c.hidden).sort((a,b)=>(a.order||0)-(b.order||0));
  const all=`<div class="cat ${STATE.currentCat==="all"?"on":""}" data-c="all">全部</div>`;
  wrap.innerHTML=all+vis.map(c=>`<div class="cat ${STATE.currentCat===c.id?"on":""}" data-c="${c.id}">${c.icon?c.icon+" ":""}${esc(c.name)}</div>`).join("");
  wrap.querySelectorAll(".cat").forEach(el=>el.onclick=()=>{STATE.currentCat=el.dataset.c;renderHome();});
}
function sectionVisibleProducts(sec){
  let list=productsByFilter(sec.filter);
  if(STATE.currentCat!=="all")list=list.filter(p=>p.cat===STATE.currentCat);
  if(STATE.search){const q=STATE.search.toLowerCase();list=list.filter(p=>(p.name+" "+(p.brand||"")+" "+(p.tags||[]).join(" ")+" "+plain(p.desc)).toLowerCase().includes(q));}
  if(STATE.filterTag)list=list.filter(p=>(p.tags||[]).includes(STATE.filterTag));
  return sortProducts(list);
}
function renderSection(sec){
  const list=sectionVisibleProducts(sec);
  let inner="";
  const head=`<div class="sec-head">${sec.cover?`<img class="sec-cover" src="${sec.cover}" loading="lazy">`:""}<h2>${esc(sec.title)}</h2>${sec.subtitle?`<div class="st">${esc(sec.subtitle)}</div>`:""}</div>`;
  if(!list.length)return `<div class="section">${head}<div class="empty">该板块暂无产品</div></div>`;
  const cards=list.map(cardHTML).join("");
  const lay=sec.layout||"grid";
  if(lay==="nine")inner=`<div class="grid">${cards}</div>`;
  else if(lay==="carousel")inner=`<div class="track">${list.map(p=>`<div style="flex:0 0 82%">${cardHTML(p)}</div>`).join("")}</div>`;
  else if(lay==="list")inner=`<div class="list">${cards}</div>`;
  else if(lay==="waterfall")inner=`<div class="lay-waterfall">${cards}</div>`;
  else if(lay==="stack")inner=`<div class="stack">${cards}</div>`;
  else if(lay==="menu"){const first=list[0];inner=`<div class="menuwrap"><div class="mlist">${list.map((p,i)=>`<div class="mi ${i===0?"on":""}" data-id="${p.id}">${esc(p.name||"未命名")}</div>`).join("")}</div><div class="mview" id="menuView">${cardHTML(first)}</div></div>`;}
  else if(lay==="pure")inner=`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${cards}</div>`;
  else if(lay==="custom")inner=`<div class="grid" style="grid-template-columns:repeat(${sec.cols||3},1fr)">${cards}</div>`;
  else inner=`<div class="grid">${cards}</div>`;
  return `<div class="section lay-${lay==="custom"?"custom":lay}">${head}${inner}</div>`;
}
function bindCardClicks(root){
  root.querySelectorAll(".card").forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
  root.querySelectorAll(".tag[data-tag]").forEach(el=>el.onclick=(e)=>{e.stopPropagation();STATE.filterTag=el.dataset.tag;STATE.search="";document.getElementById("searchInput").value="";renderHome();toast("已筛选功效："+el.dataset.tag);});
  root.querySelectorAll(".mlist .mi").forEach(el=>el.onclick=()=>{root.querySelectorAll(".mlist .mi").forEach(x=>x.classList.remove("on"));el.classList.add("on");document.getElementById("menuView").innerHTML=cardHTML(STATE.products.find(p=>p.id===el.dataset.id));bindCardClicks(document.getElementById("menuView"));});
}
function renderHome(){
  renderBanner();renderCats();renderSearch();
  const cont=document.getElementById("sections");
  const secs=STATE.settings.sections.filter(s=>!s.hidden).sort((a,b)=>(a.order||0)-(b.order||0));
  if(STATE.settings.switches.series){
    const seriesVis=STATE.settings.series.filter(s=>!s.hidden).sort((a,b)=>(a.order||0)-(b.order||0));
    let html="";
    secs.forEach(sec=>{html+=renderSection(sec);});
    seriesVis.forEach(se=>{
      const list=sortProducts(onShelfProducts().filter(p=>p.series===se.id));
      if(list.length)html+=`<div class="section series-group"><div class="sg-head"><img src="${se.cover||""}" onerror="this.style.display='none'"><div class="sg-t">${esc(se.name)}</div></div>${se.desc?`<div class="sg-desc">${esc(se.desc)}</div>`:""}<div class="grid">${list.map(cardHTML).join("")}</div></div>`;
    });
    cont.innerHTML=html;
  } else {
    cont.innerHTML=secs.map(renderSection).join("");
  }
  document.getElementById("empty").classList.toggle("hidden",cont.innerHTML.trim()!=="");
  bindCardClicks(cont);
}
function renderSearch(){document.getElementById("searchBar").classList.toggle("hidden",!STATE.settings.switches.search);}

/* ============ 详情页 ============ */
function openDetail(id){const p=STATE.products.find(x=>x.id===id);if(!p)return;STATE.detailId=id;STATE.detailImg=0;
  document.getElementById("ovTitle").textContent=p.name||"产品详情";
  const collected=STATE.settings.switches.collections&&STATE.identity.collections.includes(id);
  document.getElementById("collectBtn").innerHTML=collected?"★ 已收藏":"☆ 收藏";
  if(STATE.settings.switches.browseHistory){STATE.identity.history=STATE.identity.history.filter(h=>h.id!==id);STATE.identity.history.unshift({id,ts:Date.now()});STATE.identity.history=STATE.identity.history.slice(0,50);persistIdentity();}
  if(STATE.settings.switches.points){const g=(STATE.settings.points&&STATE.settings.points.perBrowse)||1;STATE.identity.points+=g;STATE.identity.pointsLog=STATE.identity.pointsLog||[];STATE.identity.pointsLog.push({ts:Date.now(),type:"browse",detail:"浏览产品："+(p.name||""),amount:g});persistIdentity();}
  renderDetail();renderDetailActions(p);
  document.getElementById("overlay").classList.remove("hidden");
}
function renderDetail(){
  const p=STATE.products.find(x=>x.id===STATE.detailId);if(!p)return;
  const media=(p.images||[]).slice();
  if(STATE.settings.switches.video&&p.video)media.push("__video__");
  const cur=media[STATE.detailImg]||"";
  let slide=cur==="__video__"?`<video src="${p.video}" controls autoplay></video>`:`<img src="${cur}" alt="">`;
  const dots=media.map((_,i)=>`<i class="${i===STATE.detailImg?"on":""}"></i>`).join("");
  const act=(STATE.settings.switches.activityTag&&p.activity)?`<span class="badge" style="position:static;display:inline-block;margin-bottom:8px">${esc(p.activity)}</span>`:"";
  const tags=(p.tags||[]).map(t=>`<span class="et" data-tag="${esc(t)}">#${esc(t)}</span>`).join("");
  let stock="";if(p.stock!==undefined&&p.stock!==null&&p.stock!==""){stock=`<div class="stock">库存：<span class="${p.stock>0?"ok":"no"}">${p.stock>0?p.stock+" 件（有货）":"缺货"}</span></div>`;}
  let end="";if(p.endTime){const diff=new Date(p.endTime).getTime()-Date.now();if(diff>0){const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000);end=`<div class="stock">活动倒计时：<span class="ok">${d}天${h}时</span></div>`;}}
  const long=STATE.settings.switches.longImage&&p.longImage?`<div class="longimg"><img src="${p.longImage}" loading="lazy"></div>`:"";
  document.getElementById("ovBody").innerHTML=
    `<div class="slider">${slide}</div><div class="dots">${dots}</div>
     <div class="d-name">${esc(p.name||"未命名产品")}</div>${p.brand?`<div class="d-brand">品牌：${esc(p.brand)}</div>`:""}
     ${act}<div class="eff-tags">${tags}</div>${stock}${end}
     <div class="d-desc">${p.desc||"<span style='color:#bbb'>暂无描述</span>"}</div>${long}`;
  document.querySelectorAll("#ovBody .dots i").forEach((el,i)=>el.onclick=()=>{STATE.detailImg=i;renderDetail();});
  if(media.length>1)document.querySelector("#ovBody .slider").onclick=()=>{STATE.detailImg=(STATE.detailImg+1)%media.length;renderDetail();};
  document.querySelectorAll("#ovBody .et").forEach(el=>el.onclick=()=>{STATE.filterTag=el.dataset.tag;document.getElementById("overlay").classList.add("hidden");STATE.search="";document.getElementById("searchInput").value="";renderHome();toast("已筛选功效："+el.dataset.tag);});
}
function renderDetailActions(p){
  const bar=document.getElementById("dActions");const els=[];
  if(STATE.settings.switches.buyButton&&p.buyLink){els.push(`<button class="btn primary" id="actBuy">${esc(p.buyText||"去购买")}</button>`);}
  if(STATE.settings.switches.collections){const col=STATE.identity.collections.includes(p.id);els.push(`<button class="btn" id="actCollect">${col?"★ 已收藏":"☆ 收藏"}</button>`);}

function momentsPublished(){const now=Date.now();return (STATE.settings.moments.posts||[]).filter(p=>p.status==="published"&&p.ts<=now);}
function momentsUnread(){const now=Date.now();const readAt=STATE.identity.momentsReadAt||0;return momentsPublished().filter(p=>p.ts>readAt).length;}
function fmtTime(ts){const d=Date.now()-ts;if(d<60000)return"刚刚";if(d<3600000)return Math.floor(d/60000)+"分钟前";if(d<86400000)return Math.floor(d/3600000)+"小时前";if(d<86400000*7)return Math.floor(d/86400000)+"天前";const dt=new Date(ts);return (dt.getMonth()+1)+"月"+dt.getDate()+"日";}
function renderMoments(){
  const m=STATE.settings.moments;const now=Date.now();
  const cover=m.cover?`<div class="moments-cover" style="background-image:url('${m.cover}')"><img class="cover-img" src="${m.cover}" onerror="this.style.display='none'"><div class="me">${m.author.avatar?`<img class="av" src="${m.author.avatar}">`:`<div class="av" style="display:flex;align-items:center;justify-content:center;background:#e4393c;color:#fff;font-weight:700">${esc((m.author.nickname||"店")[0])}</div>`}<div class="nm">${esc(m.author.nickname||"店铺")}</div></div></div>`:`<div class="moments-cover" style="background:#333"><div style="height:100%"></div><div class="me">${m.author.avatar?`<img class="av" src="${m.author.avatar}">`:`<div class="av" style="display:flex;align-items:center;justify-content:center;background:#e4393c;color:#fff;font-weight:700">${esc((m.author.nickname||"店")[0])}</div>`}<div class="nm">${esc(m.author.nickname||"店铺")}</div></div></div>`;
  let posts=momentsPublished().slice().sort((a,b)=>{
    if(a.pinned&&!b.pinned)return -1;if(b.pinned&&!a.pinned)return 1;
    return (b.ts||0)-(a.ts||0);
  });
  let body="";
  if(!posts.length){body=`<div class="empty">商家还没有发布动态</div>`;}
  else{
    body=posts.map(p=>{
      const av=p.author&&p.author.avatar?`<img class="av" src="${p.author.avatar}">`:`<div class="av" style="display:flex;align-items:center;justify-content:center;background:#e4393c;color:#fff;font-weight:700">${esc((p.author&&p.author.nickname||"店")[0])}</div>`;
      let imgs="";
      if(p.imgs&&p.imgs.length){
        const cls=p.imgs.length===1?"imgs s1":"imgs";
        const cells=p.imgs.map((src,i)=>("<div class=\"ph\" data-pid=\""+p.id+"\" data-idx=\""+i+"\"><img src=\""+src+"\" loading=\"lazy\" alt=\"\"></div>")).join("");
        imgs=`<div class="${cls}">`+cells+`</div>`;
      }
      const vid=p.video?`<div class="vid"><video src="${p.video}" controls preload="none"></video></div>`:"";
      const prod=p.productId?(STATE.products.find(x=>x.id===p.productId)):null;
      const prodHtml=prod?`<div class="prod" data-pid="${prod.id}"><img src="${prod.images&&prod.images[0]||''}" onerror="this.style.display='none'"><div class="pn">${esc(prod.name||"产品")}</div><div class="hint">查看详情 ›</div></div>`:"";
      const liked=(p.likes||[]).some(l=>!l.virtual&&l.uid===STATE.identity.id);
      const likeList=(p.likes||[]).map(l=>`${esc(l.name||"匿名")}`).join("、");
      const cmts=(p.comments||[]).filter(c=>c.status==="approved");
      const cmtHtml=cmts.map(c=>`<div class="cmt"><span class="cn">${esc(c.name||"匿名")}：</span>${esc(c.text||"")}${c.reply?`<span class="cr">商家回复：${esc(c.reply)}</span>`:""}</div>`).join("");
      return `<div class="mpost" data-pid="${p.id}">
        <div class="top">${av}<div class="meta"><div class="nn">${esc(p.author?p.author.nickname:(m.author.nickname||"商家"))}</div>${p.text?`<div class="txt">${esc(p.text)}</div>`:""}</div></div>
        ${imgs}${vid}${prodHtml}
        <div class="bar">
          <div class="act ${(liked?"on":"")}" data-like="${p.id}">👍 ${liked?"已赞":"赞"}</div>
          <div class="act" data-cmt="${p.id}">💬 评论</div>
          <div class="act" data-share="${p.id}">📤 分享</div>
          <div style="margin-left:auto;color:#bbb;font-size:12px">${fmtTime(p.ts)}${p.pinned?'<span class="pin-tag">置顶</span>':""}</div>
        </div>
        <div class="likes ${likeList?"show":""}">${likeList?"❤ "+likeList:""}</div>
        <div class="cmts ${cmtHtml?"show":""}">${cmtHtml}</div>
        <div class="cinput" data-cinput="${p.id}" style="display:none"><input placeholder="说点什么…" data-ci="${p.id}"><button class="btn sm primary" data-csend="${p.id}">发送</button></div>
      </div>`;
    }).join("");
  }
  document.getElementById("momentsBody").innerHTML=cover+`<div class="moments-list">${body}</div>`;
  // 绑定事件
  const mb=document.getElementById("momentsBody");
  mb.querySelectorAll(".ph").forEach(el=>el.onclick=()=>{const pp=STATE.settings.moments.posts.find(x=>x.id===el.dataset.pid);if(pp)openLightbox(pp.imgs,+el.dataset.idx);});
  mb.querySelectorAll(".prod").forEach(el=>el.onclick=()=>openDetail(el.dataset.pid));
  mb.querySelectorAll("[data-like]").forEach(el=>el.onclick=()=>toggleMomentLike(el.dataset.like));
  mb.querySelectorAll("[data-cmt]").forEach(el=>el.onclick=()=>{const ci=mb.querySelector(`[data-cinput="${el.dataset.cmt}"]`);ci.style.display=ci.style.display==="none"?"flex":"none";if(ci.style.display!=="none")ci.querySelector("input").focus();});
  mb.querySelectorAll("[data-csend]").forEach(el=>el.onclick=()=>sendMomentComment(el.dataset.csend));
  mb.querySelectorAll("[data-share]").forEach(el=>el.onclick=()=>shareMoment(el.dataset.share));
  // 浏览量 + 未读清零
  posts.forEach(p=>{p.views=(p.views||0)+1;});
  STATE.identity.momentsReadAt=now;persistIdentity();
  Store.saveAll();renderNav();
}
function openLightbox(imgs,idx){
  const lb=document.getElementById("lightbox");const img=document.getElementById("lbImg");const info=document.getElementById("lbInfo");
  let i=idx||0;
  function show(){img.src=imgs[i];info.textContent=(i+1)+" / "+imgs.length;}
  lb.classList.add("show");show();
  lb.querySelectorAll && (lb.onclick=(e)=>{if(e.target===lb||e.target.id==="lbClose")lb.classList.remove("show");});
  lb.onclick=(e)=>{if(e.target===lb||e.target.id==="lbClose")lb.classList.remove("show");};
  let sx=0;
  img.ontouchstart=(e)=>{sx=e.changedTouches[0].clientX;};
  img.ontouchend=(e)=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){i=(dx<0?i+1:i-1+imgs.length)%imgs.length;show();}};
  img.onclick=(e)=>{i=(i+1)%imgs.length;show();};
}
function toggleMomentLike(pid){
  const p=STATE.settings.moments.posts.find(x=>x.id===pid);if(!p)return;
  p.likes=p.likes||[];const k=p.likes.findIndex(l=>!l.virtual&&l.uid===STATE.identity.id);
  if(k>=0)p.likes.splice(k,1);else p.likes.push({uid:STATE.identity.id,name:STATE.identity.phone?("客户"+STATE.identity.phone.slice(-4)):"我",virtual:false,ts:Date.now()});
  Store.saveAll();renderMoments();
}
function sendMomentComment(pid){
  const p=STATE.settings.moments.posts.find(x=>x.id===pid);if(!p)return;
  const inp=document.querySelector(`[data-ci="${pid}"]`);const txt=inp.value.trim();if(!txt){toast("请输入评论内容");return;}
  const auto=STATE.settings.moments.auditMode==="auto";
  p.comments=p.comments||[];
  p.comments.push({id:uid(),uid:STATE.identity.id,name:STATE.identity.phone?("客户"+STATE.identity.phone.slice(-4)):"我",text:txt,ts:Date.now(),status:auto?"approved":"pending",reply:"",virtual:false});
  inp.value="";
  Store.saveAll();renderMoments();
  toast(auto?"评论已发布":"评论已提交，等待商家审核");

function shareMoment(pid){
  const p=STATE.settings.moments.posts.find(x=>x.id===pid);if(p)p.shares=(p.shares||0)+1;
  Store.saveAll();
  openSharePicker({type:"moment",pid});

function moveOrder(id,dir){const list=STATE.products.slice().sort((a,b)=>(a.order||0)-(b.order||0));const i=list.findIndex(p=>p.id===id);if(i<0)return;const j=i+dir;if(j<0||j>=list.length)return;const a=list[i],bb=list[j];const t=a.order;a.order=bb.order;bb.order=t;STATE.products=list;Store.saveAll().then(()=>{renderPanel();renderHome();});}
function bindDnD(box,kind){
  let drag=null;
  box.querySelectorAll(".draggable").forEach(el=>{
    el.ondragstart=()=>{drag=el;el.classList.add("drag");};
    el.ondragend=()=>{el.classList.remove("drag");drag=null;};
    el.ondragover=(e)=>{e.preventDefault();};
    el.ondrop=(e)=>{e.preventDefault();if(!drag||drag===el)return;const id=drag.dataset.id;const tgt=el.dataset.id;
      const list=STATE.products.slice().sort((a,b)=>(a.order||0)-(b.order||0));
      const from=list.findIndex(p=>p.id===id),to=list.findIndex(p=>p.id===tgt);
      const [m]=list.splice(from,1);list.splice(to,0,m);list.forEach((p,i)=>p.order=i);
      STATE.products=list;Store.saveAll().then(()=>{renderPanel();renderHome();});};
  });
}

  b.querySelector("#bBack").onclick=()=>renderPanel();

  fill("f_order",p?(p.order||0):0);

function fill(id,v){const el=document.getElementById(id);if(el)el.value=v;}
function loadDraftIntoForm(){
  fill("f_name",FORM.name||"");fill("f_brand",FORM.brand||"");fill("f_tags",(FORM.tags||[]).join(","));

function parseDateTime(s){try{let t=String(s).replace(/[年月]/g,'-').replace(/[日]/g,' ').replace(/[./]/g,'-');const m=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[\sT]+(\d{1,2}):(\d{2}))?/);if(m){const y=m[1],mo=String(m[2]).padStart(2,'0'),d=String(m[3]).padStart(2,'0');const hh=m[4]?String(m[4]).padStart(2,'0'):'00';const mm=m[5]||'00';return y+'-'+mo+'-'+d+'T'+hh+':'+mm;}}catch(e){}return null;}
function parseProductText(text){
  const lines=String(text||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  if(!lines.length)return {};
  const esc=function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');};
  const get=function(keys){for(const ln of lines){for(const k of keys){const m=ln.match(new RegExp('^'+esc(k)+'\\s*[:：]\\s*(.+)$'));if(m)return m[1].trim();}}return null;};
  const r={};
  let name=get(['产品名称','商品名称','商品名','品名','名称','标题','名字','产品名']);
  if(!name){const first=lines.find(function(l){return !/^https?:\/\//i.test(l);});if(first)name=first;}
  if(name)r.name=name;
  const brand=get(['品牌','牌子','商标']);if(brand)r.brand=brand;
  const cat=get(['分类','类别','品类']);if(cat)r.cat=cat;
  const series=get(['系列','产品线']);if(series)r.series=series;
  const tagsRaw=get(['核心功效','主要功效','功效标签','功效','卖点','标签','特点','特色']);
  if(tagsRaw){const t=tagsRaw.split(/[,，、;；\s]+/).map(function(s){return s.trim();}).filter(Boolean);if(t.length)r.tags=t;}
  const actRaw=get(['活动标签','活动类型','活动','促销']);if(actRaw)r.activity=actRaw;
  const stockRaw=get(['库存数量','库存','存货','现货']);if(stockRaw){const m=stockRaw.match(/\d+/);if(m)r.stock=m[0];}
  const endRaw=get(['活动结束时间','结束时间','活动截止','有效期至','截止','到期']);if(endRaw){const dt=parseDateTime(endRaw);if(dt)r.endTime=dt;}
  const buyText=get(['按钮文字','购买文字','按钮']);if(buyText)r.buyText=buyText;
  const buyLinkRaw=get(['购买链接','下单链接','商品链接','链接','购买','下单']);
  if(buyLinkRaw){const m=buyLinkRaw.match(/https?:\/\/\S+/i);if(m)r.buyLink=m[0];else if(/^https?:\/\//i.test(buyLinkRaw.trim()))r.buyLink=buyLinkRaw.trim();}
  if(!r.buyLink){const all=lines.join('\n').match(/https?:\/\/\S+/i);if(all)r.buyLink=all[0];}
  const shareTitle=get(['分享标题','分享']);if(shareTitle)r.shareTitle=shareTitle;
  const shareDesc=get(['分享描述','分享说明']);if(shareDesc)r.shareDesc=shareDesc;
  const LAB=/^(产品名称|商品名称|商品名|品名|名称|标题|品牌|牌子|商标|分类|类别|品类|系列|产品线|功效|卖点|标签|特点|特色|活动|促销|库存|存货|结束时间|有效期至|截止|到期|按钮文字|购买文字|购买链接|链接|下单|分享|描述|详情|介绍|说明|文案|正文)[:：]/;
  const dkeys=['产品描述','产品介绍','描述','详情','介绍','说明','文案','正文'];
  let desc=null;
  for(let i=0;i<lines.length;i++){for(const k of dkeys){const m=lines[i].match(new RegExp('^'+esc(k)+'\\s*[:：]\\s*(.*)$'));if(m){const inline=m[1].trim();const out=[];if(inline)out.push(inline);for(let j=i+1;j<lines.length;j++){if(LAB.test(lines[j]))break;out.push(lines[j]);}if(out.length){const joined=out.join('\n').trim();if(!desc||joined.length>desc.length)desc=joined;}}}}
  if(!desc){const left=lines.filter(function(ln){return ln!==name&&!/^https?:\/\//i.test(ln)&&!LAB.test(ln);});if(left.length)desc=left.join('\n').trim();}
  if(desc)r.desc=desc;
  return r;
}
function applyParsed(r){
  const filled=[];
  if(r.name){fill('f_name',r.name);filled.push('标题');}
  if(r.brand){fill('f_brand',r.brand);filled.push('品牌');}
  if(r.cat){const fc=document.getElementById('f_cat');const c=(STATE.settings.categories||[]).find(function(c){return c.name&&(c.name===r.cat||c.name.indexOf(r.cat)>=0||r.cat.indexOf(c.name)>=0);});if(c){fc.value=c.id;filled.push('分类');}}
  if(r.series){const fs=document.getElementById('f_series');const s=(STATE.settings.series||[]).find(function(s){return s.name&&(s.name===r.series||s.name.indexOf(r.series)>=0||r.series.indexOf(s.name)>=0);});if(s){fs.value=s.id;filled.push('系列');}}
  if(r.tags){fill('f_tags',r.tags.join(','));filled.push('功效标签');}
  if(r.activity){const sel=document.getElementById('f_act');const known=['爆款','秒杀','有活动','新品','推荐'];const hit=known.find(function(k){return k===r.activity||r.activity.indexOf(k)>=0;});if(hit){sel.value=hit;filled.push('活动标签');}else{sel.value='__custom__';fill('f_act_custom',r.activity);document.getElementById('f_act_custom').classList.remove('hidden');filled.push('活动标签');}}
  if(r.stock!==undefined&&r.stock!==null){fill('f_stock',r.stock);filled.push('库存');}
  if(r.endTime){fill('f_end',r.endTime);filled.push('结束时间');}
  if(r.buyText){fill('f_buytxt',r.buyText);filled.push('按钮文字');}
  if(r.buyLink){fill('f_buylink',r.buyLink);filled.push('购买链接');}
  if(r.shareTitle){fill('f_sharetitle',r.shareTitle);filled.push('分享标题');}
  if(r.shareDesc){fill('f_sharedesc',r.shareDesc);filled.push('分享描述');}
  if(r.desc){FORM.desc=r.desc;const pv=document.getElementById('f_desc_preview');if(pv)pv.textContent=plain(r.desc).slice(0,40)+(r.desc.length>40?'…':'');filled.push('描述');}
  return filled;
}
async function doPasteFill(){
  const modal=document.getElementById('formModal');

  let text=null;
  try{if(navigator.clipboard&&navigator.clipboard.readText)text=await navigator.clipboard.readText();}catch(e){text=null;}
  if(!text||!text.trim()){openPasteModal();return;}
  if(isPureUrl(text.trim())){const im=openImportModal();const ta=im.querySelector('#imfInput');ta.value=text.trim();const st=im.querySelector('#imfStatus');if(st)st.textContent='检测到是商品链接，点「识别」即可自动抓取（抓取失败会自动改用文案解析）。';return;}
  const filled=applyParsed(parseProductText(text));
  const hint=document.getElementById('pasteHint');
  if(filled.length){toast('已自动填入：'+filled.join('、'));if(hint)hint.textContent='已识别 '+filled.length+' 项';}
  else{toast('未识别到可填充字段，请检查粘贴内容');if(hint)hint.textContent='未识别到字段';}
}

function unescapeHtml(s){if(!s)return s;const d=document.createElement('div');d.innerHTML=String(s).replace(/<\/?[^>]*>/g,'');return (d.textContent||String(s)).replace(/\s+/g,' ').trim();}
function isProductUrl(s){return /https?:\/\/[^\s"'<>]*?(taobao\.com|tmall\.com|1688\.com|alibaba\.com|yangkeduo\.com|pinduoduo\.com)/i.test(s);}
function isPureUrl(s){return /^\s*https?:\/\/\S+\s*$/.test(s);}
function firstUrl(s){const m=String(s||'').match(/https?:\/\/[^\s"'<>]+/i);return m?m[0]:null;}
function looksStructured(t){if(/[\u4e00-\u9fa5]{2,}[:：]/.test(String(t||'')))return true;if(/^(product|name|brand|title|category|tags?|description)[:：]/im.test(String(t||'').trim()))return true;return false;}
const IMPORT_TARGETS=[
 {v:'f_name',t:'标题'},
 {v:'f_brand',t:'品牌'},
 {v:'f_cat',t:'分类'},

function defaultTarget(label){
  if(/分享标题/.test(label))return 'f_sharetitle';
  if(/分享描述|分享说明/.test(label))return 'f_sharedesc';
  if(/标题|名称|品名/.test(label))return 'f_name';
  if(/品牌/.test(label))return 'f_brand';
  if(/分类/.test(label))return 'f_cat';
  if(/系列/.test(label))return 'f_series';
  if(/功效/.test(label))return 'f_tags';
  if(/活动/.test(label))return 'f_act';
  if(/标签|卖点|特点/.test(label))return 'f_tags';
  if(/库存/.test(label))return 'f_stock';
  if(/结束|截止|到期/.test(label))return 'f_end';
  if(/购买文字|按钮文字/.test(label))return 'f_buytxt';
  if(/链接|购买|下单/.test(label))return 'f_buylink';
  if(/缩略|主图|图片|封面/.test(label))return 'f_sharethumb';
  if(/描述|详情|介绍|说明|文案|正文/.test(label))return 'desc';
  return '';
}
function objectToFields(r){
  const map=[['name','标题'],['brand','品牌'],['cat','分类'],['series','系列'],['tags','功效标签'],['activity','活动标签'],['stock','库存'],['endTime','结束时间'],['buyText','购买按钮文字'],['buyLink','购买链接'],['shareTitle','分享标题'],['shareDesc','分享描述'],['desc','产品描述']];
  const out=[];
  map.forEach(function(kv){let v=r[kv[0]];if(v===undefined||v===null||v==='')return;if(Array.isArray(v))v=v.join(', ');out.push({label:kv[1],value:String(v),target:defaultTarget(kv[1])});});
  return out;
}
function getMeta(html,prop){
  let m=html.match(new RegExp('<meta[^>]*?(property|name)\\s*=\\s*["\']'+prop+'["\'][^>]*?content\\s*=\\s*["\']([^"\']*)["\']','i'));
  if(m)return m[2];
  m=html.match(new RegExp('<meta[^>]*?content\\s*=\\s*["\']([^"\']*)["\'][^>]*?(property|name)\\s*=\\s*["\']'+prop+'["\']','i'));
  if(m)return m[1];
  return null;
}
function parseProductHtml(html,url){
  const fields=[];
  let title=getMeta(html,'og:title');
  if(!title){const m=html.match(/<title>([^<]*)<\/title>/i);if(m){title=m[1].replace(/\s*[-–|｜]\s*(淘宝|天猫|阿里巴巴|1688|拼多多|PDD|Taobao|Tmall|Alibaba|Pinduoduo).*$/i,'').trim();}}
  if(!title){const m=html.match(/goodsName["']?\s*:\s*["']([^"']+)["']/i);if(m)title=m[1];}
  if(title)fields.push({label:'标题',value:unescapeHtml(title),target:'f_name'});
  const pm=html.match(/"price"\s*:\s*"?(\d+\.?\d*)"?(?:\s*[,}])/i)||html.match(/"minGroupPrice"\s*:\s*"?(\d+)"/i)||html.match(/"minNormalPrice"\s*:\s*"?(\d+)"/i)||html.match(/￥\s*(\d+\.?\d*)/)||html.match(/class="tb-rmb-num"[^>]*>([\d.]+)/i)||html.match(/offerPrice["']?\s*:\s*"?(\d+\.?\d*)/i);
  if(pm){let p=pm[1];if(/^\d+$/.test(p)&&Number(p)>1000)p=(Number(p)/100).toFixed(2).replace(/\.00$/,'');fields.push({label:'价格',value:p,target:''});}
  let img=getMeta(html,'og:image');if(img)fields.push({label:'主图',value:img,target:'f_sharethumb'});
  let desc=getMeta(html,'og:description')||getMeta(html,'description');if(desc)fields.push({label:'产品描述',value:unescapeHtml(desc),target:'desc'});
  let brand=getMeta(html,'og:brand');if(brand)fields.push({label:'品牌',value:unescapeHtml(brand),target:'f_brand'});
  return fields;
}
async function fetchProductPage(url){
  const PROXIES=[u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://thingproxy.freeboard.io/fetch/'+u];
  for(let i=0;i<PROXIES.length;i++){
    try{
      const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
      const to=ctrl?setTimeout(function(){ctrl.abort();},12000):null;
      const r=await fetch(PROXIES[i](url),{mode:'cors',signal:ctrl?ctrl.signal:undefined});
      if(to)clearTimeout(to);
      if(r&&r.ok){const t=await r.text();if(t&&t.length>500)return t;}
    }catch(e){}
  }
  return null;
}
function importByTarget(target,value){

  if(target==='desc'){FORM.desc=value;const pv=document.getElementById('f_desc_preview');if(pv)pv.textContent=plain(value).slice(0,40)+(value.length>40?'…':'');return;}
  if(target==='f_cat'){const fc=document.getElementById('f_cat');const c=(STATE.settings.categories||[]).find(function(x){return x.name&&(x.name===value||x.name.indexOf(value)>=0||value.indexOf(x.name)>=0);});fc.value=c?c.id:'';return;}
  if(target==='f_series'){const fs=document.getElementById('f_series');const s=(STATE.settings.series||[]).find(function(x){return x.name&&(x.name===value||x.name.indexOf(value)>=0||value.indexOf(x.name)>=0);});fs.value=s?s.id:'';return;}
  if(target==='f_act'){const sel=document.getElementById('f_act');const known=['爆款','秒杀','有活动','新品','推荐'];const hit=known.find(function(k){return k===value||value.indexOf(k)>=0;});const cu=document.getElementById('f_act_custom');if(hit){sel.value=hit;cu.classList.add('hidden');}else{sel.value='__custom__';cu.value=value;cu.classList.remove('hidden');}return;}
  if(target==='f_end'){const dt=parseDateTime(value);fill(target,dt||value);return;}
  if(target==='f_stock'){const m=value.match(/\d+/);if(m)fill(target,m[0]);return;}
  const el=document.getElementById(target);if(el)el.value=value;
}

  ta.addEventListener('paste',function(e){setTimeout(function(){const s=ta.querySelector('#imfStatus');if(s&&!ta.value.trim())s.textContent='已粘贴内容，请点「识别」继续。';},50);},false);

  setTimeout(function(){ta.focus();},100);
  ta.addEventListener('click',function(){ta.focus();},false);
  m.querySelector('#imfCancel').onclick=function(){m.remove();_importModal=null;};
  m.querySelector('#imfClose').onclick=function(){m.remove();_importModal=null;};

  m.querySelector('#imfAdd').onclick=function(){m.querySelector('#imfRows').appendChild(makeRow({label:'自定义字段',value:'',target:''}));};

}
async function runRecognition(m){
  const ta=m.querySelector('#imfInput');const text=ta.value.trim();
  const status=m.querySelector('#imfStatus');
  if(!text){status.textContent='请先粘贴链接或商品文案再点识别。';return;}
  const url=firstUrl(text);
  // 去掉链接后是否还包含“像描述”的文字（多行 / 含常见商品字段 / 剩余字数较多）
  const stripped=text.replace(url||'','').replace(/\s+/g,'');
  const looksDesc=text.split(/\r?\n/).length>=2||/价格|￥|¥|标题|名称|品牌|功效|卖点|描述|详情|规格|库存|券|促销|参数|材质|产地|颜色|尺寸|重量|店铺/i.test(text)||stripped.length>15;
  if(url&&!looksDesc&&!looksStructured(text)){
    const isPd=/yangkeduo\.com|pinduoduo\.com/i.test(url);
    const kind=isPd?'拼多多':(isProductUrl(url)?'电商':'链接');
    status.textContent='正在通过代理抓取页面，请稍候…（'+kind+'）';
    const html=await fetchProductPage(url);
    if(html){
      const fields=parseProductHtml(html,url);
      if(fields.length){renderImportRows(m,fields);status.textContent='已从'+kind+'链接识别 '+fields.length+' 项，请勾选并选择要导入的字段：';return;}
    }
    status.textContent='链接抓取未取到内容，已自动改用「粘贴文案解析」处理你输入的内容…';
  }
  const r=parseProductText(text);const fields=objectToFields(r);
  // 排除“纯链接被当成标题”的无效情况
  const onlyUrlTitle=fields.length===1&&fields[0].target==='f_name'&&/^https?:\/\//i.test(fields[0].value);
  if(!fields.length||onlyUrlTitle){
    status.innerHTML='未识别到可导入字段。若粘贴的是商品<strong>链接</strong>且平台反爬抓不到，请改为复制商品页的<strong>文字信息</strong>粘贴进来，或直接点「+ 添加字段」手动补。';
    return;
  }
  renderImportRows(m,fields);
  status.textContent='已识别 '+fields.length+' 项，请勾选并选择要导入的字段：';
}
function renderImportRows(m,fields){
  const box=m.querySelector('#imfRows');box.innerHTML='';
  if(!fields.length){box.innerHTML='<div class="help">没有可导入的字段。</div>';return;}
  fields.forEach(function(f){box.appendChild(makeRow(f));});
}
function makeRow(f){
  const row=document.createElement('div');row.className='imf-row';
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.className='imf-cb';
  const mid=document.createElement('div');mid.className='imf-mid';
  const lab=document.createElement('input');lab.value=f.label||'字段';lab.className='imf-lab';
  const val=document.createElement('textarea');val.value=f.value||'';val.className='imf-val';
  // 按内容行数自动撑高：至少3行，中文约18字符折一行，英文约40字符，上限25行
  const txt=f.value||'';const nl=txt.split('\n').length;const cjk=(txt.match(/[\u4e00-\u9fa5]/g)||[]).length;const nonCjk=txt.length-cjk;const est=Math.max(3,Math.min(25,nl,Math.ceil(cjk/18)+Math.ceil(nonCjk/40)));val.rows=est;
  mid.appendChild(lab);mid.appendChild(val);
  const right=document.createElement('div');right.className='imf-right';
  const sel=document.createElement('select');IMPORT_TARGETS.forEach(function(t){const o=document.createElement('option');o.value=t.v;o.textContent=t.t;if(t.v===(f.target||''))o.selected=true;sel.appendChild(o);});sel.className='imf-sel';
  const del=document.createElement('button');del.textContent='✕';del.type='button';del.className='btn sm imf-del';del.onclick=function(){row.remove();};
  right.appendChild(sel);right.appendChild(del);
  row.appendChild(cb);row.appendChild(mid);row.appendChild(right);
  row._data={cb:cb,val:val,sel:sel};
  return row;
}
function gatherAndImport(m){
  const box=m.querySelector('#imfRows');const rows=Array.from(box.querySelectorAll('.imf-row'));
  let n=0;
  rows.forEach(function(row){const d=row._data;if(!d.cb.checked)return;const target=d.sel.value;if(!target)return;importByTarget(target,d.val.value);n++;});
  m.remove();_importModal=null;
  toast('已导入 '+n+' 个字段到表单');
  const hint=document.getElementById('pasteHint');if(hint)hint.textContent='已导入 '+n+' 项';
}

function openImageEditor(src,onSave){
  const m=document.createElement("div");m.className="modal iedit";m.innerHTML=`<div class="box" style="max-width:560px"><h3>图片编辑</h3>
    <div style="text-align:center"><canvas id="iedCanvas" width="400"></canvas></div>
    <div class="ctrls">
      <div class="ctrl-row"><span>旋转</span><button class="btn sm" id="rotL">↺</button><button class="btn sm" id="rotR">↻</button><button class="btn sm" id="flipH">⇋</button><button class="btn sm" id="flipV">⇅</button></div>
      <div class="ctrl-row"><span>亮度</span><input type="range" id="br" min="-100" max="100" value="0"><span>对比</span><input type="range" id="ct" min="-100" max="100" value="0"><span>饱和</span><input type="range" id="sa" min="-100" max="100" value="0"></div>
      <div class="ctrl-row"><span>文字</span><input id="txt" placeholder="加文字" style="flex:1"><input id="txtColor" type="color" value="#ffffff" style="width:34px"><button class="btn sm" id="addTxt">加</button></div>
      <div class="ctrl-row"><span>涂鸦</span><button class="btn sm" id="drawOn">开启画笔</button><span style="font-size:11px;color:var(--c-sub)">在图上拖动绘制</span></div>
      <div class="ctrl-row"><span>裁剪</span><button class="btn sm" id="cropOn">框选裁剪</button></div>
    </div>
    <div class="help">编辑后点「保存替换」会覆盖原图；如需保留原图请先另存。视频剪辑（截取/字幕/配乐）本期未实现，仅支持上传与播放。</div>
    <div class="btn-row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="iedCancel">取消</button><button class="btn primary" id="iedSave">保存替换</button></div>
  </div>`;
  document.body.appendChild(m);
  const cv=m.querySelector("#iedCanvas");const ctx=cv.getContext("2d");
  const st={rot:0,flipH:false,flipV:false,bri:0,con:0,sat:0,texts:[],draw:[]};
  const img=new Image();img.onload=draw;img.src=src;
  let drawPts=null;
  function draw(){
    const maxW=400;let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    cv.width=w;cv.height=h;ctx.save();ctx.translate(w/2,h/2);ctx.rotate(st.rot*Math.PI/180);ctx.scale(st.flipH?-1:1,st.flipV?-1:1);ctx.filter=`brightness(${100+st.bri}%) contrast(${100+st.con}%) saturate(${100+st.sat}%)`;
    ctx.drawImage(img,-w/2,-h/2,w,h);ctx.filter="none";
    st.texts.forEach(t=>{ctx.fillStyle=t.color;ctx.font="bold 20px sans-serif";ctx.fillText(t.text,-w/2+10,-h/2+30);});
    if(st.draw.length>1){ctx.strokeStyle="#ff3b30";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(st.draw[0].x*w/400,st.draw[0].y*h/400);st.draw.forEach(p=>ctx.lineTo(p.x*w/400,p.y*h/400));ctx.stroke();}
    ctx.restore();
  }
  m.querySelector("#rotL").onclick=()=>{st.rot-=90;draw();};m.querySelector("#rotR").onclick=()=>{st.rot+=90;draw();};
  m.querySelector("#flipH").onclick=()=>{st.flipH=!st.flipH;draw();};m.querySelector("#flipV").onclick=()=>{st.flipV=!st.flipV;draw();};
  ["br","ct","sa"].forEach(id=>m.querySelector("#"+id).oninput=e=>{st[id==="br"?"bri":id==="ct"?"con":"sat"]=+e.target.value;draw();});
  m.querySelector("#addTxt").onclick=()=>{const t=m.querySelector("#txt").value.trim();if(!t)return;st.texts.push({text:t,color:m.querySelector("#txtColor").value});m.querySelector("#txt").value="";draw();};
  m.querySelector("#drawOn").onclick=()=>{cv.style.cursor="crosshair";};
  cv.onmousedown=e=>{const r=cv.getBoundingClientRect();drawPts={x:(e.clientX-r.left)/r.width*400,y:(e.clientY-r.top)/r.height*400};st.draw=[drawPts];};
  cv.onmousemove=e=>{if(!drawPts)return;const r=cv.getBoundingClientRect();st.draw.push({x:(e.clientX-r.left)/r.width*400,y:(e.clientY-r.top)/r.height*400});draw();};
  cv.onmouseup=()=>drawPts=null;
  m.querySelector("#cropOn").onclick=()=>{const r=cv.getBoundingClientRect();const x=prompt("裁剪左(%)：","0"),y=prompt("裁剪上(%)：","0"),ww=prompt("裁剪宽(%)：","100"),hh=prompt("裁剪高(%)：","100");if(x===null)return;toast("裁剪为高级功能占位，可旋转/滤镜/文字/涂鸦后保存");};
  m.querySelector("#iedCancel").onclick=()=>m.remove();
  m.querySelector("#iedSave").onclick=()=>{onSave(cv.toDataURL("image/jpeg",0.9));m.remove();toast("图片已更新");};
}

function filterName(f){if(!f)return"全部";if(f.type==="all")return"全部产品";if(f.type==="cat"){const c=STATE.settings.categories.find(x=>x.id===f.value);return"分类："+(c?c.name:f.value);}if(f.type==="series"){const s=STATE.settings.series.find(x=>x.id===f.value);return"系列："+(s?s.name:f.value);}if(f.type==="manual")return"手动选择"+(f.value?("("+f.value.length+")"):"");return"全部";}
function openSecForm(s){
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box"><h3>${s?"编辑":"添加"}板块</h3>
    <div class="field"><label>板块标题</label><input id="sf_title" value="${s?esc(s.title):""}"></div>
    <div class="field"><label>副标题</label><input id="sf_sub" value="${s?esc(s.subtitle||""):""}"></div>
    <div class="field"><label>封面图</label><input id="sf_cover" type="file" accept="image/*"><div id="sf_cn" style="font-size:12px;color:var(--c-sub)"></div></div>
    <div class="field"><label>布局风格</label><select id="sf_lay">${["grid","nine","carousel","list","waterfall","stack","menu","pure","custom"].map(l=>`<option value="${l}" ${s&&s.layout===l?"selected":""}>${layoutName(l)}</option>`).join("")}</select></div>
    <div class="field" id="colsField" style="${s&&s.layout==="custom"?"":"display:none"}"><label>每行列数</label><input id="sf_cols" type="number" value="${s&&s.cols||3}"></div>
    <div class="field"><label>展示哪些产品</label><select id="sf_filter">${["all","cat","series","manual"].map(t=>`<option value="${t}" ${s&&s.filter&&s.filter.type===t?"selected":""}>${t==="all"?"全部":t==="cat"?"按分类":t==="series"?"按系列":"手动选择"}</option>`).join("")}</select></div>
    <div class="field" id="fvalField"><div id="fvalWrap"></div></div>
    <div class="btn-row" style="justify-content:flex-end"><button class="btn" id="sfCancel">取消</button><button class="btn primary" id="sfSave">保存</button></div></div>`;
  document.body.appendChild(m);
  let cover=(s&&s.cover)||"";let filter=(s&&s.filter)||{type:"all",value:[]};
  m.querySelector("#sf_cover").onchange=async e=>{const f=e.target.files&&e.target.files[0];if(f){cover=await fileToCompressedDataURL(f);m.querySelector("#sf_cn").textContent=f.name;}};
  const renderFval=()=>{const w=m.querySelector("#fvalWrap");const t=m.querySelector("#sf_filter").value;
    if(t==="cat")w.innerHTML=`<select id="sf_cat">${STATE.settings.categories.map(c=>`<option value="${c.id}" ${(filter.type==="cat"&&filter.value===c.id)?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`;
    else if(t==="series")w.innerHTML=`<select id="sf_ser">${STATE.settings.series.map(x=>`<option value="${x.id}" ${(filter.type==="series"&&filter.value===x.id)?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`;
    else if(t==="manual"){const sel=(filter.value||[]);w.innerHTML="勾选产品：<div style='max-height:160px;overflow:auto;margin-top:6px'>"+STATE.products.map(p=>`<label style="display:block;font-size:13px"><input type="checkbox" class="mp" value="${p.id}" ${sel.includes(p.id)?"checked":""} style="width:auto"> ${esc(p.name||"未命名")}</label>`).join("")+"</div>";}
    else w.innerHTML="<span style='font-size:12px;color:var(--c-sub)'>展示全部上架产品</span>";};
  m.querySelector("#sf_filter").onchange=()=>{renderFval();};
  m.querySelector("#sf_lay").onchange=()=>{m.querySelector("#colsField").style.display=m.querySelector("#sf_lay").value==="custom"?"":"none";};
  renderFval();
  m.querySelector("#sfCancel").onclick=()=>m.remove();
  m.querySelector("#sfSave").onclick=async()=>{const lay=m.querySelector("#sf_lay").value;const t=m.querySelector("#sf_filter").value;
    let fv={type:t};if(t==="cat")fv.value=m.querySelector("#sf_cat")?m.querySelector("#sf_cat").value:"";else if(t==="series")fv.value=m.querySelector("#sf_ser")?m.querySelector("#sf_ser").value:"";else if(t==="manual")fv.value=Array.from(m.querySelectorAll(".mp:checked")).map(c=>c.value);
    const obj={title:m.querySelector("#sf_title").value.trim()||"新板块",subtitle:m.querySelector("#sf_sub").value.trim(),cover,layout:lay,filter:fv,cols:parseInt(m.querySelector("#sf_cols").value)||3};
    if(s)Object.assign(s,obj);else{obj.id=uid();obj.order=STATE.settings.sections.length;obj.hidden=false;STATE.settings.sections.push(obj);}
    await Store.saveAll();m.remove();renderPanel();renderHome();toast("板块已保存");};
}

/* ============ 初始化 ============ */
async function init(){
  const d=await Store.loadAll();
  STATE.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});
  STATE.settings.switches=Object.assign({},DEFAULT_SETTINGS.switches,d.settings&&d.settings.switches||{});
  STATE.settings.supabase=Object.assign({},DEFAULT_SETTINGS.supabase,d.settings&&d.settings.supabase||{});
  STATE.settings.shop=Object.assign({},DEFAULT_SETTINGS.shop,d.settings&&d.settings.shop||{});
  STATE.settings.shop.colors=Object.assign({},DEFAULT_SETTINGS.shop.colors,STATE.settings.shop.colors||{});

/* 注意：本脚本在主导脚本之后执行，可覆盖主导脚本的同名函数（如 renderProfile / renderMall） */

function copyText(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return;} }catch(e){}
  try{ const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove(); }catch(e){}
}
function _download(name,content,mime){
  const b=new Blob([content],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>{try{URL.revokeObjectURL(a.href);}catch(e){}},2000);
}
function _csv(v){ v=v==null?"":String(v); if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }

/* 二维码（依赖已内联的 qrcode 库） */

  try{ const qr=qrcode(0,'M'); qr.addData(text); qr.make(); return qr.createDataURL(6,10); }catch(e){ return ""; }
}

/* ---- 邀请码 / 邀请链接 ---- */
function myInviteCode(){ return STATE.identity.inviteCode; }
function myInviteLink(){
  const c=myInviteCode();
  const base=location.origin+location.pathname;
  return base+"?inv="+encodeURIComponent(c);
}
function currentAgent(){ try{return localStorage.getItem("leslie_agent")||"";}catch(e){return "";} }
function setAgent(id){ try{ if(id)localStorage.setItem("leslie_agent",id); else localStorage.removeItem("leslie_agent"); }catch(e){} }
function appendRef(url){
  const a=currentAgent();
  if(!a) return url;
  try{ const u=new URL(url,location.href); u.searchParams.set("ref",a); return u.toString(); }catch(e){ return url+(url.indexOf("?")>=0?"&":"?")+"ref="+encodeURIComponent(a); }
}

/* ---- URL 参数处理：邀请得积分 + 代理绑定 ---- */
const _ANTI="leslie_invited_set";
function _invSet(){ try{return JSON.parse(localStorage.getItem(_ANTI))||{};}catch(e){return {};} }
function _markInv(k){ const s=_invSet(); s[k]=1; try{localStorage.setItem(_ANTI,JSON.stringify(s));}catch(e){} }
async function processUrlRef(){
  const params=new URLSearchParams(location.search);
  const ref=params.get("ref"); const inv=params.get("inv");
  if(ref){
    setAgent(ref);
    const ag=STATE.settings.agents.find(a=>a.id===ref);
    if(ag){
      ag.opens=(ag.opens||0)+1;
      if(STATE.identity._agentVisited!==ref){ ag.visits=(ag.visits||0)+1; STATE.identity._agentVisited=ref; }
      await Store.saveAll();
    }
  }
  if(inv){
    const hosts=await Store.loadIdentities();
    let inviterId=null;
    for(const k in hosts){ if(hosts[k]&&hosts[k].inviteCode===inv){ inviterId=k; break; } }
    if(inviterId && inviterId!==STATE.identity.id){
      const inviter=hosts[inviterId];
      const dup=(inviter.invites||[]).some(x=>x.id===STATE.identity.id);
      const devKey="dev_"+inviterId;
      if(!dup && !_invSet()[devKey]){
        _markInv(devKey);
        const gain=(STATE.settings.points&&STATE.settings.points.perInviteOpen)||10;
        inviter.points=(inviter.points||0)+gain;
        inviter.pointsLog=inviter.pointsLog||[];
        inviter.pointsLog.push({ts:Date.now(),type:"invite",detail:"邀请好友打开页面",amount:gain});
        inviter.invites=inviter.invites||[];
        inviter.invites.push({id:STATE.identity.id,ts:Date.now()});
        STATE.identity.invitedBy=inviterId;
        await Store.saveIdentities(hosts);
        await persistIdentity();
        toast("通过好友邀请进入，已为好友 +"+gain+" 积分");
      }
    }
  }
}

/* ---- 转发动态得积分 ---- */
function awardForwardPoints(){
  if(!(STATE.settings.points&&STATE.settings.points.enabledForward)) return;
  const gain=(STATE.settings.points&&STATE.settings.points.perForward)||5;
  STATE.identity.points=(STATE.identity.points||0)+gain;
  STATE.identity.pointsLog=STATE.identity.pointsLog||[];
  STATE.identity.pointsLog.push({ts:Date.now(),type:"forward",detail:"转发朋友圈动态",amount:gain});
  persistIdentity();
  toast("转发 +"+gain+" 积分");
}

/* ---- 积分商城兑换 ---- */
function doRedeem(it){
  if((STATE.identity.points||0)<it.cost){toast("积分不足");return;}
  STATE.identity.points-=it.cost;

  const items=s.redeemItems||[];

  b.innerHTML=`<h3>积分规则</h3>

    <div class="field btn-row"><div style="flex:1"><label>转发动态得积分</label><input id="rpFwd" type="number" value="${pts.perForward||5}"></div><div style="flex:1;display:flex;align-items:flex-end"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="rpFwdOn" ${pts.enabledForward!==false?'checked':''} style="width:auto"> 开启转发得积分</label></div></div>
    <button class="btn primary sm" id="rpSave">保存规则</button>
    <hr class="sep"><h3>积分商城产品</h3>
    <button class="btn sm" id="rpAdd">+ 添加兑换礼品</button>
    ${prodHtml}
    <hr class="sep"><h3>客户积分排行（Top 30）</h3>${ranking}
    <hr class="sep"><h3>邀请关系链</h3>${chain}
    <hr class="sep"><h3>兑换记录（${recs.length}）</h3>${recHtml}

    <div class="field btn-row"><div style="flex:1"><input id="maId" placeholder="客户ID或手机号"></div><div style="flex:1"><input id="maAmt" type="number" placeholder="正负积分，如 50 或 -20"></div></div>

  b.querySelector("#rpSave").onclick=async()=>{s.points=s.points||{};s.points.perBrowse=parseInt(b.querySelector("#rpBrowse").value)||0;s.points.perInviteOpen=parseInt(b.querySelector("#rpInv").value)||0;s.points.perForward=parseInt(b.querySelector("#rpFwd").value)||0;s.points.enabledForward=b.querySelector("#rpFwdOn").checked;await Store.saveAll();toast("规则已保存");};

  b.querySelectorAll("[data-edr]").forEach(el=>el.onclick=()=>_editRedeemItem(el.dataset.edr));

async function _editScript(id){
  const s=STATE.settings.scripts; const it=id?s.items.find(x=>x.id===id):null;
  const scene=prompt("场景（如：新品推荐/活动促销/自用推荐）：",it?it.scene:"新品推荐"); if(scene===null)return;

/* ============ 产品表单（门控图片/视频编辑开关） ============ */
var _origForm=openForm;
openForm=function(p){
  _origForm(p);
  if(!STATE.settings.switches.videoEdit){var fv=document.getElementById("f_video");if(fv&&fv.parentElement)fv.parentElement.style.display="none";}
  if(!STATE.settings.switches.imgEdit){var w=document.getElementById("f_thumbs");if(w)w.querySelectorAll(".edit").forEach(function(e){e.style.display="none";});}
};

/* ============ 面板分发扩展 ============ */
var _origPanel=renderPanel;
renderPanel=function(){
  var b=document.getElementById("pbody");
  if(CUR_TAB==="customer")return renderCustomerTab(b);
  if(CUR_TAB==="message")return renderMessageTab(b);
  if(CUR_TAB==="tutorial")return renderTutorialTab(b);
  if(CUR_TAB==="poster")return renderPosterTab(b);
  if(CUR_TAB==="stats")return renderStatsTab(b);
  return _origPanel();
};

/* ============ 首页扩展（欢迎/引导/教程/对比栏） ============ */
var _origHome=renderHome;
renderHome=function(){
  _origHome();
  ensureP5();
  injectTutorialSection();
  renderCompareBar();
  if(STATE.settings.switches.welcome&&!localStorage.getItem("leslie_welcome_seen"))showWelcome();
  if(STATE.settings.switches.guide&&!localStorage.getItem("leslie_guide_seen"))showGuide();
};

/* ============ 启动：补设置 + 记录访问 + 倒计时刷新 ============ */
(function bootstrapP5(){
  var n=0;
  var t=setInterval(function(){
    if(STATE&&STATE.settings&&STATE.identity&&STATE.identity.id){
      clearInterval(t);
      ensureP5();
      seedSamples().then(function(){
        try{renderHome();renderMoments();renderNav();}catch(e){}
      });
      (async function(){try{STATE.identity.visits=(STATE.identity.visits||0)+1;STATE.identity.browse=STATE.identity.browse||[];await persistIdentity();}catch(e){}})();
      setInterval(function(){
        if(STATE.detailId&&STATE.settings.switches.activityCountdown){
          var ov=document.getElementById("overlay");
          if(ov&&!ov.classList.contains("hidden"))renderDetail();
        }
      },30000);
    } else if(++n>240){clearInterval(t);}
  },50);
})();

})();
